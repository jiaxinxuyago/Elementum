# Deploys the DEV build of the Elementum app to the `elementum-dev` Cloudflare
# Worker on every push to `main` that touches the app — the same trigger as
# deploy.yml, so dev.elementum.life is always a mirror of the commit that is
# live on elementum.life. The dev build is made with VITE_DEVTOOLS=1, which
# turns on the DevBar and the QA hooks (src/devtools.js) so cloud sessions,
# which have no localhost, get a live surface to look at their change on.
# Same secrets as deploy.yml. URL: https://dev.elementum.life (custom domain
# attached in the Cloudflare dashboard; see wrangler.jsonc env.dev and INF_01 §10).
name: Deploy elementum-dev

on:
  push:
    branches: [main]
    paths:
      - 'Elementum_App/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Elementum_App/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Elementum_App

      - name: Build (dev tools on)
        run: npm run build
        working-directory: Elementum_App
        env:
          VITE_DEVTOOLS: '1'

      - name: Deploy to Cloudflare Workers (elementum-dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Elementum_App
          wranglerVersion: '4.107.0'
          command: deploy --env dev
