# Deploys the Elementum app to Cloudflare Workers (elementum.life) on every
# merge to main that touches the app. The separate "pages build and deployment"
# workflow publishes GitHub Pages — it does NOT update elementum.life; this does.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy elementum.life

on:
  push:
    branches: [main]
    paths:
      - 'Elementum_App/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Elementum_App/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Elementum_App

      - name: Build
        run: npm run build
        working-directory: Elementum_App

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Elementum_App
