<style>
/* The Naming, three directions. Same plate, same seal, same backgrounds; only
   what sits on the paper changes. */
.reveal{background:#EFE6D2;position:relative;height:100%}
.reveal .bgt{position:absolute;inset:0 0 auto;width:100%}
.reveal .bgb{position:absolute;inset:auto 0 0;width:100%;opacity:.8}
.reveal .rin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 26px;gap:10px;height:100%;box-sizing:border-box}
.reveal .rseal{width:150px;height:150px}
.reveal .rname{font-family:var(--display);font-size:40px;font-weight:500;margin:0;line-height:1.05}
.reveal .rthesis{font-family:var(--display);font-size:20px;margin:0}
.reveal .rlit{font-family:var(--carve);font-size:10px;letter-spacing:3px;color:var(--inkSoft)}
.reveal .rcast{font-family:var(--mono);font-size:8px;letter-spacing:1.8px;white-space:nowrap;color:var(--inkLight)}
.reveal .rule{width:200px;height:1px;background:var(--paperHair)}
.reveal .rswipe{margin-top:auto;padding-bottom:30px;font-size:13px;color:var(--inkSoft);display:flex;flex-direction:column;align-items:center;gap:2px}
.reveal .rswipe b{font-weight:400;font-size:18px;line-height:1}
.reveal .inscr{position:absolute;right:22px;bottom:92px;z-index:1;writing-mode:vertical-rl;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;color:var(--inkLight);opacity:.85}
.dist{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}
.dist span{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--carve);font-size:9px;letter-spacing:1px;color:var(--inkSoft)}
.dist small{font-family:var(--body);font-size:12px;color:var(--ink)}
.cmp{max-width:880px;margin:26px auto 0}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--borderLight)}
.cmp th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.cmp .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
.good{color:var(--up)} .risk{color:var(--down)}
.rows{max-width:880px;margin:0 auto}
.row{background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px;margin-top:12px}
.row .rh{display:flex;gap:10px;align-items:baseline}
.row .rc{font-family:var(--carve);font-size:13px;letter-spacing:1.5px;color:var(--bronzeDark)}
.row h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.row .why{font-size:14.5px;color:var(--inkSoft);margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--paperHair);background:var(--cream);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;font-size:15px;line-height:1.4}
.opt b{font-family:var(--carve);font-size:13px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair)}
.opt .rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--up);margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"] b{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(248,246,240,.97);border-top:1px solid var(--paperHair);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tray code{flex:1;min-width:0;font-family:var(--body);font-size:15px;font-weight:600;white-space:nowrap;overflow-x:auto;padding:6px 0}
.tray button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.tray .msg{font-size:12px;color:var(--up)}
body{padding-bottom:120px}
</style>

<script>
const plate = (inner, extra = '') => `<div class="page reveal">${status()}<img class="bgt" src="bg-reveal-01-distant-peaks.jpg" alt=""><img class="bgb" src="bg-reveal-02-floating-island.jpg" alt="">${extra}<div class="rin">${inner}<span class="rswipe"><b>^</b>Swipe up</span></div></div>`;
const seal = `<img class="rseal" src="${D.id.seal}" alt="庚, The Blade">`;
const P = Object.fromEntries(EL.map((e) => [e, D.E[e].p]));
const distRow = () => `<div class="dist">${D.order.map((e) => `<span>${dot(e, Math.round(30 + (P[e] / 33) * 34))}<small>${P[e]}%</small>${ELN[e]}</span>`).join('')}</div>`;

const V = {
  code: 'RV', name: 'The Naming',
  thesis: 'Three directions for the first page a reader sees after the chart is cast. Same seal, same painting, same backgrounds. What changes is how much the paper has to say.',
  tap: 'Unchanged in all three: swipe up or tap opens the first reading’s cards; the seal then dissolves into the wheel.',
  scroll: 'None. The plate is one still composition in every direction.',
  next: 'The first reading’s card 1 ("You are The Blade." with the who-you-are paragraph) is where the words begin in Direction 1; in Direction 3 they begin on the plate.',
  intro: 'Golden chart. Direction 3 is the page as it ships today.',
  flows: [
    { id: 'dir', short: 'The three', title: 'Three directions, side by side', note: 'Direction 1 keeps the plate to the sign. Direction 2 adds the five energies. Direction 3 is today’s page.',
      screens: [
        { id: 'd1', label: 'Direction 1 · the sign alone', gesture: 'Name under the seal; the stem line as a small inscription at the side', html: plate(`<div style="height:190px;flex:none"></div><span class="carve">You are</span>${seal}<p class="rname">${D.id.arch}</p>`, `<span class="inscr">${D.id.lit} · ${D.id.cast.replace('CAST FROM ', '')}</span>`) },
        { id: 'd2', label: 'Direction 2 · sign and five energies', gesture: 'The distribution under the name, sized by presence', html: plate(`<div style="height:96px;flex:none"></div><span class="carve">You are</span>${seal}<p class="rname">${D.id.arch}</p><span class="rlit">${D.id.lit}</span><span class="rule"></span><span class="carve" style="font-size:8.5px">Your five energies</span>${distRow()}`) },
        { id: 'd3', label: 'Direction 3 · today’s page', gesture: 'Sign, name, thesis, edge line, stem line, cast line', html: plate(`<div style="height:72px;flex:none"></div><span class="carve">You are</span>${seal}<p class="rname">${D.id.arch}</p><p class="rthesis">${D.id.thesis}</p><p class="soft" style="margin:0">${D.id.edge}</p><span class="rule"></span><span class="rlit">${D.id.lit}</span><span class="rcast">${D.id.cast}<br>— ELEMENTUM —</span>`) },
      ] },
    { id: 'after', short: 'What follows', title: 'Where the words go under Direction 1', note: 'Nothing is lost. The thesis and the edge line already live on the hero of Your reading; under Direction 1 they also open the first reading, so the plate stays silent and the cards speak first.',
      screens: [
        { id: 'c1', label: 'First reading · card 1 (Direction 1)', gesture: 'The thesis becomes the card’s kicker; the paragraph follows', html: `<div class="leafx" style="min-height:100%;display:flex;flex-direction:column;padding:12px 18px 26px;background:var(--night);color:#F3EDDF"><div style="display:flex;gap:3px;margin-top:6px"><i style="flex:1;height:2px;background:#F3EDDF"></i>${'<i style="flex:1;height:2px;background:rgba(243,237,223,.25)"></i>'.repeat(7)}</div><span style="align-self:flex-end;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:8px;opacity:.7">Skip</span><div style="margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px"><span class="carve" style="color:#D9CFBC">Your first reading</span><img src="${D.id.seal}" alt="" style="width:110px;background:rgba(243,237,223,.92);border-radius:50%"><h3 style="font-family:var(--display);font-size:30px;font-weight:500;margin:0;line-height:1.1">You are ${D.id.arch}.</h3><p style="margin:0;font-family:var(--display);font-size:19px;line-height:1.3">${D.id.thesis}. ${D.id.edge}</p><p style="margin:0;font-size:16px;line-height:1.5">${D.id.who}</p><span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-top:8px">Tap to continue</span></div></div>` },
        { id: 'c1b', label: 'First reading · card 1 (as today)', gesture: 'For comparison: the card as it ships', html: `<div style="min-height:100%;display:flex;flex-direction:column;padding:12px 18px 26px;background:var(--night);color:#F3EDDF"><div style="display:flex;gap:3px;margin-top:6px"><i style="flex:1;height:2px;background:#F3EDDF"></i>${'<i style="flex:1;height:2px;background:rgba(243,237,223,.25)"></i>'.repeat(7)}</div><span style="align-self:flex-end;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:8px;opacity:.7">Skip</span><div style="margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px"><span class="carve" style="color:#D9CFBC">Your first reading</span><img src="${D.id.seal}" alt="" style="width:110px;background:rgba(243,237,223,.92);border-radius:50%"><h3 style="font-family:var(--display);font-size:30px;font-weight:500;margin:0;line-height:1.1">You are ${D.id.arch}.</h3><p style="margin:0;font-size:16px;line-height:1.5">${D.id.who}</p><span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-top:8px">Tap to continue</span></div></div>` },
      ] },
  ],
  after: `<section class="cmp"><h2 style="font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 8px">Why Direction 1</h2>
  <div class="scroll"><table>
    <tr><th></th><th>1 · Sign alone</th><th>2 · Sign + five energies</th><th>3 · Today</th></tr>
    <tr><td>Things to decode on first sight</td><td class="good">2: the painting and the name</td><td class="risk">8: painting, name, five dots with numbers, a label</td><td class="risk">6 lines of text under the painting</td></tr>
    <tr><td>Concept ladder (DES_04 §0: one new concept per screen)</td><td class="good">One concept: who you are</td><td class="risk">Two concepts before the first card: identity and distribution, with the energies not yet named</td><td>One concept, said four ways</td></tr>
    <tr><td>What the swipe reveals</td><td class="good">Everything: the cards do the telling</td><td class="risk">Less: cards 3 to 7 repeat the five numbers the plate just showed</td><td>Some: card 1 repeats the name and the thesis</td></tr>
    <tr><td>The dissolve</td><td class="good">The seal is the only object; its descent into the wheel reads clearly</td><td class="risk">Five dots on the plate, then five disks on the wheel: two pictures of the same thing</td><td>Clear</td></tr>
    <tr><td>Ink-wash composition</td><td class="good">One-corner: the seal and the open paper, the inscription at the side (题款)</td><td>Full plate</td><td>Full plate, centred stack</td></tr>
    <tr><td>Share-card readiness (D13c)</td><td class="good">Yes: the plate is the card</td><td>Yes</td><td>Yes</td></tr>
  </table></div>
  <p style="font-size:14.5px;color:var(--inkSoft);margin-top:10px">Direction 2 is a fair idea that the app already does one screen later: the first reading teaches the five energies one card each, then the dissolve lands them on the wheel. Showing the distribution before the energies have names asks the reader to decode a chart with no key.</p></section>
  <section class="rows"><h2 style="font-family:var(--display);font-weight:500;font-size:26px;margin:26px 0 4px">Rulings</h2><div id="rows"></div></section>`,
};
renderVariant(V);

const ROWS = [
  ['RV1', 'The Naming page', 'Which direction the plate takes.', ['Direction 1: the sign alone (seal, name, a small side inscription)', 'Direction 2: the sign with the five-energy distribution', 'Direction 3: keep today’s page']],
  ['RV2', 'The stem line and the cast line', 'Where "庚 · YANG METAL" and "CAST FROM 1995 · APRIL 29" sit under Direction 1.', ['A small vertical inscription at the side of the plate, like a painter’s signature', 'Under the name, as two short lines', 'Off the plate; they stay on the Your reading hero']],
  ['RV3', 'The thesis and the edge line', 'Where "Precision before intention. You are the Metal that cuts things clean." goes under Direction 1.', ['They open card 1 of the first reading, above the who-you-are paragraph', 'Off the first run; they already live on the Your reading hero']],
];
const L = 'ABC';
let pick = {};
try { pick = JSON.parse(localStorage.getItem('elementum-rulings-naming') || '{}') || {}; } catch (e) { pick = {}; }
const rows = document.getElementById('rows');
rows.innerHTML = ROWS.map(([c, t, why, opts]) => `<div class="row"><div class="rh"><span class="rc">${c}</span><h3>${t}</h3></div><p class="why">${why}</p><div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-row="${c}" data-opt="${L[i]}" aria-pressed="${pick[c] === L[i]}"><b>${L[i]}</b><span>${o}${i === 0 ? '<span class="rec">Recommended</span>' : ''}</span></button>`).join('')}</div></div>`).join('');
document.body.insertAdjacentHTML('beforeend', '<div class="tray"><div class="in"><code id="codes">No rows ruled yet</code><span class="msg" id="msg" aria-live="polite"></span><button id="copy" type="button">Copy</button></div></div>');
const codes = document.getElementById('codes');
const render = () => { const s = ROWS.filter(([c]) => pick[c]).map(([c]) => `${c} ${pick[c]}`).join(', '); codes.textContent = s || 'No rows ruled yet'; };
rows.addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (!b) return; pick[b.dataset.row] = b.dataset.opt; b.parentElement.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', x === b)); try { localStorage.setItem('elementum-rulings-naming', JSON.stringify(pick)); } catch (err) { /* storage off */ } render(); });
document.getElementById('copy').addEventListener('click', () => { const msg = document.getElementById('msg'); navigator.clipboard.writeText(codes.textContent).then(() => { msg.textContent = 'Copied'; setTimeout(() => (msg.textContent = ''), 1500); }).catch(() => { const r = document.createRange(); r.selectNodeContents(codes); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Selected'; }); });
render();
</script>
