<!doctype html>
<meta charset="utf-8">
<title>Energy Journey Directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* The energy reading journey: album → sheet (the cover) → the Earth page as a
   ladder → the door into Domains. Three folding grammars on the same words.
   Ground, signs, dots, plates and iconography are the app's own. */
.shot{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.page.ep{background:var(--silk)}
.ep .pad{padding:8px 18px 100px;display:flex;flex-direction:column;gap:10px}
.ep .pager{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0;font-size:12.5px;color:var(--inkSoft)}
.ep .edots{display:flex;gap:6px}.ep .edots i{width:6px;height:6px;border-radius:50%;background:var(--inkMist)}.ep .edots i.on{background:var(--ink)}
/* rung 1 · the name: the cover continues (same dot, same head as the sheet) */
.ep .name{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--paperHair);background:var(--cardstock);min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px 12px}
.ep .name .kart{position:absolute;inset:0;background-position:center 35%}
.ep .name::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(248,241,225,.05) 0%,rgba(248,241,225,.35) 40%,rgba(248,241,225,.96) 72%)}
.ep .name>*:not(.kart){position:relative;z-index:2}
.ep .nrow{display:flex;align-items:center;gap:12px}
.ep .nrow .kdot{filter:drop-shadow(0 4px 12px rgba(43,39,34,.18))}
.ep .ntitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.ep .ntitle .ey{font-size:9px}
.ep .ntitle b{font-family:var(--display);font-size:26px;font-weight:500;line-height:1.05;color:var(--walnut)}
.ep .ntitle b .han{font-size:20px;color:var(--bronzeDark);margin-left:6px}
.ep .nfn{font-family:var(--display);font-size:19px;line-height:1.15;margin:8px 0 0;text-wrap:balance}
.ep .nline{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:6px;font-size:13.5px;color:var(--inkSoft)}
.ep .nline .cyc{font-family:var(--carve);font-size:8.5px;letter-spacing:1.6px;color:var(--bronzeDark)}
.ep .nbar{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--inkLight)}
.ep .nbar .kbar{height:5px}
/* the boxes (Variation A): closed = one derived line; open = the reading, in place */
.box{border:1px solid var(--paperHair);border-radius:16px;background:var(--cardstock);overflow:hidden}
.box .bh{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:11px 14px;align-items:center;cursor:pointer}
.box .bh .ey{display:block;font-size:9px;margin-bottom:3px}
.box .bh .bl{font-family:var(--display);font-size:16.5px;line-height:1.25;text-wrap:pretty}
.box .bh .chev{width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair);display:grid;place-items:center;color:var(--inkSoft);font-size:12px;background:var(--cream)}
.box.open .bh .chev{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.box .bb{display:none;padding:0 14px 14px;border-top:1px dashed var(--paperHair);margin-top:0}
.box.open .bb{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.box.open .bh{padding-bottom:10px}
.box .bb p{margin:0;font-size:15px;line-height:1.5}
.box .bb p.cls{font-family:var(--han);font-size:15px;color:var(--inkSoft);letter-spacing:1px;text-align:center}
.box .bb .turn{border-left:3px solid var(--seal);padding-left:10px}
.box .bb .turn .ey{display:block;margin-bottom:3px}
/* the equation, on paper */
.eq{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 0}
.eq .side{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--carve);font-size:8.5px;letter-spacing:1.4px;color:var(--inkSoft)}
.eq .side small{font-family:var(--body);font-size:12px;color:var(--ink);letter-spacing:0}
.eq .law{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--up)}
.eq .law .han{font-size:20px;line-height:1}
.eq .law span{font-family:var(--carve);font-size:8px;letter-spacing:2px}
.eq .law .ln{width:54px;height:1px;background:var(--up);position:relative}
.eq .law .ln::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:6px solid var(--up)}
.eq .is{font-family:var(--display);font-size:20px;color:var(--inkSoft)}
.eq.mini{gap:7px;padding:0}.eq.mini .law .ln{width:30px}.eq.mini .law .han{font-size:15px}
/* character: the metric bars (THE CHARACTER panel, as on the function page) */
.met{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13.5px}
.met .bars{display:flex;gap:3px}.met .bars i{flex:1;height:7px;border-radius:2px;background:var(--silkFold)}.met .bars i.on{background:var(--down)}
.met .style{position:relative;display:flex;gap:3px}.met .style i{flex:1;height:7px;border-radius:2px;background:var(--silkFold)}.met .style i.on{background:var(--ink)}
.met .ends{grid-column:2;display:flex;justify-content:space-between;font-family:var(--carve);font-size:8px;letter-spacing:1.4px;color:var(--inkLight);margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .domchip.k{color:var(--down);border-color:rgba(168,92,72,.4)}
.chips .domchip.k .plus{font-size:12px;color:var(--down)}
/* state */
.state{display:flex;align-items:center;gap:10px}
.state .rel{font-family:var(--display);font-size:19px}
.remedy{border-radius:12px;background:rgba(88,122,77,.08);border:1px solid rgba(88,122,77,.25);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.remedy .rh{display:flex;align-items:center;gap:8px}
.remedy .rh b{font-family:var(--display);font-size:17px;font-weight:500}
.remedy .rh .ey{color:var(--up)}
.remedy p{font-size:14px!important}
/* domains */
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dtile{border:1px solid var(--ink);border-radius:12px;padding:10px 11px;background:rgba(255,255,255,.3);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.dtile .dh{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16.5px}
.dtile .dh .ic{width:14px;height:14px;color:var(--bronzeDark)}
.dtile .ds{font-family:var(--carve);font-size:7.5px;letter-spacing:1.3px;color:var(--inkLight)}
.dtile p{font-size:13.5px!important;line-height:1.4!important}
.seat{display:flex;align-items:center;gap:10px;border:1px solid var(--paperHair);border-radius:12px;padding:9px 12px;background:var(--cream)}
.seat .han{font-size:11px;border:1px solid var(--paperHair);border-radius:6px;padding:2px 5px;color:var(--bronzeDark)}
.seat b{font-size:14px;font-weight:600}.seat small{display:block;font-family:var(--carve);font-size:8.5px;letter-spacing:1.2px;color:var(--inkLight)}
.seat .ic{margin-left:auto;width:12px;height:12px;color:var(--inkSoft)}
/* teaser cards (Variation B) */
.tcard{position:relative;border:1px solid var(--paperHair);border-radius:16px;background:var(--cardstock);padding:12px 44px 12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tcard .ey{font-size:9px}
.tcard .tt{font-family:var(--display);font-size:17px;line-height:1.2;text-wrap:pretty}
.tcard p{margin:0;font-size:14px;line-height:1.45;color:var(--inkSoft)}
.tcard .readcirc{position:absolute;right:12px;bottom:12px}
/* across + next */
.across{border-top:1px solid var(--paperHair);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.across .row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.across .row .ey{width:86px;flex:none}
.across .ladder{display:flex;gap:6px;align-items:flex-end}
.across .ladder span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--inkLight)}
.across .ladder span.dim{opacity:.4}
.next{display:flex;gap:12px;align-items:center;border:1px solid var(--paperHair);border-radius:16px;padding:10px;background:var(--cardstock);cursor:pointer}
.next .kart{width:64px;height:64px;border-radius:12px;flex:none}
/* sub-pages (B) */
.sub .pad{padding-top:0}
.sub .card{border:1px solid var(--paperHair);border-radius:16px;background:var(--cardstock);padding:14px;display:flex;flex-direction:column;gap:10px}
.sub .card p{margin:0;font-size:15px;line-height:1.5}
.sub h3{font-family:var(--display);font-size:22px;font-weight:500;margin:0;line-height:1.15}
/* the sheet (cover) tweaks */
.sheet .b-ill{position:relative;height:118px;border-radius:14px;overflow:hidden}
.sheet .b-ill .kart{position:absolute;inset:0}
.sheet .b-story{font-family:var(--display);font-size:16.5px;line-height:1.35;margin:0}
.sheet .b-cyc{font-family:var(--carve);font-size:8.5px;letter-spacing:1.8px;color:var(--bronzeDark);text-align:center}
.sheet .b-shhead{display:flex;align-items:center;gap:10px}
.sheet .b-rt{display:flex;flex-direction:column;flex:1;min-width:0}
.sheet .b-rt b{font-family:var(--display);font-size:18px;font-weight:500;line-height:1.1}
.sheet .b-rt small{font-size:12px;color:var(--inkSoft)}
.sheet .b-rr{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sheet .b-rr em{font-style:normal;font-size:13px;font-weight:600}
.hl{position:absolute;z-index:7;border:2px solid var(--seal);border-radius:50%;box-shadow:0 0 0 6px rgba(160,64,48,.18)}
.hl::after{content:"tap";position:absolute;left:50%;top:100%;transform:translate(-50%,6px);font-family:var(--carve);font-size:9px;letter-spacing:2px;color:var(--seal)}
/* page furniture */
.ladderdoc{max-width:880px;margin:26px auto 0;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px 18px}
.ladderdoc h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 6px}
.ladderdoc ol{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.5}
.ladderdoc li b{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.ladderdoc code{font-family:var(--mono);font-size:12px;color:var(--inkLight)}
.cmp{max-width:880px;margin:26px auto 0}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--borderLight)}
.cmp th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.cmp .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
.good{color:var(--up)} .risk{color:var(--down)}
.rows{max-width:880px;margin:0 auto}
.row{background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px;margin-top:12px}
.row .rh{display:flex;gap:10px;align-items:baseline}
.row .rc{font-family:var(--carve);font-size:13px;letter-spacing:1.5px;color:var(--bronzeDark)}
.row h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.row .why{font-size:14.5px;color:var(--inkSoft);margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--paperHair);background:var(--cream);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;font-size:15px;line-height:1.4}
.opt b{font-family:var(--carve);font-size:13px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair)}
.opt .rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--up);margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"] b{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(248,246,240,.97);border-top:1px solid var(--paperHair);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tray code{flex:1;min-width:0;font-family:var(--body);font-size:15px;font-weight:600;white-space:nowrap;overflow-x:auto;padding:6px 0}
.tray button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.tray .msg{font-size:12px;color:var(--up)}
body{padding-bottom:120px}
</style>

  classic: '金居石依山，津潤而生',
  base: 'Old texts have it that metal keeps to the stone and is born where the ground stays damp. Ore does not form in the open. It waits under the hill, pressed by rock and fed by slow water, for longer than anything struck from it lasts. Earth gives the blade its substance first and its patience second, and a blade that forgets the ground it came from loses the second gift first.',

  claim: 'Earth is your Mind.', verdict: D.earthPage.verdict, define: D.earthPage.define,
  functional: 'Thinking runs deep and sideways. You digest slowly, connect strangely, and surface with conclusions no straight line could have reached.',

const pageA = (openKey = null) => ep(`${backrow('Your energies · Earth')}<div class="pad">${pager()}${nameRung()}

  ${across()}${nextFire()}</div>`);

const subDomains = () => ep(`${backrow('Earth · The domains')}<div class="pad"><div class="card"><h3>What Earth rules in your life</h3><p class="soft" style="font-size:14px">${E.domLine}</p>${domTiles()}</div><div class="card"><span class="ey">Its seat in your pillars</span>${seatRow()}<span class="ey" style="margin-top:4px">Who runs it</span><p><b>The Alchemist · 偏印</b><br><span class="light" style="font-size:13px">runs your Mind · insight</span></p></div></div>`, 'sub');
