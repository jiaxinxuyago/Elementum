<meta charset="utf-8">
<title>V2 The Album</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">

<style>
/* V2 · The Album (册页): Your reading is a hub of teaser tiles under the
   wheel, sized by weight in a two-column grid. Every tile opens a leaf
   sequence that reads like the first reading: segmented progress, tap
   right to go on, tap left to go back, X to close. A "read" seal stamps
   the tile when its last leaf is reached. */
.idstrip{display:flex;align-items:center;gap:10px;padding:4px 2px}
.idstrip img{width:40px;height:40px;border-radius:50%;border:1px solid var(--paperHair);background:var(--cream)}
.idstrip .nm{display:flex;flex-direction:column;flex:1;min-width:0}
.idstrip .nm b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--walnut);line-height:1}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{position:relative;border-radius:16px;overflow:hidden;background:var(--cardstock);border:1px solid var(--paperHair);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:132px}
.bt.wide{grid-column:span 2}
.bt.tall{min-height:200px}
.bt .kart{position:absolute;inset:0;opacity:.95}
.bt.artful::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(248,241,225,0) 20%,rgba(248,241,225,.94) 62%)}
.bt>*:not(.kart){position:relative;z-index:2}
.bt .ey{font-size:9px}
.bt .cl{font-family:var(--display);font-size:17px;line-height:1.2;font-weight:500;margin:0;text-wrap:balance}
.bt .ft{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--inkLight)}
.bt .ft .readcirc{margin-left:auto}
.bt .stamp{position:absolute;right:10px;top:10px;z-index:3}
.bt .unread{position:absolute;right:12px;top:12px;z-index:3;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.domgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.domgrid span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--inkSoft)}
.domgrid span .ic{width:18px;height:18px;color:var(--bronzeDark)}
.domgrid span.hv .ic{color:var(--ink)}
.domgrid span.hv{font-weight:700}
.rxdots{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rxdots .grp{display:flex;align-items:center;gap:4px}
.rxdots .lbl{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.rxdots .lbl.d{color:var(--down)}.rxdots .lbl.u{color:var(--up)}
/* leaves */
.leaf{min-height:100%;display:flex;flex-direction:column;background:var(--silk);position:relative}
.leaf .lband{position:relative;height:210px;flex:none}
.leaf .lband .kart{position:absolute;inset:0}
.leaf .lband::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 35%,var(--silk))}
.leaf .ltop{position:absolute;top:0;left:0;right:0;z-index:4;padding:10px 14px 0}
.leaf .lprog{display:flex;gap:3px}
.leaf .lprog i{flex:1;height:2px;border-radius:1px;background:rgba(43,39,34,.18)}
.leaf .lprog i.on{background:var(--ink)}
.leaf .lbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.leaf .lbar .x{width:28px;height:28px;border-radius:50%;background:rgba(248,246,240,.8);display:grid;place-items:center}
.leaf .lbar .x .ic{width:12px;height:12px}
.leaf .lbody{padding:6px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.leaf .lbody.top{padding-top:76px;justify-content:center}
.leaf h3{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.leaf p{margin:0;font-size:15.5px;line-height:1.55}
.leaf .zones{position:absolute;inset:60px 0 0;display:grid;grid-template-columns:1fr 2fr;pointer-events:none;z-index:3}
.leaf .zones span{border:1px dashed rgba(107,83,57,.0)}
.leaf .lfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--inkLight);padding:0 20px 16px}
.leaf.ink{background:var(--night);color:#F3EDDF}
.leaf.ink .lprog i{background:rgba(243,237,223,.25)} .leaf.ink .lprog i.on{background:#F3EDDF}
.endleaf{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.nextleaf{display:flex;gap:12px;align-items:center;border:1px solid var(--paperHair);border-radius:16px;padding:10px;background:var(--cardstock);cursor:pointer}
.nextleaf .kart{width:70px;height:70px;border-radius:12px;flex:none}
.alink{font-size:13px;color:var(--bronzeDark);text-align:center;text-decoration:underline;text-underline-offset:3px}
.reveal{background:#EFE6D2}
.reveal .bgt{position:absolute;inset:0 0 auto;width:100%}
.reveal .bgb{position:absolute;inset:auto 0 0;width:100%;opacity:.8}
.reveal .rin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 26px 0;gap:10px;min-height:100%}
.reveal .rseal{width:150px;height:150px}
.reveal .rname{font-family:var(--display);font-size:40px;font-weight:500;margin:0}
.wtile{padding:10px 8px 8px}
.wtile .wh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px 2px}
.hint{text-align:center;font-size:12.5px;color:var(--inkSoft);margin:2px 0 0}
.todaycard{position:relative;border-radius:22px;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:1px solid var(--paperHair)}
.todaycard .kart{position:absolute;inset:0}
.todaycard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(241,233,214,0) 25%,rgba(248,241,225,.96) 70%)}
.todaycard .tc{position:relative;z-index:2;padding:16px;display:flex;flex-direction:column;gap:8px}
.todaycard .tc .disp{font-size:26px}
.tone-d{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--down)} .tone-u{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--up)}
.big{width:100%}
</style>

<script>
const page = (inner, tab = 'reading') => `<div class="page">${status()}${inner}${tabbar(tab)}</div>`;
const stamp = (h = '庚') => `<span class="chop stamp">${h}</span>`;
/* a leaf: n of total, optional art band, body; "go" = next leaf on tap */
const leaf = ({ n, of, art: a, ey, h, body = '', go, back = 'reading', ink = false, end = '', time = '' }) => `<div class="leaf${ink ? ' ink' : ''}"${go ? ` data-go="${go}"` : ''}>
  <div class="ltop"><div class="lprog">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><div class="lbar"><span class="carve" style="${ink ? 'color:#D9CFBC' : ''}">${ey}</span><span class="x" data-go="${back}">${use('ico-close')}</span></div></div>
  ${a ? `<div class="lband">${art(a)}</div>` : ''}
  <div class="lbody${a ? '' : ' top'}">${h ? `<h3>${h}</h3>` : ''}${body}${end}</div>
  ${time ? `<div class="lfoot"><span>${n} of ${of}</span><span>${time}</span></div>` : ''}</div>`;
const nextLeaf = (a, ey, t, go) => `<div class="endleaf"><div class="nextleaf" data-go="${go}">${art(a)}<div style="flex:1"><span class="ey">Next · ${ey}</span><p class="disp" style="font-size:18px">${t}</p></div>${arrowBtn('sm')}</div><span class="alink">Read it all as one page</span></div>`;

const hub = (scroll) => page(`<div class="pad" style="padding-top:8px">
  <div class="idstrip"><img src="${D.id.seal}" alt=""><div class="nm"><span class="kick">You are</span><b>${D.id.arch}</b></div><span data-go="run">${pill('cond')}</span></div>
  <div class="card wtile"><div class="wh"><span class="ey">Your five energies</span>${seg('do')}</div>${wheel()}<p class="hint">Tap an energy. Tap the seal for how you run.</p></div>
  <div class="bento">
    <div class="bt" data-go="run-1"><span class="ey">How am I running?</span><div style="width:96px;margin:auto">${dial(D.score, D.cond)}</div><span class="ft">${D.runShort}</span>${stamp()}</div>
    <div class="bt" data-go="sheet-fire"><span class="ey">Start here</span><div style="margin:auto">${dot('fire', 54)}</div><span class="cl" style="font-size:15px">${D.E.fire.head}</span><span class="ft">${pill('cat', 'Grow it')}</span><span class="unread"></span></div>
    <div class="bt wide" style="min-height:0" data-go="sheet-earth"><span class="ey">What does my chart ask for?</span><div class="rxdots"><span class="grp"><span class="lbl d">↓ Release</span>${D.ease.map((e) => dot(e, 26)).join('')}</span><span class="grp"><span class="lbl u">↑ Grow</span>${D.seek.map((e) => dot(e, 26)).join('')}</span></div><span class="ft">${D.rx}</span></div>
    <div class="bt wide tall artful" data-go="dom-1">${art('g_hero_3', '', 'center 30%')}<span class="unread"></span><span class="ey" style="margin-top:58px">Your domains</span><p class="cl">${D.domainsHead}</p><div class="domgrid">${D.domains.map(([d, , w]) => `<span class="${w >= 4 ? 'hv' : ''}">${domIcon(d)}${d}</span>`).join('')}</div><span class="ft">1 min · 4 leaves ${arrowBtn('sm')}</span></div>
    <div class="bt wide tall artful" data-go="ch-1">${art('g_hero_8', '', 'center 40%')}<span class="unread"></span><span class="ey" style="margin-top:58px">Your life chapters</span><p class="cl">${D.chapters.short}</p>${lifeStrip(true)}<span class="ft">5 min · 8 leaves ${arrowBtn('sm')}</span></div>

    <div class="bt tall artful" data-go="bp-1">${art('g_hero_10', '', 'center 30%')}<span class="ey" style="margin-top:46px">Your blueprint</span><p class="cl" style="font-size:15px">${D.blueprint.head}</p><span class="ft">${pill('adv', 'Advisor', false)} ${arrowBtn('sm')}</span></div>
  </div>
  <div class="card"><span class="ey">The words on this page · tap one</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${pill('core', 'Core', false)}${pill('cond')}${pill('cat', 'Catalyst')}${pill('fric', 'Friction')}${['Seat', 'Gate', 'Decade', 'Star'].map((w) => pill('core', w, false)).join('')}</div></div>
  <span class="alink" data-go="pillars">Birth chart ›</span></div>`);

const V = {
  code: 'V2', name: 'The Album',
  thesis: 'Your reading becomes an album of teaser tiles under the wheel. Every tile opens a short run of leaves that read like the first reading, so the whole app has one way to read.',
  tap: 'Tap a tile to open its leaves. In a leaf: tap the right two-thirds to go on, the left third to go back, X to close. Energies and words still open sheets.',
  scroll: 'Your reading scrolls once: identity strip, wheel, then the tile grid. Leaves never scroll; a leaf holds one idea. "Read it all as one page" turns any leaf run into a scrolling page for readers who prefer it.',
  next: 'The last leaf of every run hands you the next tile. Unread tiles carry an ink dot; finished tiles are stamped with your stem seal.',
  intro: 'Built on the strongest pattern already in the app: the eight-card first reading. Frames are tappable; arrows and tiles travel to their screens.',
  flows: [
    { id: 'first', short: 'First run', title: 'The Naming and the first reading', note: 'Unchanged. The first reading teaches the leaf gesture that every section then reuses.',

        { id: 'naming', label: 'The Naming', gesture: 'Swipe up', html: `<div class="page reveal">${status()}<img class="bgt" src="bg-reveal-01-distant-peaks.jpg" alt=""><img class="bgb" src="bg-reveal-02-floating-island.jpg" alt=""><div class="rin"><span class="carve">You are</span><img class="rseal" src="${D.id.seal}" alt=""><p class="rname">${D.id.arch}</p><p class="disp" style="font-size:20px">${D.id.thesis}</p><p class="soft" style="margin:0">${D.id.edge}</p><span class="carve" style="border-top:1px solid var(--paperHair);padding-top:10px">${D.id.lit}</span><span style="margin-top:auto;padding-bottom:30px;font-size:13px" data-go="fr-1">Swipe up</span></div></div>` },

      ] },
    { id: 'hub', short: 'Your reading', title: 'The album', note: 'Identity in one strip, the wheel at full width, then tiles sized by weight. Every tile face carries a claim from your reading and a picture: the dial, an ink dot, a painted plate, the life strip, the domain glyphs.',
      screens: [
        { id: 'hub', label: 'Your reading · top', gesture: 'Condition pill → How am I running?', html: hub() },
        { id: 'hub-2', label: 'Your reading · the tiles', gesture: 'Tiles open leaf runs', at: 360, html: hub() },
        { id: 'hub-3', label: 'Your reading · the end', gesture: 'Words, then Birth chart', at: 900, html: hub() },

        { id: 'sheet-earth', label: 'Energy sheet · Earth', gesture: 'Chips open the domain leaves', html: `<div class="page">${status()}<div class="pad"><div class="card wtile">${wheel()}</div></div>${B.sheet('earth', { back: 'hub', read: 'en-1', dom: 'dom-2' })}</div>` },
      ] },
    { id: 'energy', short: 'Energy leaves', title: 'An energy, read in leaves', note: '"Read Earth, your Mind" opens five leaves: the claim, the mechanism, the function, the remedy, the domains.',
      screens: [
        { id: 'en-1', label: 'Earth · 1 of 5', gesture: 'Claim and keywords on the plate', html: leaf({ n: 1, of: 5, ey: 'Earth · your Mind', art: ART.earth, h: D.earthPage.claim, body: `<div style="display:flex;gap:6px;align-items:center">${pill('fric')}<span class="light">33% · Earth feeds Metal</span></div><p>${D.earthPage.verdict}</p><div style="display:flex;gap:5px;flex-wrap:wrap">${D.earthPage.chips.map((c) => `<span class="domchip">${c}</span>`).join('')}</div>`, go: 'en-2', time: '2 min' }) },

        { id: 'en-3', label: 'Earth · 3 of 5', gesture: 'The function', html: leaf({ n: 3, of: 5, ey: 'Earth · the function', h: D.earthPage.claim, body: `<p>${D.earthPage.define}</p>`, go: 'en-4', time: '2 min' }) },
        { id: 'en-4', label: 'Earth · 4 of 5', gesture: 'The remedy, through Wood', html: leaf({ n: 4, of: 5, ey: 'Earth · the remedy', art: ART.wood, h: 'Release Earth through Wood', body: `<p>${D.earthPage.remedy}</p>`, go: 'en-5', time: '2 min' }) },
        { id: 'en-5', label: 'Earth · 5 of 5', gesture: 'Domains, then the next energy', html: leaf({ n: 5, of: 5, ey: 'Earth · the domains', h: 'What Earth rules in your life', body: D.earthPage.doms.map(([d, l]) => B.domRow([d, l, 1], 'dom-2')).join(''), end: nextLeaf(ART.fire, 'Fire, your Order', D.E.fire.head, 'sheet-fire'), time: '2 min' }) },
      ] },
    { id: 'run', short: 'How I run', title: '"How am I running?" in seven leaves', note: 'The dial, your nature, what Overfueled means, the Codex tests (folded), gifts and costs, scenes, what helps. The last leaf carries the Blueprint door.',
      screens: [
        { id: 'run-1', label: 'Run · 1 of 7', gesture: 'The dial and the headline', html: leaf({ n: 1, of: 7, ey: 'How am I running?', ink: true, body: `<div style="width:220px;align-self:center;margin:30px 0 6px" class="dark">${dial(D.score, D.cond)}</div><span style="align-self:center">${pill('cond')}</span><h3 style="text-align:center">${D.runHead}</h3>`, go: 'run-2', time: '2 min' }) },
        { id: 'run-2', label: 'Run · 2 of 7', gesture: 'Your nature, the stem × band paragraph', html: leaf({ n: 2, of: 7, ey: 'Your nature', art: ART.metal, body: `<p class="disp" style="font-size:20px;line-height:1.4">${D.nature}</p>`, go: 'run-3', time: '2 min' }) },

        { id: 'run-5', label: 'Run · 5 of 7', gesture: 'Gifts and costs', html: leaf({ n: 5, of: 7, ey: 'Gifts and costs', h: 'You will recognise it', body: `${B.giftsCosts()}${B.scenes()}`, go: 'run-7', time: '2 min' }) },
        { id: 'run-7', label: 'Run · 7 of 7', gesture: 'What helps, then the Blueprint door', html: leaf({ n: 7, of: 7, ey: 'What helps', h: D.helps, body: `<div class="b-hrows">${pill('cat')}<span>${D.grow}</span>${pill('fric')}<span>${D.release}</span></div>`, end: `<div class="endleaf">${B.bpDoor('bp-1')}${nextLeaf('g_hero_3', 'Your domains', D.domainsHead, 'dom-1')}</div>`, time: '2 min' }) },
        { id: 'run-u', label: 'Underfueled · Run 1 of 7', gesture: 'The Vine: the needle on the other side', html: leaf({ n: 1, of: 7, ey: 'How am I running?', ink: true, body: `<div style="width:220px;align-self:center;margin:30px 0 6px" class="dark">${dial(U.score, U.cond)}</div><span style="align-self:center">${pill('cond', 'Underfueled')}</span><h3 style="text-align:center">You run Underfueled: your Wood spends more than it takes in.</h3><p style="text-align:center">${U.rx}</p>`, time: '2 min' }) },
      ] },
    { id: 'depth', short: 'Depth', title: 'Domains, Life Chapters, Stars, Blueprint as leaves', note: 'Each run opens on a plate with its claim, then one idea per leaf. Locked leaves show their headline and name what opens them.',
      screens: [
        { id: 'dom-1', label: 'Domains · 1 of 4', gesture: 'Eight tiles; tap one for its leaves', html: leaf({ n: 1, of: 4, ey: 'Your domains', art: 'g_hero_3', h: 'Eight parts of your life, and who rules them', body: `<div class="bento">${D.domains.map(([d, l, w]) => `<div class="bt" style="min-height:0;padding:10px" data-go="dom-2"><span style="display:flex;gap:6px;align-items:center">${domIcon(d)}<span class="ey">${d}</span><span class="b-wt" style="margin-left:auto">${'●'.repeat(w)}</span></span><span style="font-size:12.5px;line-height:1.3">${l}</span></div>`).join('')}</div>`, time: '1 min' }) },
        { id: 'dom-2', label: 'Wealth · 1 of 6', gesture: 'The domain’s headline and where it sits', html: leaf({ n: 1, of: 6, ey: 'Your domains · Wealth', back: 'dom-1', h: D.wealth.head, body: `<p class="soft">${D.wealth.sub}</p><div class="card">${lifeStrip()}</div><p>${D.wealth.how[0]}</p>`, go: 'dom-3', time: '2 min' }) },
        { id: 'dom-3', label: 'Wealth · 3 of 6', gesture: 'One seat per leaf', html: leaf({ n: 3, of: 6, ey: 'The seats that rule your wealth', back: 'dom-1', art: 'g_hero_1', h: D.wealth.seats[1][0], body: `<span class="carve">${D.wealth.seats[1][1]}</span><p>${D.wealth.seats[1][2]}</p>`, time: '2 min' }) },
        { id: 'ch-1', label: 'Life Chapters · 1 of 8', gesture: 'The strip is the table of contents', html: leaf({ n: 1, of: 8, ey: 'Your life chapters', art: 'g_hero_8', h: D.chapters.head, body: `<div class="card">${lifeStrip()}</div><p class="soft">${D.chapters.intro}</p>`, go: 'ch-3', time: '5 min' }) },
        { id: 'ch-3', label: 'Life Chapters · 3 of 8', gesture: 'The chapter you are in', html: leaf({ n: 3, of: 8, ey: 'The Rising Chapter · now', art: ART.metal, body: B.chapter(D.chapters.list[1]), go: 'ch-4', time: '5 min' }) },
        { id: 'ch-4', label: 'Life Chapters · 4 of 8', gesture: 'This decade', html: leaf({ n: 4, of: 8, ey: 'This decade', art: ART.fire, body: B.decadeNow(), go: 'ch-5', time: '5 min' }) },
        { id: 'ch-5', label: 'Life Chapters · 5 of 8', gesture: 'The years, side by side', html: leaf({ n: 5, of: 8, ey: 'The years of this decade', h: '2026 to 2030', body: `<div style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px">${D.chapters.years.map((y) => `<div class="card" style="flex:0 0 82%;scroll-snap-align:start">${B.year(y)}</div>`).join('')}</div><span class="light" style="font-size:12px">Swipe the years sideways · time runs level</span>`, time: '5 min' }) },
        { id: 'st-1', label: 'Stars · 1 of 5', gesture: 'Stars that help', html: leaf({ n: 1, of: 5, ey: 'Your stars', art: 't_water_6_w', h: D.stars.head, body: `<span class="ey">Stars that help</span>${D.stars.help.map((s) => B.star(s, true)).join('<hr style="border:0;border-top:1px solid var(--borderLight);width:100%">')}`, go: 'st-3', time: '3 min' }) },
