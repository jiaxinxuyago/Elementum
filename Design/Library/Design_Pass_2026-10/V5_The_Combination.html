<style>
/* V5 · The Combination (rows R1–R11, option A): V2's album hub and leaves,
   V1's one-page reading mode, V3's Today landing and reading times, V4's
   energy pager and balance graphic. Every part is labelled with its source
   in the frame captions. */
.src{display:inline-block;font-family:var(--carve);font-size:9px;letter-spacing:1.4px;color:var(--bronzeDark);border:1px solid var(--paperHair);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;background:var(--cream)}
/* hub (V2) */
.idstrip{display:flex;align-items:center;gap:10px;padding:4px 2px}
.idstrip img{width:40px;height:40px;border-radius:50%;border:1px solid var(--paperHair);background:var(--cream)}
.idstrip .nm{display:flex;flex-direction:column;flex:1;min-width:0}
.idstrip .nm b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--walnut);line-height:1}
.bchart{font-size:12px;font-weight:600;color:var(--bronzeDark);cursor:pointer}
.readline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--inkLight)}
.readline .prog{flex:1;height:3px;border-radius:2px;background:var(--silkFold);margin:0 10px;overflow:hidden}
.readline .prog i{display:block;height:100%;width:28%;background:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{position:relative;border-radius:16px;overflow:hidden;background:var(--cardstock);border:1px solid var(--paperHair);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:132px}
.bt.wide{grid-column:span 2}.bt.tall{min-height:200px}
.bt .kart{position:absolute;inset:0}
.bt.artful::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(248,241,225,0) 20%,rgba(248,241,225,.94) 62%)}
.bt>*:not(.kart){position:relative;z-index:2}
.bt .ey{font-size:9px}
.bt .cl{font-family:var(--display);font-size:17px;line-height:1.2;font-weight:500;margin:0;text-wrap:balance}
.bt .ft{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--inkLight)}
.bt .ft .readcirc{margin-left:auto}
.bt .stamp{position:absolute;right:10px;top:10px;z-index:3}
.bt .unread{position:absolute;right:12px;top:12px;z-index:3;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.domgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.domgrid span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--inkSoft)}
.domgrid span .ic{width:18px;height:18px;color:var(--bronzeDark)}
.domgrid span.hv{font-weight:700}.domgrid span.hv .ic{color:var(--ink)}
.rxdots{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rxdots .grp{display:flex;align-items:center;gap:4px}
.rxdots .lbl{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.rxdots .lbl.d{color:var(--down)}.rxdots .lbl.u{color:var(--up)}
.wtile{padding:10px 8px 8px}
.wtile .wh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px 2px}
.hint{text-align:center;font-size:12.5px;color:var(--inkSoft);margin:2px 0 0}
/* leaves (V2) */
.leaf{min-height:100%;display:flex;flex-direction:column;background:var(--silk);position:relative}
.leaf .lband{position:relative;height:200px;flex:none}
.leaf .lband .kart{position:absolute;inset:0}
.leaf .lband::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 35%,var(--silk))}
.leaf .ltop{position:absolute;top:0;left:0;right:0;z-index:4;padding:10px 14px 0}
.leaf .lprog{display:flex;gap:3px}
.leaf .lprog i{flex:1;height:2px;border-radius:1px;background:rgba(43,39,34,.18)}
.leaf .lprog i.on{background:var(--ink)}
.leaf .lbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.leaf .lbar .x{width:28px;height:28px;border-radius:50%;background:rgba(248,246,240,.85);display:grid;place-items:center;cursor:pointer}
.leaf .lbar .x .ic{width:12px;height:12px}
.leaf .lbody{padding:6px 20px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.leaf .lbody.top{padding-top:76px;justify-content:center}
.leaf h3{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.leaf p{margin:0;font-size:15.5px;line-height:1.55}
.leaf .lfoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--inkLight);padding:0 20px 16px;gap:8px}
.leaf .lfoot .onepage{color:var(--bronzeDark);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.leaf.ink{background:var(--night);color:#F3EDDF}
.leaf.ink .lprog i{background:rgba(243,237,223,.25)} .leaf.ink .lprog i.on{background:#F3EDDF}
.leaf.ink .lfoot{color:#BFB6A6}.leaf.ink .lfoot .onepage{color:#E8DCC4}
.endleaf{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.nextleaf{display:flex;gap:12px;align-items:center;border:1px solid var(--paperHair);border-radius:16px;padding:10px;background:var(--cardstock);cursor:pointer}
.nextleaf .kart{width:64px;height:64px;border-radius:12px;flex:none}
/* page mode (V1) */
.secband{position:relative;height:150px;margin-bottom:-36px}
.secband .kart{position:absolute;inset:0}
.secband::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 30%,var(--silk) 96%)}
.sechead{padding:0 18px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.sechead .disp{font-size:24px}
.anchors{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none;position:sticky;top:26px;z-index:4;background:var(--silk)}
.anchors span{flex:none;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--paperHair);border-radius:999px;padding:4px 10px;color:var(--inkSoft);background:var(--cream)}
.anchors span.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.modeswitch{display:flex;justify-content:flex-end;padding:0 14px}
.modeswitch span{font-size:12px;color:var(--bronzeDark);border:1px dashed var(--paperHair);border-radius:999px;padding:3px 10px;cursor:pointer}
.next{display:flex;align-items:center;gap:12px;border-top:1px solid var(--paperHair);padding:16px 0 8px;margin-top:6px;cursor:pointer}
.next .kart{width:64px;height:64px;border-radius:12px;flex:none}
/* energy pager + balance (V4) */
.ebandbig{position:relative;height:220px}
.ebandbig .kart{position:absolute;inset:0}
.ebandbig::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 45%,var(--silk))}
.ebandbig .swipe{position:absolute;left:0;right:0;bottom:44px;z-index:2;display:flex;justify-content:space-between;padding:0 10px}
.ebandbig .swipe span{width:28px;height:28px;border-radius:50%;background:rgba(248,246,240,.85);display:grid;place-items:center}
.pager{display:flex;justify-content:space-between;align-items:center;padding:4px 14px;position:sticky;top:26px;z-index:4;background:linear-gradient(var(--silk) 80%,rgba(241,233,214,0))}
.edots{display:flex;gap:6px}
.edots i{width:6px;height:6px;border-radius:50%;background:var(--inkMist)} .edots i.on{background:var(--ink)}
.flowc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.flowc .side{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.35);border:1px solid var(--borderLight);text-align:center}
.flowc .side .ds{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.flowc .mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.flowc .mid img{width:56px;height:56px;border-radius:50%;background:var(--cream);border:1px solid var(--paperHair)}
.leaf.ink .flowc .side{background:rgba(243,237,223,.08);border-color:rgba(243,237,223,.18)}
.leaf.ink .flowc .side .light{color:#BFB6A6}
.leaf.ink .lbar .x{color:var(--ink)}
.leaf.ink .tone-u{color:#9cc4a2}.leaf.ink .tone-d{color:#e0a08e}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px;color:var(--inkLight)}
.ladder span{display:flex;flex-direction:column;align-items:center;gap:3px}
.dimrow{opacity:.35}
/* Today (V2 card + V3 continue) */
.todaycard{position:relative;border-radius:22px;overflow:hidden;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:1px solid var(--paperHair)}
.todaycard .kart{position:absolute;inset:0}
.todaycard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(241,233,214,0) 25%,rgba(248,241,225,.96) 70%)}
.todaycard .tc{position:relative;z-index:2;padding:16px;display:flex;flex-direction:column;gap:8px}
.todaycard .tc .disp{font-size:25px}
.cont{display:flex;gap:12px;align-items:center;cursor:pointer}
.cont .bk{width:54px;height:72px;border-radius:6px 10px 10px 6px;overflow:hidden;position:relative;flex:none;box-shadow:inset 3px 0 0 rgba(43,39,34,.25);border:1px solid var(--paperHair)}
.cont .bk .kart{position:absolute;inset:0}
.cont .ci{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cont .prog{height:3px;border-radius:2px;background:var(--silkFold);overflow:hidden}.cont .prog i{display:block;height:100%;background:var(--ink)}
.mast{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 2px 2px}
.mast .d{font-family:var(--display);font-size:32px;font-weight:500;line-height:1}
.mast .w{font-family:var(--carve);font-size:9px;letter-spacing:2px;color:var(--inkLight);text-align:right}
.tone-d{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--down)} .tone-u{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--up)}
.reveal{background:#EFE6D2}
.reveal .bgt{position:absolute;inset:0 0 auto;width:100%}
.reveal .bgb{position:absolute;inset:auto 0 0;width:100%;opacity:.8}
.reveal .rin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 26px 0;gap:10px;min-height:100%}
.legend{max-width:880px;margin:18px auto 0}
.legend table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.legend th,.legend td{text-align:left;vertical-align:top;padding:8px 10px;border-top:1px solid var(--borderLight)}
.legend th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.legend .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
</style>

<script>
const page = (inner, tab = 'reading') => `<div class="page">${status()}${inner}${tabbar(tab)}</div>`;
const stamp = () => `<span class="chop stamp">${D.id.stem}</span>`;
const leaf = ({ n, of, art: a, ey, h, body = '', go, back = 'hub', ink = false, end = '', time = '', one = '' }) => `<div class="leaf${ink ? ' ink' : ''}"${go ? ` data-go="${go}"` : ''}>
  <div class="ltop"><div class="lprog">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><div class="lbar"><span class="carve" style="${ink ? 'color:#D9CFBC' : ''}">${ey}</span><span class="x" data-go="${back}">${use('ico-close')}</span></div></div>
  ${a ? `<div class="lband">${art(a)}</div>` : ''}

  ${time || one ? `<div class="lfoot"><span>${n} of ${of}${time ? ` · ${time}` : ''}</span>${one ? `<span class="onepage" data-go="${one}">Read it all as one page</span>` : ''}</div>` : ''}</div>`;
const nextLeaf = (a, ey, t, go) => `<div class="endleaf"><div class="nextleaf" data-go="${go}">${art(a)}<div style="flex:1"><span class="ey">Next · ${ey}</span><p class="disp" style="font-size:18px">${t}</p></div>${arrowBtn('sm')}</div></div>`;
const nextCard = (a, ey, t, go) => `<div class="next" data-go="${go}">${art(a)}<div style="flex:1;display:flex;flex-direction:column"><span class="ey">Next · ${ey}</span><span class="disp" style="font-size:18px">${t}</span></div>${arrowBtn('sm')}</div>`;
const balance = (u = false) => u
  ? `<div class="flowc"><div class="side"><span class="tone-u">Adds to you</span><div class="ds">${dot('wood', 30)}${dot('water', 24)}</div><span class="light" style="font-size:11px">Body 11% · Mind 0%</span></div><div class="mid"><img src="${U.seal}" alt=""><div style="width:76px">${dial(U.score, U.cond)}</div></div><div class="side"><span class="tone-d">Spends you</span><div class="ds">${dot('metal', 44)}${dot('earth', 28)}${dot('fire', 24)}</div><span class="light" style="font-size:11px">Order 74% · Action 12% · Expression 3%</span></div></div>`
  : `<div class="flowc"><div class="side"><span class="tone-d">Adds to you</span><div class="ds">${dot('metal', 38)}${dot('earth', 42)}</div><span class="light" style="font-size:11px">Body 23% · Mind 33%</span></div><div class="mid"><img src="${D.id.seal}" alt=""><div style="width:76px">${dial(D.score, D.cond)}</div></div><div class="side"><span class="tone-u">Spends you</span><div class="ds">${dot('water', 28)}${dot('wood', 40)}${dot('fire', 28)}</div><span class="light" style="font-size:11px">Expression 6% · Action 33% · Order 5%</span></div></div>`;

const hub = () => page(`<div class="pad" style="padding-top:8px">
