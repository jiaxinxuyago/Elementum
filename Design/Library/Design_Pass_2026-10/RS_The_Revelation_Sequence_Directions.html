<!doctype html>
<meta charset="utf-8">
<title>Revelation Sequence Directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* The revelation sequence: the Naming, the first reading's eight cards, the
   dissolve. Every frame sits on the Naming's own ground (paper, the distant
   peaks, the floating island, fog): no new colours anywhere. */
.reveal{background:linear-gradient(180deg,#F5EEDE 0%,#F1E9D6 52%,#ECE2C9 100%);position:relative;height:100%;overflow:hidden}
.reveal .bgt,.reveal .bgb{position:absolute;left:0;width:100%;height:50%;object-fit:cover;pointer-events:none;z-index:0}
.reveal .bgt{top:0;object-position:center top;-webkit-mask-image:linear-gradient(to bottom,#000 56%,transparent 100%);mask-image:linear-gradient(to bottom,#000 56%,transparent 100%)}
.reveal .bgb{top:50%;object-position:center bottom;mix-blend-mode:multiply;opacity:.72;-webkit-mask-image:linear-gradient(to top,#000 60%,transparent 100%);mask-image:linear-gradient(to top,#000 60%,transparent 100%)}
.reveal .fog{position:absolute;left:-8%;right:-8%;top:24%;height:52%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(243,236,221,0) 0%,rgba(243,236,221,.14) 34%,rgba(244,238,224,.32) 50%,rgba(243,236,221,.14) 66%,rgba(243,236,221,0) 100%);filter:blur(20px)}
.reveal .veil{position:absolute;left:0;right:0;top:46%;bottom:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(241,233,214,0) 0%,rgba(241,233,214,.55) 30%,rgba(241,233,214,.72) 100%)}
.reveal .kstatus{position:absolute;left:0;right:0;top:0;z-index:5;background:none}
.reveal .prog{position:absolute;top:40px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.reveal .prog i{flex:1;height:3px;border-radius:2px;background:rgba(43,39,34,.18)} .reveal .prog i.on{background:#2b2722}
.reveal .skip{position:absolute;top:52px;right:14px;z-index:5;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.7}
.reveal .rin{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:74px 26px 44px;gap:12px;height:100%}
.reveal .rin.mid{justify-content:center}
.reveal .rey{font-family:var(--carve);font-size:9px;letter-spacing:3.2px;text-transform:uppercase;color:var(--bronzeDark)}
.reveal .rtitle{font-family:var(--display);font-size:31px;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.reveal .rtitle.name{font-size:40px;font-weight:500;line-height:1.05}
.reveal .rp{font-size:16px;line-height:1.5;margin:0;max-width:30ch}
.reveal .rp.quiet{color:var(--inkSoft);font-size:15px}
.reveal .rstate{display:flex;align-items:center;gap:10px;font-family:var(--carve);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--inkSoft)}
.reveal .rstate b{font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink)}
.reveal .rseal{width:150px;height:150px}
.reveal .hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:var(--body);font-size:9px;letter-spacing:2.4px;text-transform:uppercase;opacity:.55;z-index:3}
.reveal .rswipe{margin-top:auto;padding-bottom:0;font-size:13px;color:var(--inkSoft);display:flex;flex-direction:column;align-items:center;gap:2px}
.reveal .rswipe b{font-weight:400;font-size:18px;line-height:1}
.reveal .inscr{position:absolute;right:22px;bottom:92px;z-index:3;writing-mode:vertical-rl;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;color:var(--inkLight);opacity:.85;text-shadow:0 0 6px #F1E9D6,0 0 2px #F1E9D6}
.reveal .inscr .han{font-family:var(--han);font-size:12px;letter-spacing:4px}
.reveal .rule{width:200px;height:1px;background:var(--paperHair)}
.reveal .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:6px}
.reveal .btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 18px;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.reveal .btn.ink{background:var(--ink);color:var(--cream)}
.reveal .btn.ghost{color:var(--ink);border:1px solid var(--paperHair);background:rgba(248,246,240,.55)}
/* the distribution row (the Naming) */
.dist{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}
.dist span{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--carve);font-size:9px;letter-spacing:1px;color:var(--inkSoft)}
.dist small{font-family:var(--body);font-size:12px;color:var(--ink)}
/* the big ink dot: the wheel's sign, sized by presence */
.bigdot{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigdot .kdot{filter:drop-shadow(0 6px 16px rgba(43,39,34,.18))}
/* Direction 2: the wash under the paper, the small sign, the left column */
.reveal .wash{position:absolute;z-index:1;width:440px;height:440px;left:-130px;top:30px;background-size:cover;background-position:center;opacity:.34;mix-blend-mode:multiply;pointer-events:none;filter:blur(1.5px)}
.reveal .rin.left{align-items:flex-start;text-align:left;padding:118px 62px 44px 28px;gap:12px;justify-content:flex-start}
.reveal .rin.left .rp{max-width:28ch}
.reveal .rin.left .rtitle{text-wrap:pretty}
.reveal .rin.left .btns{align-items:stretch}
/* Direction 3: the rail, the five dots as a persistent map */
.rail{display:flex;align-items:flex-end;justify-content:center;gap:9px;min-height:150px;max-width:100%}
.rail span{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--carve);font-size:8.5px;letter-spacing:1px;color:var(--inkSoft);transition:opacity .3s}
.rail span.off{opacity:.38}
.rail span.off .kdot .ic{opacity:.6}
.rail small{font-family:var(--body);font-size:12px;color:var(--ink)}
.rail .grp{display:flex;flex-direction:column;align-items:center;gap:8px}
.rail .grp .gl{font-family:var(--carve);font-size:9px;letter-spacing:2.4px;color:var(--bronzeDark)}
.rail .grp .gd{display:flex;align-items:flex-end;gap:10px}
.rail .grp.rel .gl{color:var(--down)} .rail .grp.gro .gl{color:var(--up)}
/* the dial on paper */
.reveal .mg-dial{max-width:200px}
/* the bug, before and after */
.gapdemo{height:100%;position:relative;background:var(--silk)}
.gapdemo .card{position:absolute;left:0;right:0;bottom:0;top:48px;background:#dde5ec}
.gapdemo.fixed .card{top:0}
.gapdemo .card .prog{position:absolute;top:40px;left:12px;right:12px;display:flex;gap:4px}
.gapdemo .card .prog i{flex:1;height:3px;border-radius:2px;background:rgba(43,39,34,.18)} .gapdemo .card .prog i.on{background:#2b2722}
.gapdemo .card p{position:absolute;top:46%;left:26px;right:26px;text-align:center;font-family:var(--display);font-size:22px;margin:0;color:var(--inkSoft)}
.gapdemo .strip{position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--carve);font-size:9px;letter-spacing:2px;color:var(--down)}
/* page furniture */
.cmp{max-width:880px;margin:26px auto 0}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--borderLight)}
.cmp th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.cmp .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
.good{color:var(--up)} .risk{color:var(--down)}
.words{max-width:880px;margin:26px auto 0;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px 18px}
.words h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 6px}
.words dl{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:8px 14px;margin:0;font-size:14.5px}
.words dt{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);padding-top:3px}
.words dd{margin:0}
.words code{font-family:var(--mono);font-size:12px;color:var(--inkLight)}
.rows{max-width:880px;margin:0 auto}
.row{background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px;margin-top:12px}
.row .rh{display:flex;gap:10px;align-items:baseline}
.row .rc{font-family:var(--carve);font-size:13px;letter-spacing:1.5px;color:var(--bronzeDark)}
.row h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.row .why{font-size:14.5px;color:var(--inkSoft);margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--paperHair);background:var(--cream);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;font-size:15px;line-height:1.4}
.opt b{font-family:var(--carve);font-size:13px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair)}
.opt .rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--up);margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"] b{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(248,246,240,.97);border-top:1px solid var(--paperHair);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tray code{flex:1;min-width:0;font-family:var(--body);font-size:15px;font-weight:600;white-space:nowrap;overflow-x:auto;padding:6px 0}
.tray button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.tray .msg{font-size:12px;color:var(--up)}
body{padding-bottom:120px}
</style>

/* ── the words, all from the running app (golden chart, 2026-10-21) ───

const FN_HEAD = {

  water: 'Your Expression is the gate where inner work becomes outer fact. Water makes it flow, and what you feel comes out.',
};
const STATE = { metal: 'Overfueled', earth: 'Friction', fire: 'Catalyst', wood: 'Catalyst', water: 'Catalyst' };
const P = Object.fromEntries(EL.map((e) => [e, D.E[e].p]));
const PMAX = Math.max(...Object.values(P));
const ORDER = D.order;                       // the first reading's order: metal · earth · fire · wood · water
const n = 8;
const pillOf = (e) => pill(D.E[e].pole, D.E[e].pole === 'fric' ? 'Release it' : 'Grow it');
const prog = (i) => `<div class="prog">${Array.from({ length: n }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><span class="skip">Skip</span>`;
const ground = (inner, { card = null, extra = '', cls = 'mid', veil = true, hint = '' } = {}) => `<div class="page reveal">${status()}<img class="bgt" src="bg-reveal-01-distant-peaks.jpg" alt=""><img class="bgb" src="bg-reveal-02-floating-island.jpg" alt=""><div class="fog"></div>${veil ? '<div class="veil"></div>' : ''}${card === null ? '' : prog(card)}${extra}<div class="rin ${cls}">${inner}</div>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const seal = `<img class="rseal" src="${D.id.seal}" alt="庚, The Blade">`;
const big = (e) => Math.round(96 + 72 * (P[e] / PMAX));
const distRow = (hi = null) => `<div class="dist">${ORDER.map((e) => `<span${hi && hi !== e ? ' style="opacity:.4"' : ''}>${dot(e, Math.round(30 + (P[e] / PMAX) * 34))}<small>${P[e]}%</small>${ELN[e]}</span>`).join('')}</div>`;
const naming = () => ground(`<div style="height:72px;flex:none"></div><span class="rey">You are</span>${seal}<p class="rtitle name">${D.id.arch}</p><span class="rey" style="margin-top:14px">Your five energies</span>${distRow()}<span class="rswipe"><b>^</b>Swipe up</span>`, { cls: '', veil: false, extra: `<span class="inscr"><span class="han">庚</span> · YANG METAL · 1995 · APRIL 29 · 17–19 CST</span>` });
const stateLine = (e) => `<span class="rstate"><b>${P[e]}%</b>· ${STATE[e]} ·${pillOf(e)}</span>`;
const title = (e) => `${ELN[e]} is your ${D.E[e].fn} energy.`;
const rxDots = (grouped = true) => `<div class="rail">${grouped ? `<div class="grp rel"><span class="gl">Release</span><div class="gd">${D.ease.map((e) => `<span>${dot(e, Math.round(34 + (P[e] / PMAX) * 30))}${ELN[e]}</span>`).join('')}</div></div><div class="grp gro"><span class="gl">Grow</span><div class="gd">${D.seek.map((e) => `<span>${dot(e, Math.round(34 + (P[e] / PMAX) * 30))}${ELN[e]}</span>`).join('')}</div></div>` : ''}</div>`;
const endBtns = `<div class="btns"><span class="btn ink">Enter your reading ${use('ico-arrow-r')}</span><span class="btn ghost">${use('ico-share')} Share your reading</span></div>`;

/* ── Direction 1 · one ground ──────────────────────────────────── */
const d1 = {
  c1: ground(`<span class="rey">Your first reading</span>${seal}<h3 class="rtitle">You are ${D.id.arch}.</h3><p class="rp">${D.id.who}</p>`, { card: 0, hint: 'Tap to continue' }),
  c2: ground(`<span class="rey">How you run</span>${dial(D.score, D.cond)}<h3 class="rtitle">You run ${D.cond}.</h3><p class="rp">${D.runLine}</p>`, { card: 1 }),
  en: (e, i) => ground(`<span class="rey">${D.E[e].head}</span><div class="bigdot">${dot(e, big(e))}</div><h3 class="rtitle">${title(e)}</h3><p class="rp">${FN_HEAD[e]}</p>${stateLine(e)}`, { card: i }),
  c8: ground(`<span class="rey">What your chart asks for</span>${rxDots()}<h3 class="rtitle">${D.rx}</h3><p class="rp quiet">${D.start}</p>${endBtns}`, { card: 7 }),
};
/* ── Direction 2 · the wash ───────────────────────────────────── */
const inscr = (han, rest) => `<span class="inscr"><span class="han">${han}</span> · ${rest}</span>`;
const d2 = {
  c1: ground(`${seal}<h3 class="rtitle">You are ${D.id.arch}.</h3><p class="rp">${D.id.who}</p>`, { card: 0, cls: 'left', hint: 'Tap to continue', extra: inscr('庚', 'YANG METAL · YOUR FIRST READING') }),
  c2: ground(`<div style="width:200px">${dial(D.score, D.cond)}</div><h3 class="rtitle">You run ${D.cond}.</h3><p class="rp">${D.runLine}</p>`, { card: 1, cls: 'left', extra: inscr('主', `HOW YOU RUN · ${D.score} OF 7`) }),
  en: (e, i) => ground(`${dot(e, 72)}<span class="rey">${D.E[e].head}</span><h3 class="rtitle">${title(e)}</h3><p class="rp">${FN_HEAD[e]}</p><p class="rp quiet">${D.E[e].teaser}</p>${pillOf(e)}`, { card: i, cls: 'left', extra: `<span class="wash" style="background-image:url(dot-${e}.png)"></span>${inscr(HAN[e], `${P[e]}% · ${STATE[e].toUpperCase()}`)}` }),
  c8: ground(`<span class="rey">What your chart asks for</span><h3 class="rtitle">${D.rx}</h3><p class="rp quiet">${D.start}</p>${endBtns}`, { card: 7, cls: 'left', extra: `<span class="wash" style="background-image:url(dot-fire.png);opacity:.26"></span>${inscr('火', 'START WITH FIRE · YOUR ORDER')}` }),
};
/* ── Direction 3 · the rail ───────────────────────────────────── */
const rail = (hi) => `<div class="rail">${ORDER.map((e) => `<span class="${e === hi ? '' : 'off'}">${dot(e, e === hi ? Math.round(60 + (P[e] / PMAX) * 48) : Math.round(22 + (P[e] / PMAX) * 18))}<small>${P[e]}%</small>${ELN[e]}</span>`).join('')}</div>`;
const d3 = {
  c1: d1.c1,
  c2: d1.c2,
  en: (e, i) => ground(`<span class="rey">${D.E[e].head}</span>${rail(e)}<h3 class="rtitle">${title(e)}</h3><p class="rp">${FN_HEAD[e]}</p>${stateLine(e)}`, { card: i }),
  c8: ground(`<span class="rey">What your chart asks for</span>${rxDots()}<h3 class="rtitle">${D.rx}</h3><p class="rp quiet">${D.start}</p>${endBtns}`, { card: 7 }),
};
const shelf = (d, id, labels) => [
  { id: `${id}-c1`, label: 'Card 1 · You are The Blade', gesture: labels.c1, html: d.c1 },
  { id: `${id}-c2`, label: 'Card 2 · How you run', gesture: labels.c2, html: d.c2 },
  ...ORDER.map((e, k) => ({ id: `${id}-${e}`, label: `Card ${k + 3} · ${ELN[e]}, your ${D.E[e].fn}`, gesture: labels.en(e), html: d.en(e, k + 2) })),
  { id: `${id}-c8`, label: 'Card 8 · What your chart asks for', gesture: labels.c8, html: d.c8 },
];

const V = {
  code: 'RS', name: 'The Revelation Sequence',
  thesis: 'The Naming, the eight cards, the dissolve: one ground from the first frame to the last. The cards lose their flat colours and sit on the Naming’s paper and painting; each energy card carries the wheel’s own ink dot; each energy is named by its function first.',
  tap: 'Unchanged: tap the right two-thirds of a card to go on, the left third to go back; Skip at the top; the last card enters the reading, where the seal dissolves into the wheel.',
  scroll: 'None. Every card is one still composition on the same ground.',
  next: 'The three directions share the ground, the words and the order. They differ in where the energy’s sign sits: as the card’s object (1), as a wash under a left-hand column (2), or as the Naming’s five-dot row kept on screen (3).',
  intro: 'Golden chart (庚 The Blade, Overfueled). Every line of text is the app’s own: the who-you-are line, the run headline, the pair heads, THE FUNCTION’s opening sentences, the CHARACTER panel’s state, the ribbon. Nothing new was written. The gap at the top edge is already fixed on elementum.life (section 1).',
  flows: [
    { id: 'gap', short: '1 · The gap', title: 'The top-edge gap, fixed and live', note: 'The cards sat inside the stage, under the 48px status strip, so the frame’s paper showed above every card. The card now takes the Naming overlay’s inset and paints to the top edge. Shipped this afternoon; the directions below make the strip moot anyway, since the cards share the paper.',
      screens: [
        { id: 'gap-before', label: 'This morning', gesture: 'A paper strip above a tinted card', html: `<div class="gapdemo"><span class="strip">the gap</span><div class="card"><div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><p>Card 3, as it shipped</p></div></div>` },
        { id: 'gap-after', label: 'Now live', gesture: 'The card’s ground reaches the top edge', html: `<div class="gapdemo fixed"><div class="card">${status()}<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><p>Card 3, fixed</p></div></div>` },
        { id: 'gap-naming', label: 'The Naming, as it ships', gesture: 'The ground every direction below keeps: paper, peaks, island, fog', html: naming() },
      ] },
    { id: 'd1', short: '2 · One ground', title: 'Direction 1 · One ground (recommended)', note: 'The painting never moves; only what sits on the paper changes. The seal of the Naming gives way to the energy’s ink dot in the same place, sized by presence as on the Naming and the wheel. Centred, like the Naming. Title: “Metal is your Body energy.”, then THE FUNCTION’s first two sentences, then the state and the pill.',
      screens: shelf(d1, 'd1', { c1: 'The seal stays where the Naming left it; the words begin', c2: 'The dial in ink on paper; the run headline', en: (e) => `${ELN[e]}’s dot at ${big(e)}px (${P[e]}% of ${PMAX}%); the pair head above, the function title, the function’s opening`, c8: 'The ribbon as a picture: the five dots in two groups' }) },
    { id: 'd2', short: '3 · The wash', title: 'Direction 2 · The wash', note: 'One-corner composition (一角): the energy’s ink dot bleeds under the paper at the top left like a seal impression, the small sign heads a left-hand column, and the painter’s inscription at the right carries the number and the state. Two paragraphs: THE FUNCTION’s opening, then the verdict line the card carries today.',
      screens: shelf(d2, 'd2', { c1: 'The seal and the words in a left column; the inscription names the reading', c2: 'The dial at the left; the score in the inscription', en: (e) => `${ELN[e]}’s dot washed under the paper; the sign at 72px; “${HAN[e]} · ${P[e]}% · ${STATE[e].toUpperCase()}” at the side`, c8: 'The ribbon in the column; Fire’s wash under it, since Fire is where to start' }) },
    { id: 'd3', short: '4 · The rail', title: 'Direction 3 · The rail', note: 'The Naming’s five-dot row stays on screen through cards 3 to 7. The energy being read swells to the card’s object; the other four wait at the side, ghosted. The reader always sees where this energy sits among the five. Card 8 resolves the row into Release and Grow.',
      screens: shelf(d3, 'd3', { c1: 'As Direction 1', c2: 'As Direction 1', en: (e) => `${ELN[e]} swells in the row; the other four ghost to 38%`, c8: 'The row resolves into the ribbon’s two groups' }) },
  ],
  after: `<section class="words"><h2>The words, and where they come from</h2>
  <dl>
    <dt>Card 1</dt><dd>“You are The Blade.” and the who-you-are line. <code>STEM.who</code></dd>

    <dt>Cards 3 to 7, eyebrow</dt><dd>The pair head: “Metal strengthens the Blade”, “Earth feeds the Blade”, “Fire forges the Blade”, “Wood is shaped by the Blade”, “Water draws from the Blade”. <code>ELEMENT_PAIR.head</code></dd>

    <dt>Cards 3 to 7, state</dt><dd>“23% · Overfueled · Release it”: the CHARACTER panel’s own three facts. Direction 2 also keeps today’s verdict line under the teaser. <code>cta_verdict</code></dd>

  <section class="cmp"><h2 style="font-family:var(--display);font-weight:500;font-size:26px;margin:26px 0 8px">Why Direction 1</h2>
  <div class="scroll"><table>
    <tr><th></th><th>1 · One ground</th><th>2 · The wash</th><th>3 · The rail</th></tr>

    <tr><td>The sign’s integration with the background</td><td>The dot sits on the paper, like the wheel’s disks</td><td class="good">The dot is in the paper: the wash reads as ink under the sheet</td><td>Dots on the paper</td></tr>
    <tr><td>Readability over the island art</td><td class="good">Veil from mid-height; 16px body, 30ch</td><td class="good">Column keeps clear of the island’s right side</td><td class="good">As Direction 1</td></tr>

    <tr><td>Build size</td><td class="good">Small: merged.css grounds, two markup changes</td><td>Medium: a left layout, the wash, the inscription</td><td>Small to medium: the rail component</td></tr>
  </table></div>
  <p style="font-size:14.5px;color:var(--inkSoft);margin-top:10px">Direction 2 is the best-looking single card and the strongest “sign in the background” answer; it costs a second paragraph and a second layout grammar inside one sequence. Direction 3 answers “where am I among the five” well but puts five numbers on every card, which is what the Naming re-ruling just moved off the first glance. Direction 1 keeps one grammar from the Naming to the dissolve. Rows RS2 and RS5 can pull Direction 2’s wash or its inscription into Direction 1.</p></section>
  <section class="rows"><h2 style="font-family:var(--display);font-weight:500;font-size:26px;margin:26px 0 4px">Rulings</h2><div id="rows"></div></section>`,
};
renderVariant(V);

const ROWS = [
  ['RS1', 'The direction', 'Which composition the eight cards take. All three share the ground and the words.', ['Direction 1: one ground, the dot as the card’s object', 'Direction 2: the wash under a left column, with the side inscription', 'Direction 3: the rail, the five dots kept on screen']],
  ['RS2', 'The energy’s sign', 'How the wheel’s ink dot appears on cards 3 to 7.', ['One dot sized by presence, in the seal’s place', 'A faint wash under the paper plus a small sign at the top of the text', 'The five-dot row with the current one swelling']],
  ['RS3', 'The energy card’s title and teaser', 'What replaces “You have 23% of Metal energy.”', ['“Metal is your Body energy.” over THE FUNCTION’s first two sentences', '“Metal is your Body energy.” over today’s verdict line', 'The function title over both: the function’s opening, then the verdict']],
  ['RS4', 'Card 2’s words', 'What the How-you-run card says.', ['“You run Overfueled.” over “Your Metal takes in more than it spends.”', '“Overfueled.” as today']],
  ['RS5', 'The number and the state', 'Where 23% and Overfueled sit on an energy card.', ['A state line under the teaser: “23% · Overfueled · Release it”', 'A vertical inscription at the right, like the Naming’s, with the pill under the teaser', 'The pill alone; the number stays on the Naming and the wheel']],
  ['RS6', 'Card 8’s picture', 'What sits above “Release Metal and Earth. Grow Fire, Wood and Water.”', ['The five dots in two groups, Release and Grow', 'No picture, as today']],
  ['RS7', 'The ground under the cards', 'Which painting sits under cards 1 to 8.', ['The Naming’s own: distant peaks above, the floating island below, fog and a veil', 'Paper with the mist veil only; the peaks and island stay with the Naming']],
];
const L = 'ABC';
let pick = {};
try { pick = JSON.parse(localStorage.getItem('elementum-rulings-revelation') || '{}') || {}; } catch (e) { pick = {}; }
const rows = document.getElementById('rows');
rows.innerHTML = ROWS.map(([c, t, why, opts]) => `<div class="row"><div class="rh"><span class="rc">${c}</span><h3>${t}</h3></div><p class="why">${why}</p><div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-row="${c}" data-opt="${L[i]}" aria-pressed="${pick[c] === L[i]}"><b>${L[i]}</b><span>${o}${i === 0 ? '<span class="rec">Recommended</span>' : ''}</span></button>`).join('')}</div></div>`).join('');
document.body.insertAdjacentHTML('beforeend', '<div class="tray"><div class="in"><code id="codes">No rows ruled yet</code><span class="msg" id="msg" aria-live="polite"></span><button id="copy" type="button">Copy</button></div></div>');
const codes = document.getElementById('codes');
const render = () => { const s = ROWS.filter(([c]) => pick[c]).map(([c]) => `${c} ${pick[c]}`).join(', '); codes.textContent = s || 'No rows ruled yet'; };
rows.addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (!b) return; pick[b.dataset.row] = b.dataset.opt; b.parentElement.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', x === b)); try { localStorage.setItem('elementum-rulings-revelation', JSON.stringify(pick)); } catch (err) { /* storage off */ } render(); });
document.getElementById('copy').addEventListener('click', () => { const msg = document.getElementById('msg'); navigator.clipboard.writeText(codes.textContent).then(() => { msg.textContent = 'Copied'; setTimeout(() => (msg.textContent = ''), 1500); }).catch(() => { const r = document.createRange(); r.selectNodeContents(codes); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Selected'; }); });
render();
</script>
