<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Card Alignment Pass</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An alignment pass on the share card: three layouts that fix the uneven columns, the floating pills and the empty lower third.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* the card: 306 × 544 logical, as the app draws it; the mist veil as the ground */
.sc{width:306px;height:544px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(180deg,#F5EEDE 0%,#F1E9D6 52%,#ECE2C9 100%);box-shadow:0 18px 40px rgba(0,0,0,.3);flex:none}
.sc .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.sc .in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 20px 16px;gap:7px}
.sc .ey{font-family:var(--mono);font-size:7.5px;letter-spacing:2.6px;color:var(--inkLight);font-weight:400}
.sc .plate{width:124px;height:124px;object-fit:contain;margin-top:2px}
.sc .name{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.1;color:var(--ink);text-wrap:balance}
.sc .who{margin:0;max-width:28ch;font-family:var(--body);font-size:13px;line-height:1.45;color:var(--inkSoft)}
.sc .core{display:flex;align-items:center;gap:7px;margin-top:4px;padding:5px 10px;border-radius:999px;border:1px solid var(--paperHair);background:rgba(248,244,236,.6);font-family:var(--body);font-size:12.5px;color:var(--inkSoft)}
.sc .core b{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink)}
.sc .core .ic{width:15px;height:15px;color:var(--ink)}
.sc .core .role-pill{font-size:8px;padding:3px 8px}
.sc .foot{margin-top:auto;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;text-transform:uppercase;color:var(--bronzeDark)}
/* A · the two columns, the noun under the name */
.sc .groups{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:6px}
.sc .grp{display:flex;flex-direction:column;align-items:center;gap:7px}
.sc .gl{font-family:var(--carve);font-size:8px;letter-spacing:2.2px;text-transform:uppercase;color:var(--bronzeDark)}
.sc .grp.rel .gl{color:var(--down)} .sc .grp.gro .gl{color:var(--up)}
.sc .gd{display:flex;align-items:flex-end;gap:9px}
.sc .gd>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--carve);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--inkSoft)}
.sc .gd small{font-family:var(--body);font-size:11px;color:var(--ink)}
.sc .gd em{font-style:normal;font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.sc .gd .kdot{margin-bottom:3px}
/* B · the ledger: one row per energy, "{El} is your {Function}" */
.sc .ledger{width:100%;margin-top:6px;display:flex;flex-direction:column;border-top:1px solid var(--paperHair)}
.sc .lrow{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:7px;padding:4px 2px;border-bottom:1px solid var(--paperHair);text-align:left}
.sc .lrow .kdot{justify-self:center}
.sc .lrow .lt{white-space:nowrap;font-family:var(--display);font-size:13.5px;font-weight:500;color:var(--inkSoft);line-height:1.1}
.sc .lrow .lt b{font-weight:600;color:var(--ink)}
.sc .lrow .lp{font-family:var(--body);font-size:11.5px;color:var(--ink);min-width:28px;text-align:right}
.sc .lrow .role-pill{font-size:7px;padding:2px 6px;letter-spacing:.5px}
.sc .lrow .role-pill .ic{width:7px;height:7px}
.sc .lrow.core-row .lt::after{content:" · core";font-family:var(--carve);font-size:7.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronzeDark);font-weight:400}
.sc.b .who{font-size:12.5px;line-height:1.4}
.sc.b .plate{width:112px;height:112px}
/* C · the ribbon: one row of five with nouns, the ribbon's two lines under it */
.sc .row5{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:6px}
.sc .row5>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--carve);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--inkSoft)}
.sc .row5 small{font-family:var(--body);font-size:11px;color:var(--ink)}
.sc .row5 em{font-style:normal;font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.sc .row5 .kdot{margin-bottom:3px}
.sc .row5 .tag{margin-top:2px;width:100%;height:2px;border-radius:2px}
.sc .row5 .tag.rel{background:var(--down)} .sc .row5 .tag.gro{background:var(--up)}
.sc .rx{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-family:var(--display);font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.2}
.sc .rx span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.sc .rx .r::before{background:var(--down)} .sc .rx .g::before{background:var(--up)}
/* the page */
.shelf.cards{align-items:flex-start}
.frame.card{flex:0 0 auto;border-radius:14px}
.rows{max-width:880px;margin:0 auto}
.row{background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px;margin-top:12px}
.row .rh{display:flex;gap:10px;align-items:baseline}
.row .rc{font-family:var(--carve);font-size:13px;letter-spacing:1.5px;color:var(--bronzeDark)}
.row h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.row .why{font-size:14.5px;color:var(--inkSoft);margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--paperHair);background:var(--cream);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;font-size:15px;line-height:1.4}
.opt b{font-family:var(--carve);font-size:13px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair)}
.opt .rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--up);margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"] b{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.cmp{max-width:880px;margin:26px auto 0}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--borderLight)}
.cmp th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.cmp .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
.good{color:var(--up)} .risk{color:var(--down)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(248,246,240,.97);border-top:1px solid var(--paperHair);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tray .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tray code{flex:1;min-width:0;font-family:var(--body);font-size:15px;font-weight:600;white-space:nowrap;overflow-x:auto;padding:6px 0}
.tray button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.tray .msg{font-size:12px;color:var(--up)}
body{padding-bottom:120px}
</style><style>
.sc .claim{margin:0;max-width:27ch;font-family:var(--display);font-size:16.5px;font-weight:500;line-height:1.3;color:var(--ink);text-wrap:balance}
.sc .traits{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 10px;max-width:260px;margin:2px 0 0}
.sc .traits span{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);line-height:1.1}
.sc .traits .ic{width:11px;height:11px}
.sc .traits .down{color:var(--inkSoft)}
.sc .gd .tw{font-family:var(--body);font-size:9px;letter-spacing:0;text-transform:none;color:var(--inkSoft);max-width:52px;line-height:1.1;text-align:center}
</style>
<style>
.sc .groups.wide{gap:14px}
.sc .gh{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sc .gh .role-pill{font-size:7px;padding:2px 6px;letter-spacing:.5px;white-space:nowrap}
.sc .gh .role-pill .ic{width:7px;height:7px}
.sc .pill2{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px 3px 7px;font-family:var(--body);font-size:8px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#fff}
.sc .pill2 .ic{width:8px;height:8px}
.sc .pill2 i{font-style:normal;opacity:.8;font-weight:500}
.sc .pill2.rel{background:var(--down)} .sc .pill2.gro{background:var(--up)}
.sc .ink3{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.sc .ink3 .l{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-family:var(--carve);font-size:8px;letter-spacing:2px;text-transform:uppercase}
.sc .ink3 .l .ic{width:9px;height:9px}
.sc .ink3 .l i{font-style:normal;font-family:var(--body);font-size:8px;font-weight:700;letter-spacing:1px;opacity:.85}
.sc .ink3 .rule{width:100%;height:1px;background:currentColor;opacity:.45}
.sc .ink3.rel{color:var(--down)} .sc .ink3.gro{color:var(--up)}
</style>
<style>
/* shared: the five on one grid */
.sc .in.v{justify-content:space-between;gap:0;padding:20px 20px 18px}
.sc .top{display:flex;flex-direction:column;align-items:center;gap:7px}
.sc .mid{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.sc .grid{display:grid;grid-template-columns:repeat(5,1fr);width:100%;column-gap:4px;row-gap:0}
.sc .grid .hdr{grid-row:1;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
.sc .grid .hdr.rel{grid-column:1/3} .sc .grid .hdr.gro{grid-column:3/6}
.sc .grid .cell{grid-row:2;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--carve);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--inkSoft)}
.sc .grid .cell small{font-family:var(--body);font-size:11px;color:var(--ink)}
.sc .grid .cell em{font-style:normal;font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.sc .grid .cell .kdot{margin-bottom:3px}
.sc .grid .cell .dw{height:44px;display:flex;align-items:flex-end;justify-content:center}
.sc .grid .sep{grid-row:1/3;grid-column:3;justify-self:start;width:1px;height:100%;background:var(--paperHair);margin-left:-2px}
.sc .pill2{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px 3px 7px;font-family:var(--body);font-size:8px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#fff}
.sc .pill2 .ic{width:8px;height:8px}
.sc .pill2.rel{background:var(--down)} .sc .pill2.gro{background:var(--up)}
.sc .core.w{width:100%;justify-content:center;margin-top:0}
.sc .foot.v{margin-top:0}
/* L2 · the panel */
.sc .panel{width:100%;background:rgba(250,246,238,.62);border:1px solid rgba(205,190,158,.7);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(43,39,34,.04)}
.sc .panel .foot{margin-top:2px}
/* L3 · the corner */
.sc .in.l{align-items:flex-start;text-align:left;padding:20px 22px 18px 22px;gap:0;justify-content:space-between}
.sc .in.l .top{align-items:flex-start}
.sc .in.l .claim{text-align:left;max-width:24ch}
.sc .in.l .name{text-align:left;font-size:29px}
.sc .in.l .plate{margin-left:-6px;width:118px;height:118px}
.sc .in.l .core{align-self:flex-start}
.sc .inscr{position:absolute;right:16px;top:22px;writing-mode:vertical-rl;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;color:var(--inkSoft);text-shadow:0 0 2px #F1E9D6,0 0 3px #F1E9D6}
.sc .inscr .han{font-family:var(--han);font-size:12px;letter-spacing:4px}
.sc .in.l .foot{align-self:center}
</style>
</head><body>

<script>
const P = Object.fromEntries(EL.map((e) => [e, D.E[e].p]));
const PMAX = Math.max(...Object.values(P));
const CLAIM = 'People come to you when they need the unsoftened truth.';
const sz = (e) => Math.round(22 + 22 * (P[e] / PMAX));
const cell = (e, uniform = false) => `<span class="cell"><span class="dw">${dot(e, uniform ? 34 : sz(e))}</span><small>${P[e]}%</small>${ELN[e]}<em>${D.E[e].fn}</em></span>`;
const grid = (uniform = false, sep = false) => `<div class="grid"><span class="hdr rel"><span class="pill2 rel">${use('ar-down')}Release</span></span><span class="hdr gro"><span class="pill2 gro">${use('ar-up')}Grow</span></span>${sep ? '<span class="sep"></span>' : ''}${[...D.ease, ...D.seek].map((e) => cell(e, uniform)).join('')}</div>`;
const coreLine = (w = false) => `<div class="core${w ? ' w' : ''}">${mark('metal')}<span><b>Metal</b> is your core</span>${pill('cond', D.cond)}</div>`;
const bg = `<img class="bg" src="bg-reveal-04-mist-veil.jpg" alt="">`;
const idTop = (plate = 124) => `<div class="top"><span class="ey">ELEMENTUM</span><img class="plate" src="plate-geng.png" alt="庚, The Blade" style="width:${plate}px;height:${plate}px"><div class="name">You are ${D.id.arch}.</div><p class="claim">${CLAIM}</p></div>`;
/* L1 · the grid: five equal columns, the pills centred over their spans, the card spread top to foot */
const L1 = `<div class="sc">${bg}<div class="in v">${idTop(124)}<div class="mid">${coreLine(true)}${grid(false, true)}</div><span class="foot v">elementum.life</span></div></div>`;
/* L2 · the panel: the chart on a paper panel anchored low; the identity floats on the mist */
const L2 = `<div class="sc">${bg}<div class="in v">${idTop(130)}<div class="panel">${coreLine(true)}${grid(true)}<span class="foot">elementum.life</span></div></div></div>`;
/* L3 · the corner: a left column with the Naming's inscription at the right */
const L3 = `<div class="sc">${bg}<span class="inscr"><span class="han">庚</span> · YANG METAL · 1995 · APRIL 29</span><div class="in l">${idTop(118)}<div class="mid">${coreLine(true)}${grid(false, true)}</div><span class="foot v">elementum.life</span></div></div>`;
const wrap = (c) => `<div class="export" style="background:#1c1814;height:100%;display:flex;align-items:center;justify-content:center">${c}</div>`;
const V = {
  code: 'AL', name: 'The Share Card · alignment pass',
  thesis: 'Same words as the card that ships (the social claim, the core capsule, Release and Grow, the five with their functions). What changes is the geometry: one five-column grid for the energies, the pills centred over the columns they govern, and the card’s height used to the foot.',
  tap: 'None.', scroll: 'None.',
  next: 'The faults in the shipped card: the two groups sit as separate blocks of unequal width, so the pills float left of centre and the Grow group crowds; the dots’ presence sizing staggers the columns; the lower third is empty above the foot.',
  intro: 'Golden chart. All three share one grid: five equal columns, each dot in a fixed 44px well so the shares, names and nouns line up across the row; the Release pill spans columns 1 to 2, the Grow pill columns 3 to 5; a hairline marks the split.',
  flows: [{ id: 'cards', short: '1 · Three', title: 'Three layouts', note: 'L1 keeps the shipped composition and fixes the grid, then spreads the card so the foot sits in its own margin. L2 puts the chart on a paper panel anchored low, so the identity floats on the mist and the chart reads as the app’s own cardstock. L3 moves everything to a left column with the Naming’s inscription at the right, the one-corner composition of the Naming.',
    screens: [
      { id: 'l1', label: 'L1 · The grid', gesture: 'Centred as today; the five on one grid, dots still sized by presence inside equal wells; the card spread to the foot', html: wrap(L1) },
      { id: 'l2', label: 'L2 · The panel (recommended)', gesture: 'The chart block on translucent cardstock at the bottom; uniform 34px dots; the foot inside the panel', html: wrap(L2) },
      { id: 'l3', label: 'L3 · The corner', gesture: 'Left-aligned identity with the side inscription; the grid full width beneath', html: wrap(L3) },
    ] }],
  after: '',
};
renderVariant(V);
</script>
