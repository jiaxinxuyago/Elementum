<!doctype html>
<meta charset="utf-8">
<title>Card 8 and Share</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">

<style>
/* The Naming's ground, as the first reading ships it (paper, the distant peaks,
   the floating island, fog). Card 8 and the share card both sit on it. */
.reveal{background:linear-gradient(180deg,#F5EEDE 0%,#F1E9D6 52%,#ECE2C9 100%);position:relative;height:100%;overflow:hidden}
.reveal .bgt,.reveal .bgb{position:absolute;left:0;width:100%;height:50%;object-fit:cover;pointer-events:none;z-index:0}
.reveal .bgt{top:0;object-position:center top;-webkit-mask-image:linear-gradient(to bottom,#000 56%,transparent 100%);mask-image:linear-gradient(to bottom,#000 56%,transparent 100%)}
.reveal .bgb{top:50%;object-position:center bottom;mix-blend-mode:multiply;opacity:.72;-webkit-mask-image:linear-gradient(to top,#000 60%,transparent 100%);mask-image:linear-gradient(to top,#000 60%,transparent 100%)}
.reveal .fog{position:absolute;left:-8%;right:-8%;top:24%;height:52%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(243,236,221,0) 0%,rgba(243,236,221,.14) 34%,rgba(244,238,224,.32) 50%,rgba(243,236,221,.14) 66%,rgba(243,236,221,0) 100%);filter:blur(20px)}
.reveal .veil{position:absolute;left:0;right:0;top:46%;bottom:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(241,233,214,0) 0%,rgba(241,233,214,.55) 30%,rgba(241,233,214,.72) 100%)}
.reveal .kstatus{position:absolute;left:0;right:0;top:0;z-index:5;background:none}
.reveal .prog{position:absolute;top:40px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.reveal .prog i{flex:1;height:3px;border-radius:2px;background:rgba(43,39,34,.18)} .reveal .prog i.on{background:#2b2722}
.reveal .skip{position:absolute;top:52px;right:14px;z-index:5;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.7}
.reveal .rin{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:74px 26px 44px;gap:12px;height:100%}
.reveal .rin.mid{justify-content:center}
.reveal .rey{font-family:var(--carve);font-size:9px;letter-spacing:3.2px;text-transform:uppercase;color:var(--bronzeDark)}
.reveal .rtitle{font-family:var(--display);font-size:31px;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.reveal .rtitle.name{font-size:40px;font-weight:500;line-height:1.05}
.reveal .rtitle.soft{font-weight:500;font-size:27px}
.reveal .rp{font-size:16px;line-height:1.5;margin:0;max-width:30ch}
.reveal .rp.quiet{color:var(--inkSoft);font-size:15px}
.reveal .rseal{width:150px;height:150px}
.reveal .rseal.sm{width:110px;height:110px}
.reveal .inscr{position:absolute;right:22px;bottom:92px;z-index:3;writing-mode:vertical-rl;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;color:var(--inkLight);opacity:.85;text-shadow:0 0 6px #F1E9D6,0 0 2px #F1E9D6}
.reveal .inscr .han{font-family:var(--han);font-size:12px;letter-spacing:4px}
.reveal .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:6px}
.reveal .btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 18px;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.reveal .btn.ink{background:var(--ink);color:var(--cream)}
.reveal .btn.ghost{color:var(--ink);border:1px solid var(--paperHair);background:rgba(248,246,240,.55)}
/* the distribution row (the Naming) */
.dist{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}
.dist span{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--carve);font-size:9px;letter-spacing:1px;color:var(--inkSoft);transition:opacity .3s}
.dist span.off{opacity:.36}
.dist small{font-family:var(--body);font-size:12px;color:var(--ink)}
.dist .lit{font-family:var(--carve);font-size:8px;letter-spacing:2px;color:var(--up);margin-top:2px}
/* the big ink dot */
.bigdot{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigdot .kdot{filter:drop-shadow(0 6px 16px rgba(43,39,34,.18))}
/* today's card 8: the two groups */
.rail{display:flex;align-items:flex-end;justify-content:center;gap:22px;min-height:120px;max-width:100%}
.rail .grp{display:flex;flex-direction:column;align-items:center;gap:8px}
.rail .grp .gl{font-family:var(--carve);font-size:9px;letter-spacing:2.4px;color:var(--bronzeDark)}
.rail .grp .gd{display:flex;align-items:flex-end;gap:10px}
.rail .grp .gd span{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--carve);font-size:8.5px;letter-spacing:1px;color:var(--inkSoft)}
.rail .grp.rel .gl{color:var(--down)} .rail .grp.gro .gl{color:var(--up)}
/* card 8C: the contents */
.toc{display:flex;flex-direction:column;gap:0;width:100%;max-width:280px;margin-top:2px;background:rgba(248,246,240,.55);border:1px solid var(--paperHair);border-radius:14px;padding:4px 14px}
.toc span{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--paperHair);font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);text-align:left}
.toc span:first-child{border-top:0}
.toc span i{font-family:var(--carve);font-style:normal;font-size:9px;letter-spacing:1.2px;color:var(--bronzeDark);width:14px;flex:none}
.toc span em{font-style:normal;margin-left:auto;font-family:var(--body);font-size:11.5px;color:var(--inkLight)}
.toc .kdot{flex:none}
/* the verb line on 8B */
.verb{display:flex;align-items:center;gap:8px;font-family:var(--carve);font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--bronzeDark)}
.verb .ic{width:14px;height:14px}
/* ── the share overlay, as the app draws it (dark scrim, the card, the tray) ── */
.scov{position:absolute;inset:0;background:rgba(26,22,17,.62);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;z-index:8}
.scov .hint{font-family:var(--body);font-size:11px;letter-spacing:1px;color:#F4ECD9;opacity:.9}
.scov .close{position:absolute;top:50px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(248,244,236,.92);display:grid;place-items:center;color:var(--ink)}
.scov .close .ic{width:14px;height:14px}
.scov .tray2{display:flex;gap:12px;align-items:flex-start;margin-top:2px}
.scov .scp{display:flex;flex-direction:column;align-items:center;gap:4px;color:#F4ECD9;font-family:var(--mono);font-size:8px;letter-spacing:.4px}
.scov .scp .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4);color:#fff;font-family:var(--body);font-weight:700;font-size:13px}
.scov .scp.ig .ico{background:linear-gradient(45deg,#F9CE34 4%,#EE2A7B 48%,#6228D7 96%)}
.scov .scp.tt .ico,.scov .scp.xx .ico{background:#050505}
.scov .scp.util .ico{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.scov .scp.util .ico .ic{width:15px;height:15px;color:#F4ECD9}
.scov .st-div{width:1px;height:36px;background:rgba(255,255,255,.22)}
.scov .scp.one .ico{display:flex;align-items:center;gap:8px;width:auto;border-radius:999px;padding:0 18px;height:38px;background:#F4ECD9;color:var(--ink);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-family:var(--body);font-weight:600}
.scov .scp.one .ico .ic{width:14px;height:14px}
.underlay{position:absolute;inset:0;overflow:hidden;filter:saturate(.9)}
.underlay img{width:100%;display:block}
/* the card itself: 9:16 at 300×533, scaled where it sits */
.scwrap{width:261px;height:464px;flex:none}
.scwrap .sc{transform:scale(.87);transform-origin:top left}
.sc{width:300px;height:533px;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sc .rin{padding:24px 22px 20px;gap:10px}
.sc .scey{font-family:var(--mono);font-size:7.5px;letter-spacing:2.6px;color:var(--inkLight)}
.sc .rseal{width:150px;height:150px}
.sc .rtitle.name{font-size:38px}
.sc .rman{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.3;color:var(--inkSoft);margin:0;max-width:26ch;text-wrap:balance}
.sc .scfoot{margin-top:auto;font-family:var(--carve);font-size:8.5px;letter-spacing:3px;color:var(--bronzeDark)}
.sc .inscr{top:34px;bottom:auto;right:13px}
.sc .dist{margin-top:2px}
.sc.paper{background:url(bg-reading-04-rice-paper.jpg) center/cover,#F1E9D6}
.sc .scwheel{width:252px;margin:2px 0 0}
.sc .scwheel img{width:100%;display:block}
.sc .rp.who{font-size:15px;max-width:27ch}
.sc .sc-run{display:flex;flex-direction:column;align-items:center;gap:6px}
.sc .sc-run .rp{font-size:15px;max-width:27ch}
.sc .sq{position:absolute;left:0;right:0;top:50%;height:300px;transform:translateY(-50%);border:1px dashed rgba(43,39,34,.45);pointer-events:none;z-index:4}
.sc .sq::after{content:"1:1 crop";position:absolute;right:6px;bottom:4px;font-family:var(--carve);font-size:8px;letter-spacing:1.5px;color:var(--inkSoft)}
.export{background:#1c1814;height:100%;display:flex;align-items:center;justify-content:center}
/* ── the album (the V5 hub as it ships) ── */
.hub{display:flex;flex-direction:column;gap:10px;padding:8px 14px 70px}
.v5id{display:flex;align-items:center;gap:10px}
.v5id .idseal{width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid var(--paperHair);background:var(--cream);flex:none}
.v5id .idseal img{width:100%;height:100%;object-fit:cover}
.v5id .idnm{display:flex;flex-direction:column;min-width:0;flex:1}
.v5id .idnm b{font-family:var(--display);font-weight:500;font-size:24px;line-height:1;color:var(--walnut,#5a4430)}
.v5id .idact{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.v5id .bchart{white-space:nowrap;font-family:var(--body);font-size:13px;font-weight:600;color:var(--bronzeDark)}
.v5id .shic{width:32px;height:32px;border-radius:50%;background:#26221D;color:#F3EDDF;display:grid;place-items:center;flex:none;align-self:flex-start}
.v5id .shic .ic{width:14px;height:14px}
.v5mani{margin:0;font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.3;color:var(--inkSoft);border-left:3px solid var(--seal,#A0452E);padding-left:10px}
.wtile{padding:10px 8px 8px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.wtile .shic{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#26221D;color:#F3EDDF;display:grid;place-items:center}
.wtile .shic .ic{width:13px;height:13px}
.readline{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--inkLight);padding:0 2px}
.readline .rl{flex:1;height:4px;border-radius:2px;background:var(--paperHair);overflow:hidden}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:136px;padding:12px;border-radius:16px;border:1px solid var(--paperHair);background:var(--cardstock);text-align:left}
.bt.wide{grid-column:1/-1;min-height:0}
.bt .v5ey{font-family:var(--body);font-size:9.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--bronzeDark)}
.bt .cl{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2;color:var(--ink)}
.bt .ft{display:flex;align-items:center;gap:6px;width:100%;margin-top:auto;font-size:12px;color:var(--inkLight);line-height:1.3}
.bt .ft .readcirc{margin-left:auto}
.bt .unread{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;border:1px solid var(--paperHair);background:var(--cream)}
.bt .mg-dial{width:92px;margin:0 auto}
.bt.idcard{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.bt.idcard .thumb{width:46px;height:82px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(43,39,34,.18);position:relative;background:#F1E9D6}
.bt.idcard .thumb .sc{transform:scale(.1533);transform-origin:top left;box-shadow:none;border-radius:0}
.bt.idcard .idt{display:flex;flex-direction:column;gap:3px;flex:1}
.bt.idcard .idt .cl{font-size:16px}
.bt.idcard .idt small{font-size:12px;color:var(--inkLight)}
.bt.idcard .shic{width:32px;height:32px;border-radius:50%;background:#26221D;color:#F3EDDF;display:grid;place-items:center;flex:none}
.bt.idcard .shic .ic{width:14px;height:14px}
.rx2{display:flex;gap:14px;align-items:center}
.rx2 .g{display:flex;align-items:center;gap:6px}
.rx2 .gl{font-family:var(--carve);font-size:8.5px;letter-spacing:1.6px}
.rx2 .gl.r{color:var(--down)} .rx2 .gl.g{color:var(--up)}
.shot{height:100%;background:#1c1814;overflow:hidden}
.shot img{width:100%;display:block}
/* page furniture */
.cmp{max-width:880px;margin:26px auto 0}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--borderLight)}
.cmp th{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);font-weight:500}
.cmp .scroll{overflow-x:auto;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:12px}
.good{color:var(--up)} .risk{color:var(--down)}
.words{max-width:880px;margin:26px auto 0;background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px 18px}
.words h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 6px}
.words dl{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:8px 14px;margin:0;font-size:14.5px}
.words dt{font-family:var(--carve);font-size:10px;letter-spacing:1.4px;color:var(--bronzeDark);padding-top:3px}
.words dd{margin:0}
.words code{font-family:var(--mono);font-size:12px;color:var(--inkLight)}
.words p{font-size:14.5px;color:var(--inkSoft);margin:8px 0 0}
.rows{max-width:880px;margin:0 auto}
.row{background:var(--cardstock);border:1px solid var(--paperHair);border-radius:16px;padding:16px;margin-top:12px}
.row .rh{display:flex;gap:10px;align-items:baseline}
.row .rc{font-family:var(--carve);font-size:13px;letter-spacing:1.5px;color:var(--bronzeDark)}
.row h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.row .why{font-size:14.5px;color:var(--inkSoft);margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--paperHair);background:var(--cream);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;font-size:15px;line-height:1.4}
.opt b{font-family:var(--carve);font-size:13px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--paperHair)}
.opt .rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--up);margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"] b{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(248,246,240,.97);border-top:1px solid var(--paperHair);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tray code{flex:1;min-width:0;font-family:var(--body);font-size:15px;font-weight:600;white-space:nowrap;overflow-x:auto;padding:6px 0}
.tray button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.tray .msg{font-size:12px;color:var(--up)}
body{padding-bottom:120px}
</style>

   section titles and read line. Nothing new was written. */
const P = Object.fromEntries(EL.map((e) => [e, D.E[e].p]));
const PMAX = Math.max(...Object.values(P));
const ORDER = D.order;
const n = 8;
const MANI = 'Precision before intention. You are the Metal that cuts things clean.';
const INSCR = '庚 · YANG METAL · 1995 · APRIL 29 · 17–19 CST';
const SECTIONS = [['How am I running?', 'metal', '1 min'], ['Your five energies', null, ''], ['Your domains', null, ''], ['Your life chapters', null, ''], ['Your stars', null, '1 min'], ['Your energy blueprint', null, '']];
const prog = (i) => `<div class="prog">${Array.from({ length: n }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><span class="skip">Skip</span>`;
const ground = (inner, { card = null, extra = '', cls = 'mid', veil = true } = {}) => `<div class="page reveal">${status()}<img class="bgt" src="bg-reveal-01-distant-peaks.jpg" alt=""><img class="bgb" src="bg-reveal-02-floating-island.jpg" alt=""><div class="fog"></div>${veil ? '<div class="veil"></div>' : ''}${card === null ? '' : prog(card)}${extra}<div class="rin ${cls}">${inner}</div></div>`;
const seal = (cls = '') => `<img class="rseal ${cls}" src="${D.id.seal}" alt="庚, The Blade">`;
const enter = `<div class="btns"><span class="btn ink">Enter your reading ${use('ico-arrow-r')}</span></div>`;
const rxDots = () => `<div class="rail"><div class="grp rel"><span class="gl">Release</span><div class="gd">${D.ease.map((e) => `<span>${dot(e, Math.round(34 + (P[e] / PMAX) * 30))}${ELN[e]}</span>`).join('')}</div></div><div class="grp gro"><span class="gl">Grow</span><div class="gd">${D.seek.map((e) => `<span>${dot(e, Math.round(34 + (P[e] / PMAX) * 30))}${ELN[e]}</span>`).join('')}</div></div></div>`;
const distRow = (hi = null, lit = false) => `<div class="dist">${ORDER.map((e) => `<span class="${hi && hi !== e ? 'off' : ''}">${dot(e, Math.round(30 + (P[e] / PMAX) * 34))}<small>${P[e]}%</small>${ELN[e]}${lit && hi === e ? '<span class="lit">Start here</span>' : ''}</span>`).join('')}</div>`;

/* ── 1 · today ─────────────────────────────────────────────────────── */
const today8 = ground(`<span class="rey">What your chart asks for</span>${rxDots()}<h3 class="rtitle">${D.rx}</h3><p class="rp quiet">${D.start}</p><div class="btns"><span class="btn ink">Enter your reading ${use('ico-arrow-r')}</span><span class="btn ghost">${use('ico-share')} Share your reading</span></div>`, { card: 7 });
const shot = (src) => `<div class="shot"><img src="${src}" alt=""></div>`;

  a: ground(`<span class="rey">Where to begin</span>${distRow('fire', true)}<h3 class="rtitle">${D.start}</h3><p class="rp quiet">${D.E.fire.head}. ${D.E.fire.now}</p>${enter}`, { card: 7 }),

};

/* ── 3 · the share card ─────────────────────────────────────────────── */

  <div class="v5id"><span class="idseal"><img src="${D.id.seal}" alt=""></span><div class="idnm"><span class="kick">You are</span><b>${D.id.arch}</b></div>${strip ? `<span class="shic">${use('ico-share')}</span>` : ''}<span class="idact"><span class="bchart">Birth chart ›</span>${pill('cond', D.cond)}</span></div>

  <div class="card wtile">${onWheel ? `<span class="shic">${use('ico-share')}</span>` : ''}${seg('do')}${wheel('golden', 'do')}</div>

    <div class="bt"><span class="unread"></span><span class="v5ey">Start here</span><span style="margin:0 auto">${dot('fire', 54)}</span><b class="cl" style="font-size:15px">${D.E.fire.head}</b>${pill('cat', 'Grow it')}</div>
