<meta charset="utf-8">
<title>V1 The Handscroll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* V1 · The Handscroll: one unrolling reading. A thin rod with seven knots
   rides under the status bar; each beat is a full composition with open
   paper around one dense object; depth beats are painted tiles that push
   full pages; every page ends by handing you the next. */
.rod{position:sticky;top:26px;z-index:5;margin:0 14px;padding:6px 0 8px;background:linear-gradient(var(--silk) 70%,transparent)}
.rod .line{position:relative;height:14px;display:flex;justify-content:space-between;align-items:center}
.rod .line::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:1px;background:var(--paperHair)}
.rod .line::after{content:"";position:absolute;left:4px;top:50%;height:1px;background:var(--ink);width:var(--done,0%)}
.rod .k{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;background:var(--silk);border:1px solid var(--inkMist);cursor:pointer}
.rod .k.done{background:var(--ink);border-color:var(--ink)}
.rod .k.cur{width:13px;height:13px;border:2px solid var(--ink);background:var(--silk)}
.rod .lab{display:flex;justify-content:space-between;font-family:var(--carve);font-size:8.5px;letter-spacing:1.6px;color:var(--inkLight);margin-top:4px}
.rod .lab b{color:var(--ink);font-weight:500}
.void{padding:40px 22px 14px;text-align:left}
.void .disp{font-size:25px;color:var(--ink)}
.void .ey{display:block;margin-bottom:8px}
.ptile{border-radius:16px;overflow:hidden;background:var(--cardstock);border:1px solid var(--paperHair);position:relative;cursor:pointer}
.ptile .band{position:relative;height:104px}
.ptile .band .kart{position:absolute;inset:0}
.ptile .band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 40%,rgba(248,241,225,.96))}
.ptile .band .glyphs{position:absolute;left:14px;bottom:8px;z-index:1;display:flex;gap:4px;align-items:flex-end}
.ptile .body{padding:2px 15px 14px;display:flex;flex-direction:column;gap:6px}
.ptile .claim{font-family:var(--display);font-size:20px;line-height:1.2;font-weight:500;margin:0;text-wrap:balance}
.ptile .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--inkLight)}
.ptile .foot .readcirc{margin-left:auto}
.ptile .glyphrow{display:flex;gap:6px;flex-wrap:wrap}
.ptile .hanrow{font-family:var(--han);font-size:16px;letter-spacing:6px;color:var(--bronzeDark)}
.wtile{padding:12px 8px 10px}
.wtile .wh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px 4px}
.hint{text-align:center;font-size:13px;color:var(--inkSoft);margin:4px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 10px}
.mtile .ey{align-self:flex-start}
.mtile .t{font-size:13.5px;line-height:1.3;color:var(--inkSoft)}
.big-glyph{width:58px;height:58px}
.next{display:flex;align-items:center;gap:12px;border-top:1px solid var(--paperHair);padding:16px 0 8px;margin-top:6px;cursor:pointer}
.next .kart{width:64px;height:64px;border-radius:12px;flex:none}
.next .nx{flex:1;display:flex;flex-direction:column}
.next .nx .disp{font-size:18px}
.secband{position:relative;height:150px;margin-bottom:-36px}
.secband .kart{position:absolute;inset:0}
.secband::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 30%,var(--silk) 96%)}
.sechead{padding:0 18px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.sechead .disp{font-size:24px}
.anchors{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none;position:sticky;top:26px;z-index:4;background:var(--silk)}
.anchors span{flex:none;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--paperHair);border-radius:999px;padding:4px 10px;color:var(--inkSoft);background:var(--cream)}
.anchors span.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--inkLight)}
.reveal{background:#EFE6D2;color:var(--ink)}
.reveal .bgt{position:absolute;inset:0 0 auto;width:100%;opacity:.9}
.reveal .bgb{position:absolute;inset:auto 0 0;width:100%;opacity:.8}
.reveal .rin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 26px 0;gap:10px;min-height:100%}
.reveal .rseal{width:150px;height:150px}
.reveal .rname{font-family:var(--display);font-size:40px;font-weight:500;margin:0}
.reveal .rthesis{font-family:var(--display);font-size:20px;margin:0}
.reveal .rlit{font-family:var(--carve);font-size:10px;letter-spacing:3px;border-top:1px solid var(--paperHair);padding-top:10px;margin-top:6px}
.reveal .rswipe{margin-top:auto;padding-bottom:30px;font-size:13px;color:var(--inkSoft)}
.story{min-height:100%;display:flex;flex-direction:column;padding:12px 18px 26px;position:relative}
.story.ink{background:var(--night);color:#F3EDDF}
.story.tint-fire{background:#F0DCD2}
.story.tint-metal{background:#E1E6EA}
.story .prog{display:flex;gap:3px;margin-top:6px}
.story .prog i{flex:1;height:2px;border-radius:1px;background:rgba(43,39,34,.18)}
.story .prog i.on{background:var(--ink)}
.story.ink .prog i{background:rgba(243,237,223,.25)} .story.ink .prog i.on{background:#F3EDDF}
.story .skip{align-self:flex-end;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:8px;opacity:.7}
.story .sc{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.story h3{font-family:var(--display);font-size:30px;font-weight:500;margin:0;line-height:1.1}
.story p{margin:0;font-size:16px;line-height:1.5}
.story .sseal{width:110px;height:110px}
.story .kbar{max-width:220px;height:7px}
.almhero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--paperHair);background:var(--cardstock)}
.almhero .kart{height:120px}
.almhero .ab{padding:2px 14px 14px;display:flex;flex-direction:column;gap:6px;margin-top:-30px;position:relative}
.almhero .ab .disp{font-size:22px}
.almrow{display:flex;align-items:center;gap:8px;font-size:12px}
.tone-d{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--down)}
.tone-u{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--up)}
.decbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.decbar i{height:6px;border-radius:1px;background:var(--silkFold)} .decbar i.on{background:var(--fireDeep)}
.ann{margin:0 14px}
</style>
