<style>
/* V4 · The Five Gates: the five energies are the map for the whole app.
   Under the wheel, the energies sit as a sideways shelf of painted cards.
   A five-sign rail rides at the top of every reading page and works as a
   lens: pick Earth and Domains, Chapters, the birth chart and the
   Almanac all light up where Earth is. Self scrolls down, energies swipe
   across (CHANI's planet-by-planet reading, in our five). */
.rail{position:sticky;top:26px;z-index:5;display:flex;gap:6px;align-items:center;padding:6px 14px 8px;background:linear-gradient(var(--silk) 80%,rgba(241,233,214,0))}
.rail .all{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--paperHair);border-radius:999px;padding:5px 9px;background:var(--cream);color:var(--inkSoft)}
.rail .all.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.rail .r{position:relative;cursor:pointer;border-radius:50%;opacity:.5;transition:opacity .2s}
.rail .r.on{opacity:1;box-shadow:0 0 0 2px var(--silk),0 0 0 3px var(--ink)}
.rail .r.core::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px dashed var(--dmBorder)}
.rail .lens{margin-left:auto;font-size:10.5px;color:var(--inkLight);text-align:right;line-height:1.2}
.rail.dim .r{opacity:.25}
.eshelf{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.ecard{flex:0 0 78%;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:var(--cardstock);border:1px solid var(--paperHair);position:relative;cursor:pointer;display:flex;flex-direction:column}
.ecard .eart{position:relative;height:120px}
.ecard .eart .kart{position:absolute;inset:0}
.ecard .eart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(248,241,225,0) 40%,rgba(248,241,225,.97))}
.ecard .eb{padding:0 14px 14px;margin-top:-26px;position:relative;display:flex;flex-direction:column;gap:6px}
.ecard .eh{display:flex;align-items:center;gap:8px}
.ecard .eh b{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
.ecard .tz{font-size:13.5px;line-height:1.4;color:var(--inkSoft)}
.ecard .ft{display:flex;align-items:center;gap:8px;margin-top:auto}
.ecard .ft .readcirc{margin-left:auto}
.edots{display:flex;justify-content:center;gap:6px;margin-top:2px}
.edots i{width:6px;height:6px;border-radius:50%;background:var(--inkMist)} .edots i.on{background:var(--ink)}
.lenses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lt{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--paperHair);background:var(--cardstock);min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;cursor:pointer}
.lt .kart{position:absolute;inset:0}
.lt::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(248,241,225,0) 15%,rgba(248,241,225,.95) 62%)}
.lt>*:not(.kart){position:relative;z-index:2}
.lt .cl{font-family:var(--display);font-size:15px;line-height:1.2;margin:2px 0 0}
.flowc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.flowc .side{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.35);border:1px solid var(--borderLight)}
.flowc .side .ds{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.flowc .mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.flowc .mid img{width:56px;height:56px;border-radius:50%;background:var(--cream);border:1px solid var(--paperHair)}
.hl{outline:2px solid var(--earthDeep);outline-offset:-2px;border-radius:12px;background:rgba(184,154,106,.10)}
.dimrow{opacity:.35}
.pager{display:flex;justify-content:space-between;align-items:center;padding:4px 14px}
.pager .edots{margin:0}
.ebandbig{position:relative;height:230px}
.ebandbig .kart{position:absolute;inset:0}
.ebandbig::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,233,214,0) 45%,var(--silk))}
.ebandbig .swipe{position:absolute;left:0;right:0;bottom:44px;z-index:2;display:flex;justify-content:space-between;padding:0 10px;color:var(--ink)}
.ebandbig .swipe span{width:28px;height:28px;border-radius:50%;background:rgba(248,246,240,.85);display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:0}
.stack .lay{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--paperHair);background:var(--cardstock);cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px}
.stack .lay+.lay{margin-top:-10px}
.stack .lay .kart{position:absolute;inset:0;opacity:.22}
.stack .lay>*:not(.kart){position:relative}
.stack .lay.y{margin-inline:24px}.stack .lay.m{margin-inline:12px}
.tone-d{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--down)} .tone-u{font-family:var(--carve);font-size:9px;letter-spacing:1.6px;color:var(--up)}
.reveal{background:#EFE6D2}
.reveal .bgt{position:absolute;inset:0 0 auto;width:100%}
.reveal .bgb{position:absolute;inset:auto 0 0;width:100%;opacity:.8}
.reveal .rin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 26px 0;gap:10px;min-height:100%}
.wtile{padding:10px 8px 8px}
.hint{text-align:center;font-size:12.5px;color:var(--inkSoft);margin:2px 0 0}
.story{min-height:100%;display:flex;flex-direction:column;padding:12px 18px 26px;position:relative}
.story .pg{display:flex;gap:3px;margin-top:6px}.story .pg i{flex:1;height:2px;background:rgba(43,39,34,.18)}.story .pg i.on{background:var(--ink)}
.story .sc{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.story h3{font-family:var(--display);font-size:26px;font-weight:500;margin:0}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:10px;color:var(--inkLight)}
.ladder span{display:flex;flex-direction:column;align-items:center;gap:3px}
</style>

<script>
const page = (inner, tab = 'reading') => `<div class="page">${status()}${inner}${tabbar(tab)}</div>`;
const RAIL_ORDER = ['metal', 'earth', 'fire', 'wood', 'water'];
const rail = (on = null, lens = '', dim = false) => `<div class="rail${dim ? ' dim' : ''}"><span class="all${on ? '' : ' on'}">All</span>${RAIL_ORDER.map((e) => `<span class="r${on === e ? ' on' : ''}${e === 'metal' ? ' core' : ''}">${dot(e, 28)}</span>`).join('')}<span class="lens">${lens}</span></div>`;
const ecard = (e) => { const r = D.E[e]; return `<div class="ecard" data-go="${e === 'earth' ? 'energy' : 'sheet-fire'}"><div class="eart">${art(ART[e])}</div><div class="eb"><div class="eh">${dot(e, 40)}<div><b>${r.head}</b><br><span class="light" style="font-size:12px">${ELN[e]} is your ${r.fn}${r.core ? ' · yourself' : ''}</span></div></div>${presBar(e)}<span class="tz">${r.teaser}</span><div class="ft">${pill(r.pole, r.pole === 'cat' ? 'Grow it' : 'Release it')}<span class="light" style="font-size:12px">${r.p}%</span>${arrowBtn('sm')}</div></div></div>`; };

const reading = () => page(`${rail(null, 'Lens: all five')}<div class="pad">
  <div class="card">${B.hero()}</div>
  <div class="card wtile"><div style="display:flex;justify-content:space-between;align-items:center;padding:0 6px 4px;gap:6px;flex-wrap:wrap"><span class="ey">Your five energies</span>${seg('do')}</div>${wheel()}<p class="hint">Tap an energy. Tap the seal for how you run.</p></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="ey">Each energy, read on its own</span><span class="light" style="font-size:12px">swipe ›</span></div>
  <div class="eshelf">${D.order.map(ecard).join('')}</div><div class="edots">${D.order.map((e, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
  <div class="card tap" data-go="run"><span class="ey">How am I running?</span><div class="flowc" style="margin-top:8px"><div class="side"><span class="tone-d">Adds to you</span><div class="ds">${dot('metal', 30)}${dot('earth', 30)}</div><span class="light" style="font-size:11px">Body · Mind</span></div><div class="mid"><img src="${D.id.seal}" alt=""><div style="width:70px">${dial(D.score, D.cond)}</div></div><div class="side"><span class="tone-u">Spends you</span><div class="ds">${dot('water', 30)}${dot('wood', 30)}${dot('fire', 30)}</div><span class="light" style="font-size:11px">Expression · Action · Order</span></div></div><p class="serif" style="margin-top:8px;font-size:14px">${D.runLine} ${D.start}</p></div>
  <span class="ey">Read your chart through four lenses</span>
  <div class="lenses">
    <div class="lt" data-go="domains">${art('g_hero_3')}<span class="ey">Domains</span><p class="cl">${D.domainsHead}</p></div>
    <div class="lt" data-go="chapters">${art('g_hero_8')}<span class="ey">Life chapters</span><p class="cl">${D.chapters.short}</p></div>
    <div class="lt" data-go="stars">${art('t_water_6_w')}<span class="ey">Stars</span><p class="cl">${D.stars.head}</p></div>
    <div class="lt" data-go="blueprint">${art('g_hero_10')}<span class="ey">Blueprint · Advisor</span><p class="cl">${D.blueprint.head}</p></div>
  </div>
  <div class="card"><span class="ey">The words on this page · tap one</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${pill('core', 'Core', false)}${pill('cond')}${pill('cat', 'Catalyst')}${pill('fric', 'Friction')}${['Seat', 'Gate', 'Decade', 'Star'].map((w) => pill('core', w, false)).join('')}</div></div></div>`);

const V = {
  code: 'V4', name: 'The Five Gates',
  thesis: 'The five energies become the map for everything. Your reading is read energy by energy, and a five-sign rail on every page works as a lens across domains, chapters, the birth chart and the Almanac.',
  tap: 'Tap a sign on the rail to light up where that energy is on the current page; "All" clears it. Energy cards open energy pages; wheel disks still open sheets.',
  scroll: 'You scroll down; energies swipe across. On an energy page, swipe sideways to the next energy (five dots show where you are). Time strips scroll sideways too.',
  next: 'From any energy you can follow it everywhere: its domains, the decades it colours, the days it returns. The rail keeps the lens as you move between pages.',
  intro: 'The largest change in information architecture: the energies stop being one beat among seven and become the index of the whole reading. The wheel, marks and art are unchanged.',
  flows: [
    { id: 'first', short: 'First run', title: 'The Naming and the first reading', note: 'Unchanged ceremony. The first reading’s five energy cards already introduce the energies one by one; in this variant those same cards become the shelf under the wheel.',
      screens: [
        { id: 'naming', label: 'The Naming', gesture: 'Swipe up', html: `<div class="page reveal">${status()}<img class="bgt" src="bg-reveal-01-distant-peaks.jpg" alt=""><img class="bgb" src="bg-reveal-02-floating-island.jpg" alt=""><div class="rin"><span class="carve">You are</span><img src="${D.id.seal}" style="width:150px" alt=""><p class="disp" style="font-size:40px">${D.id.arch}</p><p class="disp" style="font-size:20px">${D.id.thesis}</p><p class="soft" style="margin:0">${D.id.edge}</p><span class="carve" style="border-top:1px solid var(--paperHair);padding-top:10px">${D.id.lit}</span><span style="margin-top:auto;padding-bottom:30px;font-size:13px" data-go="fr-wood">Swipe up</span></div></div>` },
        { id: 'fr-wood', label: 'First reading · 6 of 8', gesture: 'The energy cards here become the shelf later', html: `<div class="story" style="background:#E3EADC" data-go="reading"><div class="pg">${[1, 1, 1, 1, 1, 1, 0, 0].map((o) => `<i class="${o ? 'on' : ''}"></i>`).join('')}</div><div class="sc"><span class="carve">${D.E.wood.head}</span>${dot('wood', 92)}<span class="carve">Wood is your Action</span>${presBar('wood')}<h3>You have 33% of Wood energy.</h3><p style="margin:0;font-size:16px">${D.E.wood.teaser}</p>${pill('cat', 'Grow it')}</div></div>` },
      ] },
    { id: 'reading', short: 'Your reading', title: 'Your reading, indexed by the five', note: 'Hero, wheel, then the five energies as a sideways shelf (best first, a peek of the next). "How am I running?" shows the condition as which energies add to you and which spend you. The depth sections become four lenses.',
      screens: [
        { id: 'reading', label: 'Top · hero and wheel', gesture: 'The rail sits under the status bar', html: reading() },
        { id: 'reading-2', label: 'The energy shelf', gesture: 'Swipe the cards; tap one for its page', at: 460, html: reading() },
        { id: 'reading-3', label: 'How you run · the four lenses', gesture: 'Lenses open the depth pages', at: 820, html: reading() },
        { id: 'sheet-fire', label: 'Energy sheet · Fire', gesture: 'Wheel disks still open the sheet', html: `<div class="page">${status()}${rail('fire', 'Lens: Fire')}<div class="pad"><div class="card wtile">${wheel()}</div></div>${B.sheet('fire', { back: 'reading', read: 'energy' })}</div>` },
      ] },
    { id: 'energy', short: 'Energies', title: 'The energy page, and following one energy everywhere', note: 'The energy page is a pager: swipe to the next energy. Its last part shows the energy across the app: where it rules, which decades carry it, when it returns in the Almanac.',
      screens: [
        { id: 'energy', label: 'Earth, your Mind', gesture: 'Swipe sideways for the next energy', html: page(`${rail('earth', 'Lens: Earth')}<div class="ebandbig">${art(ART.earth)}<div class="swipe"><span>${use('ico-chev-l')}</span><span>${use('ico-chev-r')}</span></div></div><div class="pad" style="margin-top:-40px"><div style="display:flex;gap:10px;align-items:center">${dot('earth', 52)}<div><span class="ey">Earth · 33% · Mind</span><p class="disp" style="font-size:24px">${D.earthPage.claim}</p></div></div><div style="display:flex;gap:6px;align-items:center">${pill('fric')}<span class="light" style="font-size:12.5px">Earth feeds Metal</span></div><p class="serif" style="font-size:15px">${D.earthPage.diag}</p><div class="card"><span class="ey">The function</span><p class="serif" style="margin:4px 0 8px">${D.earthPage.verdict}</p><div style="display:flex;gap:5px;flex-wrap:wrap">${D.earthPage.chips.map((c) => `<span class="domchip">${c}</span>`).join('')}</div></div><div class="card"><span class="ey">The remedy · through Wood</span><p class="serif" style="margin-top:4px">${D.earthPage.remedy}</p></div></div><div class="pager"><span class="light" style="font-size:12px">‹ Metal</span><div class="edots">${D.order.map((e) => `<i class="${e === 'earth' ? 'on' : ''}"></i>`).join('')}</div><span class="light" style="font-size:12px">Fire ›</span></div>`) },
        { id: 'energy-2', label: 'Earth across your chart', gesture: 'The same energy, followed into every section', at: 640, html: page(`${rail('earth', 'Lens: Earth')}<div class="ebandbig">${art(ART.earth)}</div><div class="pad" style="margin-top:-40px"><div style="display:flex;gap:10px;align-items:center">${dot('earth', 52)}<div><span class="ey">Earth · 33% · Mind</span><p class="disp" style="font-size:24px">${D.earthPage.claim}</p></div></div><p class="serif" style="font-size:15px">${D.earthPage.diag}</p><div class="card"><span class="ey">The function</span><p class="serif">${D.earthPage.define}</p></div>
          <span class="ey">Earth across your chart</span>
          <div class="card" data-go="domains"><span class="ey">Where it rules · 1 seat</span>${D.earthPage.doms.map(([d, l]) => B.domRow([d, l, 1])).join('')}</div>
          <div class="card" data-go="chapters"><span class="ey">When it comes · Earth decades</span><div class="ladder">${D.chapters.decades.map(([a, e]) => `<span>${dot(e, e === 'earth' ? 30 : 22)}${a}</span>`).slice(0, 5).join('')}</div><p class="serif" style="font-size:13.5px;margin-top:6px">Ages 8 and 18 were Earth decades: more thinking than your chart could use.</p></div>
          <div class="card" data-go="day"><span class="ey">When it returns · the Almanac</span><p class="serif" style="font-size:14px">Today is an Earth day, inside an Earth month. ${D.almanac.today.line}.</p></div></div>`) },
      ] },
    { id: 'run', short: 'How I run', title: '"How am I running?" as a balance of the five', note: 'The page opens on the balance itself: the energies that add to you on one side, the ones that spend you on the other, your seal and the dial between them. Then the reading.',
      screens: [
        { id: 'run', label: 'How am I running?', gesture: 'Tap a side to light its energies', html: page(`${back('Your reading · How you run', 'reading')}<div class="pad"><div class="card"><div class="b-runtop"><span class="ey">How am I running?</span>${pill('cond')}</div><div class="flowc" style="margin-top:12px"><div class="side"><span class="tone-d">Adds to you</span><div class="ds">${dot('metal', 40)}${dot('earth', 40)}</div><span class="light" style="font-size:11px">Body 23% · Mind 33%</span></div><div class="mid"><img src="${D.id.seal}" alt=""><div style="width:80px">${dial(D.score, D.cond)}</div></div><div class="side"><span class="tone-u">Spends you</span><div class="ds">${dot('water', 34)}${dot('wood', 34)}${dot('fire', 34)}</div><span class="light" style="font-size:11px">Expression 6% · Action 33% · Order 5%</span></div></div><h2 class="disp b-runh" style="margin-top:10px">${D.runHead}</h2></div>${B.nature()}<div class="card">${B.mech()}</div><div class="card">${B.onChart(true)}</div></div>`) },
        { id: 'run-2', label: 'Gifts, scenes, what helps', gesture: 'Blueprint door at the end', at: 900, html: page(`${back('Your reading · How you run', 'reading')}<div class="pad"><div class="card"><div class="flowc"><div class="side"><span class="tone-d">Adds to you</span><div class="ds">${dot('metal', 40)}${dot('earth', 40)}</div></div><div class="mid"><img src="${D.id.seal}" alt=""></div><div class="side"><span class="tone-u">Spends you</span><div class="ds">${dot('water', 34)}${dot('wood', 34)}${dot('fire', 34)}</div></div></div></div>${B.nature()}<div class="card">${B.mech()}</div><div class="card">${B.onChart(false)}</div><div class="card">${B.giftsCosts()}</div><div class="card">${B.scenes()}</div><div class="card">${B.helps()}</div>${B.bpDoor()}</div>`) },
        { id: 'run-u', label: 'Underfueled · The Vine', gesture: 'The balance tips the other way', html: page(`${back('Your reading · How you run', 'reading')}<div class="pad"><div class="card"><div class="b-runtop"><span class="ey">How am I running?</span>${pill('cond', 'Underfueled')}</div><div class="flowc" style="margin-top:12px"><div class="side"><span class="tone-u">Adds to you</span><div class="ds">${dot('wood', 30)}${dot('water', 24)}</div><span class="light" style="font-size:11px">Body 11% · Mind 0%</span></div><div class="mid"><img src="${U.seal}" alt=""><div style="width:80px">${dial(U.score, U.cond)}</div></div><div class="side"><span class="tone-d">Spends you</span><div class="ds">${dot('metal', 46)}${dot('earth', 30)}${dot('fire', 24)}</div><span class="light" style="font-size:11px">Order 74% · Action 12% · Expression 3%</span></div></div><h2 class="disp b-runh" style="margin-top:10px">You run Underfueled: your Wood spends more than it takes in.</h2></div><p class="b-nature">${U.nature}</p><div class="card wtile">${wheel('under', 'do')}</div></div>`) },
      ] },
    { id: 'depth', short: 'Depth', title: 'The four lenses, with the rail', note: 'Each depth page keeps the rail. With "All" it reads as the full section; with one energy it lights the rows that energy touches and dims the rest. Stars sit outside the five, so the rail dims there.',
      screens: [
        { id: 'domains', label: 'Domains · lens: Earth', gesture: 'Earth’s three domains lit', html: page(`${rail('earth', 'Lens: Earth<br>3 of 8 lit')}${back('Your reading · Domains', 'reading')}<div class="pad"><span class="ey">Your domains</span><p class="disp" style="font-size:24px">Eight parts of your life, and who rules them</p><div class="card" style="padding-top:4px">${D.domains.map((d) => { const lit = ['Career', 'Mind', 'Growth'].includes(d[0]); return `<div class="${lit ? 'hl' : 'dimrow'}" style="padding:0 6px">${B.domRow(d)}</div>`; }).join('')}</div></div>`) },
        { id: 'domain', label: 'Wealth', gesture: 'Seats on the life strip', html: page(`${rail(null, 'Lens: all five')}${back('Your domains · Wealth', 'domains')}<div class="pad"><span class="ey">The domains · Wealth</span><p class="disp" style="font-size:24px">${D.wealth.head}</p><p class="soft" style="margin:0">${D.wealth.sub}</p><div class="card">${lifeStrip()}</div>${D.wealth.how.map((p) => `<p class="serif">${p}</p>`).join('')}${D.wealth.seats.map(B.seat).join('')}</div>`) },
        { id: 'chapters', label: 'Life Chapters · lens: Fire', gesture: 'The decades Fire colours, lit', html: page(`${rail('fire', 'Lens: Fire<br>2 decades')}${back('Your reading · Life chapters', 'reading')}<div class="pad"><span class="ey">Your life chapters</span><p class="disp" style="font-size:24px">${D.chapters.head}</p><div class="card">${lifeStrip()}<div class="ladder" style="grid-template-columns:repeat(7,1fr);margin-top:12px">${D.chapters.decades.map(([a, e]) => `<span class="${e === 'fire' ? '' : 'dimrow'}">${dot(e, e === 'fire' ? 30 : 22)}${a}</span>`).join('')}</div></div><div class="card hl">${B.decadeNow()}</div>${D.chapters.list.slice(1, 2).map((c) => `<div class="card dimrow">${B.chapter(c, { short: true })}</div>`).join('')}</div>`) },
        { id: 'chapters-2', label: 'Life Chapters · all', gesture: 'Chapters and years', at: 520, html: page(`${rail(null, 'Lens: all five')}${back('Your reading · Life chapters', 'reading')}<div class="pad"><span class="ey">Your life chapters</span><p class="disp" style="font-size:24px">${D.chapters.head}</p><div class="card">${lifeStrip()}</div>${D.chapters.list.slice(0, 2).map((c) => `<div class="card">${B.chapter(c)}</div>`).join('')}<div style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px">${D.chapters.years.map((y) => `<div class="card" style="flex:0 0 80%;scroll-snap-align:start">${B.year(y)}</div>`).join('')}</div></div>`) },
        { id: 'stars', label: 'Stars', gesture: 'The rail dims: stars sit outside the five', html: page(`${rail(null, 'Stars sit outside<br>the five', true)}${back('Your reading · Stars', 'reading')}<div class="pad"><span class="ey">Your stars</span><p class="disp" style="font-size:24px">${D.stars.head}</p><p class="soft" style="margin:0">${D.stars.intro}</p>${D.stars.help.map((s) => `<div class="card">${B.star(s)}</div>`).join('')}${D.stars.arrive.map((s) => `<div class="card">${B.star(s, true)}</div>`).join('')}</div>`) },
        { id: 'blueprint', label: 'Blueprint · Advisor', gesture: 'Part 2 lit by the rail: what the chart runs on', html: page(`${rail('wood', 'Lens: Wood')}${back('Your reading · Energy blueprint', 'reading')}<div class="pad"><span class="ey">Your energy blueprint</span><p class="disp" style="font-size:24px">${D.blueprint.head}</p><p class="soft" style="margin:0">${D.blueprint.sub}</p><div class="card" style="padding-top:2px">${D.blueprint.secs.map((s, i) => `<div class="${i === 1 || i === 0 ? '' : 'dimrow'}">${B.bpSec(s)}</div>`).join('')}</div><div class="quietc"><span class="ey han">${D.blueprint.season[0]}</span><p class="serif" style="font-size:14px">${D.blueprint.season[1]}</p></div></div>`) },
      ] },
    { id: 'almanac', short: 'Almanac', title: 'Your Almanac as layered time', note: 'Year, month and day stack like ranges behind ranges (深远): each layer is its energy, and today sits in front. The rail lights today’s energy across the week.',
      screens: [
        { id: 'almanac-hub', label: 'The hub', gesture: 'Tap a layer to open it', html: page(`${rail('earth', 'Today: Earth')}<div class="pad"><span class="ey">Your Almanac · ${D.almanac.today.date}</span><p class="disp" style="font-size:28px">Across time</p>
          <div class="stack"><div class="lay y" data-go="year">${art(ART.fire)}${dot('fire', 30)}<span style="flex:1"><span class="ey">This year</span><br><span style="font-size:13px">${D.almanac.year.line}</span></span><span class="tone-u">↑</span></div><div class="lay m" data-go="month">${art('t_earth_4_w')}${dot('earth', 34)}<span style="flex:1"><span class="ey">This month</span><br><span style="font-size:13.5px">${D.almanac.month.line}</span></span><span class="tone-d">↓</span></div><div class="lay" data-go="day" style="padding:16px 14px">${art(ART.earth)}${dot('earth', 46)}<span style="flex:1"><span class="ey">Today</span><br><span class="disp" style="font-size:19px">${D.almanac.today.line}</span><br><span class="tone-d">${D.almanac.today.tone}</span></span>${arrowBtn('sm')}</div></div>
