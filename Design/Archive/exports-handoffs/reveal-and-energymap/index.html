 from defined edges and clear decisions. Damaging for those who needed more time or more flexibility — the cutting happens regardless of readiness. Classical texts warn 金旺伤木 (strong Metal injures Wood) — when Metal is excessive, it cuts down what was still growing, including what should have been given more time. The danger is cutting too early, deciding too harshly, and removing things that needed more development before they were ready to be shaped.`,open:`The ability to make definitive decisions, set clear limits, and close what is finished becomes genuinely harder. Things that are complete don't get properly ended. Ambiguity lingers past the point where it serves anyone. Relationships and projects that should close continue because there is no cutting force available to bring them to a clean conclusion. The environment feels gentler but more cluttered — less decisive, more unresolved, more drained by the energy required to maintain what should have ended.`,catalyst:`Activate it by making the decision you have been deferring. This energy specifically rewards categorical commitment: the contract signed, the option closed, the position stated clearly, the boundary set. Don't hedge — the productive use of this energy is definitiveness. One clear decision is worth ten careful ones that stay provisional. Outcome: clarity replaces ambiguity and frees up the energy that was being spent maintaining the unresolved situation. What was clouded becomes specific. Direction becomes actionable.`,resistance:`When 庚 energy is creating friction — the cutting force is removing what the chart needed to preserve, or pressing on growth energy in a way that damages rather than shapes it. The corrective is to redirect the precision toward what is actually finished rather than what is merely inconvenient or imperfect. Use the Fire quality (clarity of purpose, warmth of direction) to identify what the precision is actually for — so the blade knows what to spare. Outcome: the force becomes surgical rather than indiscriminate, and what was damaging becomes defining.`},seasonalCalibration:{label:`The Forging Season`,element:`Fire`,teaser:`There is a specific kind of period that doesn't arrive often but changes everything when it does: the encounter that specifies what the precision is actually for. The capability was always real. What fire reveals is the direction — not the capability, which was already there.`,desc:`The seasonal pattern for 庚: Metal is most fully expressed when Fire is present and engaged. Not because Fire adds anything to the structure — the capability was complete before Fire arrived — but because Fire specifies what the structure is an instrument for.

The classical principle from 穷通宝鉴: 金逢火炼方成器 — raw metal becomes a shaped instrument through contact with fire. The transition is from 素材 (formed, capable, unspecified raw material) to 成器 (an instrument defined for a specific purpose). The capability doesn't change. What changes is the direction.

In practice: periods when Fire energy is strong — summer months, Fire-dominant years, relationships or career contexts that carry genuine warmth, urgency, or a target worthy of the edge — bring the specific challenge, person, or context that specifies where the precision should land. Without this contact, the evaluative apparatus remains formed but unspecified: accurate, capable, and running on whatever is available rather than on what it was built for.

Note: 庚 Metal prefers 丁 Fire (the contained flame — the forge, the purposeful heat) over 丙 Fire (the open blaze, the burning sun). The forge shapes. The wildfire consumes. When Fire contact arrives through genuine purpose and directed warmth, the Forging Season is productive. When it arrives through excessive pressure or uncontrolled intensity, the metal loses temper rather than gains it.

The 2 AM version: "I know what I am. I still don't know what I'm for." The Forging Season is when that question gets answered — not once, but each time Fire provides a worthy target.`},liunianSignatures:{career:{trigger:`Fire or Metal year/month bringing competitive pressure or restructuring (庚午, 庚寅, 丙庚 configurations)`,event:`Promotion, restructuring, or career-defining decision point. The precision finds an institutional target. Environments that have been unclear about what they want from you define themselves — often through competitive pressure or organizational change that requires someone to make a call. You are the person who makes the call.`,timing:`Activates most directly in 庚 and 丁 years; also activated in summer months (巳午未) when Fire energy peaks and provides the Forging Season condition`,source:`子平真诠 — 七杀制伏得宜，反为权贵 (Seven Killings properly contained becomes authority); 三命通会 — 庚金得地得势，刀锋所指皆有成`},relationships:{trigger:`Water or Wood year/month providing contrast element; or a person whose chart brings significant Fire (specificity, warmth, directional pressure)`,event:`Relationship dynamic clarification — long-held ambiguities get resolved. A connection that was sustainable but undefined gets defined, sometimes against your preference. A person enters who can receive your directness without deflecting from it. The relationship either deepens structurally or ends with precision. Both outcomes are better than sustained ambiguity.`,timing:`Activates most strongly in 癸 (Yin Water) years — depth and sensitivity as complement to the precision; also activated in 甲乙 (Wood) years through the wealth/relationship dynamic`,source:`三命通会 — 庚金孤刚，得水而情生 (Rigid Yang Metal, softened by Water, produces feeling); 滴天髓 — 刚柔相推，而生变化`},wealth:{trigger:`Wood year/month (wealth element for Metal Day Master — Metal controls Wood in the classical 五行 productive cycle)`,event:`Income expansion through precision work. A project or commitment that required genuine quality produces measurable return. The evaluation that was invested in building correctly begins paying back. Not windfall wealth — the kind that accumulates from having built something that holds up over time and under examination.`,timing:`甲乙 (Wood) years and 寅卯 (Wood branch) months activate the wealth dynamic; productive configurations require balanced Metal strength — excess Metal cutting Wood produces loss rather than gain`,source:`子平真诠 — 庚金逢木，才现而有用 (Yang Metal meets Wood — wealth appears and becomes useful); 穷通宝鉴 — Metal-Wood interaction chapters`},health:{trigger:`Fire dominant periods (巳午未 branch months, 丙丁 stem years) — productive in balance, pressing in excess`,event:`Physical energy peaks in aligned Forging Season conditions. In over-Fire configurations, watch for inflammatory pressure or cardiovascular stress (热症 — heat conditions, classical Metal-Fire excess). In balanced Fire contact, the result is purposeful physical energy rather than the chronic muscular tension that accumulates when the assessment has nowhere productive to go.`,timing:`Summer months and Fire years — generative when 庚 has adequate Water or Earth grounding; pressing when Fire is excessive and no tempering element is present`,source:`穷通宝鉴 — 庚金喜丁火锻炼方成大器，不喜丙火烈焰过旺 (庚 Metal welcomes 丁 Fire's forging; does not welcome 丙 Fire's excess blaze); 五行医学 — 金主肺，过旺则肺气郁结 (Metal governs the lung system; excess produces respiratory tension and suppressed qi)`}},psych:{bigFive:`High Conscientiousness/Industriousness · Low Agreeableness/Politeness · lower Neuroticism — evaluation as structural default, not as active choice`,jungian:`Introverted Thinking (Ti) — the evaluation operates through an internal logical framework that cannot be switched off; runs before social or emotional consideration`,attachment:`Dismissive-avoidant — self-sufficient, low dependency; the evaluative default reads as distance but the care is real, arriving through the same precision channel as everything else`,shadow:`The Justice Wound — sees the world in Right/Wrong; the bluntness is a defense mechanism for a very soft interior; the blade in the tongue is protecting something that rarely gets shown`},archetypes:[`INTJ / ENTJ (MBTI)`,`The Outlaw / Maverick (Brand)`,`The Hero / Warrior (Jungian)`,`Type 1 / Type 8 (Enneagram)`,`Aries / Scorpio (Western)`,`Manifestor (HD)`,`The Warrior (Campbell)`]},辛:{identity:{archetypeName:`The Jewel`,archetypeLabel:`Yin Metal — The Jewel`,identityIcon:`ArchetypeSeal`,manifesto:`Refinement over output · The flaw is felt before the eye finds it.`},subtitle:`Quality perceived as temperature — before the question forms · The Definition Impulse (Yin)`,chips:[`Discerning`,`Aesthetically precise`,`Perfectionist`,`Exacting`,`Distance through refinement`],yourNature:{phrase:`The Jade Appraiser`,desc:`You sense whether something is genuinely excellent the way others sense whether a room is cold — automatically, before thinking about it. You produce work of real quality, but the same standard that makes you exceptional never quite lets you feel done.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Jewel perceives quality the way others perceive temperature — automatically, before thinking about it. Not "is this good?" as a question they ask, but an immediate, pre-verbal sense that something is or isn't genuinely excellent. This applies to work, to ideas, to environments, to people, to the way something was made. The standard is always running. It's not a habit they developed — it's a perceptual structure they were born with, as natural and involuntary as the ability to see color.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Producing things of genuine distinction because they literally cannot bring themselves to output something they don't fully believe in. Identifying what is genuinely excellent when others would settle for adequate. Building things where the quality is lasting — not impressive on the surface but actually good in the way that holds up over time and under examination. They're also the person who has already noticed the flaw that will become a problem three months from now. They often don't say this immediately. But they've already seen it.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The refining doesn't know when to stop. The same faculty that produces excellent work keeps working past the point of completion — improving things that are done, delaying delivery of things that are ready, exhausting the precision on what doesn't need it. There's also a persistent gap between what the Jewel can perceive as possible and what the world tends to offer, creating a background friction that doesn't switch off. In environments that can't meet the standard, this becomes chronic dissatisfaction.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Jewel's quality is most fully expressed in settings that can actually receive what it produces. In conditions that genuinely warrant the discernment, what the Jewel produces is something most other approaches simply cannot generate. The practice is protecting access to those conditions rather than applying the full standard uniformly to everything.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That the standard they apply to everything, they apply to themselves — and that this is often the hardest part. The gap between what they can perceive as possible in themselves and what they currently are is always visible to them. Which means they are almost never quite satisfied with who they are right now, regardless of what they've achieved.`}}],psych:{bigFive:`High Openness/Aesthetics (quality-seeking, not truth-seeking) · High Conscientiousness/Orderliness · moderate-low Extraversion — healthy vs. maladaptive perfectionism axis`,jungian:`Introverted Sensation (Si) + Introverted Feeling (Fi) for aesthetic valuation — discernment is both perceptual (registers quality as temperature) and evaluative (assigns internal value)`,attachment:`Fearful-avoidant — deep relational capacity with high threshold; the discernment that identifies excellence also identifies what doesn't meet it`,shadow:`The Value/Perfectionism Trap — the need to be "polished" and special; brilliance as a way to keep people at a distance so they don't see the flaws perceived underneath`},archetypes:[`ISFJ / INFP (MBTI)`,`The Creator (Brand)`,`The Aesthetic Anima / Puer (Jungian)`,`Type 4 / Type 1 (Enneagram)`,`Libra / Virgo (Western)`,`Projector (HD)`],energy:{keywords:[],what:`辛 is the refined metal — the jewel after the forge, the precise edge after the grinding. Where 庚 cuts broadly, 辛 evaluates with precision. Classically, 辛 represents metal that has already been shaped — the stage of assessment and recognition that follows the restructuring 庚 began. 穷通宝鉴 notes that 辛 carries an inherent quality of "revealing true value." It is the atmosphere of "what things are actually worth becomes visible; past efforts receive their accurate measure."`,represents:`Recognition for past work arriving — both positive recognition and accountability for what was poorly done. The quality of what has been built being assessed honestly. Rewards for genuine excellence. Consequences for corners that were cut. Aesthetic and creative standards becoming more relevant. Fine-tuning and optimization of existing systems producing results.`,liunian:`When 辛 energy enters your luck cycle or annual pillar, the environment shifts into evaluation mode. If you have built something genuinely excellent, this is when it gets recognized. If work was shoddy or commitments were not honored, this is when the invoice arrives. Rewards and consequences from the previous cycle become visible. Aesthetic and quality matters take on more relevance — in career, in relationships, in creative work. For charts that benefit from Metal, this is a period of genuine recognition and refinement; for those already Metal-heavy, the excess can produce hypercritical evaluation of everything, perfectionism that prevents completion, or a sharpness that registers as coldness in relationships.`},manual:{concentrated:`The evaluative standard is applied to everything simultaneously with no relief. The environment produces either remarkable quality or paralysis — the discernment that should enable excellence instead prevents completion. Relationships and situations that don't meet the implicit standard become genuinely difficult to engage with. Classical texts note that excess 辛 Metal produces rigidity of aesthetic judgment — the jeweler so committed to perfection that no gem ever leaves the workshop. Self-criticism intensifies. The standard keeps moving just past wherever the work has arrived.`,open:`Discernment and quality-sensing are reduced. Things are produced without adequate evaluation. Work looks fine on the surface but doesn't hold up over time or under close examination. The environment loses its ability to distinguish what is genuinely excellent from what merely appears excellent. Recognition of real quality becomes unreliable — people accept substitutes they would have rejected had the discernment been present to notice the difference.`,catalyst:`Activate it by intentionally raising the standard of what you produce and what you accept. This is the period for genuine refinement: the revision that makes the work actually excellent rather than merely presentable, the relationship investment that makes the connection actually deep rather than merely consistent, the decision that reflects what you actually value rather than what is most convenient. Outcome: what is produced in this period carries lasting quality and remains recognizable as excellent well past the moment it was created. Recognition arrives for the refinement specifically.`,resistance:`When 辛 energy is creating friction — the discernment is running at a level that prevents output. The evaluating quality is being used to disqualify rather than develop. The corrective: set the completion criterion before beginning, not during. Decide in advance what "excellent enough to release" looks like, so the discernment has a defined finish line rather than an open-ended mandate to keep refining. Use Water energy (flow, depth, forward movement) to give the precision somewhere to go beyond itself. Outcome: evaluation produces completion rather than endless refinement, and the standard becomes generative rather than paralyzing.`}},壬:{identity:{archetypeName:`The Ocean`,archetypeLabel:`Yang Water — The Ocean`,identityIcon:`ArchetypeSeal`,manifesto:`Depth before disclosure · Oceans don't announce their depth.`},subtitle:`More beneath the surface than is ever shown · The Intelligence Impulse (Yang)`,chips:[`Expansive`,`Systemic`,`Depth-witholding`,`Untranslatable`,`Ambition without edges`],yourNature:{phrase:`The River Cartographer`,desc:`You process things at a depth most people in the room aren't reaching, and you carry more beneath the surface than you ever show. The hard part is the gap between how deep you actually think and what you can get the room to understand.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Ocean holds more beneath the surface than it shows. In any exchange, they're processing at a depth that most people in the conversation can't quite follow — holding more variables, more layers, more implications simultaneously than the situation might seem to warrant. Others sense this as intelligence before they can name what they're sensing. The depth is structural, not accumulated through study or experience. It was there before anything else was added to it.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Understanding how things actually work at the level where they actually operate — not the surface dynamics everyone can see but the real dynamics beneath them. Producing insights that emerge from holding many things at once rather than following a single logical thread, reaching conclusions by routes they can't always fully explain. Going further into complex or difficult territory than most people are willing to go, and returning with something genuinely useful.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The depth needs banks or it disperses. Without a specific channel — a specific form, a specific person who can engage at the level where they're actually operating — the intelligence ranges widely without landing anywhere productive. The translation problem is real: bringing what they perceive at depth into forms that people at the surface can receive is a constant, effortful process that never quite finishes.

Most exchanges happen at a shallower level than where the Ocean operates. This produces a persistent sense of being encountered at the surface — of having depth that no one is quite reaching. The response is often to withdraw further rather than simplify, which deepens the problem without resolving it.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`In conditions of genuine exchange — where someone meets them at the level they're operating and gives something back at that level — the Ocean produces things it cannot produce alone. The depth that was ranging without form finds a channel. The intelligence that was present but not landing becomes genuinely useful. These conditions are rare, which is why the Ocean learns to recognize them quickly and protects them once found.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`How often they're lonely in this specific way: surrounded by capable, intelligent people and still operating in a depth that no one in the room is quite reaching. Not because the people are insufficient. Because the depth is structural — it was always going to be this particular width and this particular distance down, regardless of who was in the room.`}}],psych:{bigFive:`High Openness/Intellect · lower Extraversion Enthusiasm · High Industriousness · variable Neuroticism — competence and autonomy needs extremely high`,jungian:`Introverted Thinking (Ti) at vast scale + Introverted Intuition (Ni) — processes comprehensively, holding multiple frameworks simultaneously, generating systemic insight`,attachment:`Dismissive-avoidant — the depth that perceives everything can produce emotional distance; holding more internally than gets shown is constitutional, not a choice`,shadow:`Emotional Scale — thinks in "waves"; massive ambition but lack of natural limits tends to flood rooms or disappear entirely into the deep; the translation gap between depth and surface is persistent`},archetypes:[`INTP / INTJ (MBTI)`,`The Sage (Brand)`,`The Wise Old Man / Self (Jungian)`,`Type 5 / Type 7 (Enneagram)`,`Scorpio / Aquarius (Western)`,`Reflector / Projector (HD)`,`The Threshold Guardian (Campbell)`],energy:{keywords:[],what:`壬 is the great river or open ocean — vast, flowing, carrying everything with it. Classically described as 水之阳 (the Yang of Water), it is the energy of movement, passage, and systemic flow. 三命通会 describes 壬 as the water that "carries and moves all things forward." Where Earth consolidates and Metal defines, Water flows. It is the atmosphere of "things begin moving; opportunity flows in from unexpected directions; boundaries become less fixed."`,represents:`Career mobility and movement opportunities. Travel and expansion becoming natural and productive. Intellectual energy and curiosity increasing across the environment. Ambition energizing the social field. Opportunities arriving through flow — through being in the right currents — rather than through direct effort. Also: the potential for flooding, for dispersion, when there is no structure to channel the movement.`,liunian:`When 壬 energy enters your luck cycle or annual pillar, things start moving. Career positions shift. Travel opens. Intellectual interests expand. Opportunities flow — sometimes all at once, requiring discernment about which currents to enter. The classical texts note that Yang Water without banks disperses and floods: this energy at its best requires structure and focus to channel productively. For charts that benefit from Water, this is a high-flow period of genuine opportunity and expanding intelligence; for those already Water-heavy, the excess can produce overwhelm, scattered attention, emotional flooding, or ambition that exceeds what the foundations can support.`},manual:{concentrated:`Everything flows at once — career mobility, intellectual expansion, ambition, opportunity. High energy. But excess 壬 without structure disperses: the intelligence ranges without landing, the ambition floods available structure, the movement goes in too many directions simultaneously. Classical texts warn 壬水泛滥 (Yang Water flooding) — when the Ocean overflows its banks, it doesn't irrigate the field; it destroys the crop. The environment becomes intellectually stimulating but practically unproductive. Too many currents pull in too many directions and nothing actually advances.`,open:`Systemic intelligence and movement are reduced. Career positions that should be mobile become fixed. Intellectual curiosity narrows. The depth of understanding that comes from holding many frameworks simultaneously — the quality of perceiving the whole system at once — is less accessible. Decisions get made with less information than is available because the capacity to perceive depth is not fully engaged. Life becomes more local, more predictable, and more limited in range than the chart's actual capacity warrants.`,catalyst:`Activate it by entering movement: change the environment, take the trip, begin the intellectual pursuit that has been deferred, apply for the position that requires relocation or expansion. This energy rewards those who enter the current rather than waiting on the bank. Don't try to control the direction — learn to read where the flow is going and position yourself there. Outcome: career mobility arrives naturally when you stop resisting movement. Opportunities flow from directions that stationary positioning would never have reached, often arriving faster than effort-based strategies would have produced.`,resistance:`When 壬 energy is creating friction — flow is running against the chart's structure rather than through it. Too much movement has dispersed what needed to concentrate. The corrective is to introduce Earth energy (consolidation, containment, banks) — not to stop the Water but to give it shape. Identify specifically where the intelligence and energy should land, and build enough structure to allow accumulation rather than flooding. Outcome: movement becomes purposeful flow rather than dispersal, and what was scatter becomes a current going somewhere specific.`}},癸:{identity:{archetypeName:`The Rain`,archetypeLabel:`Yin Water — The Rain`,identityIcon:`ArchetypeSeal`,manifesto:`Felt before spoken · What enters water becomes water.`},subtitle:`Knows what is true before it is spoken · The Intelligence Impulse (Yin)`,chips:[`Attuned`,`Psychically permeable`,`Absorbing`,`Specifically nourishing`,`Lost in own fog`],yourNature:{phrase:`The Court Oracle`,desc:`You know what's true in a room before anyone says it out loud — the feeling arrives before the reasoning does. The difficult part is that you absorb what everyone around you is feeling, and it can be hard to tell what's yours and what isn't.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Rain senses what's true in a room before anyone says the thing. Not through observation and analysis — the knowing arrives as a felt sense, directly, before any reasoning catches up. They know when something is off, when someone is hurting, when the thing that was said isn't the thing that is actually true. This happens continuously and without their choosing it. Proximity to others is never emotionally neutral for them — they absorb the emotional reality of their environment the way rain absorbs the ground's temperature when it falls.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Nourishing what they touch in ways that are specific to what that particular person or situation actually needs — not generic care, but calibrated care. Making people feel genuinely known rather than simply seen. Perceiving the thing that's almost true but not quite, and finding the exact words for it that make the person realize it was there all along. Sustaining this across time — their care doesn't diminish when circumstances change. It's structural.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The permeability that makes them so perceptive makes it genuinely hard to know whose feeling is whose. The Rain absorbs what it encounters — not from weakness but from how the sensitivity is wired. In difficult or charged environments, they don't just observe the difficulty; they carry it home. The boundary between what they're sensing in others and what they're experiencing themselves can dissolve quietly, often before they've noticed it's happened.

There's also a pattern of caring for others at the level they wish they were cared for — which means the care they give is often more than what returns. Because the giving felt natural, the gap takes a long time to become visible.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`In genuinely reciprocal conditions — where the sensitivity is met with sensitivity, where the nourishment returns at something close to the rate it goes out — what the Rain produces is among the most valuable things available in close relationship. The perception is extraordinary. The care is specific. The knowing is real. Protecting these conditions isn't selfishness. It's maintenance of the instrument.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That they absorb far more than they show — and that the accumulation is real and has weight. Over time, in environments that don't return what's given, this becomes something between exhaustion and a kind of grief: the specific sadness of giving something real that doesn't arrive back at the same depth.`}}],psych:{bigFive:`High Neuroticism/Withdrawal (perceptual, not anxious) · High Agreeableness/Compassion · lower Extraversion — Aron's Highly Sensitive Person (HSP) framework is the most precise analog`,jungian:`Introverted Intuition (Ni) + Introverted Feeling (Fi) — perceives at depth and cares specifically; the intuition is immediate and uncanny, the care goes where most needed`,attachment:`Anxious-preoccupied — permeability means proximity to others is not emotionally neutral; absorbs the emotional state of those around it as a structural fact`,shadow:`Psychic Permeability — absorbs the moods of everyone around them; feels lost in their own fog; the most intuitive stem and the most at risk of losing themselves in what they perceive`},archetypes:[`INFJ / INFP (MBTI)`,`The Innocent / Mystic (Brand)`,`The Anima / Sibyl (Jungian)`,`Type 2 / Type 4 (Enneagram)`,`Pisces / Cancer (Western)`,`Reflector (HD)`,`The Shape-Shifter (Campbell)`],energy:{keywords:[],what:`癸 is the rain, the mist, the pervasive moisture that seeps through everything without announcing itself. Classically described as the final stem — the culminating, completing water — 癸 represents the energy of endings becoming clear and hidden things rising to the surface. 子平真诠 describes 癸 as water that "nourishes in secret and completes what is unseen." It is the atmosphere of "what was hidden comes to light; what is ending becomes visible; reflection becomes more productive than action."`,represents:`Completion of cycles and projects that had been running for a long time. Hidden information surfacing — sometimes gently, sometimes as a surprise. Spiritual and reflective periods becoming more productive than outward action. Intuitive accuracy increasing. Endings that prepare space for what comes next. The body's need for rest and restoration becoming harder to suppress.`,liunian:`When 癸 energy enters your luck cycle or annual pillar, things complete and hidden truths surface. What has been quietly building over the previous cycle — good work, neglected maintenance, deferred consequences — tends to become visible. This is a period for honest reflection and honest assessment more than aggressive expansion. Spiritual and inner development tends to deepen. What is ending becomes clear, and what is beginning in the next cycle starts to emerge in the reflection. For charts that benefit from Water, this is a period of genuine completion and deepening wisdom; for those already Water-heavy, the excess can produce emotional absorption, difficulty distinguishing what is perceived from what is actually happening, or exhaustion from carrying what was never fully put down.`},manual:{concentrated:`Everything is perceived, everything is felt, everything is known at a level that exceeds what can be processed. The environment or person absorbs more than it can hold without losing its own shape. Classical texts describe 癸水多则迷 (excess 癸 Water creates confusion) — when the Rain becomes a flood of perception, the person can no longer distinguish their own knowing from what they have absorbed from others. Emotional and perceptual exhaustion. The intuition that was extraordinarily accurate becomes overwhelming noise, and the sensitivity that was a gift becomes genuinely difficult to live inside.`,open:`Perceptual intelligence that reads what is actually true in a room — beneath the surface of what people are saying — becomes harder to access. Things are taken at face value. Hidden information doesn't surface. The body's signals are missed. The slow-penetrating quality that reveals what careful reflection produces — the "soaks through to the real layer" quality — is reduced. What is ending doesn't get recognized as ending until it has already ended. Intuitive accuracy is replaced by logical analysis, which is slower and misses the layer below.`,catalyst:`Activate it by creating conditions for genuine perception: quiet, reduced stimulation, time for reflection without agenda. This energy does not respond to force — it responds to receptivity. The insight arrives when you stop trying to produce it and create the space where it can surface naturally. Sit with the question longer than feels productive. The answer arrives at the edge of sleep, in the transition between conversations, in the moment after the analysis stops. Outcome: what was obscure becomes clear. The right answer to a long-standing question arrives not from analysis but from having been genuinely still with it long enough for the perception to form.`,resistance:`When 癸 energy is creating friction — the permeability is absorbing what it should be allowing to pass through. The chart needs more definition (Metal) or more grou
