2)`,border:`1px solid ${Ae}`,borderRadius:22,...e}),He={甲:{identity:{archetypeName:`The Oak`,archetypeLabel:`Yang Wood — The Oak`,identityIcon:`ArchetypeSeal`,manifesto:`Motion before readiness · The oak does not negotiate its direction.`},subtitle:`Forward motion as structure, not ambition · The Growth Impulse (Yang)`,chips:[`Visionary`,`Initiating`,`Growth-driven`,`Integrity-bound`,`Consolidation-resistant`],yourNature:{phrase:`The Vanguard General`,desc:`You're always the first to see where something could go — and you start moving toward it before anyone else has decided whether to begin. You build things that outlast you, but you're usually already thinking about the next thing before the current one is done.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Oak doesn't decide to grow toward things. It just grows, the way a tree grows toward light — not because it chose the direction but because that's what it does. For this person, the next stage of anything is always visible before the current one has settled. They're mentally already somewhere else while the room is still discussing whether to begin. This isn't impatience exactly. It's more like living slightly ahead of the present moment at all times.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Seeing what something could become before anyone else does. Starting things — not because someone asked them to, but because the gap between what exists and what could exist is physically uncomfortable for them to leave alone. Once they start something, they generate a kind of forward pull that brings other people along without anyone deliberately organizing it. People around them tend to end up thinking bigger than they did before, often without knowing why.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The reaching outruns the roots. They commit to something genuinely and deeply — and then outgrow it before it's fully established. There's a recurring pattern of building something real, then moving before it's been properly consolidated, leaving things in a state that needs someone else to finish. The next stage is always visible before the current one has actually been tested. This isn't fickleness — the investment was real. The problem is structural: the nature moves faster than the foundations can follow.

There's also a specific interpersonal cost: people who care about them often feel like they're perpetually catching up. The Oak doesn't mean to move that fast. It just can't stop.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The classical principle: raw wood becomes useful timber only when something shapes and defines it — converts the reaching into something specific. The Oak doesn't need someone to give it direction. What it needs is a force that says "this, not everything." When that arrives through the right challenge or pressure, the reach consolidates into something that holds. The growth doesn't stop. It just finally has a form.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That they often don't know what they're building toward — only that they're building. The momentum is real. The destination is often genuinely unclear even to them, which is part of why the reaching can go in so many directions before finding the thing that's actually worth the full force.`}}],psych:{bigFive:`High Openness/Intellect · High Assertiveness · variable Industriousness (challenge is consolidation, not initiation)`,jungian:`Extraverted Intuition (Ne) + Extraverted Thinking (Te) — generates possibilities and reaches toward them before consolidating`,attachment:`Secure-leaning with over-extension risk — commits deeply then outgrows before fully rooting`,shadow:`Integrity vs. Rigidity — would rather break than bend. Authority is tolerated only if the vision is genuinely shared, not merely imposed`},archetypes:[`ENTP / ENTJ (MBTI)`,`The Pioneer (Brand)`,`The Hero (Jungian)`,`The Magician (Campbell)`,`Type 7 / Type 3 (Enneagram)`,`Aries / Sagittarius (Western)`,`Manifesting Generator (HD)`],energy:{keywords:[],what:`甲 is the first stem — the energy of spring's first upward break through frozen ground. Classically described as 木之阳 (the Yang of Wood), it represents a forceful, non-negotiable impulse to rise and expand. Think of the moment when a forest floor cracks open with new growth after winter: nothing deliberate, nothing negotiated — just life asserting itself upward. It is the atmosphere of "things beginning whether you're ready or not."`,represents:`New projects launching all around you. The feeling of ambition and possibility filling the environment. People becoming more assertive, initiating more, competing more openly. The conditions that make starting things feel natural and necessary. Also: the landscape gets crowded — more people reaching for the same things at the same time.`,liunian:`When 甲 energy enters your luck cycle or annual pillar, it acts like the first warm week of spring — activating everything that was dormant. If you're positioned to initiate, this is the energy that provides momentum. If you're not ready to move, the pressure to start still arrives. Career opportunities emerge suddenly. Competitors become more visible. For those whose chart benefits from Wood energy, this is a period of genuine forward momentum; for those whose chart is already Wood-heavy, the excess can produce restlessness, overcommitment, or difficulty consolidating what's already been started.`},manual:{concentrated:`New ideas launch before old ones land. Commitments pile up faster than they can be honored. The chart or period is saturated with initiating energy — ambitious, restless, and difficult to anchor. The classical principle warns of "growth without harvest": energy expanding without converting into completed form. Restlessness is constant. Stillness feels impossible. The specific trap: more beginnings accumulate than can ever be finished, and the backlog slowly becomes its own weight.`,open:`Initiative is genuinely harder to find. The environment or person waits for external permission before moving. Starting things feels risky rather than natural. Leadership and forward visibility feel inaccessible — not from lack of capability but from lack of the upward-push energy that makes initiating feel worth the cost. Projects that need a champion stall at the beginning. Ambition may exist internally but stays unexpressed.`,catalyst:`Enter it by initiating the thing you have been circling — one specific thing, not ten. This is not a "plan more" energy; it is a "start now" energy. Commit to a direction and enter it fully before the window moves. Volunteer for the visible role, launch the project, make the first move in the relationship. The productive use is concentration of the initiating force, not dispersal. Outcome: things that had no momentum suddenly have it. Doors that required the right person to ask become accessible when you step forward as that person.`,resistance:`When 甲 energy is creating friction — growth impulse is competing with your structure rather than feeding it. Don't resist the initiating force; redirect it. Use the Metal quality (pruning, deciding, cutting options) to define which growth is worth nurturing. Stop adding beginnings — close enough open loops to make space for one thing to actually land. The corrective is not stillness but focus. Outcome: restlessness converts into directed momentum, and what was scatter becomes a clear line of forward motion.`}},乙:{identity:{archetypeName:`The Vine`,archetypeLabel:`Yin Wood — The Vine`,identityIcon:`ArchetypeSeal`,manifesto:`Route bends. Destination holds. · The vine finds every wall a ladder.`},subtitle:`Navigation as intelligence, not accommodation · The Growth Impulse (Yin)`,chips:[`Adaptive`,`Strategically perceptive`,`Resilient`,`Destination-fixed`,`Coiling intelligence`],yourNature:{phrase:`The Shadow Diplomat`,desc:`You always find a way through — not by pushing harder, but by reading the room and finding the opening no one else noticed. Your destination never changes; only the path you take to get there.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Vine knows where it's going before it knows how to get there. It reads surfaces, finds the gaps, goes around what can't be moved, and arrives somewhere the Oak never could have reached through force. From outside this looks indirect. From inside it's extremely precise: the destination is fixed; only the path is flexible. They have a gift for reading what a situation actually is — not what it presents, not what people say it is, but the actual underlying reality — and navigating according to that.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Finding the route that wasn't obvious. Arriving where they intended by means that nobody predicted. Reading people and rooms with an accuracy that feels almost unfair — they pick up on what's really happening before anyone has said the thing. Building genuine trust through attentiveness, not through performance. The people who know them well describe someone who always seems to end up exactly where they were heading, even when the path looked like it was going sideways.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The adaptability can become the whole point. When every surface is interesting and every route is worth exploring, the Vine can keep navigating without actually landing anywhere. There's also a subtler risk: the Vine adjusts to surfaces so smoothly it can slowly accommodate away from its own position without noticing — adjusting so quietly that by the time they notice, it's hard to say exactly when it happened or what they actually think anymore.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Vine's gifts fully activate when the environment is genuinely worth the full reach — a surface that deserves the climbing, a destination that's actually worth arriving at. In those conditions, the navigation is extraordinary: precise, intelligent, arriving somewhere real. In the wrong environment, the gifts don't disappear — they just don't engage. This makes choosing environments one of the highest-leverage decisions this person makes.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`How much of what looks like flexibility is actually a form of self-protection — a way of staying mobile enough that no single failure can fully land. The adaptability is genuine intelligence. It's also, sometimes, a way of not having to find out what happens if they commit completely and it doesn't work.`}}],psych:{bigFive:`High Enthusiasm (Extraversion facet) · High Compassion/Agreeableness · moderate Neuroticism (accumulation cost of structural warmth)`,jungian:`Extraverted Feeling (Fe) — shapes the emotional climate of any space occupied, as a property of presence rather than performance`,attachment:`Secure with abandonment sensitivity — the giving is genuine; the depletion is real when unrecognised by others`,shadow:`The Authenticity Burden — performing "light" for others while sitting in one's own shadow; deep exhaustion invisible behind consistent radiance`},archetypes:[`ENFJ / ESFJ (MBTI)`,`The Hero (Brand)`,`The Great Mother / Anima (Jungian)`,`Type 2 / Type 7 (Enneagram)`,`Leo / Aries (Western)`,`Manifestor (HD)`,`The Lover (Campbell)`],energy:{keywords:[],what:`乙 is the energy of the vine after the tree — not the initial thrust but the intelligent navigation that follows. Classically described as the Wood that bends rather than breaks, it represents pervasive, penetrating growth that finds every available path. Where 甲 forces upward, 乙 feels its way forward. It is the atmosphere of "the smart path matters more than the direct one."`,represents:`Relationship dynamics becoming more important than raw capability. Opportunities arriving through connections rather than competition. The environment rewards those who read the room well, adapt quickly, and know how to work with people. Diplomacy outperforms force. Collaboration opens doors that confrontation closes.`,liunian:`When 乙 energy enters your luck cycle or annual pillar, the environment shifts toward relationship-intelligence. Raw power becomes less effective; knowing the right people and reading the terrain correctly becomes decisive. Opportunities arrive through networking, referrals, and word of mouth rather than visible achievement. A period that rewards those who listen well and move flexibly — and frustrates those who only know how to push directly. For charts that benefit from Wood, this brings collaborative momentum; for those already Wood-heavy, it can produce over-accommodation or difficulty making firm decisions.`},manual:{concentrated:`Everything accommodates, nothing commits. The chart or period is saturated with relational intelligence — socially exhausting because the room-reading never stops. The classical trap: 柔弱 (too yielding) — the vine that never finds a surface firm enough to actually climb, and so keeps reaching in all directions simultaneously. Chronic over-adaptation gradually erodes position: you become expert at arriving where others wanted, and lose track of where you intended to go. Commitment feels like a trap because there are always other paths.`,open:`Relational intelligence gaps appear. The environment can only approach things directly — and direct force fails in complex political or relational terrain. Opportunities that require connection rather than competence get missed. Diplomacy becomes unavailable when it's most needed. Life becomes more transactional and confrontational, even when a side door was available and far easier. The texture of relationships turns blunt.`,catalyst:`Engage it through the relational field: network, collaborate, make the introduction, let others open the door. This energy rewards those who work through people rather than around them. The productive use is entering the room where the right connections already exist, not building something alone. Allow others to facilitate what direct effort would take three times as long to produce. Outcome: networks activate, referrals arrive, opportunities appear through relationship rather than visible achievement — and often move faster than any amount of direct pushing would.`,resistance:`When 乙 energy is creating friction — flexibility is working against your actual goal. You have read the room so accurately that you've accommodated yourself out of your original position. The corrective: name where you are going before you enter the adaptive mode. Know your destination clearly before you start finding routes around the obstacles. Don't add more flexibility — add a clear ending point for the navigation so it doesn't become permanent drift. Outcome: the adaptability becomes intelligent navigation rather than endless accommodation, and what was drift becomes a route.`}},丙:{identity:{archetypeName:`The Sun`,archetypeLabel:`Yang Fire — The Sun`,identityIcon:`ArchetypeSeal`,manifesto:`Warmth without permission · The sun does not choose who it reaches.`},subtitle:`Warmth as structural property, not personality trait · The Visibility Impulse (Yang)`,chips:[`Radiant`,`Generative`,`Involuntarily warm`,`Invisibly depleting`,`Trust-creating`],yourNature:{phrase:`The Court Herald`,desc:`You walk into a room and people feel more at ease, more energized, more capable — without you trying to make that happen. The cost is that you give it constantly and almost never get asked if you're okay.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Sun doesn't decide to warm things. It warms things because that's what it is. People orient toward this person in a room without deciding to — they just find themselves doing it. Things feel more possible near them. Ideas get bigger. Other people feel more capable of things they weren't sure they could do. This isn't something they engineer; it's a property of their presence, the way sunlight warms a surface without the sun choosing that particular spot.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Creating trust quickly, authentically, and without trying. Moving people not through logic or performance but through what they actually believe — which means it works in rooms where performance would fail completely. Making people feel genuinely seen, not just acknowledged. Sustaining warmth over time in a way that builds rather than fluctuates — the people who receive it know it's real because it was still there on the difficult days too.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The warmth goes everywhere at once, which means it costs the same as focused warmth but produces a fraction of the impact. The giving feels effortless — which is exactly why the depletion accumulates invisibly. They don't notice the tank getting low until it's very low. Others assume they're inexhaustible. This assumption is wrong but hard to correct — the moment the warmth dims, people register it as a problem with the relationship rather than a cost that was always being paid.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Directed warmth — warmth that knows where it's going — is dramatically more powerful than broadcast warmth. When this person finds relationships and contexts that genuinely give back, the warmth stops being diffuse and becomes specific. What was warming a whole room starts illuminating particular things fully. That's when the Sun's quality is at its most extraordinary: not more warmth, but warmth that has somewhere real to go.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That they sometimes don't know whether the warmth is something they're choosing or something that just runs regardless. The giving can feel less like a gift and more like a structural fact — which makes it genuinely difficult to protect, because it's hard to guard something that operates before you've decided to give it.`}}],psych:{bigFive:`High Conscientiousness across both facets · Low Neuroticism · moderate Extraversion — structural reliability rather than effortful discipline`,jungian:`Introverted Sensation (Si) in its most stable expression — maintains the internal framework of what works, what has proven stable, what can be depended on`,attachment:`Secure provider with stagnation risk — the stability that holds everything can hold itself in place past the point of serving anyone`,shadow:`Internal Stagnation — "who holds the rock?" The heaviness that makes this person irreplaceable is also what prevents them from moving toward what they need`},archetypes:[`ISTJ / ESTJ (MBTI)`,`The Ruler (Brand)`,`The Self / Great Father (Jungian)`,`Type 9 / Type 1 (Enneagram)`,`Taurus / Capricorn (Western)`,`Manifestor / Generator (HD)`,`The Guardian (Campbell)`],energy:{keywords:[],what:`丙 is the sun — the great broadcasting fire that lights everything simultaneously. Classically described as 火之阳 (the Yang of Fire), it is outward, radiant, and indiscriminate: it warms what it reaches and illuminates what it touches without choosing. The classical texts describe 丙 as giving warmth and light to all things under heaven. It is the atmosphere of "nothing stays hidden; everything becomes more visible."`,represents:`Public recognition opportunities. Career visibility increasing. Social environments expanding and becoming more energized. Fame and reputation becoming relevant — for better and for worse. What has been built becomes more publicly known. Equally, what has been concealed becomes harder to keep covered. It is the energy of the spotlight.`,liunian:`When 丙 energy enters your luck cycle or annual pillar, visibility increases across the board. If you have built something worth showing, this is when it gets seen. Career recognition can arrive quickly. Social networks expand. Opportunities come through being publicly known rather than quietly competent. The shadow is equally real: 丙 reveals everything, including what wasn't meant to be seen. For charts that benefit from Fire, this is an activating period of genuine recognition; for those already Fire-heavy, the excess can produce burnout, overexposure, or reputation risk.`},manual:{concentrated:`Everything is lit up — and nothing remains private. Social momentum and recognition are high. But excess 丙 is literal overexposure: work that wasn't ready gets seen, private things become public, and being "on" continuously becomes genuinely depleting. The classical warning: 火炎土燥 (fire blazes, earth scorches) — when Fire becomes excessive, the ground beneath it dries and cracks. The environment becomes brilliant but unstable, high-energy but exhausting. Reputation risk increases alongside recognition opportunity.`,open:`Visibility is genuinely harder to access. Quality work exists but doesn't surface. The person or environment struggles to be noticed despite having real substance. Social connections feel effortful rather than natural. The classical image: a lantern inside a jar — the flame is real but the light doesn't reach others. Career recognition requires ten times more effort than it should because the radiance that would carry the work outward is simply not present.`,catalyst:`Activate it by entering public or visible contexts: put the work in front of others, attend the gathering, publish the piece, take the speaking slot. This is not a "refine quietly" energy — it produces momentum specifically through being seen. Don't wait until everything is perfect. Enter the spotlight when it's available. Outcome: recognition accelerates when conditions align. Career momentum that felt stuck suddenly moves because visibility has been restored and the quality that was invisible is now landing.`,resistance:`When 丙 energy is creating friction — warmth and visibility are running ahead of what the chart can sustain. The exposure is broader than the structure behind it can support. Channel it by directing exposure strategically rather than broadcasting broadly. Use the Water quality (depth, selectivity, substance) to give form to what's being shown — choose specific audiences, specific contexts, specific moments. Outcome: overexposure converts into targeted presence, and what felt like scatter becomes a signal that actually lands.`}},丁:{identity:{archetypeName:`The Ember`,archetypeLabel:`Yin Fire — The Ember`,identityIcon:`ArchetypeSeal`,manifesto:`Intimacy over range · A candle doesn't reach far — it reaches true.`},subtitle:`Complete illumination of exactly what it's pointed at · The Visibility Impulse (Yin)`,chips:[`Precise`,`Intimate`,`Selectively warm`,`Detail-sensitive`,`Flickering under depletion`],yourNature:{phrase:`The Imperial Examiner`,desc:`When your attention is fully on someone, they feel completely seen — understood at a level they rarely experience. But you can only truly light up one thing at a time, and everything else goes dark.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Candle illuminates what it's pointed at completely — and nothing else. When the Candle's attention is on you, you are genuinely seen in a way that most people never experience. The attention is total. The light is complete. And what it's not currently pointing at receives almost nothing. This is not the Sun's warmth, which fills a whole room. This is something more precise and more intimate: specificity is the whole point.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Noticing the thing that others walked past. Producing work of real quality in whatever they're fully invested in. Making people feel understood in a way that is specific to them — seen as who they actually are rather than how they've presented themselves. Their perception is unusually accurate, especially about things that are just slightly off. The quality of their attention is something people remember specifically and tend to return to.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The full force of attention can arrive harder than the moment required. Contexts that needed gentle warmth receive the full flame. What falls outside the current focus receives almost nothing — people who aren't being fully attended to can feel the absence sharply and take it personally, even when it has nothing to do with them.

There's also an investment asymmetry that accumulates: the Candle gives the full quality of its attention without always checking whether it's being matched. The care is real. The return is often lower than what was given. And because the giving felt like connection rather than cost, the imbalance often goes unnamed for a long time.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Candle works best when its autonomy to direct the light is genuinely its own — when what it chooses to focus on is genuinely worth the full illumination. In those conditions, the precision is extraordinary: the depth of understanding, the quality of care, the accuracy of perception. The practice is learning that choosing selectively isn't a failure to be more like the Sun — it's the mechanism by which this particular kind of light actually works.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That when the full flame arrives at full force in a context that wasn't ready for it, they often don't understand why it didn't land the way it should have. The quality was real. The care was genuine. What they don't always account for is that not every moment wants to be fully illuminated.`}}],psych:{bigFive:`High Conscientiousness/Industriousness · Low Agreeableness/Politeness · lower Neuroticism — evaluation as structural default, not as active choice`,jungian:`Introverted Thinking (Ti) — the evaluation operates through an internal logical framework that cannot be switched off; runs before social or emotional consideration`,attachment:`Dismissive-avoidant — self-sufficient, low dependency; the evaluative default reads as distance but the care is real, arriving through the same precision channel as everything else`,shadow:`The Justice Wound — sees the world in Right/Wrong; the bluntness is a defense mechanism for a very soft interior; the blade in the tongue is protecting something that rarely gets shown`},archetypes:[`INTJ / ENTJ (MBTI)`,`The Outlaw / Maverick (Brand)`,`The Hero / Warrior (Jungian)`,`Type 1 / Type 8 (Enneagram)`,`Aries / Scorpio (Western)`,`Manifestor (HD)`,`The Warrior (Campbell)`],energy:{keywords:[],what:`丁 is the candle or the forge fire — concentrated, intentional, illuminating exactly what it points at. Where 丙 lights everything, 丁 lights one thing completely. Classically described as the refining and illuminating fire used to work metal and reveal detail, it is the energy of careful examination rather than broad visibility. It is the atmosphere of "the details that were missed before now come into focus."`,represents:`Learning, skill development, and careful refinement becoming more productive than broad expansion. The fine print in agreements becoming relevant. Relationships and projects kept at surface level getting examined more closely. Spiritual and intellectual insight becoming more accessible. The value of precision and quality rising relative to scale.`,liunian:`When 丁 energy enters your luck cycle or annual pillar, the environment rewards attention to detail and careful development over broad ambition. Skills cultivated during this period tend to be genuinely refined. Examinations — literal and figurative — go well for those who have prepared carefully. Agreements and commitments should be read closely. For charts that benefit from Fire, this brings focused development and meaningful insight; for those already Fire-heavy, it can produce overthinking, excessive self-examination, or anxiety from looking too closely at everything at once.`},manual:{concentrated:`The examining quality becomes exhaustive. Every detail gets scrutinized, every relationship gets held to a standard of depth it may not be designed for, every piece of work gets refined past the point of value. The classical problem: excess 丁 burns away what it examines — the candle that runs out of its own fuel. Anxiety emerges from examining everything and finding it insufficient. The environment becomes demanding and intense rather than illuminating. The precision becomes punishing rather than refining.`,open:`Things stay at surface level. Work is produced but not polished. Relationships remain pleasant but never reach real depth. The "notice what others miss" quality is not accessible. There may be energy — perhaps broad warmth from 丙 — but no concentrated, directional light. The specific deficit: work gets started and finished, but the layer beneath the surface — where the genuine quality lives — remains undeveloped.`,catalyst:`Activate it by going deeper into one thing rather than broader across many. Study the subject fully, not partially. Have the one-on-one conversation that a group setting would prevent. Revise the work one more time past where it felt done. Develop the skill to the level where it actually distinguishes you rather than merely qualifying you. Outcome: depth produces results that breadth never could. What is made in this focused state carries a quality that persists across time and resists erosion by competition.`,resistance:`When 丁 energy is creating friction — precision is examining rather than building. The scrutiny is consuming the energy that should go into output. The corrective: set a completion point before you begin — decide in advance what "done" looks like, so the refining faculty has a finish line. Once that point is reached, move the examining quality to the next project rather than continuing to refine the current one. Outcome: precision lands constructively rather than circling endlessly, and what was paralysis becomes a sequence of genuinely completed things.`}},戊:{identity:{archetypeName:`The Mountain`,archetypeLabel:`Yang Earth — The Mountain`,identityIcon:`ArchetypeSeal`,manifesto:`Immovable by design · Others find their bearings and never name why.`},subtitle:`The ground others orient by without naming · The Stability Impulse (Yang)`,chips:[`Grounding`,`Load-bearing`,`Change-resistant`,`Silently accumulating`,`Orientation-providing`],yourNature:{phrase:`The Mountain Warden`,desc:`You're the person everyone builds their plans around — steady, reliable, there when things shake. The part no one sees is how much you're actually holding, because you never let it show.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Mountain is what people orient by. It provides a kind of psychological ground — a stable reference point that others use without thinking about it. Conversations land differently around them. Decisions get made based on what they think, often before anyone has formally asked. People plan their lives around their presence. The reliability isn't something they practice or maintain through effort — it's what they're made of, the way a mountain is made of stone rather than holding itself up by trying.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Holding what needs holding — weight, stress, uncertainty, pressure — without showing the cost in a way that makes others feel responsible for it. Building things that last because they genuinely cannot tolerate building things that won't. Following through across time, not as a discipline they impose on themselves but as a structural fact. Being the person in the room who is still there when the dramatic options have run out.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The same quality that makes them load-bearing makes genuine movement difficult. When something needs to change — a relationship that's over, a position no longer tenable — the Mountain can hold it in place long past the point where the situation calls for release. Not from stubbornness. More from the fact that the stability everyone relies on makes shifting feel like a betrayal of what they're for.

There's also a slow accumulation of unspoken costs. The Mountain absorbs a great deal without naming it. Over time this produces weight that no one sees because the Mountain never showed it — which means no one thought to ask whether it was okay.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Mountain that has learned to distinguish between what needs to be held and what needs to be released is dramatically more powerful than the one that holds everything equally. The fire that activates it doesn't destabilize the stability — it gives the holding a direction. What was simply present becomes generative. What was enduring begins to produce.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That they need things too — specific things, from specific people — and have spent so long not needing anything visibly that they've almost stopped knowing how to name what those things are. The Mountain is so reliably there for everyone else that the question of what it needs has largely stopped being asked. Which means it's also largely stopped being answered.`}}],psych:{bigFive:`High Openness/Intellect · lower Extraversion Enthusiasm · High Industriousness · variable Neuroticism — competence and autonomy needs extremely high`,jungian:`Introverted Thinking (Ti) at vast scale + Introverted Intuition (Ni) — processes comprehensively, holding multiple frameworks simultaneously, generating systemic insight`,attachment:`Dismissive-avoidant — the depth that perceives everything can produce emotional distance; holding more internally than gets shown is constitutional, not a choice`,shadow:`Emotional Scale — thinks in "waves"; massive ambition but lack of natural limits tends to flood rooms or disappear entirely; the translation gap between depth and surface is persistent`},archetypes:[`INTP / INTJ (MBTI)`,`The Sage (Brand)`,`The Wise Old Man / Self (Jungian)`,`Type 5 / Type 7 (Enneagram)`,`Scorpio / Aquarius (Western)`,`Reflector / Projector (HD)`,`The Threshold Guardian (Campbell)`],energy:{keywords:[],what:`戊 is the mountain or the great plain — immovable, orienting, the accumulating ground. Classically described as 土之阳 (the Yang of Earth), it is the energy of settled, solid, load-bearing stability. 三命通会 describes 戊 as the earth that "stands without moving" — the reference point by which other things find their position. It is the atmosphere of "things solidify and slow; what is built now is built to last."`,represents:`Real estate, property, and physical assets becoming more prominent. Consolidation of resources and positions. The environment favoring stability and reliability over speed and novelty. Long-term commitments and foundations gaining importance. Things taking longer to move — ideal if you are building something meant to endure, frustrating if you are pushing for rapid change.`,liunian:`When 戊 energy enters your luck cycle or annual pillar, the environment shifts toward consolidation and foundation-building. Property matters become more significant. Career positions and relationships that were fluid start to solidify — sometimes helpfully, sometimes constrainingly. The pace of change slows. Reliability and consistency become more valuable than innovation. For charts that benefit from Earth, this is a grounding, stabilizing period of genuine accumulation; for those already Earth-heavy, the excess can produce stagnation, difficulty changing course, or a heaviness that makes movement feel impossible.`},manual:{concentrated:`The grounding quality becomes literal heaviness. Things that should move don't. Decisions that should be made get postponed. Weight accumulates without being processed. Classical texts warn 土重则滞 (excess Earth creates stagnation) — when the Mountain grows too dense, nothing moves across it. Opportunities pass because the inertia of consolidation prevents engagement with what's new. The environment becomes utterly reliable but genuinely stuck. Stability, which was the gift, becomes the trap when it refuses to distinguish between what should be held and what should be released.`,open:`Foundational stability is hard to access. Things don't land or hold. Projects start but don't root — growth happens above ground, but there's no foundation for it to anchor into. Financial and physical accumulation is more difficult. The environment feels unstable or mobile in ways that are exhausting rather than exciting. Others can't build on what you offer because the surface keeps shifting before they get a chance to establish themselves on it.`,catalyst:`Activate it by doing the foundation work: establish the structure, formalize the arrangement, secure the position, sign the commitment. This is not a "explore and expand" energy — it is "consolidate what you have and make it permanent." The productive use is making the tentative fixed. Outcome: what was provisional becomes stable. Resources stop moving and start accumulating. What is built now stays built in a way that the previous period of movement never allowed, and the groundwork laid here supports the next several years of activity on top of it.`,resistance:`When 戊 energy is creating friction — stability is working against the movement the chart needs. The ground is too fixed to accommodate necessary change. Don't try to remove the Mountain; find the path it allows. Use Wood energy (growth impulse, directionality) to create movement within the structure rather than against it — not breaking the foundation, but finding where within it something new can grow. Outcome: resistance becomes framework, and what felt like an obstacle becomes the specific form within which something worthwhile can be built.`}},己:{identity:{archetypeName:`The Field`,archetypeLabel:`Yin Earth — The Field`,identityIcon:`ArchetypeSeal`,manifesto:`Nourish without credit · The soil feeds everything and claims nothing.`},subtitle:`Growing things in others without announcing it · The Stability Impulse (Yin)`,chips:[`Nurturing`,`Developmentally attuned`,`Invisibly depleting`,`Overcultivating`,`Responsive`],yourNature:{phrase:`The Palace Gardener`,desc:`You help others grow without making a thing out of it — quietly creating the conditions for people to become better versions of themselves. The problem is you give more than you get back, and it takes longer than it should to notice.`},blocks:[{label:`How they experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Field grows things in everyone it encounters — before it decides to. It notices what people and situations need and responds before being asked, the way fertile soil responds to a seed by providing what's required for it to grow. People develop in the presence of this person in ways they often attribute entirely to themselves — not recognizing that the conditions making the growth possible were created by someone paying close, quiet attention to what was needed.`}},{label:`What they're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`Reading what a person or situation actually needs — not what's being asked for, but the underlying requirement. Following through on care consistently across time, not just when it's convenient or visible. Building relationships that genuinely develop people rather than simply maintaining proximity. Producing in others a kind of trust earned specifically by consistency: when they say they'll show up, they do, and people build their lives around that accordingly.`}},{label:`Where they consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`The Field depletes invisibly. The nourishment flows outward without being tracked — and by the time the deficit becomes visible, it's been accumulating for months. The growth they create in others tends to be attributed to those others, which means the Field is chronically undercompensated for what it actually produces. They're also particularly susceptible to investing in contexts that absorb without returning. The Field is often the last to notice this, partly because caring about whether care is being returned feels, to them, like a betrayal of what genuine care should be.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`In genuinely reciprocal conditions — where the care flows in both directions and the Field is being nourished at the same rate it nourishes — what it produces is extraordinary. The growth that was quiet and consistent becomes visible and remarkable. The practice is treating its own fertility as something worth protecting rather than something to be fully spent on whoever arrives.`}},{label:`What they rarely admit`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5},text:{default:`That they keep score, quietly — and that the accounting is often worse than anyone around them knows. They don't say this because saying it feels contrary to what care is supposed to be. But the gap between what's given and what returns is real, and it accumulates in them even when it isn't visible to anyone else.`}}],psych:{bigFive:`High Agreeableness (both Compassion and Politeness facets) · moderate Conscientiousness · variable Extraversion — parental investment theory, not simple agreeableness`,jungian:`Introverted Feeling (Fi) in its most relational expression — cares specifically, not broadly; nourishment directed at what the specific person or situation actually needs`,attachment:`Anxious-preoccupied — high caregiving activation; when unreciprocated over time, depletes invisibly without anyone noticing the accumulation`,shadow:`Nurturing / Suffocation Balance — can be "farmed" by others for kindness; a fertile mind that can grow anything, but often grows weeds from overthinking what was planted`},archetypes:[`ISFJ / INFJ (MBTI)`,`The Caregiver (Brand)`,`The Great Mother / Nurturing Anima (Jungian)`,`Type 2 / Type 9 (Enneagram)`,`Cancer / Virgo (Western)`,`Generator (HD)`],energy:{keywords:[],what:`己 is the cultivated field — fertile, absorptive, responsive to what is planted. Where 戊 holds firm and does not yield, 己 receives and nourishes what it receives. Classically described as the earth that "produces and nurtures," it is the energy of patient, receptive cultivation. It does not force growth; it creates the conditions for growth to happen. It is the atmosphere of "what you plant now grows slowly and deeply."`,represents:`Health and wellbeing becoming a more prominent theme. Long-term investments — financial, relational, and personal — becoming more productive. The environment rewarding patience and careful cultivation over aggressive acquisition. Relationships that were casual deepening. Projects that were broad becoming more specific and nourishing. The body and its needs becoming harder to ignore.`,liunian:`When 己 energy enters your luck cycle or annual pillar, the environment supports patient cultivation over quick results. Health matters tend to surface — both as concerns requiring attention and as an opportunity for genuine restoration. Long-term investments begin paying quiet dividends. Relationships deepen rather than expand. This is not a period for dramatic moves; it is a period for developing what is already growing. For charts that benefit from Earth, this brings genuine nourishment and productive development; for those already Earth-heavy, the excess can produce overthinking, accumulation of worry, or a tendency to absorb others' difficulties without adequate filtration.`},manual:{concentrated:`The receptive and nurturing quality becomes absorptive without filtration. The environment or person pulls in difficulties as readily as it nourishes growth. Classical texts describe 己土混浊 (己 Earth becomes muddy) — when the fertile soil absorbs too much without drainage, it loses its cultivating quality entirely and becomes mud. Overthinking, rumination, and carrying others' emotional weight characterizes the excess state. The Field grows weeds as readily as it grows crops when there's no selectivity about what gets tended.`,open:`The patient-development quality is absent. Growth happens but nothing is tended. People and projects are initiated but not cultivated. The environment lacks the quiet, sustained presence that allows things to develop at their natural pace — which means the depth of development that slow nourishment produces simply never arrives. Quick results get prioritized over lasting ones, and nothing reaches the quality it could have reached with genuine care.`,catalyst:`Activate it by investing attention and care in what is already growing rather than starting something new. This is the energy for tending: deepening existing relationships, developing skills that have already been started, returning to projects that were begun but not fully cultivated. It specifically rewards patience — what receives genuine care and attention now develops into something of real substance over the next period. Outcome: things that were beginning deepen, relationships that were forming solidify, work that was surface-level becomes genuinely developed.`,resistance:`When 己 energy is creating friction — the absorptive quality is pulling in more than the chart can process. Obligations, relationships, and projects are accumulating faster than they can be properly nurtured. The corrective is deliberate selectivity: explicitly choose what deserves the cultivation energy and stop absorbing what doesn't. Use Metal energy (boundary, definition, cutting) to create filtration — allowing only the right material into the nurturing field. Outcome: caregiving becomes targeted and powerful rather than diffuse and depleting, and what was an endless drain converts into sustainable, productive investment.`}},庚:{identity:{archetypeName:`The Blade`,archetypeLabel:`Yang Metal — The Blade`,identityIcon:`BladeJian`,manifesto:`Precision before intention · An edge is never given — it is forged.`,elementIntro:{punch:`The Blade is the ancient cutting force of Metal.`,expand:`Sharp without announcement, cold without cruelty — it carries in a person the stillness of something that has already decided.`}},subtitle:`Evaluation runs before engagement begins · The Definition Impulse (Yang)`,chips:[`Evaluative`,`Uncompromising`,`Precision-first`,`Self-sufficient`,`Justice-oriented`],yourNature:{phrase:`The Imperial Executioner`,desc:`The most honest person in any room, often the most alone in it. Precision arrives before warmth does — people lean on the edge and rarely find what's behind it.`},gifts:[{phrase:`The Structural Read`,desc:`You don't choose to assess — the read finishes before you've decided to begin it.`},{phrase:`The Core Beneath the Edge`,desc:`What people experience as your edge is covering a depth of care that almost no one earns access to.`},{phrase:`The Held Position`,desc:`When everyone else has adjusted their position to manage the room, yours is unchanged — and people depend on that more than they say.`}],shadows:[{phrase:`The Finished Too Early`,desc:`You tend to call things complete before they've fully arrived — the clarity that recognizes finished things can misread what's still becoming.`},{phrase:`The Internal Standard`,desc:`The assessment you turn outward runs inward too — and it holds you to a standard that never fully declares you done.`},{phrase:`The Clarity Gap`,desc:`You often know something before the room is ready to hear it, and the distance between those two moments creates a loneliness that's hard to name.`}],blocks:[{label:`How you experience the world`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5,concentrated:5},text:{default:`You evaluate before you engage. The assessment starts when you enter a room — not as a decision you make but as a process that has already begun. You know what holds up and what doesn't before the conversation has fully started. Others feel this in your presence even when nothing has been said. This is not coldness. It's what it looks like when the first cognitive event is precision rather than warmth.`,concentrated:`You evaluate before you engage. The assessment starts the moment you walk into a room — not as a decision you make but as a process that has already begun before you've chosen to begin it. You know what's real and what isn't, what holds up and what doesn't, before the conversation has fully started. Others feel assessed in your presence even when nothing has been said and nothing was intended. This is not coldness. It's what it looks like when the first cognitive event is precision rather than warmth.`,open:`The evaluation is present, but it doesn't lead. You enter a room and something observes — notes what holds and what doesn't — but that observation doesn't arrive as a completed assessment before engagement has begun. The evaluative quality exists as an undercurrent rather than a first fact. What's different: you can be more present to what's actually in the room before the read closes. The precision functions; it just no longer runs ahead of everything else. The world arrives before the verdict does.`,tested:`The world evaluates back. That's the specific texture when authority energy is dominant: the precision runs as it always does, but now something is running a read on you at the same time. An institutional lens — an external standard — operates in parallel with your own. If the external standard is genuine, this sharpens rather than compresses: there's something real to measure against. If it isn't, you know before the conversation has properly started. What changes is that the assessment is no longer one-directional. You are inside a system that is also assessing you, and that fact is part of what you're evaluating.`,pure:`No dominant Ten God is shaping the deployment of this energy. The evaluative capacity runs as its essential self — not directed outward by a wealth configuration, not grounded by a dominant resource pull, not filtered through a relational or authority register. What arrives is precision without a predetermined channel. The world is a set of things to be assessed, and the question of what to do with those assessments is genuinely more open than it is for configurations where a dominant force has already specified the answer. This is not a weakness. It is the unconstrained form: the precision is free to find the target that actually deserves it, rather than the one a dominant configuration has already selected.`,rooted:`Resource energy supporting the Metal means the evaluation doesn't arrive alone — it arrives backed. Assessments form slower here and land harder once they do: the structural support that generates stability also generates weight. The world arrives not just as something to be cut but as something to be understood at depth, relative to what persists. There is a groundedness in how you encounter things — you don't need to immediately act on what you've assessed, and the holding capacity is real. Where this creates friction: the same structural weight that makes your verdicts reliable makes it harder to move toward things that aren't yet proven. You are well-positioned for durable work. You are less well-positioned for commitments that need to be made before confidence has fully formed.`}},{label:`What you're genuinely good at`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4},text:{default:`Cutting to what's actually true, quickly, without sentimentality — not because you don't care but because accuracy is a form of care for you. Building things that last because you genuinely cannot commit to building things that won't. Being the person whose feedback is the most difficult to hear and the most reliable in the room. The things you build tend to still be in use years later, because you could not have made them any other way.`,flowing:`When expression energy is dominant, the precision creates rather than just evaluates. What you're genuinely good at shifts toward generative output: producing work that carries that same standard into its execution rather than its assessment of others. The evaluative function is still running — now directed inward, at what's being made. The result is work of unusually high internal consistency: precise in execution, not just in judgment. The critique mechanism becomes craft. The edge finds what it was actually for.`}},{label:`Where you consistently get stuck`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:5,concentrated:5,open:3},text:{default:`The assessment has no warmth channel. The person who came needing to feel less alone gets a solution rather than presence — accurate, often useful, and not what was actually needed in that moment. The care was real. It arrived through the wrong door.

The verdict also becomes load-bearing: once formed, it requires new information to pass through the same evaluative system — which is very good at finding reasons why the new information doesn't change anything. You can hold a position longer than the evidence warrants.`,concentrated:`The assessment has no warmth channel. The person who came needing to feel less alone gets a solution rather than presence — accurate, often useful, and not what was actually needed in that moment. The care was real. It arrived through the wrong door.

The verdict also becomes load-bearing: once formed, it requires new information to pass through the same evaluative system that produced the original conclusion — a system that is very good at finding reasons why the new information doesn't change anything. You can hold a position longer than the evidence warrants, and some part of you knows it.`,open:`The stuck is different in kind. The assessment runs, but verdicts don't close with the same force — positions stay open longer than they should, and the evaluative capacity can circle a question without landing somewhere that holds. Not paralysis: more like a loop that doesn't quite lock. You arrive at something that seems true, find a reason to reconsider, then return to roughly the same place. The care is real; the precision is real. What's missing is the weight that makes the conclusion feel final.`,tested:`The stuck is specific: you know what's right, and the structure wants something else. Not wrong — differently calibrated, optimized for criteria your standard wasn't built around. The temptation is to push the assessment through anyway because it's accurate. The cost is structural: the framework grants standing, and standing determines what gets heard. What holds you back is the gap between maintaining the verdict and operating inside the system that lets you act on it. Most of the time you find a way to manage both. The times you can't are the ones that cost something.`,pure:`The pure configuration produces a specific stuck point: the precision is operational and accurate, but without a dominant directive force, the question of which valid conclusion to act on first doesn't have a built-in answer. Multiple assessments can coexist in equal standing — each accurate, none obviously prioritized. The decision machinery works. The orientational function, which would normally be supplied by a dominant wealth or authority configuration, has to be consciously constructed rather than structurally given. The stuck is subtle: you are not lacking clarity. You may be lacking the frame that tells you which clarity matters most right now.`,rooted:`The structural weight that makes your assessments reliable is the same force that makes revision expensive. A conclusion formed with strong resource backing doesn't revise easily — not because it can't be corrected, but because the same grounding that produced it resists being overturned by anything less than genuinely heavy counter-evidence. The stuck pattern: you identify that something may need to change, the internal evaluation runs, and it runs longer than the situation requires. By the time you've reached full confidence in the revision, the window for acting on it has sometimes closed. The other form: you hold a position past its usefulness not out of stubbornness but out of structural integrity. Same property; different cost.`}},{label:`What changes when conditions are right`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:3,concentrated:4},text:{default:`The classical principle: raw metal becomes an instrument — shaped for a specific purpose — through contact with fire. The capability was always real. What fire does is specify what the precision is actually for. Without a worthy target, the evaluative apparatus runs on whatever is available. With the right challenge, the precision stops searching and starts producing. The edge was already there. Fire reveals what it was for.`,forging:`When wealth energy is dominant, the directing force is already in place — the precision isn't searching for what to aim at, it has a material target. What shifts is the quality of the direction: conditions are right when the target is genuinely worthy, when the system, resource, or outcome being shaped actually requires the standard. The risk: the directing energy carries the evaluative apparatus on its own momentum, toward outcomes that are achievable but not worthy. The question that matters isn't whether there's a target. It's whether the target deserves the edge.`}},{label:`What you rarely admit`,bands:[`concentrated`,`balanced`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4,concentrated:5},text:{default:`That you're often less certain than you appear. The conviction is real. The completeness of the assessment is real. But underneath the settled verdict, there is sometimes a quieter question: whether what the precision is currently aimed at actually deserves it.`,concentrated:`That you're often less certain than you appear. The conviction is real. The completeness of the assessment is real. But underneath the settled verdict, there is sometimes a quieter question: whether what the precision is currently aimed at actually deserves it. That question rarely makes it to the surface. It tends to come up at 2 AM.`}},{label:`How you make decisions`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4,concentrated:4,open:3},text:{default:`Decisions arrive as conclusions. You don't deliberate the way some people do — you build a structural picture, the picture resolves, and the answer appears. What looks like confidence from the outside is usually just completion: the assessment ran, the result is there. What gets harder is the edge case: when the evidence doesn't fully resolve, when the variables conflict, when something that should be straightforward keeps remaining ambiguous.`,concentrated:`Decisions arrive as conclusions. You don't deliberate the way some people do — you build a structural picture, the picture resolves, and the answer appears. What looks like confidence from the outside is usually just completion: the assessment ran, the result is there. What gets harder is the edge case: when the evidence doesn't fully resolve, when the variables conflict, when something that should be straightforward keeps remaining ambiguous. That's when the evaluative system runs over the same ground twice, then again. You make fast decisions or you make slow, grinding ones. There isn't much in between.`,open:`The structural picture builds, but the resolution hangs. Ambiguity lasts longer; new information reopens what felt settled more easily than it should. This isn't indecision as a character flaw — the evaluative capacity is functioning, just without the finality the concentrated case produces. What helps: external anchors. A deadline. Someone whose judgment you trust. A situation where a decision has to be made and the moment arrives. The conclusion comes when something outside provides the close the internal process didn't.`,tested:`Under authority pressure, a second calculation runs alongside the first: what the institutional context will accept, not just what the assessment says is true. For a mind that produces conclusions, holding both simultaneously creates specific friction — the answer is there; the path to it runs through a framework that doesn't always reach the same place. The decisions that stall longest aren't the complex ones. They're the ones where the answer is clear and the institutional route isn't.`}},{label:`How you show up in relationships`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4,concentrated:4},text:{default:`You are more reliable than you are easy. The people who know you well understand that when you give your word, it holds — that your assessment of them is honest even when it's uncomfortable, that your care, once given, is structural and doesn't diminish. What's harder: the relationship that needs reassurance rather than accuracy, warmth rather than honesty, or presence rather than solutions. You deliver real things. Not always the thing that was needed in that specific moment.`,flowing:`When expression energy is dominant, there's more outward movement in the relational texture. The reliability is still there, but it arrives alongside something warmer — a tendency to contribute and express rather than assess and hold position. The precision lands differently: through what's made or shared rather than through direct judgment, which tends to create less friction on entry. The shadow shifts too: the output impulse can overproduce, or push expression in a direction the other person wasn't ready for. The care is more visible. The edge is softer at the start.`}},{label:`What you do with pressure`,bands:[`concentrated`,`balanced`],patterns:[`pure`,`rooted`,`tested`],priority:{default:3,concentrated:5,concentrated_pure:5},text:{default:`Pressure clarifies. When the environment provides sufficient resistance — a real problem, a worthy challenge, a situation where the precision has something real to cut against — you tend to focus more sharply. The evaluative capacity sharpens. This is the mechanism: fire reveals the edge.`,concentrated:`Pressure clarifies. When the environment provides sufficient resistance — a real problem, a worthy challenge, a situation where the precision has something real to cut against — you operate at a different level than ordinary conditions allow. The evaluative capacity sharpens. Focus narrows and deepens simultaneously. This is the mechanism: fire reveals the edge. Without adequate pressure, the precision can turn inward or run on low-stakes targets, producing the same intensity that would serve you under real challenge but creates unnecessary friction where none was required.`,tested:`When authority energy is dominant, pressure changes register. It is no longer generative challenge — it's structural friction that requires its own assessment before it can be used. The evaluative capacity is still running, but part of it is now occupied with the source of the pressure itself. Is this authority genuine? Does the standard behind it hold? Under real institutional standing, the precision sharpens — there's something worthy to cut against, and the edge has a target it can respect. Under authority that doesn't hold up, the same capacity turns resistant. The distinction between those two experiences is one you make quickly and rarely revise.`}},{label:`What holds you back without looking like it`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4,concentrated:5},text:{default:`You carry your verdicts. Not forever — but past the point where they serve you. A position formed under real evidence becomes the frame through which new evidence gets screened, and a system good at spotting confirmation becomes good at producing it. The thing that holds you back isn't doubt. It's certainty applied past its expiration.`,concentrated:`You carry your verdicts. Not forever — but past the point where they serve you. A position formed under real evidence becomes the frame through which new evidence gets screened, and a system very good at spotting confirmation becomes very good at producing it. This isn't stubbornness as a character flaw. It's structural: the same evaluative rigidity that makes your assessments reliable makes revising them costly. The thing that holds you back isn't doubt. It's certainty applied past its expiration.`,pure:`Without a dominant force specifying what the precision is for, the pure configuration can accumulate something that doesn't look like a problem from outside: technically active, producing accurate reads, operating well — but the precision isn't converging toward anything in particular. The evaluative function runs without a consistent target that builds on itself. This looks like productivity from the outside while something inside registers as drift. What holds you back is not visible failure but the absence of a compounding direction — each assessment accurate in isolation, none building systematically toward something beyond itself. The sharp edge. The unspecified purpose.`,rooted:`The resource backing that stabilizes you also delays you. The structural support makes commitment to unproven paths feel structurally premature — not fearful, just early. And because you are genuinely stable and functional in the current state, the cost of not moving is invisible until it isn't. Opportunities that require early commitment — relationships in their uncertain opening phase, career moves that need to be made before the destination is fully legible, positions that close if you don't act before confidence is established — arrive and pass without you registering them as losses in real time. What holds you back looks like patience from the outside. The recognition of what passed tends to arrive later, when solid is no longer the relevant question.`}},{label:`What activates the best version of this`,bands:[`concentrated`,`balanced`,`open`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:4,concentrated:4,tested:4,forging:4},text:{default:`Contact with something genuinely worthy of the precision. A problem hard enough that the evaluative apparatus has to operate at full range. Work where the quality actually matters and the standard is the point — not just accepted but necessary. The version of you that is most alive is the version that has found what the edge is for.`,concentrated:`Contact with something genuinely worthy of the precision. A problem hard enough that the evaluative apparatus has to operate at full range. A person capable of meeting the assessment directly without deflecting or collapsing under it. Work where the quality actually matters and the standard is the point — not just accepted but necessary. The version of you that is most alive is the version that has found what the edge is for. The question that recurs, quietly: is what I'm currently aimed at actually worthy of this?`,tested:`Recognition from something that actually has standing. Not flattery — an encounter with a structure or person that represents a real standard, one capable of assessing the precision and finding it accurate rather than merely efficient. The specific activation: a problem given by someone whose judgment is real, inside a framework where meeting it means something beyond performance. What turns on is the recognition that the standard being applied from outside and the standard running inside are, for once, pointing in the same direction. That alignment is rarer than it should be. When it arrives, the version of you that operates inside it is the clearest version.`,forging:`Material worthy of being shaped. Not just achievable or profitable — genuinely worthy: a system, resource, or situation where the precision has something real to define, improve, or build toward. The specific activation under forging energy: finding that the directing force and the internal standard are aimed at the same thing. When the material is real and the direction is worthy, the output carries a mark that persists. What to watch: the forging pattern can produce the feeling of activation — directed output, visible progress — without the material actually warranting the precision. That version is productive but hollow.`}},{label:`The image and the interior`,bands:[`concentrated`,`balanced`],patterns:[`pure`,`rooted`,`flowing`,`forging`,`tested`],priority:{default:3,concentrated:5,concentrated_pure:5},text:{default:`What the room sees: precision and an edge that doesn't easily bend. What is underneath: a softer interior than the presence suggests, running a question the assessment doesn't fully answer — whether the verdict holds, whether the standard is being aimed at the right things. The certainty is partly real and partly structural. Most people close to you eventually sense this.`,concentrated:`What the room sees: precision, certainty, an edge that doesn't bend. What is actually underneath: a much softer interior than anyone in the room would guess, running a question that the assessment never quite answers — whether what you've built is actually right, whether the verdict holds, whether the standard is being applied to the right things. The blade in the tongue is protecting something. The certainty is partly real and partly structural armor. You know this. Most people close to you eventually sense it. The gap between the version of you that the room experiences and the version that exists at 2 AM is larger than most people realize.`}}],lifeDomains:{career:{name:`The Precision Economy`,desc:`You build things that last because you literally cannot build them any other way. Environments that require genuine quality — where the standard is real and the stakes for getting it wrong are visible — are where you produce at your full range. The career challenge is finding work where the precision is the point, not a liability: where being the most rigorous person in the room is valued rather than experienced as difficult. You are most effective when you have a target worthy of the edge.`},relationships:{name:`The Honest Mirror`,desc:`You are more useful than you are easy. The people who receive your honest assessment when they needed it — the ones who weren't coddled but were told something true — often recognize, later, that your care was real even when it arrived through the wrong door. Relationships deepen when the other person can hold your directness without collapsing, and when you can develop warmth delivery alongside accuracy. The capacity for genuine closeness is there. The channel for it requires deliberate building.`},wealth:{name:`The Long Game`,desc:`You build toward quality, not toward speed. Financial patterns reward patience, structure, and the willingness to make clear decisions rather than keep options open — your natural mode, when not pressured into false urgency. The risk: the evaluative rigidity that protects long-term quality can also delay exits past optimal, hold positions past expiry, and mistake comfort with a previous assessment for genuine evidence. The wealth pattern is strong when the decisiveness is active; it stalls when the precision turns defensive.`},health:{name:`The Structural Body`,desc:`The body responds to the same patterns as the mind: precision-heavy, tends toward rigidity under sustained pressure, benefits from intentional softening. Chronic tension lives in the jaw, the shoulders, and the places the evaluation never rests. The health signal to watch: when the assessment is running on the body itself — when the standard that applies to everything else gets applied to how the body performs, looks, or functions. High standards are structural; they don't take days off. The counterbalance is movement that doesn't evaluate, rest that isn't optimized, warmth in the physical sense.`}},dominantEnergy:{label:`The Force`,teaser:`When Metal is the dominant force in your chart, precision isn't something you reach for — it's the default state. The assessment runs first. Everything else follows.`,characterDesc:`When Metal is dominant in your chart, precision is not just your nature — it is the atmosphere you operate in. Everything you encounter gets evaluated through a standard that doesn't bend to convenience. This is not a choice you made. The Metal dominant quality is structural: it was already running before preference had a chance to form.

The gift is reliability. When you assess something, the assessment is accurate. When you commit to something, the commitment holds. What you build carries the mark of this quality in ways that outlast the moment it was made.

The cost is also structural. The same quality that produces reliability produces friction: environments, relationships, and opportunities that can't hold the standard experience you as difficult before they experience you as valuable. The precision doesn't modulate for readiness. It arrives at full force.

The productive question is not "how do I soften this" — it's "what is this precision currently aimed at, and does that target actually deserve it?"`},energy:{keywords:[`Defining`,`Cutting`,`Structural clarity`,`Forced decision`,`Precision force`],what:`庚 is the blade, the axe, the harvest tool — the Yang Metal that cuts, defines, and restructures. Classically described as 金之阳 (the Yang of Metal), it is the energy of forced decision and structural clarity. The classical texts describe 庚 as the force that "cuts away what is complete to reveal what remains." Where Wood grows and Earth accumulates, Metal defines. It is the atmosphere of "what was vague becomes clear, often by force; what was finished gets cut away."`,represents:`Major restructuring in environments — organizational, governmental, relational. Forced decisions on matters that were being kept ambiguous. Endings of cycles that had been quietly completed but not yet formally closed. Competitive pressure increasing. The need for decisive action in career and personal matters. Contracts and agreements being written, enforced, or terminated.`,liunian:`When 庚 energy enters your luck cycle or annual pillar, the environment demands clarity and decision. Things that were vague get defined — by choice or by circumstance. Relationships and situations that were being kept in comfortable ambiguity get resolved, often sharply. Restructuring happens around you and possibly to you. This period rewards those who can act decisively and punishes those who avoid decisions past the deadline. For charts that benefit from Metal, this brings productive definition and momentum-clearing restructuring; for those already Metal-heavy, the excess can produce conflict, unnecessary cutting of things not yet finished, or a bluntness that damages what it was meant to sharpen.`},manual:{concentrated:`The evaluating and cutting force is relentless. Everything gets assessed; everything gets cut to shape. Highly productive for those who benefit
