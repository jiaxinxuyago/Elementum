<script type="text/babel" data-presets="env,react">
// =====================================================
// Elementum · Ink & Pigment — shared primitives
// Element signs, brush gestures, silk paper, ink scenes.
// (Adapted from screens/directionD.jsx for the reading pages.)
// =====================================================

const { useState, useMemo, useEffect, useRef } = React;

// ---------------- ElementSign — five iconic marks ----------------
function ElementSign({ element, size = 24, color, muted = false, style }) {
  const c = color || T.ink;
  const op = muted ? 0.32 : 1;
  const sw = size * 0.07;
  const s = size, cx = s/2, cy = s/2;
  const marks = {
    metal: <path d={`M ${cx - s*0.28} ${cy + s*0.05}
                    A ${s*0.32} ${s*0.32} 0 0 1 ${cx + s*0.28} ${cy + s*0.05}`}
            stroke={c} strokeWidth={sw} strokeLinecap="round" fill="none" opacity={op}/>,
    wood: <g stroke={c} strokeWidth={sw} strokeLinecap="round" fill="none" opacity={op}>
            <line x1={cx} y1={cy + s*0.3} x2={cx} y2={cy - s*0.3}/>
            <line x1={cx} y1={cy - s*0.05} x2={cx - s*0.22} y2={cy - s*0.25}/>
            <line x1={cx} y1={cy - s*0.05} x2={cx + s*0.22} y2={cy - s*0.25}/>
          </g>,
    water: <g stroke={c} strokeWidth={sw} strokeLinecap="round" fill="none" opacity={op}>
             <path d={`M ${cx - s*0.3} ${cy - s*0.08}
                      Q ${cx - s*0.1} ${cy - s*0.22}, ${cx} ${cy - s*0.08}
                      T ${cx + s*0.3} ${cy - s*0.08}`}/>
             <path d={`M ${cx - s*0.3} ${cy + s*0.14}
                      Q ${cx - s*0.1} ${cy + s*0.28}, ${cx} ${cy + s*0.14}
                      T ${cx + s*0.3} ${cy + s*0.14}`}/>
           </g>,
    fire: <path d={`M ${cx} ${cy - s*0.3}
                    L ${cx + s*0.26} ${cy + s*0.22}
                    L ${cx - s*0.26} ${cy + s*0.22} Z`}
            stroke={c} strokeWidth={sw} strokeLinejoin="round" fill="none" opacity={op}/>,
    earth: <rect x={cx - s*0.26} y={cy - s*0.22} width={s*0.52} height={s*0.44}
            stroke={c} strokeWidth={sw} strokeLinejoin="round" fill="none" opacity={op} rx={s*0.04}/>,
  };
  return (
    <svg viewBox={`0 0 ${s} ${s}`} width={size} height={size} style={{ display:'block', ...style }}>
      {marks[element]}
    </svg>
  );
}

// element pigment from key (no .Deep)
function pig(key) { return T[key]; }
function pigDeep(key) { return T[key + 'Deep']; }

// ---------------- Brush gestures ----------------
function BrushUnderline({ w = 100, color, opacity = 0.7 }) {
  const c = color || T.ink;
  const id = `uBleed-${w}-${Math.round(opacity*100)}`;
  return (
    <svg viewBox="0 0 120 10" width={w} height={10} style={{ display:'block' }}>
      <defs>
        <filter id={id}>
          <feTurbulence baseFrequency="1.1" numOctaves="2" seed="5"/>
          <feDisplacementMap in="SourceGraphic" scale="1.2"/>
        </filter>
      </defs>
      <path d="M 4 5 Q 30 2.8 60 5.2 Q 90 7 116 4.8"
        stroke={c} strokeWidth="2.2" strokeLinecap="round" fill="none"
        opacity={opacity} filter={`url(#${id})`}/>
      <path d="M 14 7.2 Q 50 6, 80 7, 104 6.5"
        stroke={c} strokeWidth="0.9" strokeLinecap="round" fill="none"
        opacity={opacity * 0.35}/>
    </svg>
  );
}

// ink-bled corner splotch
function CornerInk({ size = 64, color, opacity = 0.08, position = 'tl' }) {
  const c = color || T.ink;
  const transforms = {
    tl: '', tr: 'scale(-1,1) translate(-64,0)',
    bl: 'scale(1,-1) translate(0,-64)', br: 'scale(-1,-1) translate(-64,-64)',
  };
  const fid = `cBleed-${position}-${Math.round(opacity*100)}`;
  return (
    <svg viewBox="0 0 64 64" width={size} height={size}
      style={{ position: 'absolute', pointerEvents: 'none',
        ...(position === 'tl' ? { top: -8, left: -8 } :
            position === 'tr' ? { top: -8, right: -8 } :
            position === 'bl' ? { bottom: -8, left: -8 } :
                                { bottom: -8, right: -8 }) }}>
      <defs>
        <filter id={fid}>
          <feTurbulence baseFrequency="0.9" numOctaves="2" seed="11"/>
          <feDisplacementMap in="SourceGraphic" scale="2"/>
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
      </defs>
      <g transform={transforms[position]} filter={`url(#${fid})`} opacity={opacity}>
        <path d="M 0 0 Q 28 6 40 24 Q 44 36 30 40 Q 18 34 10 22 Q 4 14 0 8 Z" fill={c}/>
      </g>
    </svg>
  );
}

function SealDot({ size = 10, color, style }) {
  const c = color || T.seal;
  return (
    <svg viewBox="0 0 10 10" width={size} height={size} style={{ display:'block', ...style }}>
      <defs>
        <filter id="sealBleed">
          <feTurbulence baseFrequency="1.3" numOctaves="2" seed="2"/>
          <feDisplacementMap in="SourceGraphic" scale="0.8"/>
        </filter>
      </defs>
      <circle cx="5" cy="5" r="4.2" fill={c} filter="url(#sealBleed)" opacity="0.92"/>
    </svg>
  );
}

// ---------------- Silk paper background ----------------
function SilkPaper({ seed = 3, w = 390, h = 844 }) {
  const sid = `Dsilk-${seed}`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid slice"
      style={{ position:'absolute', inset:0, width:'100%', height:'100%',
        pointerEvents:'none', zIndex:0 }}>
      <defs>
        <linearGradient id={sid} x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%"   stopColor="#F4ECD9"/>
          <stop offset="55%"  stopColor="#EFE5CC"/>
          <stop offset="100%" stopColor="#E8DCBD"/>
        </linearGradient>
        <radialGradient id={`${sid}M1`} cx="0.2" cy="0.15" r="0.55">
          <stop offset="0%" stopColor="#F8F1DD" stopOpacity="0.75"/>
          <stop offset="100%" stopColor="#F8F1DD" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={`${sid}M2`} cx="0.82" cy="0.78" r="0.4">
          <stop offset="0%" stopColor="#DAC9A0" stopOpacity="0.35"/>
          <stop offset="100%" stopColor="#DAC9A0" stopOpacity="0"/>
        </radialGradient>
        <filter id={`${sid}G`}>
          <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" seed={seed}/>
          <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.48  0 0 0 0 0.35  0 0 0 0.06 0"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
      <rect width={w} height={h} fill={`url(#${sid})`}/>
      <rect width={w} height={h} fill={`url(#${sid}M1)`}/>
      <rect width={w} height={h} fill={`url(#${sid}M2)`}/>
      <rect width={w} height={h} filter={`url(#${sid}G)`} opacity="0.3"/>
    </svg>
  );
}

// ---------------- Ink images (multiplied onto silk) ----------------
function InkImage({ src, opacity = 0.5, style }) {
  return (
    <img src={src} alt="" style={{
      position: 'absolute', pointerEvents: 'none',
      objectFit: 'cover', opacity, mixBlendMode: 'multiply',
      ...style,
    }}/>
  );
}

// ---------------- Hero stem mark — BladeJian for 庚 ----------------
function BrushJian({ w = 180, h = 260, opacity = 1 }) {
  return (
    <svg viewBox="0 0 180 260" width={w} height={h} style={{ display:'block', opacity }}>
      <defs>
        <filter id="DjianBleed2">
          <feTurbulence baseFrequency="0.6" numOctaves="2" seed="4"/>
          <feDisplacementMap in="SourceGraphic" scale="2"/>
        </filter>
        <linearGradient id="DjianInk2" x1="0.5" x2="0.5" y1="0" y2="1">
          <stop offset="0%"  stopColor={T.ink} stopOpacity="0"/>
          <stop offset="10%" stopColor={T.ink} stopOpacity="0.6"/>
          <stop offset="45%" stopColor={T.ink} stopOpacity="0.88"/>
          <stop offset="85%" stopColor={T.ink} stopOpacity="0.82"/>
          <stop offset="100%" stopColor={T.ink} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <g filter="url(#DjianBleed2)">
        <path d="M88 8 Q 89 100 91 200 L94 216 L86 216 Q 88 100 88 8 Z" fill="url(#DjianInk2)"/>
        <path d="M68 214 Q 90 208 112 214 L115 224 Q 90 228 65 224 Z" fill={T.ink}/>
        <rect x="83" y="224" width="14" height="34" rx="2.5" fill={T.inkSoft}/>
        <circle cx="90" cy="262" r="5" fill={T.ink}/>
      </g>
    </svg>
  );
}

// ---------------- Soft paper card ----------------
const cardStyle = (extra = {}) => ({
  background: 'rgba(248, 241, 225, 0.92)',
  border: `1px solid ${T.paperHair}`,
  borderRadius: 22,
  ...extra
});

// ---------------- Status bar (dark on silk) ----------------
function StatusBarSilk({ tint }) {

// ---------------- Eyebrow / section label (DES_04 §3 standard) ----------------
function Eyebrow({ children, color, style, mb = 14 }) {
  return (
    <div style={{
      fontFamily: "'EB Garamond', serif",
      fontSize: 10, letterSpacing: 2.5, textTransform: 'uppercase',
      color: color || T.inkLight, marginBottom: mb,
      fontWeight: 500, ...style,
    }}>{children}</div>
  );
}

// ---------------- Bottom tab nav (5 tabs, DES_04 §11) ----------------
function NavGlyph({ name, size = 22, color, active }) {
  const c = color || (active ? T.ink : T.inkLight);
  const sw = 1.6;
  const ic = {
    today: <circle cx="11" cy="11" r="3.2" fill={c}/>,
    map:   <g stroke={c} strokeWidth={sw} fill="none">
             <circle cx="11" cy="11" r="3"/>
             <circle cx="11" cy="11" r="6.5"/>
             <circle cx="11" cy="11" r="9.5" opacity="0.4"/>
           </g>,
    guide: <g stroke={c} strokeWidth={sw} fill="none" strokeLinecap="round">
             <path d="M11 3 L11 19"/>
             <path d="M5 11 L17 11"/>
             <path d="M11 3 L7 9 L15 9 Z" fill={c}/>
           </g>,
    friends: <g stroke={c} strokeWidth={sw} fill="none">
               <circle cx="8" cy="9" r="3"/>
               <circle cx="14" cy="9" r="3"/>
             </g>,
    profile: <rect x="3.5" y="3.5" width="15" height="15" rx="3" stroke={c} strokeWidth={sw} fill="none"/>,
  };
  return (
    <svg viewBox="0 0 22 22" width={size} height={size} style={{ display:'block' }}>
      {ic[name]}
    </svg>
  );
}

function TabBar({ active = 'map', dmEl = 'metal' }) {
  const items = [
    { id: 'today',   label: 'Today',   ic: 'today' },
    { id: 'map',     label: 'Map',     ic: 'map' },
    { id: 'guide',   label: 'Guidance',ic: 'guide' },
    { id: 'friends', label: 'Friends', ic: 'friends' },
    { id: 'profile', label: 'Profile', ic: 'profile' },
  ];
  const activeColor = pig(dmEl);
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, height: 76,
      background: 'rgba(241,233,214,0.96)',
      backdropFilter: 'blur(8px)',
      borderTop: `1px solid ${T.paperHair}`,
      padding: '8px 8px 18px',
      display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)',
      alignItems: 'flex-start', zIndex: 20,
    }}>
      {items.map(it => {
        const isActive = it.id === active;
        const c = isActive ? activeColor : T.inkLight;
        return (
          <div key={it.id} style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
            paddingTop: 6,
          }}>
            <NavGlyph name={it.ic} size={20} color={c}/>
            <div style={{
              fontFamily: "'EB Garamond', serif", fontSize: 9.5,
              letterSpacing: 1.5, textTransform: 'uppercase',
              color: c, fontWeight: isActive ? 600 : 500,
            }}>{it.label}</div>
            {isActive && (
              <div style={{ marginTop: 1 }}>
                <BrushUnderline w={20} color={activeColor} opacity={0.7}/>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---------------- Buttons (consistent with onboarding/Reveal CTAs) ----------------
function PrimaryCTA({ children, full = true, style }) {

    <button style={{
      width: full ? '100%' : 'auto',

      textTransform: 'uppercase', cursor: 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      ...style,
    }}>{children}</button>

}

function GhostCTA({ children, full = true, color, style }) {

  return (

      background: 'transparent', color: c,

      textTransform: 'uppercase', cursor: 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      ...style,
    }}>{children}</button>

}

function PillTab({ label, active, color }) {
  const ac = color || T.ink;
  return (
    <div style={{
      flexShrink: 0, padding: '7px 14px', borderRadius: 999,
      background: active ? ac : 'transparent',
      border: active ? 'none' : `1px solid ${T.paperHair}`,
      color: active ? T.silk : T.inkSoft,
      fontFamily: "'EB Garamond', serif", fontSize: 10.5,
      letterSpacing: 2, textTransform: 'uppercase',
      fontWeight: active ? 600 : 500, cursor: 'pointer',
    }}>{label}</div>
  );
}

// ---------------- Identity Ribbon (Reveal §2 + Energy Map §11) ----------------
function IdentityRibbon({ ref = REF, compact = false }) {
  const c = pig(ref.element);
  return (
    <div>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 12,
