y you hold on to least.","pattern":"What you make turns into money more easily for you than for most, and the work that feels like play is the work that pays you best. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Steward at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Money at home was counted and spent with care, and you learned what things cost before most children do. By your teens you were already saving what your friends spent."},{"kind":"gap","label":"Rising Chapter · 16 to now · no Wealth seat.","text":"Since sixteen you have put work, study and friends before money, and your income has followed your decades more than any plan of your own."},{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2030 · coming","text":"From your mid-thirties your income starts to rise through the life you share with a partner, through a joint venture, a move or an opening from their side. You will earn more in these years than in all the years before, and you see the part with no clear owner slip away."},{"kind":"seat","name":"The Steward at the Hour Gate","meta":"Late Chapter · from 48 · 2043 · in plain view · coming","text":"The slow years of saving start paying you back in your late forties, and money stops being something you check every week. You spend on the people you love without a second look at the budget, because the budget has held for decades."},{"kind":"seat","name":"The Rival inside the Hour Gate","meta":"Late Chapter · from 48 · 2043 · coming","text":"From your late forties your money turns into common ground, pooled with friends and split among the people after you. You divide it fairly enough that nobody needs to keep score."}],"notes":[],"byDecade":[{"label":"A Steward decade · 2043 to 2052","text":"You turn steady work into something you own, a home or savings or a share in something lasting. You keep more of what you earn than in any decade before."},{"label":"A Horizon decade · 2053 to 2062","text":"Money comes through openings, an offer or a sale or a well-timed move, more than through regular pay. You take more chances with it than you are used to, and most of them pay."}],"byYear":[{"label":"2031 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."}]},{"domain":"Family","headline":"Fed well as a child, you now feed everyone else.","intro":"Four seats rule Family in your chart. Two sit in your Early Chapter and two in your Late Chapter.","lit":["zhengcai_year_stem","shishen_year_branch","zhengcai_hour_stem","jiecai_hour_branch"],"heavy":true,"pips":["wood","water","wood","metal"],"hubLine":"Fed well as a child, you now feed everyone else.","how":"You hold your family together through comfort, the visit kept and the favour done and the table set. Because care reached you first as warmth, you give it back the same way, and you feel useless in a family crisis that kindness cannot touch. What you want from your family is ease, and you work hard to make it.","pattern":"","blocks":[{"kind":"seat","name":"The Steward at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Someone in your first home kept the household running on plans and a careful budget, and you watched closely. By your teens you were the child trusted with the money, the keys or the younger ones."},{"kind":"seat","name":"The Artisan inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"In your first home an older relative made comfort a daily thing, giving food and warmth before anyone thought to ask. You still judge a home by how it feels to walk into, a measure those first years set in you for good."},{"kind":"seat","name":"The Steward at the Hour Gate","meta":"Late Chapter · from 48 · 2043 · in plain view · coming","text":"From your late forties your family leans on what you have saved, and you give it calmly. You become the relative everyone trusts with arrangements, saying in words at last some of what your money already says."},{"kind":"seat","name":"The Rival inside the Hour Gate","meta":"Late Chapter · from 48 · 2043 · coming","text":"From your late forties the people after you compete for your attention, and each of them is sure their claim comes first. You enjoy those years most while your own keys stay in your pocket, because they run warmer and riskier than most people's."}],"notes":[],"byDecade":[{"label":"A Magistrate decade · 2023 to 2032 · now","text":"A proper place in the family comes to you, as the reliable one with a role and a duty. You earn a standing among your relatives that holds for years to come."},{"label":"A Steward decade · 2043 to 2052","text":"Family life settles around the order you keep, with a home that runs well and bills paid on time. You become the steady one relatives rely on and take quiet pride in it."},{"label":"A Horizon decade · 2053 to 2062","text":"Your family widens through new relatives, friends who become kin and a door kept open to visitors. You spend more on the people around you than you used to and mind it less than you thought."}],"byYear":[{"label":"2027 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."},{"label":"2029 · a Sage year","text":"Your home draws a relative's closer interest this year, with help and opinions that leave you more looked after than you asked to be."},{"label":"2030 · a Twin year","text":"With siblings and cousins weighing in, you settle family matters this year between equals of your own age."},{"label":"2032 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."}]},{"domain":"Career","headline":"Your work pays for what only you know.","intro":"Two seats rule Career in your chart. Both sit in your Rising Chapter.","lit":["bijian_month_stem","pianyin_month_branch"],"heavy":false,"pips":["metal","earth"],"hubLine":"Your work pays for what only you know.","how":"You are the specialist people call when the usual answers fail. Because you trust knowledge you have dug out yourself, you are drawn to a narrow field the mainstream ignores, and you would rather be paid for strange work than praised for ordinary work. You earn more from the niche you choose than any ladder would pay you.","pattern":"You also rise by making more rather than by climbing, as each piece of work you finish brings the next one to your door. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Twin at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Since your late teens you have been the one handed the job nobody else would finish alone. Your moves between teams and roles have come each time someone else took the credit for your work."},{"kind":"seat","name":"The Alchemist inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Your working life so far has run underground, in jobs that looked quiet while you were building a skill nobody asked for. You have won roles over people with better connections on the strength of something strange you knew."}],"notes":["Your later gates hold no Career seat, so your decades set its course from here."],"byDecade":[{"label":"An Alchemist decade · 2013 to 2022","text":"Study and odd side paths pulled you away from steady work. You learned a great deal that did not pay at the time and got through on the one skill people kept asking you for."},{"label":"A Magistrate decade · 2023 to 2032 · now","text":"Your work gains structure, a clear role with real responsibility. You are trusted with more than before, and the trust outlasts the work that earned it."},{"label":"A General decade · 2033 to 2042","text":"You take on hard assignments and real pressure, and you rise because of them. You come out with more authority than you went in with."},{"label":"A Steward decade · 2043 to 2052","text":"Your work pays properly, steadily and in proportion to what you put in. You chase the next thing less and build on what you already do well."},{"label":"A Virtuoso decade · 2063 to 2072","text":"Original work brings you recognition, and your voice carries further than before. You win people over by saying what others will not and build a name on your own terms."}],"byYear":[{"label":"2026 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2027 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."},{"label":"2028 · an Alchemist year","text":"This year you learn more out of sight than you earn in plain view, with your work turned toward study and specialist skill."},{"label":"2031 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."},{"label":"2032 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."}]},{"domain":"Social","headline":"Your friends are your equals, or they drift.","intro":"Two seats rule Social in your chart. One sits in your Rising Chapter and one in your Home Chapter.","lit":["bijian_month_stem","piancai_day_branch"],"heavy":false,"pips":["metal","wood"],"hubLine":"Your friends are your equals, or they drift.","how":"You choose friends who match you, people who carry their own weight and expect you to carry yours. Because you measure everyone against your own standard, you drift from anyone who leans on you, and you rarely say why. You keep a small circle, and you keep it for years.","pattern":"","blocks":[{"kind":"seat","name":"The Twin at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Since your late teens your closest friends have been people at your own stage, classmates and colleagues who grew up beside you like siblings. You have learned among them to settle your own trouble first and to mention it once it is solved."},{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2030 · coming","text":"Your circle widens from your mid-thirties through a partner's world, through their friends and their family and their work. In your forties you know more people through a partner's side than through your own."}],"notes":[],"byDecade":[{"label":"A Magistrate decade · 2023 to 2032 · now","text":"You hold standing among friends, and people ask your opinion before they decide. You become the steady one they count on, a role you take seriously."},{"label":"A Horizon decade · 2053 to 2062","text":"New places and new groups keep bringing people into your life, and each one leads to more. You will make friends faster than you can introduce them to each other."},{"label":"A Virtuoso decade · 2063 to 2072","text":"You become more outspoken, and the people who enjoy a sharp voice seek you out. You gather an audience of your own and lose patience with company that asks you to be quieter."}],"byYear":[{"label":"2027 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."},{"label":"2030 · a Twin year","text":"Among friends this year, you spend more time with peers who do what you do than with anyone who looks up to you."},{"label":"2031 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."}]},{"domain":"Health","headline":"Your body trusts food and rest to put it right.","intro":"One seat rules Health in your chart. It sits in your Early Chapter.","lit":["shishen_year_branch"],"heavy":false,"pips":["water"],"hubLine":"Your body trusts food and rest to put it right.","how":"You trust your body to fix itself with a good meal and a long sleep, and for most of your life it has. Because comfort is how you recover, you reach for it under stress, and you turn the extra helping or the lost weekend into a habit before you notice. Your body asks you for rhythm more than for effort.","pattern":"","blocks":[{"kind":"seat","name":"The Artisan inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"You were a child who recovered quickly, from colds and falls and bad days alike. Your appetite and your sleep were steady, and you came into adulthood with more reserve than most of the people around you."}],"notes":["Your later gates hold no Health seat, so your decades set its course from here."],"byDecade":[{"label":"A General decade · 2033 to 2042","text":"You carry more pressure, and for once it suits your body. You will be fitter and sharper in demanding years than in easy ones, as long as you keep sleeping."}],"byYear":[{"label":"2026 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."},{"label":"2029 · a Sage year","text":"This year you accept more looking after than you normally allow, leaning on shelter, quiet evenings and someone else's care."},{"label":"2032 · an Artisan year","text":"Your body follows the pace you set this year, with meals, sleep and easy pleasures filling more of your days."}]},{"domain":"Love","headline":"You fall for people who widen your life.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["piancai_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"You fall for people who widen your life.","how":"In love you fall for the one with plans and friends and somewhere to be. Because range is what draws you, you lose interest within months in a partner who only offers closeness. What you want is someone who brings the world home, and anyone who shuts it out leaves you restless.","pattern":"","blocks":[{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2030 · coming","text":"From your mid-thirties love and money start to move together. You choose a partner in these years who brings an opening into your life, and the bond holds for as long as the two of you keep heading somewhere new."}],"notes":["Love has no decade of its own. It is read from your Day Gate alone."],"byDecade":[],"byYear":[]},{"domain":"Mind","headline":"Your mind runs best on what others find strange.","intro":"One seat rules Mind in your chart. It sits in your Rising Chapter.","lit":["pianyin_month_branch"],"heavy":false,"pips":["earth"],"hubLine":"Your mind runs best on what others find strange.","how":"You think best alone, on problems other people have given up on or never noticed. Because you trust only the conclusions you reached alone, you rework a problem long after others have moved on, and you find small talk harder than hard questions. You keep most of what you know to yourself, and it is the thing that matters most.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"From your late teens your mind went its own way, into a subject or a method most people around you did not follow. You have spent more nights with a question than with company, and the result is a corner of knowledge almost nobody else holds."}],"notes":["Your later gates hold no Mind seat, so your decades set its course from here."],"byDecade":[{"label":"An Alchemist decade · 2013 to 2022","text":"You turned inward, into subjects nobody near you could follow, and work you owed others waited. Out of step with the people close to you, you were carried by one private piece of work you still count among your best."},{"label":"A Virtuoso decade · 2063 to 2072","text":"You turn your thinking outward, and you say in public what you used to keep to yourself. You are quicker and bolder with ideas than at any time before."}],"byYear":[{"label":"2028 · an Alchemist year","text":"You study alone this year, pulled toward odd, specialist subjects nobody nearby would think to ask about."},{"label":"2029 · a Sage year","text":"You learn most this year when someone else sets the syllabus, with books, courses and a patient teacher filling your evenings."}]},{"domain":"Growth","headline":"You grow late, and mostly in private.","intro":"One seat rules Growth in your chart. It sits in your Rising Chapter.","lit":["pianyin_month_branch"],"heavy":false,"pips":["earth"],"hubLine":"You grow late, and mostly in private.","how":"You grow in long quiet stretches that look like standing still, and then you change all at once. Because you change on the inside first, the people around you underrate where you are, and you let them. You are further along than anyone watching would guess.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Since your late teens your growth has looked slow from the outside, years spent studying or testing or changing direction while friends settled. Most of what you can do now, you taught yourself in those years."}],"notes":["Your later gates hold no Growth seat, so your decades set its course from here."],"byDecade":[{"label":"An Alchemist decade · 2013 to 2022","text":"You grew by going your own way, away from what was expected of you. The progress stayed nearly invisible, but you kept faith in a private conviction while you felt behind."},{"label":"A General decade · 2033 to 2042","text":"You grow fastest through pressure, a hard role or a challenge you choose on purpose. You will come out stronger in the places that used to hold you back."}],"byYear":[{"label":"2026 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."},{"label":"2028 · an Alchemist year","text":"Out of public view, you grow more yourself this year through solitary study and interests nobody assigned you."},{"label":"2030 · a Twin year","text":"This year you see your own shape by working alongside equals, leaning less on anyone's approval and more on your own judgement."}]}],"blueprint":{"title":"A Steward structure · 正财格","structure":{"reading":{"label":"","text":"Your chart is built around money kept and value earned. You do best when the work in front of you has a clear return, and you trust a slow sure gain over a fast one.","draft":false},"rule":{"label":"","text":"The Wood held midway down your strongest seat shows on two of your stems. That gives the Steward the lead in your life, and you answer to it more than to the Alchemist who holds the seat.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"A pull on what you earn sits in your chart beside the lock that already holds it shut. What you have built stays put, whoever comes asking for it.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Wood and Earth carry two thirds of your chart, and you live mostly through what you earn and what you think.","draft":false},"missing":[{"label":"no Magistrate · your season asks for it too · it comes with your decade now, 2023 to 2032","text":"You look to others to learn what the rules are. You borrow structure from a boss or a contract, and you work best once someone else has fixed the terms.","draft":false},{"label":"no Sage · your Sage decade 2003 to 2012 is lived","text":"Without a Sage you learned early to reassure yourself and to praise your own effort. You trust help more when you did not have to ask for it.","draft":false}],"seasonName":"三月庚","season":{"label":"","text":"You were born in late spring, when Earth runs the season and buries Metal more than it feeds it. Your season asks first for Wood to break that Earth open and then for Fire to temper you, and you come into your own when both are within reach.","draft":false},"needs":[{"label":"first need · 甲, the Horizon · inside a branch, not on show","text":"You hold the Horizon at the heart of a branch, where its element slips in by a side door and gives a lean season something to work on.","draft":false}]},"seen":{"plain":[{"label":"the Steward, twice","text":"You come across as a careful provider, the one who pays on time and keeps count.","draft":false},{"label":"the Twin","text":"You come across as someone who carries their own weight and asks for little help.","draft":false}],"inside":[{"label":"the Artisan","text":"You want comfort more than you show, good food and an evening with nothing planned.","draft":false},{"label":"the Alchemist","text":"You think in strange directions and keep most of those thoughts to yourself.","draft":false},{"label":"the Horizon","text":"You keep a second plan that nobody has heard about and want more open roads than you admit.","draft":false},{"label":"the Rival","text":"You keep score with the people closest to you, and you want to win more than you let on.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[{"label":"The maker’s economy · 食伤生财","text":"What you make sells without much pushing, and the best pay comes from projects you would have done for nothing.","draft":false}],"bonds":[{"label":"Day binds with Year · 寅亥合","text":"You build your own home close to the habits of the one you grew up in, and you return to them more than you expected.","draft":false},{"label":"Hour binds with Month · 辰酉合","text":"Your later life will hold on to the people and crafts of your rising years, with that working circle staying beside you.","draft":false}],"noneHard":{"label":"","text":"You move from one chapter of your life to the next without a sharp break, because no clash, punishment or harm sits between your gates.","draft":false}}}},"youngHourLead":{"why":"R9: How you are from a seat the reader has not reached","birth":{"year":1997,"month":10,"day":26,"hour":20,"location":"Beijing","gender":"female"},"hu":false,"age":29,"strength":"extremely_strong","dayStem":"辛","pillars":[{"g":"year","stem":"丁","branch":"丑"},{"g":"month","stem":"庚","branch":"戌"},{"g":"day","stem":"辛","branch":"丑"},{"g":"hour","stem":"戊","branch":"戌"}],"positions":[{"id":"qisha_year_stem","gate":"year","el":"fire","kind":"stem","term":"The General at the Year Gate"},{"id":"pianyin_year_branch","gate":"year","el":"earth","kind":"branch","term":"The Alchemist inside the Year Gate"},{"id":"jiecai_month_stem","gate":"month","el":"metal","kind":"stem","term":"The Rival at the Month Gate"},{"id":"zhengyin_month_branch","gate":"month","el":"earth","kind":"branch","term":"The Sage inside the Month Gate"},{"id":"pianyin_day_branch","gate":"day","el":"earth","kind":"branch","term":"The Alchemist inside the Day Gate"},{"id":"zhengyin_hour_stem","gate":"hour","el":"earth","kind":"stem","term":"The Sage at the Hour Gate"},{"id":"zhengyin_hour_branch","gate":"hour","el":"earth","kind":"branch","term":"The Sage inside the Hour Gate"}],"seek":["fire","wood","water"],"ease":["metal","earth"],"domains":[{"domain":"Mind","headline":"You learn steadily, and the learning holds.","intro":"Five seats rule Mind in your chart. One sits in your Early Chapter, one in your Rising Chapter, one in your Home Chapter and two in your Late Chapter.","lit":["pianyin_year_branch","zhengyin_month_branch","pianyin_day_branch","zhengyin_hour_stem","zhengyin_hour_branch"],"heavy":true,"pips":["earth","earth","earth","earth","earth"],"hubLine":"You learn steadily, and the learning holds.","how":"Week by week you add to what you know, studying in a steady and patient way. Because understanding a thing fully is what makes you feel secure, you read the extra chapter and take the extra course, and you speak on a subject only once you are sure of it. You know far more than you claim to.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Whatever you were given to read when you were small, you read past it into subjects nobody around you shared. By your teens you knew more about a few odd things than most adults did, mentioning it only to the one or two people who asked."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Learning has carried you since your late teens, through courses and qualifications and the teachers who took an interest. You have stayed a student in some form ever since, and it has kept you steadier than most people around you."},{"kind":"seat","name":"The Alchemist inside the Day Gate","meta":"Home Chapter · from 35 · 2032 · coming","text":"From your mid-thirties your thinking deepens and turns toward a single subject you have circled for years. You share more of the work in progress with a partner in these years, and the work gets better for it."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2045 · in plain view · coming","text":"Past your late forties the people after you bring you their questions, and you take care to teach them properly. You are quoted and asked for more than ever, and most yourself when someone leaves understanding more than they came with."},{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2045 · coming","text":"From your late forties reading fills more of your days, and you remember more of it than you did in your busiest years. You take up study for its own sake, a course or a long book read slowly, with your judgement growing calmer and surer alongside it."}],"notes":[],"byDecade":[{"label":"A Virtuoso decade · 2011 to 2020","text":"Ideas came fast, and you spoke them aloud with confidence. Quicker than most people in the conversation, you enjoyed proving it in argument."},{"label":"A Sage decade · 2071 to 2080","text":"Caution settles over your thinking, and you read about things far more than you try them. You trust your own ideas again once teaching puts them to work in someone else."}],"byYear":[{"label":"2028 · a Sage year","text":"You learn most this year when someone else sets the syllabus, with books, courses and a patient teacher filling your evenings."},{"label":"2029 · an Alchemist year","text":"You study alone this year, pulled toward odd, specialist subjects nobody nearby would think to ask about."}]},{"domain":"Career","headline":"Your career rises on what you have studied.","intro":"Three seats rule Career in your chart. One sits in your Early Chapter and two in your Rising Chapter.","lit":["qisha_year_stem","jiecai_month_stem","zhengyin_month_branch"],"heavy":true,"pips":["fire","metal","earth"],"hubLine":"Your career rises on what you have studied.","how":"You are trusted at work because you know your subject properly, and people check their facts with you. Because depth matters more to you than visibility, you leave the self-promotion to others, and promotion reaches you later than your knowledge has earned it. Your standing grows slowly and holds when louder careers fall away.","pattern":"","blocks":[{"kind":"seat","name":"The General at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Pressure beyond your age reached you in your first years, a job at home or a team to lead or younger children to mind. The weight felt heavy at the time, but you came out of it tougher than most of your friends."},{"kind":"seat","name":"The Rival at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Since your late teens the colleagues you raced hardest have also been the ones you teamed up with on joint bids and shared clients. You have learned from the bids that soured over a vague split to agree who gets what before any work starts."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Your progress at work since your late teens has come through what you studied, with each qualification carrying you a step further. You have proved right every mentor who put your name forward before you felt ready."}],"notes":["Your later gates hold no Career seat, so your decades set its course from here."],"byDecade":[{"label":"A Virtuoso decade · 2011 to 2020","text":"Talent made your name, through work that broke with how things had always been done. You stood out for being different, and the people who chose you wanted exactly that."},{"label":"An Artisan decade · 2021 to 2030 · now","text":"A craft you enjoy is what pays, and people come back for what you make. You do your finest work at an easy pace, with pleasure in the making."},{"label":"A Steward decade · 2031 to 2040","text":"Your work pays properly, steadily and in proportion to what you put in. You chase the next thing less and build on what you already do well."},{"label":"A Magistrate decade · 2051 to 2060","text":"Your work gains structure, a clear role with real responsibility. You are trusted with more than before, and the trust outlasts the work that earned it."},{"label":"A General decade · 2061 to 2070","text":"You take on hard assignments and real pressure, and you rise because of them. You come out with more authority than you went in with."}],"byYear":[{"label":"2026 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."},{"label":"2027 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2029 · an Alchemist year","text":"This year you learn more out of sight than you earn in plain view, with your work turned toward study and specialist skill."},{"label":"2030 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."}]},{"domain":"Family","headline":"You love your family in an unusual way.","intro":"Three seats rule Family in your chart. One sits in your Early Chapter and two in your Late Chapter.","lit":["pianyin_year_branch","zhengyin_hour_stem","zhengyin_hour_branch"],"heavy":false,"pips":["earth","earth","earth"],"hubLine":"You love your family in an unusual way.","how":"You show love to your family through ideas and help with problems more than through surface warmth. Because the care you got early was quiet and odd, you trust a relative who understands you over one who fusses, and you feel lonely at noisy gatherings. You come home as the quiet one, a part your relatives have long stopped trying to change.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Instead of the usual fuss you got books, questions and long silences from an adult in your first home who lived in their own head. What you took from it was the habit of answering your own odd questions before you thought to ask anyone else."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2045 · in plain view · coming","text":"From your late forties the people after you look to you for guidance, and for cover when things fall apart. You give both with patience in these years, watching what you taught them carry on in their own lives."},{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2045 · coming","text":"The people after you gather around you from your late forties as a home base, the place they come back to for advice and support. You become the calm centre of a close family, taking their help as easily as they take yours."}],"notes":[],"byDecade":[{"label":"An Artisan decade · 2021 to 2030 · now","text":"Your household softens around shared meals and slow weekends. You make the home a place of comfort where relatives drop by because it feels good to be there."},{"label":"A Steward decade · 2031 to 2040","text":"Family life settles around the order you keep, with a home that runs well and bills paid on time. You become the steady one relatives rely on and take quiet pride in it."},{"label":"A Horizon decade · 2041 to 2050","text":"Your family widens through new relatives, friends who become kin and a door kept open to visitors. You spend more on the people around you than you used to and mind it less than you thought."},{"label":"A Magistrate decade · 2051 to 2060","text":"A proper place in the family comes to you, as the reliable one with a role and a duty. You earn a standing among your relatives that holds for years to come."},{"label":"A Sage decade · 2071 to 2080","text":"Family care comes with conditions, and help arrives with a say in your choices. You hold steady by keeping a way of your own without a quarrel, and the bond survives the distance you need."}],"byYear":[{"label":"2026 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."},{"label":"2028 · a Sage year","text":"Your home draws a relative's closer interest this year, with help and opinions that leave you more looked after than you asked to be."}]},{"domain":"Growth","headline":"Your growth waits on a readiness you already have.","intro":"Three seats rule Growth in your chart. One sits in your Early Chapter, one in your Rising Chapter and one in your Late Chapter.","lit":["pianyin_year_branch","zhengyin_month_branch","zhengyin_hour_stem"],"heavy":false,"pips":["earth","earth","earth"],"hubLine":"Your growth waits on a readiness you already have.","how":"Each step you take comes after the training is done and the support is in place. Because shelter feels like the right place to prepare, you stay in safe roles past the point they teach you anything, and you wait for one more sign that you are ready. You are readier than you feel, and have been for a long time.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"The people who taught you most as a child stood outside the usual line, the neighbour or relative with odd interests who took you seriously. You grew in directions your family could not follow, and stopped expecting them to before you were fifteen."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"From your late teens you have grown in sheltered steps, under teachers and seniors who prepared you well. You have done better than you feared each time you moved, standing on the base they gave you."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2045 · in plain view · coming","text":"Your knowledge takes a lasting form from your late forties, a course or a set of notes or a body of advice. You take quiet pride in seeing it outlast your own part in it."}],"notes":[],"byDecade":[{"label":"A General decade · 2061 to 2070","text":"You grow fastest through pressure, a hard role or a challenge you choose on purpose. You will come out stronger in the places that used to hold you back."}],"byYear":[{"label":"2027 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."},{"label":"2029 · an Alchemist year","text":"Out of public view, you grow more yourself this year through solitary study and interests nobody assigned you."}]},{"domain":"Social","headline":"Your circle is full of rivals you respect.","intro":"Two seats rule Social in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["qisha_year_stem","jiecai_month_stem"],"heavy":false,"pips":["fire","metal"],"hubLine":"Your circle is full of rivals you respect.","how":"You get close to people by competing with them, over a quiz night or a sales month or a race for the same client. Because you respect anyone who can beat you, a close loss to a friend brings you nearer to them. You keep the friends who win fairly and lose with grace.","pattern":"","blocks":[{"kind":"seat","name":"The General at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"As a child you were the one others looked to in a fight or a dare, and you did not give way easily. Your friends by your teens were either as tough as you or kept at a distance, and you learned diplomacy slowly."},{"kind":"seat","name":"The Rival at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"From your late teens you have made friends through competition, in teams and courses and workplaces where everyone was ranked. You have shared each win with the people you beat, and those are the friendships that have lasted."}],"notes":["Your later gates hold no Social seat, so your decades set its course from here."],"byDecade":[{"label":"A Virtuoso decade · 2011 to 2020","text":"In company you were the lively one, quick with a joke and a sharp opinion. You were sought out for your wit and loved being heard."},{"label":"A Horizon decade · 2041 to 2050","text":"New places and new groups keep bringing people into your life, and each one leads to more. You will make friends faster than you can introduce them to each other."},{"label":"A Magistrate decade · 2051 to 2060","text":"You hold standing among friends, and people ask your opinion before they decide. You become the steady one they count on, a role you take seriously."}],"byYear":[{"label":"2026 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."},{"label":"2030 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."}]},{"domain":"Health","headline":"Your health answers to each decade for now.","intro":"One seat rules Health in your chart. It sits in your Late Chapter.","lit":["zhengyin_hour_branch"],"heavy":false,"pips":["earth"],"hubLine":"Your health answers to each decade for now.","how":"Your health has a character of its own that arrives in a later chapter, and for now each decade steers it. You take your strength from the years you are in, reading your energy one season at a time.","pattern":"","blocks":[{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2045 · coming","text":"From your late forties your body does well on gentle habits and the company of people who look after you. You hold your strength by learning something new each season, and a class or a guided walk does more for you than a hard workout."}],"notes":[],"byDecade":[{"label":"An Artisan decade · 2021 to 2030 · now","text":"You ease into your body, with a better appetite, deeper sleep and more pleasure in ordinary days. You will enjoy your health the way you enjoy a good meal, slowly and without guilt."},{"label":"A General decade · 2061 to 2070","text":"You carry more pressure, and for once it suits your body. You will be fitter and sharper in demanding years than in easy ones, as long as you keep sleeping."},{"label":"A Sage decade · 2071 to 2080","text":"Too much rest dulls you, and sheltered days leave you flat. Your energy returns whenever someone needs looking after, because it gets you up early and moving."}],"byYear":[{"label":"2027 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."},{"label":"2028 · a Sage year","text":"This year you accept more looking after than you normally allow, leaning on shelter, quiet evenings and someone else's care."}]},{"domain":"Love","headline":"You love best with time alone built in.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["pianyin_day_branch"],"heavy":false,"pips":["earth"],"hubLine":"You love best with time alone built in.","how":"You want someone close, and you also want hours each week that belong only to you. Because you work your feelings out in private, you go quiet before a serious talk, and a partner who presses gets less of you. Your love lasts with someone who waits for you to come back.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Day Gate","meta":"Home Chapter · from 35 · 2032 · coming","text":"The bond you make from your mid-thirties takes your private hours as part of love and not a gap in it. You grow closer in these years by bringing back what you worked out alone, the odd idea or the half-solved puzzle, and letting a partner in on it."}],"notes":["Love has no decade of its own. It is read from your Day Gate alone."],"byDecade":[],"byYear":[]},{"domain":"Wealth","headline":"Your money rises and falls with each decade.","intro":"No seat rules Wealth in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your money rises and falls with each decade.","how":"Your money answers to each decade, and you trust one good year less than most people do. You read the turn before anyone around you does, because some decades bring it in and others draw it out.","pattern":"","blocks":[],"notes":[],"byDecade":[{"label":"A Steward decade · 2031 to 2040","text":"You turn steady work into something you own, a home or savings or a share in something lasting. You keep more of what you earn than in any decade before."},{"label":"A Horizon decade · 2041 to 2050","text":"Money comes through openings, an offer or a sale or a well-timed move, more than through regular pay. You take more chances with it than you are used to, and most of them pay."}],"byYear":[{"label":"2030 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."}]}],"blueprint":{"title":"A Sage structure · 正印格","structure":{"reading":{"label":"","text":"Your chart rests on shelter and learning, on teachers who back you and places that look after their own. You do your best work where study is valued and someone senior vouches for you. You repay that care with years of loyalty.","draft":false},"rule":{"label":"","text":"The Sage who holds your strongest seat also shows on one of your stems. That makes it the organising force of your life, and you answer to it before anything else.","draft":false},"statusLabel":"Formed, under strain.","status":{"label":"","text":"More support and study surround you than you can put to use, and preparing keeps standing in for doing. You stay well looked after and underused, ready for work you could already do.","draft":false},"rescue":{"label":"what protects it · Steward decade 2031 to 2040 · Horizon decade 2041 to 2050","text":"Money protects it, a steady income or a shared venture, and you meet it in your next decade and later ones.","draft":false}},"runs":{"strongest":{"label":"","text":"Earth alone carries more than half of your chart, and you live mostly through what you think.","draft":false},"missing":[{"label":"no Virtuoso · your season asks for it too · your Virtuoso decade 2011 to 2020 is lived","text":"Arguing back is not your first reflex when a plan looks wrong. You follow the brief as written and raise objections late and politely, after the decision is made.","draft":false},{"label":"no Horizon · it arrives with your decade 2041 to 2050","text":"Offers you did not chase seldom find you, and side doors stay shut until you knock. You earn by the front route, one job at a time, trusting what you worked for over a windfall.","draft":false},{"label":"no Steward · your season asks for it too · it arrives with your decade 2031 to 2040","text":"You do the books when you must and not a day sooner. You handle money in bursts and forget it for months, leaning on a partner or a spreadsheet to keep track.","draft":false},{"label":"no Magistrate · it arrives with your decade 2051 to 2060","text":"You look to others to learn what the rules are. You borrow structure from a boss or a contract, and you work best once someone else has fixed the terms.","draft":false}],"seasonName":"九月辛","season":{"label":"","text":"Late autumn piles Earth around you and swells you with more strength than you can use. Water comes first as a clean current to carry off that excess, and Wood after it to loosen the Earth, while Fire and more Earth only add to the weight. You turn clear and light again once that work is done.","draft":false},"needs":[]},"seen":{"plain":[{"label":"the General","text":"You read as tough and hard to rattle, the person people send in when the stakes are high.","draft":false},{"label":"the Rival","text":"To most people you look bold and openhanded, quick to share what you have and quicker to race for more.","draft":false},{"label":"the Sage","text":"You look calm and well taught, someone a teacher or an older friend has clearly looked after.","draft":false}],"inside":[{"label":"the Alchemist","text":"You think in strange directions and keep most of those thoughts to yourself.","draft":false},{"label":"the Sage","text":"Privately you want to be looked after and stay close to the people who once taught you.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[],"bonds":[{"label":"Month punishes Year · 丑戌刑","text":"Your family's expectations follow you into every job, driving you harder than any boss asks until you settle on your own measure.","draft":false},{"label":"Hour punishes Year · 丑戌刑","text":"You hold the people after you to the standards you were raised on, with the same friction repeating until you decide which of those rules to keep.","draft":false},{"label":"Day punishes Month · 丑戌刑","text":"You bring the standards of your work home, holding a partner to the demands you make of colleagues until you draw a line where the job stops.","draft":false},{"label":"Hour punishes Day · 丑戌刑","text":"The same argument returns at home between you and those who follow you, but you break the loop by changing your own rule first.","draft":false}],"noneHard":null}}},"dualBond":{"why":"R3: one pair of gates with two bond lines","birth":{"year":1978,"month":7,"day":15,"hour":1,"location":"Beijing","gender":"female"},"hu":false,"age":48,"strength":"extremely_strong","dayStem":"戊","pillars":[{"g":"year","stem":"戊","branch":"午"},{"g":"month","stem":"己","branch":"未"},{"g":"day","stem":"戊","branch":"寅"},{"g":"hour","stem":"癸","branch":"丑"}],"positions":[{"id":"bijian_year_stem","gate":"year","el":"earth","kind":"stem","term":"The Twin at the Year Gate"},{"id":"zhengyin_year_branch","gate":"year","el":"fire","kind":"branch","term":"The Sage inside the Year Gate"},{"id":"jiecai_month_stem","gate":"month","el":"earth","kind":"stem","term":"The Rival at the Month Gate"},{"id":"jiecai_month_branch","gate":"month","el":"earth","kind":"branch","term":"The Rival inside the Month Gate"},{"id":"qisha_day_branch","gate":"day","el":"wood","kind":"branch","term":"The General inside the Day Gate"},{"id":"zhengcai_hour_stem","gate":"hour","el":"water","kind":"stem","term":"The Steward at the Hour Gate"},{"id":"jiecai_hour_branch","gate":"hour","el":"earth","kind":"branch","term":"The Rival inside the Hour Gate"}],"seek":["wood","metal","water"],"ease":["earth","fire"],"domains":[{"domain":"Family","headline":"Your family grows louder, and dearer, with age.","intro":"Four seats rule Family in your chart. Two sit in your Early Chapter and two in your Late Chapter.","lit":["bijian_year_stem","zhengyin_year_branch","zhengcai_hour_stem","jiecai_hour_branch"],"heavy":true,"pips":["earth","fire","water","earth"],"hubLine":"Your family grows louder, and dearer, with age.","how":"You are pulled toward the strong-willed people in your family, the ones who push back and want their share. Because you respect whoever stands up to you, you give most to whoever argues hardest, and the quieter ones get less of you. You love a full and noisy table more than a calm one.","pattern":"","blocks":[{"kind":"seat","name":"The Twin at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"An older relative in your first home made a point of standing on their own, and you copied it before you understood it. You asked for less with each year you grew, and the adults around you praised you for it."},{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"An older relative looked after you closely when you were small, and you came to rely on their calm. You grew up expecting the world to treat you with the same care, and mostly it did."},{"kind":"seat","name":"The Steward at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"You have covered the gaps in your family since your late forties, paying the fees and the deposits before anyone had to ask. You have earned the family's trust one settled bill at a time."},{"kind":"seat","name":"The Rival inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Since your late forties your family has grown louder, with the people after you claiming your time, your backing and your money. You have given more than you meant to, and you would do most of it again."}],"notes":[],"byDecade":[{"label":"A Sage decade · 1991 to 2000","text":"Your family sheltered you more than you needed, and the care came with expectations attached. You kept the peace by doing as you were asked, holding on to one thing you chose for yourself."},{"label":"A Magistrate decade · 2011 to 2020","text":"Order and good manners shaped your home, and everyone knew their place and their duties. You earned respect in your family by keeping its rules and felt secure inside them."},{"label":"A Steward decade · 2031 to 2040","text":"Family life settles around the order you keep, with a home that runs well and bills paid on time. You become the steady one relatives rely on and take quiet pride in it."},{"label":"A Horizon decade · 2041 to 2050","text":"Your family widens through new relatives, friends who become kin and a door kept open to visitors. You spend more on the people around you than you used to and mind it less than you thought."}],"byYear":[{"label":"2027 · a Sage year","text":"Your home draws a relative's closer interest this year, with help and opinions that leave you more looked after than you asked to be."},{"label":"2028 · a Twin year","text":"With siblings and cousins weighing in, you settle family matters this year between equals of your own age."},{"label":"2030 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."}]},{"domain":"Wealth","headline":"You earn hardest when someone is racing you.","intro":"Three seats rule Wealth in your chart. One sits in your Rising Chapter and two in your Late Chapter.","lit":["jiecai_month_branch","zhengcai_hour_stem","jiecai_hour_branch"],"heavy":true,"pips":["earth","water","earth"],"hubLine":"You earn hardest when someone is racing you.","how":"You earn alongside the people around you, chasing the same bonus or backing the same venture as your friends. Because keeping up is how you show you belong, you match their spending before you count your own. You save less than you mean to in good years and lean ones alike, and a win is when you feel it most.","pattern":"","blocks":[{"kind":"seat","name":"The Rival inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"In your twenties and early thirties your income moved with your circle, climbing in the years your friends climbed and dipping when they did. You spent most wins keeping pace with them, which kept your place in the race secure and your reserve thin."},{"kind":"seat","name":"The Steward at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"Since your late forties your accounts have settled, the debts cleared and the savings finally visible. You became the one in your family with enough, and you have quietly paid for more than you mention."},{"kind":"seat","name":"The Rival inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Since your late forties your money has moved through your circle, split with friends in a bad year and shared with younger people starting out. You have had most of it back in loyalty rather than cash, and that has been the return you valued most."}],"notes":[],"byDecade":[{"label":"A Steward decade · 2031 to 2040","text":"You turn steady work into something you own, a home or savings or a share in something lasting. You keep more of what you earn than in any decade before."},{"label":"A Horizon decade · 2041 to 2050","text":"Money comes through openings, an offer or a sale or a well-timed move, more than through regular pay. You take more chances with it than you are used to, and most of them pay."}],"byYear":[{"label":"2029 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."}]},{"domain":"Social","headline":"Work and friendship are one circle for you.","intro":"Three seats rule Social in your chart. One sits in your Early Chapter and two in your Rising Chapter.","lit":["bijian_year_stem","jiecai_month_stem","jiecai_month_branch"],"heavy":false,"pips":["earth","earth","earth"],"hubLine":"Work and friendship are one circle for you.","how":"Your friends and colleagues are mostly the same people, and you go into business with the ones you like. Because you trust the people you enjoy, you agree to shared plans before the terms are clear. You mix friendship and money without a line between them, slow to ask which one a deal is really about.","pattern":"","blocks":[{"kind":"seat","name":"The Twin at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"The friends you made as a child were your equals, children who kept pace with you and stood up for you in turn. By your teens you had kept only the level friendships, letting the rest go without a fuss."},{"kind":"seat","name":"The Rival at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"Across your Rising Chapter you made friends through competition, in teams and courses and workplaces where everyone was ranked. You shared each win with the people you beat, and those were the friendships that lasted."},{"kind":"seat","name":"The Rival inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"Your friendships ran through shared ventures and pooled money from sixteen to your mid-thirties, and each deal tested which friends were really yours. You left those years valuing the friends who came through a bad deal with you far above anything the deals paid."},{"kind":"gap","label":"Late Chapter · 48 to now · no Social seat.","text":"From your late forties, you keep company with the people after you and the friends who have lasted, with each new decade adding faces to the circle."}],"notes":[],"byDecade":[{"label":"A Magistrate decade · 2011 to 2020","text":"Respect came to you through how you carried yourself among others. Fair and dependable in their eyes, you were the one friends asked to lead."},{"label":"A Horizon decade · 2041 to 2050","text":"New places and new groups keep bringing people into your life, and each one leads to more. You will make friends faster than you can introduce them to each other."},{"label":"A Virtuoso decade · 2051 to 2060","text":"You become more outspoken, and the people who enjoy a sharp voice seek you out. You gather an audience of your own and lose patience with company that asks you to be quieter."}],"byYear":[{"label":"2028 · a Twin year","text":"Among friends this year, you spend more time with peers who do what you do than with anyone who looks up to you."},{"label":"2029 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."}]},{"domain":"Health","headline":"Your body grows strong under hard tests.","intro":"Two seats rule Health in your chart. One sits in your Early Chapter and one in your Home Chapter.","lit":["zhengyin_year_branch","qisha_day_branch"],"heavy":false,"pips":["fire","wood"],"hubLine":"Your body grows strong under hard tests.","how":"You feel best in the weeks your body is pushed hard, by training, by heavy work or by a goal with real stakes. Because you meet pressure by bracing against it, a long strain at home goes into your sleep before you admit it is there. You recover within days once the fight is over.","pattern":"","blocks":[{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Whenever you were run down as a child, an older relative was there with an early night and a watchful eye. Growing up, you learned that being looked after was part of getting your strength back, and letting others do it came easily."},{"kind":"seat","name":"The General inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties your strongest stretches were the hard ones, when home and work both tested you and you held up on nerve and short sleep. You came out of each test tougher and with a clear sense of how much you could carry."}],"notes":[],"byDecade":[{"label":"A Sage decade · 1991 to 2000","text":"Other people set your pace, and you rested only when someone insisted. You were carried by their care, and learned in time to give yourself the same without being asked."},{"label":"A General decade · 2021 to 2030 · now","text":"You carry more pressure, and for once it suits your body. You will be fitter and sharper in demanding years than in easy ones, as long as you keep sleeping."}],"byYear":[{"label":"2027 · a Sage year","text":"This year you accept more looking after than you normally allow, leaning on shelter, quiet evenings and someone else's care."},{"label":"2030 · an Artisan year","text":"Your body follows the pace you set this year, with meals, sleep and easy pleasures filling more of your days."}]},{"domain":"Career","headline":"You are at your best with a rival at the next desk.","intro":"Two seats rule Career in your chart. Both sit in your Rising Chapter.","lit":["jiecai_month_stem","jiecai_month_branch"],"heavy":false,"pips":["earth","earth"],"hubLine":"You are at your best with a rival at the next desk.","how":"You come alive when the score is public, a sales board or a ranking or a race for one target. Because beating the people beside you is how you know you are good, you push hardest in the weeks a colleague pulls level. Your bold moves pay best beside someone who checks the details, the part you leave to others.","pattern":"","blocks":[{"kind":"seat","name":"The Rival at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"From sixteen to your mid-thirties the colleagues you raced hardest were also the ones you teamed up with on joint bids and shared clients. You learned from the bids that soured over a vague split to agree who got what before any work started."},{"kind":"seat","name":"The Rival inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"Between sixteen and your mid-thirties you chose work where you were measured against colleagues, by results anyone could see. You won big beside partners and lost ground to them, and the race made you faster than the job alone could have."}],"notes":[],"byDecade":[{"label":"An Alchemist decade · 2001 to 2010","text":"Study and odd side paths pulled you away from steady work. You learned a great deal that did not pay at the time and got through on the one skill people kept asking you for."},{"label":"A Magistrate decade · 2011 to 2020","text":"Recognition came the proper way, through good work noticed by the right people. You earned a place you could be proud of and carried its responsibility well."},{"label":"A General decade · 2021 to 2030 · now","text":"You take on hard assignments and real pressure, and you rise because of them. You come out with more authority than you went in with."},{"label":"A Steward decade · 2031 to 2040","text":"Your work pays properly, steadily and in proportion to what you put in. You chase the next thing less and build on what you already do well."},{"label":"A Virtuoso decade · 2051 to 2060","text":"Original work brings you recognition, and your voice carries further than before. You win people over by saying what others will not and build a name on your own terms."}],"byYear":[{"label":"2026 · an Alchemist year","text":"This year you learn more out of sight than you earn in plain view, with your work turned toward study and specialist skill."},{"label":"2029 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."},{"label":"2030 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."}]},{"domain":"Love","headline":"You love hardest when something is at stake.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["qisha_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"You love hardest when something is at stake.","how":"You trust a love that has come through something hard, and you feel closest to a partner in the weeks when everything is on the line. Because pressure is how you know a bond is real, you test a partner without meaning to whenever love runs easy. Your kind of partner has the nerve to stand beside you when it counts.","pattern":"","blocks":[{"kind":"seat","name":"The General inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties your relationships were tested hard, by heavy loads and bad stretches carried together, and the strain itself felt like closeness. From them, you learned to tell a bond that bent under pressure from one that broke."}],"notes":["Love has no decade of its own. The pattern your Day Gate set is the one your love life keeps."],"byDecade":[],"byYear":[]},{"domain":"Growth","headline":"Your growth starts from a safe base.","intro":"One seat rules Growth in your chart. It sits in your Early Chapter.","lit":["zhengyin_year_branch"],"heavy":false,"pips":["fire"],"hubLine":"Your growth starts from a safe base.","how":"You take your biggest steps from a secure position, with people behind you and a home to return to. Because safety came first in your life, you learn faster when you feel held, and you stall when people you do not trust try to hurry you. You put off a change until the support is in place.","pattern":"","blocks":[{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"As a child you tried new things when someone you trusted stood close by, and you held back when nobody did. By your teens you were slower than your friends to try things away from home, because home felt so safe."}],"notes":[],"byDecade":[{"label":"An Alchemist decade · 2001 to 2010","text":"You grew by going your own way, away from what was expected of you. The progress stayed nearly invisible, but you kept faith in a private conviction while you felt behind."},{"label":"A General decade · 2021 to 2030 · now","text":"You grow fastest through pressure, a hard role or a challenge you choose on purpose. You will come out stronger in the places that used to hold you back."}],"byYear":[{"label":"2026 · an Alchemist year","text":"Out of public view, you grow more yourself this year through solitary study and interests nobody assigned you."},{"label":"2028 · a Twin year","text":"This year you see your own shape by working alongside equals, leaning less on anyone's approval and more on your own judgement."}]},{"domain":"Mind","headline":"Your thinking changes character with each decade.","intro":"No seat rules Mind in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your thinking changes character with each decade.","how":"Your thinking takes its colour from each decade, studious in one and restless or practical in another. You notice the change in what you read before you notice it in yourself.","pattern":"","blocks":[],"notes":[],"byDecade":[{"label":"A Sage decade · 1991 to 2000","text":"The shelter of what you already knew held you, and new ideas felt like a threat to it. You read and studied more than you acted, kept going by the depth of what you had learned."},{"label":"An Alchemist decade · 2001 to 2010","text":"You turned inward, into subjects nobody near you could follow, and work you owed others waited. Out of step with the people close to you, you were carried by one private piece of work you still count among your best."},{"label":"A Virtuoso decade · 2051 to 2060","text":"You turn your thinking outward, and you say in public what you used to keep to yourself. You are quicker and bolder with ideas than at any time before."}],"byYear":[{"label":"2026 · an Alchemist year","text":"You study alone this year, pulled toward odd, specialist subjects nobody nearby would think to ask about."},{"label":"2027 · a Sage year","text":"You learn most this year when someone else sets the syllabus, with books, courses and a patient teacher filling your evenings."}]}],"blueprint":{"title":"A Rival structure · 月劫格","structure":{"reading":{"label":"","text":"Your chart centres on the Rival, on equals who compete with you and share in whatever you have. You work hardest in a team where everyone can see the score. You win more in an open contest than in a quiet deal.","draft":false},"rule":{"label":"","text":"Your strongest seat holds a rival of your own element. Your chart is built around what you win against your equals, and you answer first to the contest.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"Your will to win has a fair field, and what you share with friends comes back to you through them. You can lean on a crew that races you and backs you in equal measure.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Earth alone carries two thirds of your chart, and you live mostly through your own strength.","draft":false},"missing":[{"label":"no Artisan · no decade of yours brings it","text":"A free afternoon needs a reason before you let yourself have it. You plan your pleasures like tasks, a booked dinner or a day off on the calendar, and relax best when someone else sets the table.","draft":false},{"label":"no Horizon · it arrives with your decade 2041 to 2050","text":"Offers you did not chase seldom find you, and side doors stay shut until you knock. You earn by the front route, one job at a time, trusting what you worked for over a windfall.","draft":false}],"seasonName":"六月戊","season":{"label":"","text":"Late summer leaves your mountain parched, dust on the slopes and every spring run low. Water as rain is the first thing this month wants for you, with Fire and Wood after it to keep the ground warm and broken open. You turn green again when the water comes first and the rest follows.","draft":false},"needs":[{"label":"first need · 癸, the Steward · on show","text":"Your chart puts the Steward right on the surface, where its element gives your strength something solid to shape in a season with little to hold.","draft":false},{"label":"second need · 丙, the Alchemist · hidden deep","text":"Far beneath the surface, you hold the Alchemist as a thin thread, a trickle of its element feeding you where the season gives nothing.","draft":false},{"label":"third need · 甲, the General · inside a branch, not on show","text":"Your chart roots the General as the main stem of a branch, and its element presses your strength into a shape the season alone never gives it.","draft":false}]},"seen":{"plain":[{"label":"the Twin","text":"You come across as someone who carries their own weight and asks for little help.","draft":false},{"label":"the Rival","text":"To most people you look bold and openhanded, quick to share what you have and quicker to race for more.","draft":false},{"label":"the Steward","text":"You come across as a careful provider, the one who pays on time and keeps count.","draft":false}],"inside":[{"label":"the Sage","text":"Privately you want to be looked after and stay close to the people who once taught you.","draft":false},{"label":"the Rival","text":"You keep score with the people closest to you, and you want to win more than you let on.","draft":false},{"label":"the General","text":"You want a harder test than anyone sets you and push yourself to meet it where nobody sees.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[],"bonds":[{"label":"Month binds with Year · 午未合","text":"Your first family stays tied to your working life, with a trade or a contact or a loyalty from home going into every job you hold.","draft":false},{"label":"Hour harms Year · 丑午害","text":"You notice a tone or a rule from your childhood rubbing at how you treat the children you raise or train, and smooth it over before it grows.","draft":false},{"label":"Hour clashes with Month · 丑未冲","text":"From your late forties, you have let go of the career your rising years built and turned toward work that fits your later life.","draft":false},{"label":"Day joins Year · 寅午","text":"Your first family stands behind the home you make, keeping their help close at hand while you build a household with a partner.","draft":false}],"noneHard":null}}},"strongSealMoney":{"why":"R1: a strong seal chart told money breaks it","birth":{"year":1996,"month":11,"day":24,"hour":2,"location":"Beijing","gender":"female"},"hu":false,"age":29,"strength":"strong","dayStem":"乙","pillars":[{"g":"year","stem":"丙","branch":"子"},{"g":"month","stem":"己","branch":"亥"},{"g":"day","stem":"乙","branch":"丑"},{"g":"hour","stem":"丁","branch":"丑"}],"positions":[{"id":"shangguan_year_stem","gate":"year","el":"fire","kind":"stem","term":"The Virtuoso at the Year Gate"},{"id":"pianyin_year_branch","gate":"year","el":"water","kind":"branch","term":"The Alchemist inside the Year Gate"},{"id":"piancai_month_stem","gate":"month","el":"earth","kind":"stem","term":"The Horizon at the Month Gate"},{"id":"zhengyin_month_branch","gate":"month","el":"water","kind":"branch","term":"The Sage inside the Month Gate"},{"id":"piancai_day_branch","gate":"day","el":"earth","kind":"branch","term":"The Horizon inside the Day Gate"},{"id":"shishen_hour_stem","gate":"hour","el":"fire","kind":"stem","term":"The Artisan at the Hour Gate"},{"id":"piancai_hour_branch","gate":"hour","el":"earth","kind":"branch","term":"The Horizon inside the Hour Gate"}],"seek":["metal","earth","fire"],"ease":["wood","water"],"domains":[{"domain":"Wealth","headline":"Your money arrives in windfalls and goes to the next chance.","intro":"Three seats rule Wealth in your chart. One sits in your Rising Chapter, one in your Home Chapter and one in your Late Chapter.","lit":["piancai_month_stem","piancai_day_branch","piancai_hour_branch"],"heavy":true,"pips":["earth","earth","earth"],"hubLine":"Your money arrives in windfalls and goes to the next chance.","how":"You earn best from timing, a bonus or a sale or a deal that comes good all at once. Because you trust another opening to come, each gain goes straight into the next venture or the next move. Your money moves as fast as your eye for the next deal, and a quiet season finds you rich in plans.","pattern":"What you make turns into money more easily for you than for most, and the work that feels like play is the work that pays you best. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Horizon at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Good years and thin ones have followed each other since your late teens, with money arriving in lumps. You have put each windfall into a move or a venture before setting any of it aside, and those ventures have widened your range more than your balance."},{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2031 · coming","text":"From your mid-thirties your income starts to rise through the life you share with a partner, through a joint venture, a move or an opening from their side. You will earn more in these years than in all the years before, and you see the part with no clear owner slip away."},{"kind":"seat","name":"The Horizon inside the Hour Gate","meta":"Late Chapter · from 48 · 2044 · coming","text":"From your late forties a windfall or an offer from far away reaches you, and a move sets your money going again. You keep most of it in motion from then on, sleeping best while one part stays untouched."}],"notes":[],"byDecade":[{"label":"A Rival decade · 2042 to 2051","text":"Other people reach for your money through loans, shared costs and favours that do not all come back. You keep enough by setting your own share aside first and spending less on proving yourself."}],"byYear":[{"label":"2028 · a Steward year","text":"Your attention turns to bills, savings and the slow work of keeping accounts this year, until you know where each part of your money goes."},{"label":"2029 · a Horizon year","text":"Through a second job or an unexpected offer, you take in money by side doors this year and spread it across more ventures than usual."}]},{"domain":"Career","headline":"Your career rises on what you have studied.","intro":"Three seats rule Career in your chart. Two sit in your Rising Chapter and one in your Late Chapter.","lit":["piancai_month_stem","zhengyin_month_branch","shishen_hour_stem"],"heavy":true,"pips":["earth","water","fire"],"hubLine":"Your career rises on what you have studied.","how":"You are trusted at work because you know your subject properly, and people check their facts with you. Because depth matters more to you than visibility, you leave the self-promotion to others, and promotion reaches you later than your knowledge has earned it. Your standing grows slowly and holds when louder careers fall away.","pattern":"You also rise by making more rather than by climbing, as each piece of work you finish brings the next one to your door. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Horizon at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Your best career moves since your late teens have come through timing, a job heard about early or an offer made in a casual conversation. Your working life has turned with each better chance, and it has grown wider than any single ladder."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Your progress at work since your late teens has come through what you studied, with each qualification carrying you a step further. You have proved right every mentor who put your name forward before you felt ready."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · from 48 · 2044 · in plain view · coming","text":"Your working life slows to the pace that suits you from your late forties, and the work you make for others becomes the work you enjoy most. You are paid for it in thanks as well as money, a trade that pleases you more each year."}],"notes":[],"byDecade":[{"label":"An Artisan decade · 2012 to 2021","text":"Work came easily, especially work that let you make things or please people. You did your best at a relaxed pace, and others valued what you made."},{"label":"A Virtuoso decade · 2022 to 2031 · now","text":"Original work brings you recognition, and your voice carries further than before. You win people over by saying what others will not and build a name on your own terms."},{"label":"A Rival decade · 2042 to 2051","text":"Rivalry over shared work drains your energy, and a joint effort takes more from you than it pays. You get through on work that is plainly yours, done where the people who matter can see it."},{"label":"An Alchemist decade · 2052 to 2061","text":"Your work wanders between private study and side projects, and steady output is hard to keep up. Each time a side path stalls, you return to the one method people pay you for."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Sure of your skill and short with the rules, you say out loud this year what colleagues only grumble about."},{"label":"2027 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."},{"label":"2028 · a Steward year","text":"Your pay tracks your effort this year, earned through the hours you put in and the details you get right."},{"label":"2030 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."},{"label":"2031 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."}]},{"domain":"Family","headline":"You love your family in an unusual way.","intro":"Three seats rule Family in your chart. One sits in your Early Chapter and two in your Late Chapter.","lit":["pianyin_year_branch","shishen_hour_stem","piancai_hour_branch"],"heavy":false,"pips":["water","fire","earth"],"hubLine":"You love your family in an unusual way.","how":"You show love to your family through ideas and help with problems more than through surface warmth. Because the care you got early was quiet and odd, you trust a relative who understands you over one who fusses, and you feel lonely at noisy gatherings. You come home as the quiet one, a part your relatives have long stopped trying to change.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Instead of the usual fuss you got books, questions and long silences from an adult in your first home who lived in their own head. What you took from it was the habit of answering your own odd questions before you thought to ask anyone else."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · from 48 · 2044 · in plain view · coming","text":"From your late forties you become the place the people after you come to rest, the slow meal and the spare bed and the evening nobody rushes. You enjoy them more as they grow easy around you, unhurried and well fed."},{"kind":"seat","name":"The Horizon inside the Hour Gate","meta":"Late Chapter · from 48 · 2044 · coming","text":"From your late forties the people after you open new places to you, a spare bed in a far city and a reason to stay a month. Your visits become the link between them, and those gatherings matter more to you than anything you could buy them."}],"notes":[],"byDecade":[{"label":"An Artisan decade · 2012 to 2021","text":"Home was warm, full of meals and unhurried evenings with the people you lived with. You were the comfort everyone at home gathered around."},{"label":"A Twin decade · 2032 to 2041","text":"Pride runs through your family, each person insisting on their own way and quarrelling over it. You come through by doing your part well and leaving others to theirs."},{"label":"A Sage decade · 2062 to 2071","text":"Family care comes with conditions, and help arrives with a say in y
