our choices. You hold steady by keeping a way of your own without a quarrel, and the bond survives the distance you need."}],"byYear":[{"label":"2027 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."},{"label":"2028 · a Steward year","text":"You keep the household accounts this year and see to family property, holding the home in careful order."},{"label":"2029 · a Horizon year","text":"Your family life widens this year to relatives far away or newly met, drawing your time and money to people beyond your own door."},{"label":"2030 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."}]},{"domain":"Social","headline":"You know someone for every need.","intro":"Three seats rule Social in your chart. One sits in your Early Chapter, one in your Rising Chapter and one in your Home Chapter.","lit":["shangguan_year_stem","piancai_month_stem","piancai_day_branch"],"heavy":false,"pips":["fire","earth","earth"],"hubLine":"You know someone for every need.","how":"You collect contacts the way other people collect friends, and you love introducing people who will get on. Because your network brings you work and money, the useful friendships and the warm ones get mixed together. You give a real friend the same quick hour you give a contact, and the difference is the last thing you notice.","pattern":"","blocks":[{"kind":"seat","name":"The Virtuoso at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"When you were a child, your remarks were the ones other people repeated, at home and in class. By your teens you had a few friends who loved your wit and one or two adults who had given up on correcting you."},{"kind":"seat","name":"The Horizon at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Many of your friendships since your late teens began far from home, over a deal or a trip or a shared plan. You have kept a friend in each of the worlds you passed through, and a few of them have become close for life."},{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2031 · coming","text":"Your circle widens from your mid-thirties through a partner's world, through their friends and their family and their work. In your forties you know more people through a partner's side than through your own."}],"notes":[],"byDecade":[{"label":"A Virtuoso decade · 2022 to 2031 · now","text":"You become more outspoken, and the people who enjoy a sharp voice seek you out. You gather an audience of your own and lose patience with company that asks you to be quieter."},{"label":"A Twin decade · 2032 to 2041","text":"Company that truly matches you is scarce, and crowded groups wear you out quickly. You get through on your own strength, and prize a quiet evening over a full calendar."},{"label":"A Rival decade · 2042 to 2051","text":"Comparison creeps into your friendships, and you notice who earns more and who wins more. You win friends back by giving a share freely, and a fair split comes to matter more to you than the prize."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Your conversations with friends grow sharper and wittier this year, until you are the one your circle quotes the next day."},{"label":"2029 · a Horizon year","text":"You move easily this year between groups that never meet each other, carried there by chance meetings and introductions."},{"label":"2030 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."}]},{"domain":"Mind","headline":"You learn steadily, and the learning holds.","intro":"Three seats rule Mind in your chart. Two sit in your Early Chapter and one in your Rising Chapter.","lit":["shangguan_year_stem","pianyin_year_branch","zhengyin_month_branch"],"heavy":false,"pips":["fire","water","water"],"hubLine":"You learn steadily, and the learning holds.","how":"Week by week you add to what you know, studying in a steady and patient way. Because understanding a thing fully is what makes you feel secure, you read the extra chapter and take the extra course, and you speak on a subject only once you are sure of it. You know far more than you claim to.","pattern":"","blocks":[{"kind":"seat","name":"The Virtuoso at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"You finished the work early at school and went looking for something harder, or for trouble when nothing harder came. By your teens you were teaching yourself subjects well beyond your class and hiding how bored you were."},{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Whatever you were given to read when you were small, you read past it into subjects nobody around you shared. By your teens you knew more about a few odd things than most adults did, mentioning it only to the one or two people who asked."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Learning has carried you since your late teens, through courses and qualifications and the teachers who took an interest. You have stayed a student in some form ever since, and it has kept you steadier than most people around you."}],"notes":["Your later gates hold no Mind seat, so your decades set its course from here."],"byDecade":[{"label":"A Virtuoso decade · 2022 to 2031 · now","text":"You turn your thinking outward, and you say in public what you used to keep to yourself. You are quicker and bolder with ideas than at any time before."},{"label":"An Alchemist decade · 2052 to 2061","text":"Your mind turns inward, and long stretches of solitary thought leave work half done. You finish more once a single person understands your odd way of thinking and waits to see the result."},{"label":"A Sage decade · 2062 to 2071","text":"Caution settles over your thinking, and you read about things far more than you try them. You trust your own ideas again once teaching puts them to work in someone else."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Your thinking sharpens against the ideas you are handed this year, finding flaws in what others accept faster than you can keep quiet about them."}]},{"domain":"Growth","headline":"Your growth waits on a readiness you already have.","intro":"Two seats rule Growth in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["pianyin_year_branch","zhengyin_month_branch"],"heavy":false,"pips":["water","water"],"hubLine":"Your growth waits on a readiness you already have.","how":"Each step you take comes after the training is done and the support is in place. Because shelter feels like the right place to prepare, you stay in safe roles past the point they teach you anything, and you wait for one more sign that you are ready. You are readier than you feel, and have been for a long time.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"The people who taught you most as a child stood outside the usual line, the neighbour or relative with odd interests who took you seriously. You grew in directions your family could not follow, and stopped expecting them to before you were fifteen."},{"kind":"seat","name":"The Sage inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"From your late teens you have grown in sheltered steps, under teachers and seniors who prepared you well. You have done better than you feared each time you moved, standing on the base they gave you."}],"notes":["Your later gates hold no Growth seat, so your decades set its course from here."],"byDecade":[{"label":"A Twin decade · 2032 to 2041","text":"Comparison with peers drives you hard, and the standard you hold yourself to leaves you little slack. You will keep growing once the only measure you use is your own last best."},{"label":"An Alchemist decade · 2052 to 2061","text":"Solitary searching slows you, with many interests started and few carried through. Your progress stays hidden until one obscure project is finished, and on that day you will see how far you have come."}],"byYear":[{"label":"2031 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."}]},{"domain":"Love","headline":"You fall for people who widen your life.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["piancai_day_branch"],"heavy":false,"pips":["earth"],"hubLine":"You fall for people who widen your life.","how":"In love you fall for the one with plans and friends and somewhere to be. Because range is what draws you, you lose interest within months in a partner who only offers closeness. What you want is someone who brings the world home, and anyone who shuts it out leaves you restless.","pattern":"","blocks":[{"kind":"seat","name":"The Horizon inside the Day Gate","meta":"Home Chapter · from 35 · 2031 · coming","text":"From your mid-thirties love and money start to move together. You choose a partner in these years who brings an opening into your life, and the bond holds for as long as the two of you keep heading somewhere new."}],"notes":["Love has no decade of its own. It is read from your Day Gate alone."],"byDecade":[],"byYear":[]},{"domain":"Health","headline":"Your health moves with the decade you are in.","intro":"No seat rules Health in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your health moves with the decade you are in.","how":"Each decade moves your health more than any single habit of yours. You feel well for some stretches of years and worn for others, with each turn arriving as one decade gives way to the next.","pattern":"","blocks":[],"notes":[],"byDecade":[{"label":"An Artisan decade · 2012 to 2021","text":"Your appetite and sleep were good, and ordinary pleasures kept you well. Eating well and moving without strain, you felt at home in your own body."},{"label":"A Sage decade · 2062 to 2071","text":"Too much rest dulls you, and sheltered days leave you flat. Your energy returns whenever someone needs looking after, because it gets you up early and moving."}],"byYear":[{"label":"2027 · an Artisan year","text":"Your body follows the pace you set this year, with meals, sleep and easy pleasures filling more of your days."},{"label":"2031 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."}]}],"blueprint":{"title":"A Sage structure · 正印格","structure":{"reading":{"label":"","text":"Your chart rests on shelter and learning, on teachers who back you and places that look after their own. You do your best work where study is valued and someone senior vouches for you. You repay that care with years of loyalty.","draft":false},"rule":{"label":"","text":"Nothing hidden in your strongest seat shows on your stems. The Sage who holds it is the organising force of your life, and you answer to it first.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"Support holds steady around you, from teachers, credentials and people who speak up for you. You can lean on what you have learned, and on the people who taught you, whenever a setback comes.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Water alone carries more than half of your chart, and you live mostly through what you think.","draft":false},"missing":[{"label":"no Twin · it arrives with your decade 2032 to 2041","text":"Going it alone is never your first move. With a team or a close friend beside you, you find your footing faster and hold it longer.","draft":false},{"label":"no Steward · your season asks for it too · your Steward decade 2002 to 2011 is lived","text":"You do the books when you must and not a day sooner. You handle money in bursts and forget it for months, leaning on a partner or a spreadsheet to keep track.","draft":false},{"label":"no Magistrate · no decade of yours brings it","text":"You look to others to learn what the rules are. You borrow structure from a boss or a contract, and you work best once someone else has fixed the terms.","draft":false}],"seasonName":"十月乙","season":{"label":"","text":"Early winter brings cold water up around your roots, more than a vine can take in, and growth stops. The month turns to Fire first to warm you and then to Earth as solid ground to hold back the water and give you footing. You stay above the flood when warmth and firm ground reach you together.","draft":false},"needs":[{"label":"first need · 丙, the Virtuoso · on show","text":"You carry the Virtuoso openly on a stem, and its element cuts a channel for the force your season keeps pent up in you.","draft":false}]},"seen":{"plain":[{"label":"the Virtuoso","text":"You strike people as quick and outspoken, the one who says what the rest of the meeting was thinking.","draft":false},{"label":"the Horizon","text":"In company you are easy with newcomers and quick with an offer, the one who always knows someone useful.","draft":false},{"label":"the Artisan","text":"You seem easygoing and warm, the friend who cooks for everyone and makes hard work look light.","draft":false}],"inside":[{"label":"the Alchemist","text":"You think in strange directions and keep most of those thoughts to yourself.","draft":false},{"label":"the Sage","text":"Privately you want to be looked after and stay close to the people who once taught you.","draft":false},{"label":"the Horizon","text":"You keep a second plan that nobody has heard about and want more open roads than you admit.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[{"label":"The maker’s economy · 食伤生财","text":"What you make sells without much pushing, and the best pay comes from projects you would have done for nothing.","draft":false}],"bonds":[{"label":"Day binds with Year · 子丑合","text":"You build your own home close to the habits of the one you grew up in, and you return to them more than you expected.","draft":false},{"label":"Hour binds with Year · 子丑合","text":"Your later years will come to echo your earliest ones, as you hand the habits of your first home to the young ones you guide.","draft":false}],"noneHard":{"label":"","text":"You move from one chapter of your life to the next without a sharp break, because no clash, punishment or harm sits between your gates.","draft":false}}}},"pastMonth":{"why":"R13: a reader past the Month Gate with Month seats","birth":{"year":1972,"month":1,"day":25,"hour":2,"location":"Beijing","gender":"male"},"hu":false,"age":54,"strength":"weak","dayStem":"乙","pillars":[{"g":"year","stem":"辛","branch":"亥"},{"g":"month","stem":"辛","branch":"丑"},{"g":"day","stem":"乙","branch":"卯"},{"g":"hour","stem":"丁","branch":"丑"}],"positions":[{"id":"qisha_year_stem","gate":"year","el":"metal","kind":"stem","term":"The General at the Year Gate"},{"id":"zhengyin_year_branch","gate":"year","el":"water","kind":"branch","term":"The Sage inside the Year Gate"},{"id":"qisha_month_stem","gate":"month","el":"metal","kind":"stem","term":"The General at the Month Gate"},{"id":"piancai_month_branch","gate":"month","el":"earth","kind":"branch","term":"The Horizon inside the Month Gate"},{"id":"bijian_day_branch","gate":"day","el":"wood","kind":"branch","term":"The Twin inside the Day Gate"},{"id":"shishen_hour_stem","gate":"hour","el":"fire","kind":"stem","term":"The Artisan at the Hour Gate"},{"id":"piancai_hour_branch","gate":"hour","el":"earth","kind":"branch","term":"The Horizon inside the Hour Gate"}],"seek":["water","wood"],"ease":["earth","metal","fire"],"domains":[{"domain":"Career","headline":"You build a career by spotting openings first.","intro":"Four seats rule Career in your chart. One sits in your Early Chapter, two in your Rising Chapter and one in your Late Chapter.","lit":["qisha_year_stem","qisha_month_stem","piancai_month_branch","shishen_hour_stem"],"heavy":true,"pips":["metal","metal","earth","fire"],"hubLine":"You build a career by spotting openings first.","how":"You are drawn to work where timing matters, buying and selling or finding things before others notice them. Because you read change early, a job where nothing moves bores you, and you leave it sooner than you planned. In any role you end up as the person who sees what is coming next.","pattern":"Underneath, you do your calmest work closest to pressure, because the deadlines that grind other people turn into steady output in your hands.","blocks":[{"kind":"seat","name":"The General at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Pressure beyond your age reached you in your first years, a job at home or a team to lead or younger children to mind. The weight felt heavy at the time, but you came out of it tougher than most of your friends."},{"kind":"seat","name":"The General at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"Through your Rising Chapter your reputation at work grew out of hard moments, the emergency handled or the project rescued. Your promotions came out of the worst weeks, each one earned by the nerve you showed when a project was close to failing."},{"kind":"seat","name":"The Horizon inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"In your twenties and early thirties your best jobs were the ones where you could spot a trend early, in trading or sales or finding the right people. With every move you widened your range of contacts, until chances reached you before anyone announced them."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"Since your late forties your work has turned toward making, hosting and finishing the projects you had put off for years. You have made some of your best things in this stretch, better received than anything from your busier decades."}],"notes":[],"byDecade":[{"label":"A Steward decade · 1998 to 2007","text":"Safety kept you in one place too long, and your workload grew faster than your pay. You carried the extra load reliably and earned a trust that later work paid for."},{"label":"An Artisan decade · 2008 to 2017","text":"Comfort dulled your drive, and easy work held you longer than it served you. Well liked and under-stretched, you kept going on a skill you practised for pleasure."},{"label":"A Virtuoso decade · 2018 to 2027 · now","text":"Authority pushes back on you, and a frank remark costs more than it used to. You do better outside a strict chain of command, where work in your own voice carries you through."},{"label":"A Rival decade · 2038 to 2047","text":"Joint efforts carry your work, and you do best inside a group with something to win. You compete hard, share credit fairly and keep the backing of the people beside you."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Sure of your skill and short with the rules, you say out loud this year what colleagues only grumble about."},{"label":"2027 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."}]},{"domain":"Family","headline":"Your family spreads wide and gathers in bursts.","intro":"Three seats rule Family in your chart. One sits in your Early Chapter and two in your Late Chapter.","lit":["zhengyin_year_branch","shishen_hour_stem","piancai_hour_branch"],"heavy":true,"pips":["water","fire","earth"],"hubLine":"Your family spreads wide and gathers in bursts.","how":"You love it best when your whole family gathers for a few full days, and you plan those days months early. Because distance has never felt like loss to you, long gaps between visits pass without worry. You travel far for a short visit, and the people you miss get many arrivals and few long stays.","pattern":"","blocks":[{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"An older relative looked after you closely when you were small, and you came to rely on their calm. You grew up expecting the world to treat you with the same care, and mostly it did."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"You have become the relative who hosts since your late forties, the one whose table the people after you head for first. You see your own habits of ease in how they now treat their guests, down to the second helping."},{"kind":"seat","name":"The Horizon inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Your family has spread to new places since your late forties, the people after you settling far from you and from each other. You have travelled more for them than for any holiday, and their streets have grown nearly as familiar to you as your own."}],"notes":[],"byDecade":[{"label":"A Horizon decade · 1988 to 1997","text":"Plans and people far from home pulled you away, and your family saw less of you than they wanted. You made up for it in bursts of generosity, and relatives forgave more readily than you feared."},{"label":"A Steward decade · 1998 to 2007","text":"Careful keeping outweighed pleasure at home, and you noticed every purchase anyone made. You kept the household secure if a little tense, carried by the relatives who thanked you plainly."},{"label":"An Artisan decade · 2008 to 2017","text":"You gave your family more comfort than they asked for, and some of them came to expect it. Your own ease came back once others began to cook for you in turn."},{"label":"A Twin decade · 2028 to 2037","text":"Your household runs on shared effort, with each person carrying a fair part of the load. You pull your weight before anyone asks and meet every relative as one equal meets another."}],"byYear":[{"label":"2027 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."}]},{"domain":"Social","headline":"Your friendships are tested before they are trusted.","intro":"Three seats rule Social in your chart. One sits in your Early Chapter, one in your Rising Chapter and one in your Home Chapter.","lit":["qisha_year_stem","qisha_month_stem","bijian_day_branch"],"heavy":false,"pips":["metal","metal","wood"],"hubLine":"Your friendships are tested before they are trusted.","how":"You size up new people by how they act when something goes wrong, and you warm to anyone who keeps their nerve. Because you trust only what has been tested, light talk at a party feels like a waste of your evening. Your friendships are few and serious, and loyalty under strain is the one test you set.","pattern":"","blocks":[{"kind":"seat","name":"The General at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"As a child you were the one others looked to in a fight or a dare, and you did not give way easily. Your friends by your teens were either as tough as you or kept at a distance, and you learned diplomacy slowly."},{"kind":"seat","name":"The General at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"In your Rising Chapter your closest friends were the people you worked hardest beside, in a tough job or a demanding team. You came out of each hard stretch with an ally who answered your call at any hour."},{"kind":"seat","name":"The Twin inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties your closest friendships were between equals, people who never needed you to rescue them. You kept every friendship level, with nothing owed in either direction."}],"notes":[],"byDecade":[{"label":"A Horizon decade · 1988 to 1997","text":"Acquaintances crowded your life, and you knew people in many places without letting many of them close. You kept your footing by moving on, with every new place a fresh start."},{"label":"A Virtuoso decade · 2018 to 2027 · now","text":"Bluntness strains your friendships, and some people hear an attack where you meant wit. You will steady yourself by giving that edge a stage, a talk or a page where sharpness is the point."},{"label":"A Twin decade · 2028 to 2037","text":"Friendship settles into a circle of equals, people with lives and strength of their own. You trust that small, solid circle more than any crowd."},{"label":"A Rival decade · 2038 to 2047","text":"Rivalry turns friendly, and the people who compete with you end up on your side. Your friendships stay busy and fair, with every win shared and every loss taken well."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Your conversations with friends grow sharper and wittier this year, until you are the one your circle quotes the next day."}]},{"domain":"Wealth","headline":"Your money comes in strong seasons and quiet ones.","intro":"Two seats rule Wealth in your chart. One sits in your Rising Chapter and one in your Late Chapter.","lit":["piancai_month_branch","piancai_hour_branch"],"heavy":false,"pips":["earth","earth"],"hubLine":"Your money comes in strong seasons and quiet ones.","how":"You earn in bursts, a run of good months and a quiet stretch after. Because each good season makes you sure of the next, you spend the winnings on a new chance before you have kept any. You are richer in the middle of each good stretch than after it.","pattern":"","blocks":[{"kind":"seat","name":"The Horizon inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"What you earned from sixteen to your mid-thirties followed your instinct, with good runs and lean months in turn. You came out of those years knowing how your own streaks ran, a lesson paid for with the gains of good years spent chasing better ones."},{"kind":"seat","name":"The Horizon inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Since your late forties your money has come in sideways, through late ventures and deals struck while travelling. You have spent much of it as fast as it arrived, and that motion has kept new chances reaching you."}],"notes":[],"byDecade":[{"label":"A Horizon decade · 1988 to 1997","text":"Easy money came and went, and each windfall left as fast as it arrived. You chased too many openings at once and held on through the one steady source you kept."},{"label":"A Steward decade · 1998 to 2007","text":"Expenses felt heavy, and you counted money long after there was enough. You came through on the security careful habit built, though your pleasure shrank as your savings grew."},{"label":"A Rival decade · 2038 to 2047","text":"Shared money works for you, because the contest with others keeps you sharp. You do better with people at your side than alone and keep a fair cut of what you win together."}],"byYear":[]},{"domain":"Health","headline":"Your body recovers best when someone looks after you.","intro":"One seat rules Health in your chart. It sits in your Early Chapter.","lit":["zhengyin_year_branch"],"heavy":false,"pips":["water"],"hubLine":"Your body recovers best when someone looks after you.","how":"You get your energy back quickly after tiring weeks and bad nights, and faster still when someone close is fussing over you. Because care was what restored you from the start, you let yourself rest properly only when another person insists. Your body does well on trust, rest and good company.","pattern":"You find your protection in comfort, because good food and work with your hands turn pressure into something you can use.","blocks":[{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Whenever you were run down as a child, an older relative was there with an early night and a watchful eye. Growing up, you learned that being looked after was part of getting your strength back, and letting others do it came easily."},{"kind":"gap","label":"Late Chapter · 48 to now · no Health seat.","text":"From your late forties, you take your energy from the decade you are in, and the people after you give your days their shape."}],"notes":["Your four gates have all opened, so your body moves with your decades from here."],"byDecade":[{"label":"An Artisan decade · 2008 to 2017","text":"Rich food, late nights and easy evenings piled up, and your energy dropped as the habits grew. You came back through a plain daily routine and felt the difference within weeks."}],"byYear":[{"label":"2027 · an Artisan year","text":"Your body follows the pace you set this year, with meals, sleep and easy pleasures filling more of your days."}]},{"domain":"Love","headline":"You love best as an equal, or not at all.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["bijian_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"You love best as an equal, or not at all.","how":"You want a partner with a full life of their own, and you go cold on anyone who needs you to lead. Because standing level is how you feel respected, you keep your own friends, money and plans inside the relationship. You find it harder to be carried, even for a day, than to carry yourself.","pattern":"","blocks":[{"kind":"seat","name":"The Twin inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties your closest bonds were with people who needed no rescuing, and the partners who leaned on you faded within a season. From those years you built a way of loving side by side, with neither of you walking behind."}],"notes":["Love has no decade of its own. The pattern your Day Gate set is the one your love life keeps."],"byDecade":[],"byYear":[]},{"domain":"Growth","headline":"Your growth starts from a safe base.","intro":"One seat rules Growth in your chart. It sits in your Early Chapter.","lit":["zhengyin_year_branch"],"heavy":false,"pips":["water"],"hubLine":"Your growth starts from a safe base.","how":"You take your biggest steps from a secure position, with people behind you and a home to return to. Because safety came first in your life, you learn faster when you feel held, and you stall when people you do not trust try to hurry you. You put off a change until the support is in place.","pattern":"Underneath, you answer the years that weigh on you with study and the people who steady you, ending every heavy stretch more sure of who you are. In you the two sit at one gate, and you rarely meet a pressure without learning from it.","blocks":[{"kind":"seat","name":"The Sage inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"As a child you tried new things when someone you trusted stood close by, and you held back when nobody did. By your teens you were slower than your friends to try things away from home, because home felt so safe."},{"kind":"gap","label":"Late Chapter · 48 to now · no Growth seat.","text":"From your late forties, you grow by settling into who you are and by teaching what you know to the people after you, as each decade turns."}],"notes":[],"byDecade":[{"label":"A Twin decade · 2028 to 2037","text":"Self-reliance starts to pay. You teach yourself what you need, train beside equals who keep your pace, and end up more capable on your own terms."}],"byYear":[]},{"domain":"Mind","headline":"Your thinking changes character with each decade.","intro":"No seat rules Mind in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your thinking changes character with each decade.","how":"Your thinking takes its colour from each decade, studious in one and restless or practical in another. You notice the change in what you read before you notice it in yourself.","pattern":"Underneath, you turn pressure into understanding, and the hardest years of your life are the ones that taught you how to think. In you the two sit at one gate, and you rarely meet a pressure without learning from it.","blocks":[],"notes":[],"byDecade":[{"label":"A Virtuoso decade · 2018 to 2027 · now","text":"You argue with more of what you are told, and every rule you meet reads like a dare. You are calmest on the days you finish something sharp enough to show."}],"byYear":[{"label":"2026 · a Virtuoso year","text":"Your thinking sharpens against the ideas you are handed this year, finding flaws in what others accept faster than you can keep quiet about them."}]}],"blueprint":{"title":"A General structure · 七杀格","structure":{"reading":{"label":"","text":"Your chart answers to pressure, the hard test and the person who pushes back. You rise when the risk is real and the deadline is close. In the thick of a fight, you are at your steadiest.","draft":false},"rule":{"label":"","text":"A trace of Metal deep in your strongest seat shows on two of your stems. That makes the General the organising force of your life, and you answer to it more than to the Horizon who holds the seat.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"The pressure in your chart has a handle on it, and each hard test turns into proof of what you can do. Your nerve is what you lean on when the stakes climb.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Earth and Metal carry two thirds of your chart, and you live mostly through what you earn and what you answer to.","draft":false},"missing":[{"label":"no Virtuoso · your season asks for it too · it comes with your decade now, 2018 to 2027","text":"Arguing back is not your first reflex when a plan looks wrong. You follow the brief as written and raise objections late and politely, after the decision is made.","draft":false},{"label":"no Steward · your Steward decade 1998 to 2007 is lived","text":"You do the books when you must and not a day sooner. You handle money in bursts and forget it for months, leaning on a partner or a spreadsheet to keep track.","draft":false},{"label":"no Magistrate · your Magistrate decade 1978 to 1987 is lived","text":"You look to others to learn what the rules are. You borrow structure from a boss or a contract, and you work best once someone else has fixed the terms.","draft":false}],"seasonName":"十二月乙","season":{"label":"","text":"Late winter keeps you in a cold valley, a vine waiting under frost for the year to turn. The season asks for one thing only, Fire as a clear sun that brings spring back early to the valley floor. You flower before the rest of the year when that light reaches you clear of any rain.","draft":false},"needs":[]},"seen":{"plain":[{"label":"the General, twice","text":"You read as tough and hard to rattle, the person people send in when the stakes are high.","draft":false},{"label":"the Artisan","text":"You seem easygoing and warm, the friend who cooks for everyone and makes hard work look light.","draft":false}],"inside":[{"label":"the Sage","text":"Privately you want to be looked after and stay close to the people who once taught you.","draft":false},{"label":"the Horizon","text":"You keep a second plan that nobody has heard about and want more open roads than you admit.","draft":false},{"label":"the Twin","text":"In private you want to answer to nobody and would rather finish a job alone than wait for a hand.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[{"label":"The Artisan checks the General · 食神制杀","text":"You meet pressure by making things, and a hard week ends with finished work instead of worry.","draft":false},{"label":"Pressure feeds the Sage · 杀印相生","text":"You turn each hard test into something you know, leaving every demanding stretch with a qualification or a title you did not have before.","draft":false}],"bonds":[{"label":"Day joins Year · 亥卯","text":"Your first family stands behind the home you make, keeping their help close at hand while you build a household with a partner.","draft":false}],"noneHard":{"label":"","text":"You move from one chapter of your life to the next without a sharp break, because no clash, punishment or harm sits between your gates.","draft":false}}}},"familyGap":{"why":"R11: a reader aged 16 to 34 with a gap row","birth":{"year":2002,"month":6,"day":4,"hour":15,"location":"Beijing","gender":"male"},"hu":false,"age":24,"strength":"moderate","dayStem":"癸","pillars":[{"g":"year","stem":"壬","branch":"午"},{"g":"month","stem":"乙","branch":"巳"},{"g":"day","stem":"癸","branch":"卯"},{"g":"hour","stem":"庚","branch":"申"}],"positions":[{"id":"jiecai_year_stem","gate":"year","el":"water","kind":"stem","term":"The Rival at the Year Gate"},{"id":"piancai_year_branch","gate":"year","el":"fire","kind":"branch","term":"The Horizon inside the Year Gate"},{"id":"shishen_month_stem","gate":"month","el":"wood","kind":"stem","term":"The Artisan at the Month Gate"},{"id":"zhengcai_month_branch","gate":"month","el":"fire","kind":"branch","term":"The Steward inside the Month Gate"},{"id":"shishen_day_branch","gate":"day","el":"wood","kind":"branch","term":"The Artisan inside the Day Gate"},{"id":"zhengyin_hour_stem","gate":"hour","el":"metal","kind":"stem","term":"The Sage at the Hour Gate"},{"id":"zhengyin_hour_branch","gate":"hour","el":"metal","kind":"branch","term":"The Sage inside the Hour Gate"}],"seek":["earth","fire","wood","metal"],"ease":[],"domains":[{"domain":"Family","headline":"You become the host your family returns to.","intro":"Four seats rule Family in your chart. One sits in your Early Chapter, one in your Home Chapter and two in your Late Chapter.","lit":["piancai_year_branch","shishen_day_branch","zhengyin_hour_stem","zhengyin_hour_branch"],"heavy":true,"pips":["fire","wood","metal","metal"],"hubLine":"You become the host your family returns to.","how":"Your home is where your family ends up, for meals and holidays and the nights someone needs a bed. Because a full house makes you feel settled, you take on more hosting than anyone asks of you. Relatives treat your door as always open, and you rarely show them how tired you are by the end.","pattern":"","blocks":[{"kind":"seat","name":"The Horizon inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Through your first years your family lived far apart, and visits and calls did the work of living close. You grew up able to go months without seeing a relative and come back as close as before."},{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"Once you are past your mid-thirties, more of your family gathers at your house, and relatives and friends treat it as a second home. You become the relative everyone means when they say home, and quarrels in the family get settled over your meals."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2050 · in plain view · coming","text":"From your late forties the people after you look to you for guidance, and for cover when things fall apart. You give both with patience in these years, watching what you taught them carry on in their own lives."},{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2050 · coming","text":"The people after you gather around you from your late forties as a home base, the place they come back to for advice and support. You become the calm centre of a close family, taking their help as easily as they take yours."}],"notes":[],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Your household opened outward through travel, new relatives and friends who became family. You kept the door wide and gave generously to everyone who came through it."},{"label":"A Magistrate decade · 2023 to 2032 · now","text":"A proper place in the family comes to you, as the reliable one with a role and a duty. You earn a standing among your relatives that holds for years to come."},{"label":"A Sage decade · 2043 to 2052","text":"Family support reaches you as advice, practical help and a home base to come back to. You receive more care than you expected and return it in kind to the people who gave it."},{"label":"A Twin decade · 2073 to 2082","text":"Pride runs through your family, each person insisting on their own way and quarrelling over it. You come through by doing your part well and leaving others to theirs."}],"byYear":[{"label":"2026 · a Steward year","text":"You keep the household accounts this year and see to family property, holding the home in careful order."},{"label":"2027 · a Horizon year","text":"Your family life widens this year to relatives far away or newly met, drawing your time and money to people beyond your own door."},{"label":"2028 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."},{"label":"2030 · a Sage year","text":"Your home draws a relative's closer interest this year, with help and opinions that leave you more looked after than you asked to be."}]},{"domain":"Wealth","headline":"Your savings grow quietly, year after year.","intro":"Three seats rule Wealth in your chart. Two sit in your Early Chapter and one in your Rising Chapter.","lit":["jiecai_year_stem","piancai_year_branch","zhengcai_month_branch"],"heavy":true,"pips":["water","fire","fire"],"hubLine":"Your savings grow quietly, year after year.","how":"You save a part of everything you earn, and a steady rise in your accounts pleases you more than any sudden gain. Because security is what you are working for, you spend only after you have counted what will be left. Your caution keeps you safe, and a good year feels to you like relief more than joy.","pattern":"What you make turns into money more easily for you than for most, and the work that feels like play is the work that pays you best. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Rival at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Money in your family moved fast while you were growing up, won boldly and shared out among whoever was close. By your teens you matched your family's daring, spending what you had almost as soon as you had it."},{"kind":"seat","name":"The Horizon inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"When you were young the family's money came from moving, from work taken far off and trade that travelled. You looked past your own streets for every chance to earn, and a coin from a distance pleased you more than any from next door."},{"kind":"seat","name":"The Steward inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Even in lean months you have put money aside since your late teens, and your savings have grown more than people expected. You have turned down exciting offers that asked too much risk, and none of those refusals has cost you a night of sleep."}],"notes":["Your later gates hold no Wealth seat, so your decades set its course from here."],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Openings came your way, through a timely move, a chance offer or someone who knew someone. You grew bolder with money that reached you by routes regular pay never took."},{"label":"A Rival decade · 2063 to 2072","text":"Other people reach for your money through loans, shared costs and favours that do not all come back. You keep enough by setting your own share aside first and spending less on proving yourself."}],"byYear":[{"label":"2026 · a Steward year","text":"Your attention turns to bills, savings and the slow work of keeping accounts this year, until you know where each part of your money goes."},{"label":"2027 · a Horizon year","text":"Through a second job or an unexpected offer, you take in money by side doors this year and spread it across more ventures than usual."},{"label":"2032 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."}]},{"domain":"Health","headline":"Your body stays well on good food and rest.","intro":"Two seats rule Health in your chart. One sits in your Home Chapter and one in your Late Chapter.","lit":["shishen_day_branch","zhengyin_hour_branch"],"heavy":false,"pips":["wood","metal"],"hubLine":"Your body stays well on good food and rest.","how":"Your health runs on appetite and ease, and you are at your best in the seasons when meals at home are long and evenings are slow. Because pleasure is how your body recovers, a tense month with a partner shows first in how little you enjoy your food. You recover through ordinary comfort, a shared meal and an early night.","pattern":"","blocks":[{"kind":"gap","label":"Rising Chapter · 16 to now · no Health seat.","text":"From sixteen you run your body on the reserve your childhood gave you, as work and study come first and each decade sets your strength."},{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"From your mid-thirties your health settles around the table you share with a partner, around food you make and evenings with nothing planned. You stay well in the fullest of these years because you take the time to enjoy them."},{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2050 · coming","text":"From your late forties your body does well on gentle habits and the company of people who look after you. You hold your strength by learning something new each season, and a class or a guided walk does more for you than a hard workout."}],"notes":[],"byDecade":[{"label":"A General decade · 2033 to 2042","text":"You carry more pressure, and for once it suits your body. You will be fitter and sharper in demanding years than in easy ones, as long as you keep sleeping."},{"label":"A Sage decade · 2043 to 2052","text":"Support and good rest restore you, and strain lifts quickly. You sleep soundly, with an energy that holds because you let yourself be looked after."}],"byYear":[{"label":"2029 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."},{"label":"2030 · a Sage year","text":"This year you accept more looking after than you normally allow, leaning on shelter, quiet evenings and someone else's care."}]},{"domain":"Career","headline":"Every step you earn at work, you keep.","intro":"Two seats rule Career in your chart. Both sit in your Rising Chapter.","lit":["shishen_month_stem","zhengcai_month_branch"],"heavy":false,"pips":["wood","fire"],"hubLine":"Every step you earn at work, you keep.","how":"You do your best work in a job you can stay in and get better at, with clear tasks and fair pay. Because you value what you can explain and defend, you distrust shortcuts and the people who take them. Underrated in the early years of any role, you outlast most of the people who underrated you.","pattern":"You also rise by making more rather than by climbing, as each piece of work you finish brings the next one to your door. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Artisan at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Since your late teens the older people around you, a parent or a first boss, have taken your ease for a lack of drive. You have answered with finished work each time, and a craft of your own has grown out of the jobs you enjoyed."},{"kind":"seat","name":"The Steward inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Your working life has moved forward one step at a time since your late teens, with each job adding a skill you kept. Your pay has risen with every one of those skills, earned in full and owed to nobody."}],"notes":["Your later gates hold no Career seat, so your decades set its course from here."],"byDecade":[{"label":"A Magistrate decade · 2023 to 2032 · now","text":"Your work gains structure, a clear role with real responsibility. You are trusted with more than before, and the trust outlasts the work that earned it."},{"label":"A General decade · 2033 to 2042","text":"You take on hard assignments and real pressure, and you rise because of them. You come out with more authority than you went in with."},{"label":"An Alchemist decade · 2053 to 2062","text":"Unusual knowledge brings you work, through research, consulting or technical skill. Your name grows inside a small field, where you are the one people ask about what others do not know."},{"label":"A Rival decade · 2063 to 2072","text":"Rivalry over shared work drains your energy, and a joint effort takes more from you than it pays. You get through on work that is plainly yours, done where the people who matter can see it."}],"byYear":[{"label":"2026 · a Steward year","text":"Your pay tracks your effort this year, earned through the hours you put in and the details you get right."},{"label":"2028 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."},{"label":"2029 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2031 · an Alchemist year","text":"This year you learn more out of sight than you earn in plain view, with your work turned toward study and specialist skill."},{"label":"2032 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."}]},{"domain":"Social","headline":"Your easy manner wins you friends at work.","intro":"Two seats rule Social in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["jiecai_year_stem","shishen_month_stem"],"heavy":false,"pips":["water","wood"],"hubLine":"Your easy manner wins you friends at work.","how":"You put people at ease without trying, and a tense meeting turns friendly once you join it. Because food and good company are how you connect, you are the one who suggests lunch and turns up with something good on a long day. You know more people than you realise and rarely ask any of them for a favour.","pattern":"","blocks":[{"kind":"seat","name":"The Rival at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"As a child you shared what you had and competed for what you wanted, and other children gathered round you. By your teens you had a wide circle, and the friends closest to you were the ones you had raced hardest."},{"kind":"seat","name":"The Artisan at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Your closest friends at work since your late teens have come out of shared breaks and long evenings, the colleagues you ate with. Your jobs have come through those friends, each one offered over a meal before you started looking."}],"notes":["Your later gates hold no Social seat, so your decades set its course from here."],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Your circle spread wide, through moves, trips and friends of friends. Wherever you went, you met people easily, and doors kept opening through them."},{"label":"A Magistrate decade · 2023 to 2032 · now","text":"You hold standing among friends, and people ask your opinion before they decide. You become the steady one they count on, a role you take seriously."},{"label":"A Rival decade · 2063 to 2072","text":"Comparison creeps into your friendships, and you notice who earns more and who wins more. You win friends back by giving a share freely, and a fair split comes to matter more to you than the prize."},{"label":"A Twin decade · 2073 to 2082","text":"Company that truly matches you is scarce, and crowded groups wear you out quickly. You get through on your own strength, and prize a quiet evening over a full calendar."}],"byYear":[{"label":"2027 · a Horizon year","text":"You move easily this year between groups that never meet each other, carried there by chance meetings and introductions."},{"label":"2028 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."},{"label":"2032 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."}]},{"domain":"Mind","headline":"Your mind follows each decade until its own character arrives.","intro":"Two seats rule Mind in your chart. Both sit in your Late Chapter.","lit":["zhengyin_hour_stem","zhengyin_hour_branch"],"heavy":false,"pips":["metal","metal"],"hubLine":"Your mind follows each decade until its own character arrives.","how":"Your mind has its own character still to come, and for now each decade sets what you think about. You follow the questions your present years raise, one subject at a time.","pattern":"","blocks":[{"kind":"gap","label":"Rising Chapter · 16 to now · no Mind seat.","text":"Since sixteen you have learned by doing more than by study, with each decade choosing the questions your work and friendships bring you."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2050 · in plain view · coming","text":"Past your late forties the people after you bring you their questions, and you take care to teach them properly. You are quoted and asked for more than ever, and most yourself when someone leaves understanding more than they came with."},{"kind":"seat","name":"The Sage inside the Hour Gate","meta":"Late Chapter · from 48 · 2050 · coming","text":"From your late forties reading fills more of your days, and you remember more of it than you did in your busiest years. You take up study for its own sake, a course or a long book read slowly, with your judgement growing calmer and surer alongside it."}],"notes":[],"byDecade":[{"label":"A Sage decade · 2043 to 2052","text":"Learning comes easily, through books, good guides or a course taken at your own pace. Your thinking grows calmer and deeper, until you understand things you once rushed past."},{"label":"An Alchemist decade · 2053 to 2062","text":"Your intuition grows keen, and unusual ideas start to find a use. You become the person people bring a puzzle to, for the angle nobody else saw."}],"byYear":[{"label":"2030 · a Sage year","text":"You learn most this year when someone else sets the syllabus, with books, courses and a patient teacher filling your evenings."},{"label":"2031 · an Alchemist year","text":"You study alone this year, pulled toward odd, specialist subjects nobody nearby would think to ask about."}]},{"domain":"Love","headline":"You show love by making life easy.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["shishen_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"You show love by making life easy.","how":"You love by doing, the meal made and the evening kept free and the worry taken off someone's hands. Since giving comfort is how you feel close, you feel most loved by a partner who receives it gladly and gives some back. You give without keeping count and are the last of your friends to notice a partner who only takes.","pattern":"","blocks":[{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"Past your mid-thirties love settles into an easy rhythm with a partner who makes ordinary days pleasant. Your gift for ease comes back to you in these years, as a meal cooked for you or an evening planned around your rest."}],"notes":["Love has no decade of its own. It is read from your Day Gate alone."],"byDecade":[],"byYear":[]},{"domain":"Growth","headline":"Your growth keeps time with the decades for now.","intro":"One seat rules Growth in your chart. It sits in your Late Chapter.","lit":["zhengyin_hour_stem"],"heavy":false,"pips":["metal"],"hubLine":"Your growth keeps time with the decades for now.","how":"Your growth meets its own character later, and for now each decade sets the pace. You grow in step with the years you are in, changing when they ask it of you.","pattern":"","blocks":[{"kind":"gap","label":"Rising Chapter · 16 to now · no Growth seat.","text":"Since sixteen you have grown through work, friends and family more than through any plan to improve yourself, as each decade brings its own change."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2050 · in plain view · coming","text":"Your knowledge takes a lasting form from your late forties, a course or a set of notes or a body of advice. You take quiet pride in seeing it outlast your own part in it."}],"notes":[],"byDecade":[{"label":"A General decade · 2033 to 2042","text":"You grow fastest through pressure, a hard role or a challenge you choose on purpose. You will come out stronger in the places that used to hold you back."},{"label":"An Alchemist decade · 2053 to 2062","text":"Private study pays, and the things you taught yourself start to count. Your growth runs in directions nobody planned for you, toward work only you could do."},{"label":"A Twin decade · 2073 to 2082","text":"Comparison with peers drives you hard, and the standard you hold yourself to leaves you little slack. You will keep growing once the only measure you use is your own last best."}],"byYear":[{"label":"2029 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."},{"label":"2031 · an Alchemist year","text":"Out of public view, you grow more yourself this year through solitary study and interests nobody assigned you."}]}],"blueprint":{"title":"A Sage structure · 正印格","structure":{"reading":{"label":"","text":"Your chart rests on shelter and learning, on teachers who back you and places that look after their own. You do your best work where study is valued and someone senior vouches for you. You repay that care with years of loyalty.","draft":false},"rule":{"label":"","text":"The Metal held midway down your strongest seat shows on one of your stems. That gives the Sage the lead in your life, and you answer to it more than to the Steward who holds the seat.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"The support behind you frays at the edges, and your chart already holds what mends it. Your backing stays in place while your study goes on.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Fire and Wood carry two thirds of your chart, and you live mostly through what you earn and what you make.","draft":false},"missing":[{"label":"no Twin · it arrives with your decade 2073 to 2082","text":"Going it alone is never your first move. With a team or a close friend beside you, you find your footing faster and hold it longer.","draft":false},{"label":"no Virtuoso · no decade of yours brings it","text":"Arguing back is not your first reflex when a plan looks wrong. You follow the brief as written and raise objections late and politely, after the decision is made.","draft":false},{"label":"no Alchemist · your season asks for it too · it arrives with your decade 2053 to 2062","text":"Odd subjects and second thoughts rarely pull at you. You take knowledge as it is taught and act on a straight answer before you think to question it.","draft":false}],"seasonName":"四月癸","season":{"label":"","text":"The air heats around you in early summer, and a rain like you can dry out before it lands. Fine Metal is what the season wants first, a cool source that keeps you replenished, with heavier Metal as the second choice. You stay fresh through the hottest days with that source close by.","draft":false},"needs":[{"label":"support · 庚, the Sage · on show","text":"What you get from the Sage on show is its element feeding and steadying you, the nourishment a season low in it holds back.","draft":false}]},"seen":{"plain":[{"label":"the Rival","text":"To most people you look bold and openhanded, quick to share what you have and quicker to race for more.","draft":false},{"label":"the Artisan","text":"You seem easygoing and warm, the friend who cooks for everyone and makes hard work look light.","draft":false},{"label":"the Sage","text":"You look calm and well taught, someone a teacher or an older friend has clearly looked after.","draft":false}],"inside":[{"label":"the Horizon","text":"You keep a second plan that nobody has heard about and want more open roads than you admit.","draft":false},{"label":"the Steward","text":"You keep a private tally of what things cost and sleep better with something put aside.","draft":false},{"label":"the Artisan","text":"You want comfort more than you show, good food and an evening with nothing planned.","draft":false},{"label":"the Sage","text":"Privately you want to be looked after and stay close to the people who once taught you.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[{"label":"The maker’s economy · 食伤生财","text":"What you make sells without much pushing, and the best pay comes from projects you would have done for nothing.","draft":false}],"bonds":[{"label":"Hour punishes Month · 巳申刑","text":"You pass the pressure you put on yourself at work to the people you train, easing it once you see them repeat your hardest years.","draft":false}],"noneHard":null}}},"mixedCured":{"why":"R1: officers mixed, the cure already seated (M-1)","birth":{"year":1984,"month":8,"day":10,"hour":13,"location":"Beijing","gender":"male"},"hu":false,"age":42,"strength":"moderate","dayStem":"丙","pillars":[{"g":"year","stem":"甲","branch":"子"},{"g":"month","stem":"壬","branch":"申"},{"g":"day","stem":"丙","branch":"子"},{"g":"hour","stem":"乙","branch":"未"}],"positions":[{"id":"pianyin_year_stem","gate":"year","el":"wood","kind":"stem","term":"The Alchemist at the Year Gate"},{"id":"zhengguan_year_branch","gate":"year","el":"water","kind":"branch","term":"The Magistrate inside the Year Gate"},{"id":"qisha_month_stem","gate":"month","el":"water","kind":"stem","term":"The General at the Month Gate"},{"id":"piancai_month_branch","gate":"month","el":"metal","kind":"branch","term":"The Horizon inside the Month Gate"},{"id":"zhengguan_day_branch","gate":"day","el":"water","kind":"branch","term":"The Magistrate inside the Day Gate"},{"id":"zhengyin_hour_stem","gate":"hour","el":"wood","kind":"stem","term":"The Sage at the Hour Gate"},{"id":"shangguan_hour_branch","gate":"hour","el":"earth","kind":"branch","term":"The Virtuoso inside the Hour Gate"}],"seek":["wood","fire"],"ease":["water","metal","earth"],"domains":[{"domain":"Family","headline":"Your home runs on kept promises.","intro":"Four seats rule Family in your chart. One sits in your Early Chapter, one in your Home Chapter and two in your Late Chapter.","lit":["zhengguan_year_branch","zhengguan_day_branch","zhengyin_hour_stem","shangguan_hour_branch"],"heavy":true,"pips":["water","water","wood","earth"],"hubLine":"Your home runs on kept promises.","how":"You run your household on clear duties and fair rules, and the people in it know what to expect. Because order is how you protect the people you love, you notice a broken promise at home faster than a kind word. You know your family feels secure with you, and that some of them wish you were less strict.","pattern":"","blocks":[{"kind":"seat","name":"The Magistrate inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"You knew the rules of your first home without being told, and you rarely needed correcting. You came into your teens holding yourself to an older relative's standards as strictly as if they were your own."},{"kind":"seat","name":"The Magistrate inside the Day Gate","meta":"Home Chapter · 35 to 47 · now","text":"Your family life has been built on structure, with set routines, shared duties and arrangements that hold. When others forgot, you have been the one who kept the household's promises, and relatives on both sides have come to trust it."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2032 · in plain view · coming","text":"From your late forties the people after you look to you for guidance, and for cover when things fall apart. You give both with patience in these years, watching what you taught them carry on in their own lives."},{"kind":"seat","name":"The Virtuoso inside the Hour Gate","meta":"Late Chapter · from 48 · 2032 · coming","text":"From your late forties the people after you seek you out for talk they cannot get anywhere else. You become the one in your family who says what others will not, with more warmth than you once had."}],"notes":[],"byDecade":[{"label":"A Magistrate decade · 1994 to 2003","text":"Family duty weighed on you, with expectations that left you little say in your own life. You did what was asked of you well and came out of it with a respect you had earned."},{"label":"A Sage decade · 2014 to 2023","text":"Care and support surrounded you, from family who put your needs first and helped without being asked. Feeling protected, you found the nerve to take on more than before."},{"label":"A Twin decade · 2024 to 2033 · now","text":"Your household runs on shared effort, with each person carrying a fair part of the load. You pull your weight before anyone asks and meet every relative as one equal meets another."},{"label":"An Artisan decade · 2044 to 2053","text":"Indulgence runs the household, with treats, late meals and little order. You get through on the warmth itself, tiring less once the family learns to fend for itself."}],"byYear":[{"label":"2026 · a Twin year","text":"With siblings and cousins weighing in, you settle family matters this year between equals of your own age."},{"label":"2028 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."},{"label":"2030 · a Horizon year","text":"Your family life widens this year to relatives far away or newly met, drawing your time and money to people beyond your own door."},{"label":"2031 · a Steward year","text":"You keep the household accounts this year and see to family property, holding the home in careful order."},{"label":"2033 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."}]},{"domain":"Mind","headline":"Your mind works at an angle.","intro":"Three seats rule Mind in your chart. One sits in your Early Chapter and two in your Late Chapter.","lit":["pianyin_year_stem","zhengyin_hour_stem","shangguan_hour_branch"],"heavy":true,"pips":["wood","wood","earth"],"hubLine":"Your mind works at an angle.","how":"You come at problems from an unexpected direction, and the strange angle is the one you take. Because your mind took its own path from the start, a private hunch carries more weight with you than the method everyone else was taught. You trust your mind most when nobody else agrees with it.","pattern":"You also learn best when you can show what you learn, turning every course you finish into something you can say out loud. Your talent and your training sit at one gate, close enough that you rarely have to choose between them.","blocks":[{"kind":"seat","name":"The Alchemist at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"As a child you reached the right answer by routes nobody had shown you, working things out alone with a book or a puzzle. By your teens you were known as the clever one or the odd one, and both were true."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2032 · in plain view · coming","text":"Past your late forties the people after you bring you their questions, and you take care to teach them properly. You are quoted and asked for more than ever, and most yourself when someone leaves understanding more than they came with."},{"kind":"seat","name":"The Virtuoso inside the Hour Gate","meta":"Late Chapter · from 48 · 2032 · coming","text":"From your late forties your thinking turns bolder, and you question ideas you once took on trust. You lose sleep over an idea that grips you until you have said it out loud."}],"notes":[],"byDecade":[{"label":"An Alchemist decade · 2004 to 2013","text":"Strange subjects drew you in, and you learned through instinct and odd sources more than set courses. Your thinking grew original, built on hunches that later proved right."},{"label":"A Sage decade · 2014 to 2023","text":"Steady study suited you, and people who knew more than you gave your learning firm ground. You absorbed knowledge patiently, laying down much of what you know best."},{"label":"A Virtuoso decade · 2054 to 2063","text":"You argue with more of what you are told, and every rule you meet reads like a dare. You are calmest on the days you finish something sharp enough to show."}],"byYear":[{"label":"2029 · a Virtuoso year","text":"Your thinking sharpens against the ideas you are handed this year, finding flaws in what others accept faster than you can keep quiet about them."}]},{"domain":"Career","headline":"You build a career by spotting openings first.","intro":"Two seats rule Career in your chart. Both sit in your Rising Chapter.","lit":["qisha_month_stem","piancai_month_branch"],"heavy":false,"pips":["water","metal"],"hubLine":"You build a career by spotting openings first.","how":"You are drawn to work where timing matters, buying and selling or finding things before others notice them. Because you read change early, a job where nothing moves bores you, and you leave it sooner than you planned. In any role you end up as the person who sees what is coming next.","pattern":"Your boldest ideas and your patience for study also feed each other, with every qualification you earn making you braver in public. Your talent and your training sit at one gate, close enough that you rarely have to choose between them.","blocks":[{"kind":"seat","name":"The General at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"Through your Rising Chapter your reputation at work grew out of hard moments, the emergency handled or the project rescued. Your promotions came out of the worst weeks, each one earned by the nerve you showed when a project was close to failing."},{"kind":"seat","name":"The Horizon inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"In your twenties and early thirties your best jobs were the ones where you could spot a trend early, in trading or sales or finding the right people. With every move you widened your range of contacts, until chances reached you before anyone announced them."},{"kind":"gap","label":"Home Chapter · 35 to now · no Career seat.","text":"From your mid-thirties you fit work around the home and the life you have chosen, while each decade decides how far your career climbs."}],"notes":["Your later gates hold no Career seat, so your decades set its course from here."],"byDecade":[{"label":"A Magistrate decade · 1994 to 2003","text":"Rules and rank pressed on your work, and you followed procedure long after it stopped helping. Reliable to a fault, you were carried to better posts later by your record."},{"label":"An Alchemist decade · 2004 to 2013","text":"Unusual work suited you, the kind that needs odd knowledge and long hours alone. You became good at something few others understood, earning respect before it earned you anything else."},{"label":"A Rival decade · 2034 to 2043","text":"Joint efforts carry your work, and you do best inside a group with something to win. You compete hard, share credit fairly and keep the backing of the people beside you."},{"label":"An Artisan decade · 2044 to 2053","text":"Ambition softens, and the easy option keeps getting its way in your work. You keep moving on the worth of what you make and finish the pieces people are waiting to enjoy."},{"label":"A Virtuoso decade · 2054 to 2063","text":"Authority pushes back on you, and a frank remark costs more than it used to. You do better outside a strict chain of command, where work in your own voice carries you through."}],"byYear":[{"label":"2027 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."},{"label":"2028 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."},{"label":"2029 · a Virtuoso year","text":"Sure of your skill and short with the rules, you say out loud this year what colleagues only grumble about."},{"label":"2031 · a Steward year","text":"Your pay tracks your effort this year, earned through the hours you put in and the details you get right."},{"label":"2032 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2033 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."}]},{"domain":"Social","headline":"Your friendships are tested before they are trusted.","intro":"Two seats rule Social in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["pianyin_year_stem","qisha_month_stem"],"heavy":false,"pips":["wood","water"],"hubLine":"Your friendships are tested before they are trusted.","how":"You size up new people by how they act when something goes wrong, and you warm to anyone who keeps their nerve. Because you trust only what has been tested, light talk at a party feels like a waste of your evening. Your friendships are few and serious, and loyalty under strain is the one test you set.","pattern":"","blocks":[{"kind":"seat","name":"The Alchemist at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Other children took a while to warm to you, because you stood at the edge of each group for a long time before you joined it. By your teens you had one or two close friends who understood you, and they were enough for you."},{"kind":"seat","name":"The General at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"In your Rising Chapter your closest friends were the people you worked hardest beside, in a tough job or a demanding team. You came out of each hard stretch with an ally who answered your call at any hour."}],"notes":["Your later gates hold no Social seat, so your decades set its course from here."],"byDecade":[{"label":"A Magistrate decade · 1994 to 2003","text":"What was proper ruled your social life, and you kept company with people you were expected to know. You were respected and a little lonely, held up by a role that gave you standing among them."},{"label":"A Twin decade · 2024 to 2033 · now","text":"Friendship settles into a circle of equals, people with lives and strength of their own. You trust that small, solid circle more than any crowd."},{"label":"A Rival decade · 2034 to 2043","text":"Rivalry turns friendly, and the people who compete with you end up on your side. Your friendships stay busy and fair, with every win shared and every loss taken well."},{"label":"A Virtuoso decade · 2054 to 2063","text":"Bluntness strains your friendships, and some people hear an attack where you meant wit. You will steady yourself by giving that edge a stage, a talk or a page where sharpness is the point."}],"byYear":[{"label":"2026 · a Twin year","text":"Among friends this year, you spend more time with peers who do what you do than with anyone who looks up to you."},{"label":"2027 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."},{"label":"2029 · a Virtuoso year","text":"Your conversations with friends grow sharper and wittier this year, until you are the one your circle quotes the next day."},{"label":"2030 · a Horizon year","text":"You move easily this year between groups that never meet each other, carried there by chance meetings and introductions."},{"label":"2033 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."}]},{"domain":"Growth","headline":"You grow best inside a clear structure.","intro":"Two seats rule Growth in your chart. One sits in your Early Chapter and one in your Late Chapter.","lit":["zhengguan_year_branch","zhengyin_hour_stem"],"heavy":false,"pips":["water","wood"],"hubLine":"You grow best inside a clear structure.","how":"You grow by finishing what you start, the course completed and the level passed and the standard met. Because order is where you first felt secure, you do well wherever the steps are clear and lose heart when they are not. You climb steadily, further in the end than people who started faster.","pattern":"Underneath, you answer the years that weigh on you with study and the people who steady you, ending every heavy stretch more sure of who you are.","blocks":[{"kind":"seat","name":"The Magistrate inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Through your first school years you built a record of steady progress, each year finished well and responsibilities taken on early. By fifteen you were the one the adults in charge trusted with a role, measuring your growth by the steps you had completed."},{"kind":"seat","name":"The Sage at the Hour Gate","meta":"Late Chapter · from 48 · 2032 · in plain view · coming","text":"Your knowledge takes a lasting form from your late forties, a course or a set of notes or a body of advice. You take quiet pride in seeing it outlast your own part in it."}],"notes":[],"byDecade":[{"label":"An Alchemist decade · 2004 to 2013","text":"Unconventional paths taught you most, a strange course, a self-taught skill or an expert nobody else had heard of. You developed in your own direction, and the difference became your strength."},{"label":"A Twin decade · 2024 to 2033 · now","text":"Self-reliance starts to pay. You teach yourself what you need, train beside equals who keep your pace, and end up more capable on your own terms."}],"byYear":[{"label":"2026 · a Twin year","text":"This year you see your own shape by working alongside equals, leaning less on anyone's approval and more on your own judgement."},{"label":"2032 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."}]},{"domain":"Wealth","headline":"Your money comes in strong seasons and quiet ones.","intro":"One seat rules Wealth in your chart. It sits in your Rising Chapter.","lit":["piancai_month_branch"],"heavy":false,"pips":["metal"],"hubLine":"Your money comes in strong seasons and quiet ones.","how":"You earn in bursts, a run of good months and a quiet stretch after. Because each good season makes you sure of the next, you spend the winnings on a new chance before you have kept any. You are richer in the middle of each good stretch than after it.","pattern":"What you make turns into money more easily for you than for most, and the work that feels like play is the work that pays you best.","blocks":[{"kind":"seat","name":"The Horizon inside the Month Gate","meta":"Rising Chapter · 16 to 3
