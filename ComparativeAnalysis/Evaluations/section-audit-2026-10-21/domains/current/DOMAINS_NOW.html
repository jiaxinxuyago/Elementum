alse,"pips":["metal"],"hubLine":"You love best as an equal, or not at all.","how":"You want a partner with a full life of their own, and you go cold on anyone who needs you to lead. Because standing level is how you feel respected, you keep your own friends, money and plans inside the relationship. You find it harder to be carried, even for a day, than to carry yourself.","pattern":"","blocks":[{"kind":"seat","name":"The Twin inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties your closest bonds were with people who needed no rescuing, and the partners who leaned on you faded within a season. From those years you built a way of loving side by side, with neither of you walking behind."}],"notes":["Love has no decade of its own. The pattern your Day Gate set is the one your love life keeps."],"byDecade":[],"byYear":[]},{"domain":"Growth","headline":"Your growth keeps the pace of each decade.","intro":"No seat rules Growth in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your growth keeps the pace of each decade.","how":"Your growth moves at the speed of the decade you are in. You change fast in some decades and stand still in others, and only once one ends do you see which kind it was.","pattern":"","blocks":[],"notes":[],"byDecade":[{"label":"An Alchemist decade · 1988 to 1997","text":"Unconventional paths taught you most, a strange course, a self-taught skill or an expert nobody else had heard of. You developed in your own direction, and the difference became your strength."},{"label":"A General decade · 2008 to 2017","text":"The tests outran the lessons, with one hard stretch after another. On sheer refusal to stop, you kept going and came out tougher and more tired than you expected."}],"byYear":[{"label":"2027 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."}]}],"blueprint":{"title":"A Virtuoso structure · 伤官格","structure":{"reading":{"label":"","text":"Your chart turns on a sharp voice and a talent that refuses to sit quietly. You shine where you are judged on what you can do, on a stage or under your own name. When nobody stands over you, you do your finest work.","draft":false},"rule":{"label":"","text":"The Virtuoso who holds your strongest seat also shows on one of your stems. That makes it the organising force of your life, and you answer to it before anything else.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"Something in your chart pushes back against your voice, and your chart already has the reply. You keep your edge without paying for every sharp remark.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Water alone carries more than half of your chart, and you live mostly through what you make.","draft":false},"missing":[{"label":"no Horizon · it arrives with your decade 2028 to 2037","text":"Offers you did not chase seldom find you, and side doors stay shut until you knock. You earn by the front route, one job at a time, trusting what you worked for over a windfall.","draft":false},{"label":"no General · your General decade 2008 to 2017 is lived","text":"You keep your own pace, with no hard test set for you and no date you cannot move. You learn how strong you are only when pressure comes from outside.","draft":false},{"label":"no Alchemist · your Alchemist decade 1988 to 1997 is lived","text":"Odd subjects and second thoughts rarely pull at you. You take knowledge as it is taught and act on a straight answer before you think to question it.","draft":false}],"seasonName":"十月辛","season":{"label":"","text":"Early winter opens with a short false spring before the cold comes down on you. It asks first for flowing Water to keep you washed and bright, and then for the sun's Fire to warm you as the days shorten. You glint at your best in that brief warmth, and you carry the shine into the cold.","draft":false},"needs":[{"label":"first need · 壬, the Virtuoso · on show","text":"You carry the Virtuoso openly on a stem, and its element cuts a channel for the force your season keeps pent up in you.","draft":false},{"label":"second need · 丙, the Magistrate · on show","text":"In plain sight, you have the Magistrate giving your element form and measure, an order that a season without it never sets.","draft":false},{"label":"support · 戊, the Sage · hidden deep","text":"Deep inside one branch, you hold a little of the Sage, a faint source that still feeds your element when the season starves it.","draft":false}]},"seen":{"plain":[{"label":"the Virtuoso","text":"You strike people as quick and outspoken, the one who says what the rest of the meeting was thinking.","draft":false},{"label":"the Twin","text":"You come across as someone who carries their own weight and asks for little help.","draft":false},{"label":"the Magistrate","text":"You present as reliable and correct, the person others trust to follow the rules and keep their word.","draft":false}],"inside":[{"label":"the Artisan","text":"You want comfort more than you show, good food and an evening with nothing planned.","draft":false},{"label":"the Virtuoso","text":"You rewrite other people's work in your head and want your talent noticed without having to point to it.","draft":false},{"label":"the Twin","text":"In private you want to answer to nobody and would rather finish a job alone than wait for a hand.","draft":false},{"label":"the Rival","text":"You keep score with the people closest to you, and you want to win more than you let on.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[],"bonds":[{"label":"Hour harms Month · 申亥害","text":"Your work rubs at the people after you in small ways, a missed evening or a forgotten promise that you make up to them in person.","draft":false},{"label":"Hour joins Year · 子申","text":"Through your later years, you have taken up something your first family started and built on it beside the people after you.","draft":false}],"noneHard":null}}},"noHour":{"why":"R5: no birth hour","birth":{"year":2002,"month":6,"day":4,"hour":15,"location":"Beijing","gender":"male"},"hu":true,"age":24,"strength":"moderate","dayStem":"癸","pillars":[{"g":"year","stem":"壬","branch":"午"},{"g":"month","stem":"乙","branch":"巳"},{"g":"day","stem":"癸","branch":"卯"},null],"positions":[{"id":"jiecai_year_stem","gate":"year","el":"water","kind":"stem","term":"The Rival at the Year Gate"},{"id":"piancai_year_branch","gate":"year","el":"fire","kind":"branch","term":"The Horizon inside the Year Gate"},{"id":"shishen_month_stem","gate":"month","el":"wood","kind":"stem","term":"The Artisan at the Month Gate"},{"id":"zhengcai_month_branch","gate":"month","el":"fire","kind":"branch","term":"The Steward inside the Month Gate"},{"id":"shishen_day_branch","gate":"day","el":"wood","kind":"branch","term":"The Artisan inside the Day Gate"}],"seek":["earth","fire","wood","metal"],"ease":[],"domains":[{"domain":"Wealth","headline":"Your savings grow quietly, year after year.","intro":"Three seats rule Wealth in your chart. Two sit in your Early Chapter and one in your Rising Chapter.","lit":["jiecai_year_stem","piancai_year_branch","zhengcai_month_branch"],"heavy":true,"pips":["water","fire","fire"],"hubLine":"Your savings grow quietly, year after year.","how":"You save a part of everything you earn, and a steady rise in your accounts pleases you more than any sudden gain. Because security is what you are working for, you spend only after you have counted what will be left. Your caution keeps you safe, and a good year feels to you like relief more than joy.","pattern":"What you make turns into money more easily for you than for most, and the work that feels like play is the work that pays you best. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Rival at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Money in your family moved fast while you were growing up, won boldly and shared out among whoever was close. By your teens you matched your family's daring, spending what you had almost as soon as you had it."},{"kind":"seat","name":"The Horizon inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"When you were young the family's money came from moving, from work taken far off and trade that travelled. You looked past your own streets for every chance to earn, and a coin from a distance pleased you more than any from next door."},{"kind":"seat","name":"The Steward inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Even in lean months you have put money aside since your late teens, and your savings have grown more than people expected. You have turned down exciting offers that asked too much risk, and none of those refusals has cost you a night of sleep."}],"notes":["Your Hour Gate is closed, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Openings came your way, through a timely move, a chance offer or someone who knew someone. You grew bolder with money that reached you by routes regular pay never took."},{"label":"A Rival decade · 2063 to 2072","text":"Other people reach for your money through loans, shared costs and favours that do not all come back. You keep enough by setting your own share aside first and spending less on proving yourself."}],"byYear":[{"label":"2026 · a Steward year","text":"Your attention turns to bills, savings and the slow work of keeping accounts this year, until you know where each part of your money goes."},{"label":"2027 · a Horizon year","text":"Through a second job or an unexpected offer, you take in money by side doors this year and spread it across more ventures than usual."},{"label":"2032 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."}]},{"domain":"Career","headline":"Every step you earn at work, you keep.","intro":"Two seats rule Career in your chart. Both sit in your Rising Chapter.","lit":["shishen_month_stem","zhengcai_month_branch"],"heavy":true,"pips":["wood","fire"],"hubLine":"Every step you earn at work, you keep.","how":"You do your best work in a job you can stay in and get better at, with clear tasks and fair pay. Because you value what you can explain and defend, you distrust shortcuts and the people who take them. Underrated in the early years of any role, you outlast most of the people who underrated you.","pattern":"You also rise by making more rather than by climbing, as each piece of work you finish brings the next one to your door. Because making and earning share a gate, you barely see a line between your craft and your income.","blocks":[{"kind":"seat","name":"The Artisan at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Since your late teens the older people around you, a parent or a first boss, have taken your ease for a lack of drive. You have answered with finished work each time, and a craft of your own has grown out of the jobs you enjoyed."},{"kind":"seat","name":"The Steward inside the Month Gate","meta":"Rising Chapter · 16 to 34 · now","text":"Your working life has moved forward one step at a time since your late teens, with each job adding a skill you kept. Your pay has risen with every one of those skills, earned in full and owed to nobody."}],"notes":["Your Hour Gate is closed, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A Magistrate decade · 2023 to 2032 · now","text":"Your work gains structure, a clear role with real responsibility. You are trusted with more than before, and the trust outlasts the work that earned it."},{"label":"A General decade · 2033 to 2042","text":"You take on hard assignments and real pressure, and you rise because of them. You come out with more authority than you went in with."},{"label":"An Alchemist decade · 2053 to 2062","text":"Unusual knowledge brings you work, through research, consulting or technical skill. Your name grows inside a small field, where you are the one people ask about what others do not know."},{"label":"A Rival decade · 2063 to 2072","text":"Rivalry over shared work drains your energy, and a joint effort takes more from you than it pays. You get through on work that is plainly yours, done where the people who matter can see it."}],"byYear":[{"label":"2026 · a Steward year","text":"Your pay tracks your effort this year, earned through the hours you put in and the details you get right."},{"label":"2028 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."},{"label":"2029 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2031 · an Alchemist year","text":"This year you learn more out of sight than you earn in plain view, with your work turned toward study and specialist skill."},{"label":"2032 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."}]},{"domain":"Family","headline":"You become the host your family returns to.","intro":"Two seats rule Family in your chart. One sits in your Early Chapter and one in your Home Chapter.","lit":["piancai_year_branch","shishen_day_branch"],"heavy":false,"pips":["fire","wood"],"hubLine":"You become the host your family returns to.","how":"Your home is where your family ends up, for meals and holidays and the nights someone needs a bed. Because a full house makes you feel settled, you take on more hosting than anyone asks of you. Relatives treat your door as always open, and you rarely show them how tired you are by the end.","pattern":"","blocks":[{"kind":"seat","name":"The Horizon inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Through your first years your family lived far apart, and visits and calls did the work of living close. You grew up able to go months without seeing a relative and come back as close as before."},{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"Once you are past your mid-thirties, more of your family gathers at your house, and relatives and friends treat it as a second home. You become the relative everyone means when they say home, and quarrels in the family get settled over your meals."}],"notes":["Your Hour Gate is closed, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Your household opened outward through travel, new relatives and friends who became family. You kept the door wide and gave generously to everyone who came through it."},{"label":"A Magistrate decade · 2023 to 2032 · now","text":"A proper place in the family comes to you, as the reliable one with a role and a duty. You earn a standing among your relatives that holds for years to come."},{"label":"A Sage decade · 2043 to 2052","text":"Family support reaches you as advice, practical help and a home base to come back to. You receive more care than you expected and return it in kind to the people who gave it."},{"label":"A Twin decade · 2073 to 2082","text":"Pride runs through your family, each person insisting on their own way and quarrelling over it. You come through by doing your part well and leaving others to theirs."}],"byYear":[{"label":"2026 · a Steward year","text":"You keep the household accounts this year and see to family property, holding the home in careful order."},{"label":"2027 · a Horizon year","text":"Your family life widens this year to relatives far away or newly met, drawing your time and money to people beyond your own door."},{"label":"2028 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."},{"label":"2030 · a Sage year","text":"Your home draws a relative's closer interest this year, with help and opinions that leave you more looked after than you asked to be."}]},{"domain":"Social","headline":"Your easy manner wins you friends at work.","intro":"Two seats rule Social in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["jiecai_year_stem","shishen_month_stem"],"heavy":false,"pips":["water","wood"],"hubLine":"Your easy manner wins you friends at work.","how":"You put people at ease without trying, and a tense meeting turns friendly once you join it. Because food and good company are how you connect, you are the one who suggests lunch and turns up with something good on a long day. You know more people than you realise and rarely ask any of them for a favour.","pattern":"","blocks":[{"kind":"seat","name":"The Rival at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"As a child you shared what you had and competed for what you wanted, and other children gathered round you. By your teens you had a wide circle, and the friends closest to you were the ones you had raced hardest."},{"kind":"seat","name":"The Artisan at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · now","text":"Your closest friends at work since your late teens have come out of shared breaks and long evenings, the colleagues you ate with. Your jobs have come through those friends, each one offered over a meal before you started looking."}],"notes":["Your Hour Gate is closed, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A Horizon decade · 2013 to 2022","text":"Your circle spread wide, through moves, trips and friends of friends. Wherever you went, you met people easily, and doors kept opening through them."},{"label":"A Magistrate decade · 2023 to 2032 · now","text":"You hold standing among friends, and people ask your opinion before they decide. You become the steady one they count on, a role you take seriously."},{"label":"A Rival decade · 2063 to 2072","text":"Comparison creeps into your friendships, and you notice who earns more and who wins more. You win friends back by giving a share freely, and a fair split comes to matter more to you than the prize."},{"label":"A Twin decade · 2073 to 2082","text":"Company that truly matches you is scarce, and crowded groups wear you out quickly. You get through on your own strength, and prize a quiet evening over a full calendar."}],"byYear":[{"label":"2027 · a Horizon year","text":"You move easily this year between groups that never meet each other, carried there by chance meetings and introductions."},{"label":"2028 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."},{"label":"2032 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."}]},{"domain":"Health","headline":"Your body stays well on good food and rest.","intro":"One seat rules Health in your chart. It sits in your Home Chapter.","lit":["shishen_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"Your body stays well on good food and rest.","how":"Your health runs on appetite and ease, and you are at your best in the seasons when meals at home are long and evenings are slow. Because pleasure is how your body recovers, a tense month with a partner shows first in how little you enjoy your food. You recover through ordinary comfort, a shared meal and an early night.","pattern":"","blocks":[{"kind":"gap","label":"Rising Chapter · 16 to now · no Health seat.","text":"From sixteen you run your body on the reserve your childhood gave you, as work and study come first and each decade sets your strength."},{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"From your mid-thirties your health settles around the table you share with a partner, around food you make and evenings with nothing planned. You stay well in the fullest of these years because you take the time to enjoy them."}],"notes":["Your Hour Gate is closed, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A General decade · 2033 to 2042","text":"You carry more pressure, and for once it suits your body. You will be fitter and sharper in demanding years than in easy ones, as long as you keep sleeping."},{"label":"A Sage decade · 2043 to 2052","text":"Support and good rest restore you, and strain lifts quickly. You sleep soundly, with an energy that holds because you let yourself be looked after."}],"byYear":[{"label":"2029 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."},{"label":"2030 · a Sage year","text":"This year you accept more looking after than you normally allow, leaning on shelter, quiet evenings and someone else's care."}]},{"domain":"Love","headline":"You show love by making life easy.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["shishen_day_branch"],"heavy":false,"pips":["wood"],"hubLine":"You show love by making life easy.","how":"You love by doing, the meal made and the evening kept free and the worry taken off someone's hands. Since giving comfort is how you feel close, you feel most loved by a partner who receives it gladly and gives some back. You give without keeping count and are the last of your friends to notice a partner who only takes.","pattern":"","blocks":[{"kind":"seat","name":"The Artisan inside the Day Gate","meta":"Home Chapter · from 35 · 2037 · coming","text":"Past your mid-thirties love settles into an easy rhythm with a partner who makes ordinary days pleasant. Your gift for ease comes back to you in these years, as a meal cooked for you or an evening planned around your rest."}],"notes":["Love has no decade of its own. It is read from your Day Gate alone."],"byDecade":[],"byYear":[]},{"domain":"Mind","headline":"Your thinking changes character with each decade.","intro":"No seat rules Mind in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your thinking changes character with each decade.","how":"Your thinking takes its colour from each decade, studious in one and restless or practical in another. You notice the change in what you read before you notice it in yourself.","pattern":"","blocks":[],"notes":["Your Hour Gate can hold a Mind seat, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A Sage decade · 2043 to 2052","text":"Learning comes easily, through books, good guides or a course taken at your own pace. Your thinking grows calmer and deeper, until you understand things you once rushed past."},{"label":"An Alchemist decade · 2053 to 2062","text":"Your intuition grows keen, and unusual ideas start to find a use. You become the person people bring a puzzle to, for the angle nobody else saw."}],"byYear":[{"label":"2030 · a Sage year","text":"You learn most this year when someone else sets the syllabus, with books, courses and a patient teacher filling your evenings."},{"label":"2031 · an Alchemist year","text":"You study alone this year, pulled toward odd, specialist subjects nobody nearby would think to ask about."}]},{"domain":"Growth","headline":"Your growth keeps the pace of each decade.","intro":"No seat rules Growth in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your growth keeps the pace of each decade.","how":"Your growth moves at the speed of the decade you are in. You change fast in some decades and stand still in others, and only once one ends do you see which kind it was.","pattern":"","blocks":[],"notes":["Your Hour Gate can hold a Growth seat, and your Late Chapter opens once you add your birth hour."],"byDecade":[{"label":"A General decade · 2033 to 2042","text":"You grow fastest through pressure, a hard role or a challenge you choose on purpose. You will come out stronger in the places that used to hold you back."},{"label":"An Alchemist decade · 2053 to 2062","text":"Private study pays, and the things you taught yourself start to count. Your growth runs in directions nobody planned for you, toward work only you could do."},{"label":"A Twin decade · 2073 to 2082","text":"Comparison with peers drives you hard, and the standard you hold yourself to leaves you little slack. You will keep growing once the only measure you use is your own last best."}],"byYear":[{"label":"2029 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."},{"label":"2031 · an Alchemist year","text":"Out of public view, you grow more yourself this year through solitary study and interests nobody assigned you."}]}],"blueprint":{"title":"A Steward structure · 正财格","structure":{"reading":{"label":"","text":"Your chart is built around money kept and value earned. You do best when the work in front of you has a clear return, and you trust a slow sure gain over a fast one.","draft":false},"rule":{"label":"","text":"Nothing hidden in your strongest seat shows on your stems. The Steward who holds it is the organising force of your life, and you answer to it first.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"A pull on what you earn sits in your chart beside the lock that already holds it shut. What you have built stays put, whoever comes asking for it.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Fire and Wood carry two thirds of your chart, and you live mostly through what you earn and what you make.","draft":false},"missing":[{"label":"not in your three known pillars · your Hour Gate could hold it · it arrives with your decade 2073 to 2082","text":"The Twin does not show in your Year, Month or Day Gate, and the Hour Gate your birth time would open could still hold it. For now you think problems through with someone at your side before you carry them alone.","draft":false},{"label":"not in your three known pillars · your Hour Gate could hold it · no decade of yours brings it","text":"The Virtuoso is absent from the gates your birth date fills, and the Hour Gate stays dark until your birth time is set. Until then you take a plan as given and save your objections for after the decision.","draft":false},{"label":"not in your three known pillars · your Hour Gate could hold it · your season asks for it too · it arrives with your decade 2053 to 2062","text":"The Alchemist is not among the stems and branches your birth date gives, and whether the Hour Gate holds it waits on your birth time. In the meantime you take what you are taught at face value and act on it before any doubt arrives.","draft":false}],"seasonName":"四月癸","season":{"label":"","text":"The air heats around you in early summer, and a rain like you can dry out before it lands. Fine Metal is what the season wants first, a cool source that keeps you replenished, with heavier Metal as the second choice. You stay fresh through the hottest days with that source close by.","draft":false},"needs":[{"label":"support · 庚, the Sage · hidden deep","text":"Deep inside one branch, you hold a little of the Sage, a faint source that still feeds your element when the season starves it.","draft":false}]},"seen":{"plain":[{"label":"the Rival","text":"To most people you look bold and openhanded, quick to share what you have and quicker to race for more.","draft":false},{"label":"the Artisan","text":"You seem easygoing and warm, the friend who cooks for everyone and makes hard work look light.","draft":false}],"inside":[{"label":"the Horizon","text":"You keep a second plan that nobody has heard about and want more open roads than you admit.","draft":false},{"label":"the Steward","text":"You keep a private tally of what things cost and sleep better with something put aside.","draft":false},{"label":"the Artisan","text":"You want comfort more than you show, good food and an evening with nothing planned.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[{"label":"The maker’s economy · 食伤生财","text":"What you make sells without much pushing, and the best pay comes from projects you would have done for nothing.","draft":false}],"bonds":[],"noneHard":{"label":"","text":"You move from one chapter of your life to the next without a sharp break, because no clash, punishment or harm sits between your gates.","draft":false}}}},"seasonCond":{"why":"R4: 十月丙 half Water, told it needs 壬 (穷通宝鉴: 火旺用壬)","birth":{"year":1971,"month":11,"day":16,"hour":23,"location":"Beijing","gender":"male"},"hu":false,"age":54,"strength":"weak","dayStem":"丙","pillars":[{"g":"year","stem":"辛","branch":"亥"},{"g":"month","stem":"己","branch":"亥"},{"g":"day","stem":"丙","branch":"午"},{"g":"hour","stem":"戊","branch":"子"}],"positions":[{"id":"zhengcai_year_stem","gate":"year","el":"metal","kind":"stem","term":"The Steward at the Year Gate"},{"id":"qisha_year_branch","gate":"year","el":"water","kind":"branch","term":"The General inside the Year Gate"},{"id":"shangguan_month_stem","gate":"month","el":"earth","kind":"stem","term":"The Virtuoso at the Month Gate"},{"id":"qisha_month_branch","gate":"month","el":"water","kind":"branch","term":"The General inside the Month Gate"},{"id":"jiecai_day_branch","gate":"day","el":"fire","kind":"branch","term":"The Rival inside the Day Gate"},{"id":"shishen_hour_stem","gate":"hour","el":"earth","kind":"stem","term":"The Artisan at the Hour Gate"},{"id":"zhengguan_hour_branch","gate":"hour","el":"water","kind":"branch","term":"The Magistrate inside the Hour Gate"}],"seek":["wood","fire"],"ease":["water","earth","metal"],"domains":[{"domain":"Family","headline":"Your family trusts your word completely.","intro":"Four seats rule Family in your chart. Two sit in your Early Chapter and two in your Late Chapter.","lit":["zhengcai_year_stem","qisha_year_branch","shishen_hour_stem","zhengguan_hour_branch"],"heavy":true,"pips":["metal","water","earth","water"],"hubLine":"Your family trusts your word completely.","how":"You serve your family by keeping its word, the promise honoured and the duty done on time. Because a role is how you know your place, you take the formal jobs in the family that others avoid. You hold that word more carefully than your own feelings, and the family builds on it.","pattern":"","blocks":[{"kind":"seat","name":"The Steward at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Someone in your first home kept the household running on plans and a careful budget, and you watched closely. By your teens you were the child trusted with the money, the keys or the younger ones."},{"kind":"seat","name":"The General inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Through your first years at home you carried a weight few people saw, hard stretches and heavy demands and worries beyond your age. By your teens you were the one your family turned to in a hard week, holding firm without being asked."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"You have become the relative who hosts since your late forties, the one whose table the people after you head for first. You see your own habits of ease in how they now treat their guests, down to the second helping."},{"kind":"seat","name":"The Magistrate inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Since your late forties the people after you have taken your word as settled, and they have built their plans on the promises you made them. You have kept every one of them, which has given you a standing in the family that no title could."}],"notes":[],"byDecade":[{"label":"A Twin decade · 1994 to 2003","text":"Standing level with your relatives made you an equal at home, with a voice that counted as much as anyone's. You stood on your own feet, and nobody in the family spoke over you."},{"label":"A Sage decade · 2004 to 2013","text":"Care and support surrounded you, from family who put your needs first and helped without being asked. Feeling protected, you found the nerve to take on more than before."},{"label":"A Magistrate decade · 2024 to 2033 · now","text":"Obligations at home pile up, with duties to the people who rely on you and a family name to uphold. You meet them faithfully while guarding a part of your life that belongs to you alone."},{"label":"A Steward decade · 2044 to 2053","text":"Keeping the household in order weighs on you, and you carry more of the load than anyone else. You lean on the routines you built until the family sees the weight and takes some of it."}],"byYear":[{"label":"2026 · a Twin year","text":"With siblings and cousins weighing in, you settle family matters this year between equals of your own age."},{"label":"2028 · an Artisan year","text":"This year you cook, host and make the place feel lived in, with home gathering around food and easy company."},{"label":"2030 · a Horizon year","text":"Your family life widens this year to relatives far away or newly met, drawing your time and money to people beyond your own door."},{"label":"2031 · a Steward year","text":"You keep the household accounts this year and see to family property, holding the home in careful order."},{"label":"2033 · a Magistrate year","text":"You carry family duties in full view of your relatives this year, from the paperwork and signatures to speaking for the household."}]},{"domain":"Career","headline":"You do your best work under real pressure.","intro":"Three seats rule Career in your chart. Two sit in your Rising Chapter and one in your Late Chapter.","lit":["shangguan_month_stem","qisha_month_branch","shishen_hour_stem"],"heavy":true,"pips":["earth","water","earth"],"hubLine":"You do your best work under real pressure.","how":"You pick the job with the highest stakes and the tightest deadlines, and you are at your sharpest when it is going badly for everyone else. Because pressure is how you prove yourself to yourself, calm work leaves you flat and restless. What you build fastest is respect, and what you lose first is rest.","pattern":"","blocks":[{"kind":"seat","name":"The Virtuoso at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"From sixteen to your mid-thirties bosses either backed you fully or tried to slow you down, and few stayed neutral about you. You did your best work for the ones who believed in you and outstayed most of the ones who did not."},{"kind":"seat","name":"The General inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"From your late teens to your mid-thirties you asked for the hard assignment, the failing project or the client nobody else could handle. You came out of each crisis more trusted, until the hardest work reached you first."},{"kind":"seat","name":"The Artisan at the Hour Gate","meta":"Late Chapter · 48 on · in plain view · now","text":"Since your late forties your work has turned toward making, hosting and finishing the projects you had put off for years. You have made some of your best things in this stretch, better received than anything from your busier decades."}],"notes":[],"byDecade":[{"label":"A Rival decade · 1984 to 1993","text":"Work was a contest, and you did best when someone else wanted the same result. You were sharpest racing a rival, and that drive carried you further than skill alone."},{"label":"An Alchemist decade · 2014 to 2023","text":"Unusual work suited you, the kind that needs odd knowledge and long hours alone. You became good at something few others understood, earning respect before it earned you anything else."},{"label":"A Magistrate decade · 2024 to 2033 · now","text":"Hierarchy presses on your work, and each new duty adds to rules that are already strict. You keep your good name and hold on through the part of the work you shape yourself."},{"label":"A General decade · 2034 to 2043","text":"Demands pile up in your work faster than you can meet them, and a calm week feels like falling behind. You hold your ground by choosing which fights matter and letting the rest go."},{"label":"A Steward decade · 2044 to 2053","text":"Routine tightens around your work, and caution keeps you from moves that would pay more. You find a better fit once someone else sees what your reliability is worth."}],"byYear":[{"label":"2027 · a Rival year","text":"You keep your share this year by naming it before anyone else does, as a colleague or partner reaches for the same credit."},{"label":"2028 · an Artisan year","text":"You get paid more readily this year for what you enjoy making, because your work loosens and pleases people."},{"label":"2029 · a Virtuoso year","text":"Sure of your skill and short with the rules, you say out loud this year what colleagues only grumble about."},{"label":"2031 · a Steward year","text":"Your pay tracks your effort this year, earned through the hours you put in and the details you get right."},{"label":"2032 · a General year","text":"You hold up better than anyone expects this year, when a demanding task or a rival with standing tests your work."},{"label":"2033 · a Magistrate year","text":"Your work gains a title, a rule book or a formal promise this year, leaving you with more trust at the end of it than at the start."}]},{"domain":"Wealth","headline":"Your money at home is shared, and contested.","intro":"Two seats rule Wealth in your chart. One sits in your Early Chapter and one in your Home Chapter.","lit":["zhengcai_year_stem","jiecai_day_branch"],"heavy":false,"pips":["metal","fire"],"hubLine":"Your money at home is shared, and contested.","how":"You treat money in a relationship as a shared pot, and you give freely when a partner wants something. Because sharing and competing feel like one thing to you, you match every gift and every bill, and the arguments arrive later. You are calmest about money when your share and theirs are kept apart, a split you seldom manage.","pattern":"","blocks":[{"kind":"seat","name":"The Steward at the Year Gate","meta":"Early Chapter · birth to 15 · in plain view · lived","text":"Money at home was counted and spent with care, and you learned what things cost before most children do. By your teens you were already saving what your friends spent."},{"kind":"seat","name":"The Rival inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties each home you shared ran a quiet contest over money, over who earned more and who spent it faster. Your money swung between generous seasons and tight ones, because you won those contests by giving more than your share."},{"kind":"gap","label":"Late Chapter · 48 to now · no Wealth seat.","text":"From your late forties, you measure money by what it lets you give the people after you, with each decade setting how much comes in."}],"notes":[],"byDecade":[{"label":"A Rival decade · 1984 to 1993","text":"Contest sharpened the way you handled money, and you went after the same prizes others wanted. With a rival close by, you learned exactly what your effort was worth."},{"label":"A Steward decade · 2044 to 2053","text":"Caution about money tightens, and spending on yourself feels wrong even when you can afford it. Each time you check, you find more put by than you thought and relax a little."}],"byYear":[{"label":"2027 · a Rival year","text":"You decide how much of your own goes in this year, as shared purchases and a friend's request for help pull at your money."},{"label":"2030 · a Horizon year","text":"Through a second job or an unexpected offer, you take in money by side doors this year and spread it across more ventures than usual."},{"label":"2031 · a Steward year","text":"Your attention turns to bills, savings and the slow work of keeping accounts this year, until you know where each part of your money goes."}]},{"domain":"Health","headline":"Your body carries the cost of your pace.","intro":"Two seats rule Health in your chart. One sits in your Early Chapter and one in your Rising Chapter.","lit":["qisha_year_branch","qisha_month_branch"],"heavy":false,"pips":["water","water"],"hubLine":"Your body carries the cost of your pace.","how":"You run on adrenaline through long weeks and notice the tiredness only when the pressure lifts. Because effort is where you feel most like yourself, you push through poor sleep as if it were part of the job. Your energy runs deep, though you spend it faster than you replace it.","pattern":"","blocks":[{"kind":"seat","name":"The General inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"In your first years you were hardy, slow to complain and the last to quit a tough game. Your nerve carried you through hard weeks most children never faced, long before you were fifteen."},{"kind":"seat","name":"The General inside the Month Gate","meta":"Rising Chapter · 16 to 34 · lived","text":"In your twenties and early thirties your body kept pace with demands that stopped most people around you. Your hardest seasons ended with you worn out for weeks, and each one taught you to stop a little sooner."},{"kind":"gap","label":"Late Chapter · 48 to now · no Health seat.","text":"From your late forties, you take your energy from the decade you are in, and the people after you give your days their shape."}],"notes":[],"byDecade":[{"label":"A Sage decade · 2004 to 2013","text":"Good care kept you well, with early nights, a steady routine and someone who noticed when you were tired. You recovered quickly from strain and felt safe in your body."},{"label":"A General decade · 2034 to 2043","text":"Pressure costs you sleep and energy, and short nights add up faster than you notice. Once rest has a fixed place in your week, you recover fast whenever the pressure lifts."}],"byYear":[{"label":"2028 · an Artisan year","text":"Your body follows the pace you set this year, with meals, sleep and easy pleasures filling more of your days."},{"label":"2032 · a General year","text":"Pressure settles into your body this year as tension you carry without noticing, and you feel it first in your sleep."}]},{"domain":"Growth","headline":"You grow later by refining what you value.","intro":"Two seats rule Growth in your chart. One sits in your Early Chapter and one in your Late Chapter.","lit":["qisha_year_branch","zhengguan_hour_branch"],"heavy":false,"pips":["water","water"],"hubLine":"You grow later by refining what you value.","how":"You grow by doing familiar things better, holding the same values to a higher standard. Because consistency matters to you, you would rather do a thing properly than try something new, and the change in you shows up as patience. You redo a job nobody else noticed was wrong, for no reason but the standard you hold yourself to.","pattern":"","blocks":[{"kind":"seat","name":"The General inside the Year Gate","meta":"Early Chapter · birth to 15 · lived","text":"Each hard year of your childhood left you more capable than the one before, at school or at home or in a sport. You came to trust difficulty more than ease, and by your teens you went looking for it."},{"kind":"seat","name":"The Magistrate inside the Hour Gate","meta":"Late Chapter · 48 on · now","text":"Since your late forties your growth has come through commitments you kept, a practice deepened or a standard raised year by year. Your standing has grown with it, and people have started bringing you the work that has to be done right."}],"notes":[],"byDecade":[{"label":"A Twin decade · 1994 to 2003","text":"Your progress came from peers who matched you, people you learned beside rather than beneath. By setting your own standard and meeting it, you built a confidence that held."},{"label":"An Alchemist decade · 2014 to 2023","text":"Unconventional paths taught you most, a strange course, a self-taught skill or an expert nobody else had heard of. You developed in your own direction, and the difference became your strength."},{"label":"A General decade · 2034 to 2043","text":"Setbacks arrive without warning, and you are pushed before you feel ready. You get through on the discipline you already have, coming out tougher in ways that show later."}],"byYear":[{"label":"2026 · a Twin year","text":"This year you see your own shape by working alongside equals, leaning less on anyone's approval and more on your own judgement."},{"label":"2032 · a General year","text":"You grow fastest this year where something forces you to, a deadline or a rival or a role with real stakes."}]},{"domain":"Love","headline":"Your love runs on sharing, and on keeping count.","intro":"One seat rules Love in your chart. It sits in your Home Chapter.","lit":["jiecai_day_branch"],"heavy":false,"pips":["fire"],"hubLine":"Your love runs on sharing, and on keeping count.","how":"You love by sharing, the money and the plans and the friends, and you notice who gets the bigger part. Because a partner is also the person you measure yourself against, small questions of turn and share become contests. You give generously in love and keep a quiet tally of what comes back.","pattern":"","blocks":[{"kind":"seat","name":"The Rival inside the Day Gate","meta":"Home Chapter · 35 to 47 · lived","text":"In your late thirties and forties every relationship pooled what you both had and turned into a race over who put in more. Your eye for an uneven split sharpened with each of them, along with a soft spot for partners who gave as good as they got."}],"notes":["Love has no decade of its own. The pattern your Day Gate set is the one your love life keeps."],"byDecade":[],"byYear":[]},{"domain":"Social","headline":"Friends and colleagues either love you or resist you.","intro":"One seat rules Social in your chart. It sits in your Rising Chapter.","lit":["shangguan_month_stem"],"heavy":false,"pips":["earth"],"hubLine":"Friends and colleagues either love you or resist you.","how":"You say the sharp thing in company, the joke that lands too close or the question nobody wanted asked. Because being remembered matters more to you than being liked, you accept that a few people cool on you after a dinner. You are closest to the people who came for that edge and defend it when you are absent.","pattern":"","blocks":[{"kind":"seat","name":"The Virtuoso at the Month Gate","meta":"Rising Chapter · 16 to 34 · in plain view · lived","text":"Through your Rising Chapter your friendships were sorted by what you said in public, in class and at work. You ended up trusting the people who argued back far more than anyone who simply agreed."}],"notes":[],"byDecade":[{"label":"A Rival decade · 1984 to 1993","text":"Lively company filled your life, friends who competed with you and pushed you on. Among rivals you were at your best, and won their respect fair and square."},{"label":"A Twin decade · 1994 to 2003","text":"Your friendships ran between equals, people who matched your pace and asked nothing extra. Level with every friend, you never had to shrink to be liked."},{"label":"A Magistrate decade · 2024 to 2033 · now","text":"Duty presses on your friendships, and social life feels more like obligation than pleasure. Your good name holds, and each promise kept steadies you a little more."}],"byYear":[{"label":"2026 · a Twin year","text":"Among friends this year, you spend more time with peers who do what you do than with anyone who looks up to you."},{"label":"2027 · a Rival year","text":"This year you compete with friends for the same invitations and attention, sharing your circle more widely than you planned."},{"label":"2029 · a Virtuoso year","text":"Your conversations with friends grow sharper and wittier this year, until you are the one your circle quotes the next day."},{"label":"2030 · a Horizon year","text":"You move easily this year between groups that never meet each other, carried there by chance meetings and introductions."},{"label":"2033 · a Magistrate year","text":"You take on roles among friends this year, a committee seat or a host's duty, and become known for showing up when you said you would."}]},{"domain":"Mind","headline":"Your thinking changes character with each decade.","intro":"No seat rules Mind in your chart, and your decades set its course.","lit":[],"heavy":false,"pips":[],"hubLine":"Your thinking changes character with each decade.","how":"Your thinking takes its colour from each decade, studious in one and restless or practical in another. You notice the change in what you read before you notice it in yourself.","pattern":"","blocks":[],"notes":[],"byDecade":[{"label":"A Sage decade · 2004 to 2013","text":"Steady study suited you, and people who knew more than you gave your learning firm ground. You absorbed knowledge patiently, laying down much of what you know best."},{"label":"An Alchemist decade · 2014 to 2023","text":"Strange subjects drew you in, and you learned through instinct and odd sources more than set courses. Your thinking grew original, built on hunches that later proved right."}],"byYear":[{"label":"2029 · a Virtuoso year","text":"Your thinking sharpens against the ideas you are handed this year, finding flaws in what others accept faster than you can keep quiet about them."}]}],"blueprint":{"title":"A General structure · 七杀格","structure":{"reading":{"label":"","text":"Your chart answers to pressure, the hard test and the person who pushes back. You rise when the risk is real and the deadline is close. In the thick of a fight, you are at your steadiest.","draft":false},"rule":{"label":"","text":"Nothing hidden in your strongest seat shows on your stems. The General who holds it is the organising force of your life, and you answer to it first.","draft":false},"statusLabel":"Formed.","status":{"label":"","text":"Something in your chart turns the pressure up, and your chart already carries what tempers it. You still meet hard tests, but each one arrives with its answer close by.","draft":false},"rescue":null},"runs":{"strongest":{"label":"","text":"Water and Earth carry three quarters of your chart, and you live mostly through what you answer to and what you make.","draft":false},"missing":[{"label":"no Twin · your Twin decade 1994 to 2003 is lived","text":"Going it alone is never your first move. With a team or a close friend beside you, you find your footing faster and hold it longer.","draft":false},{"label":"no Horizon · no decade of yours brings it","text":"Offers you did not chase seldom find you, and side doors stay shut until you knock. You earn by the front route, one job at a time, trusting what you worked for over a windfall.","draft":false},{"label":"no Sage · your Sage decade 2004 to 2013 is lived","text":"Without a Sage you learned early to reassure yourself and to praise your own effort. You trust help more when you did not have to ask for it.","draft":false}],"seasonName":"十月丙","season":{"label":"","text":"Early winter takes the sun out of season, with short days and cold water rising under you. The month wants Wood to keep your fire fed, Earth to hold back the water, and Metal to trim the Wood when it grows thick. You stay bright through the dark months by drawing on each of these as the weather changes.","draft":false},"needs":[{"label":"first need · 甲, the Alchemist · hidden deep","text":"Far beneath the surface, you hold the Alchemist as a thin thread, a trickle of its element feeding you where the season gives nothing.","draft":false},{"label":"second need · 戊, the Artisan · on show","text":"With the Artisan on show, you send your strength out through its element, an outlet that a season short of it never opens for you.","draft":false}]},"seen":{"plain":[{"label":"the Steward","text":"You come across as a careful provider, the one who pays on time and keeps count.","draft":false},{"label":"the Virtuoso","text":"You strike people as quick and outspoken, the one who says what the rest of the meeting was thinking.","draft":false},{"label":"the Artisan","text":"You seem easygoing and warm, the friend who cooks for everyone and makes hard work look light.","draft":false}],"inside":[{"label":"the General","text":"You want a harder test than anyone sets you and push yourself to meet it where nobody sees.","draft":false},{"label":"the Rival","text":"You keep score with the people closest to you, and you want to win more than you let on.","draft":false},{"label":"the Magistrate","text":"You hold yourself to rules nobody wrote down and want a clear title that is yours alone.","draft":false}],"close":{"label":"","text":"You save what sits inside for the few people who know you best.","draft":false}},"pairs":{"pairs":[],"bonds":[{"label":"Year and Month share 亥 · 自刑","text":"You play the role you had in your family again at work, the peacemaker or the one who carries everything, and change it once you see it twice.","draft":false},{"label":"Hour clashes with Day · 子午冲","text":"The people after you pull against the life you share with a partner, but you keep both by moving house or reworking your days.","draft":false}],"noneHard":null}}}},"commit":"4f9bcc8","names":{"golden":"The reference chart behind the golden tests","youngHourLead":"A reader of 29 whose ruling seats sit mostly in later chapters","dualBond":"Two bonds tie the same pair of pillars","strongSealMoney":"A strong Sage chart with money showing","pastMonth":"A reader of 54, past the Rising Chapter","familyGap":"A reader of 24 with an empty seat row","mixedCured":"Magistrate and General mixed, the cure already seated","weakWealthPeers":"A weak chart with peers beside its wealth","jinshui":"Metal Day Master born in winter (金水伤官)","noHour":"The 24-year-old again, with no birth hour","seasonCond":"Fire Day Master in the tenth month, half Water"}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);

  var EL = { '甲': 'wood', '乙': 'wood', '丙': 'fire', '丁': 'fire', '戊': 'earth', '己': 'earth', '庚': 'metal', '辛': 'metal', '壬': 'water', '癸': 'water',
    '寅': 'wood', '卯': 'wood', '巳': 'fire', '午': 'fire', '辰': 'earth', '戌': 'earth', '丑': 'earth', '未': 'earth', '申': 'metal', '酉': 'metal', '亥': 'water', '子': 'water' };
  var GATES = ['year', 'month', 'day', 'hour'];

  var GATE_AGES = { year: 'birth–15', month: '16–34', day: '35–47', hour: '48 on' };
  var PIL = { year: 'Year', month: 'Month', day: 'Day', hour: 'Hour' };

  var STRENGTH = { extremely_strong: 'very strong', strong: 'strong', moderate: 'balanced', weak: 'weak', extremely_weak: 'very weak' };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* none */ } }
  var state = { id: get('dn-chart', 'golden'), view: get('dn-view', 'hub') };
  if (!D.charts[state.id]) state.id = 'golden';
  function tag(t) { return '<span class="tag t-' + t + '">' + t + '</span>'; }
  function draft(u) { return u && u.draft ? '<span class="draft">draft</span>' : ''; }
  function birthLine(c) {
    var b = c.birth; var h = c.hu ? 'hour unknown' : (String(b.hour).padStart(2, '0') + ':00');
    return b.day + ' ' + MON[b.month - 1] + ' ' + b.year + ' · ' + h + ' · ' + b.gender;
  }
  document.getElementById('intro').innerHTML = 'The Domains and Blueprint pages of elementum.life on ' + esc('14 November 2026') + (D.commit ? ' (build ' + esc(D.commit) + ')' : '') +
    ', for eleven sample charts. Every line was produced by the app’s own code, with the rulings of this round live, including the new structure rules and pairing conditions (S1 A). Sections run in the order the app shows them.';
  document.getElementById('foot').innerHTML = 'Generated by <code>ComparativeAnalysis/Evaluations/section-audit-2026-10-21/domains/current/</code> (snapshot-now.mjs, then build.mjs). Reader’s age and the year are read as of ' + esc(D.today) + '. In the app, By position, By decade and By year are tabs on each domain page; here they are stacked so the whole page reads in one scroll.';
  function rail() {
    document.getElementById('rail').innerHTML = IDS.map(function (id) {
      var c = D.charts[id]; var p = c.pillars.map(function (x) { return x ? x.stem + x.branch : '··'; }).join(' ');
      return '<button type="button" class="chartbtn" data-id="' + id + '" aria-current="' + (id === state.id) + '"><b>' + esc(p) + '</b><span>' + esc(D.names[id] || c.why) + '</span></button>';
    }).join('');
    document.getElementById('chartsel').innerHTML = IDS.map(function (id) {
      return '<option value="' + id + '"' + (id === state.id ? ' selected' : '') + '>' + esc(D.names[id] || id) + '</option>';
    }).join('');
  }
  function chartCard(c) {
    var pil = GATES.map(function (g, i) {
      var x = c.pillars[i];
      var s = x ? '<span style="background:var(--' + EL[x.stem] + 'Bg);color:var(--' + EL[x.stem] + ')">' + x.stem + '</span><span style="background:var(--' + EL[x.branch] + 'Bg);color:var(--' + EL[x.branch] + ')">' + x.branch + '</span>'
        : '<span style="color:var(--inkLight)">·</span><span style="color:var(--inkLight)">·</span>';
      return '<div class="pil' + (g === 'day' ? ' day' : '') + '"><small>' + PIL[g] + '</small><div class="gz">' + s + '</div></div>';
    }).join('');
    return '<div class="pillars" aria-label="Four pillars">' + pil + '</div><div class="facts"><span class="n">' + esc(c.blueprint.title) + '</span>' +
      '<span class="m">' + esc(birthLine(c)) + ' · age ' + c.age + ' · Day Master ' + esc(STRENGTH[c.strength] || c.strength) + '</span>' +
      '<span class="m">' + esc(D.names[D._id] || c.why) + '</span></div>';
  }
  function navHtml(c) {
    var items = [['hub', 'All domains']].concat(c.domains.map(function (d) { return [d.domain, d.domain]; })).concat([['blueprint', 'Blueprint']]);
    return items.map(function (it) {
      return '<button type="button" class="chip' + (it[0] === 'blueprint' ? ' bp' : '') + '" data-view="' + esc(it[0]) + '" aria-current="' + (state.view === it[0]) + '">' + esc(it[1]) + '</button>';
    }).join('');
  }
  function lifeLine(c, lit) {
    var age = c.age; var gi = age < 16 ? 0 : age < 35 ? 1 : age < 48 ? 2 : 3;
    var b = [[0, 16], [16, 35], [35, 48], [48, 80]][gi]; var frac = Math.max(0, Math.min(1, (age - b[0]) / (b[1] - b[0])));
    var gates = GATES.map(function (g, i) {
      var seats = (g === 'hour' && c.hu) ? '<span class="closed">closed</span>' : c.positions.filter(function (p) { return p.gate === g; })
        .sort(function (a, z) { return (a.kind === 'stem' ? 0 : 1) - (z.kind === 'stem' ? 0 : 1); })
        .map(function (p) { return '<i class="pip' + (lit && lit.indexOf(p.id) < 0 ? ' dim' : '') + '" style="--c:var(--' + p.el + ')" title="' + esc(p.term) + '"></i>'; }).join('');
      return '<div class="gate' + (i === gi ? ' cur' : i > gi ? ' fut' : '') + '"><span class="gn">' + GATE_NAME[g] + '</span><span class="gs">' + seats + '</span><span class="ga">' + GATE_AGES[g] + '</span></div>';
    }).join('');
    return '<div class="life">' + gates + '<span class="you" style="left:' + ((gi + frac) * 25).toFixed(1) + '%"><span>you · ' + age + '</span></span></div>';
  }
  function hub(c) {
    return '<section class="card"><div class="eyebrow">Your Domains ' + tag('free') + '</div><h2 class="title">Eight parts of your life, and who rules them</h2>' +
      '<p class="lede">One of ten characters sits in each seat of your chart, and each character rules certain parts of your life. Where several seats rule the same domain, that domain carries more weight for you.</p></section>' +
      '<div class="domgrid">' + c.domains.map(function (d) {
        return '<button type="button" class="domcard' + (d.heavy ? ' heavy' : '') + '" data-view="' + esc(d.domain) + '"><span class="domtop"><span class="domname">' + esc(d.domain) + '</span><span class="pips">' +
          d.pips.map(function (e) { return '<i class="pip" style="--c:var(--' + e + ')"></i>'; }).join('') + '</span></span><span class="domh">' + esc(d.hubLine) + '</span></button>';
      }).join('') + '</div><p class="note" style="text-align:center">Every headline and each domain’s first reading are free. A red edge marks the domains that carry the most weight.</p>';
  }
  function domain(c, d) {
    var seats = d.blocks.filter(function (b) { return b.kind === 'seat'; });
    var h = '<section class="card"><div class="eyebrow">The Domains · ' + esc(d.domain) + ' ' + tag('free') + '</div>' +
      (d.headline ? '<h2 class="title">' + esc(d.headline) + '</h2>' : '') + '<p class="lede">' + esc(d.intro) + '</p>' + lifeLine(c, d.lit) + '</section>';
    h += '<div class="secthead"><h3>By position</h3><span class="app">the first tab</span></div>';
    h += '<section class="card"><div class="eyebrow">How you are ' + tag('free') + '</div>' + (d.how ? '<p class="read" style="margin-top:8px">' + esc(d.how) + '</p>' : '') +
      (d.pattern ? '<p class="read">' + esc(d.pattern) + '</p>' : '') + (!d.how && !d.pattern ? '<p class="empty">No line here for this chart.</p>' : '') + '</section>';
    if (d.blocks.length) {
      h += '<section class="card"><div class="eyebrow">' + (seats.length ? 'The ' + (seats.length === 1 ? 'seat that rules' : NUMW[seats.length].toLowerCase() + ' seats that rule') + ' your ' + esc(d.domain) : 'Your ' + esc(d.domain) + ' seats') + ' ' + tag('seeker') + '</div><div class="seats" style="margin-top:10px">' +
        d.blocks.map(function (b) {
          return b.kind === 'gap' ? '<div class="gap"><b>' + esc(b.label) + '</b> ' + esc(b.text) + '</div>'
            : '<div class="seat"><span class="seatname">' + esc(b.name) + '</span><span class="seatmeta">' + esc(b.meta) + '</span>' + (b.text ? '<p class="read">' + esc(b.text) + '</p>' : '') + '</div>';
        }).join('') + '</div></section>';
    }
    d.notes.forEach(function (n) { h += '<p class="note">' + esc(n) + '</p>'; });
    h += '<div class="secthead"><h3>By decade</h3><span class="app">the second tab</span> ' + tag('advisor') + '</div><section class="card"><div class="seats">' +
      (d.byDecade.length ? d.byDecade.map(function (x) { return '<div class="seat"><span class="seatmeta">' + esc(x.label) + '</span><p class="read">' + esc(x.text) + '</p></div>'; }).join('')
        : '<p class="empty">No decade in your reading window rules your ' + esc(d.domain) + '.</p>') + '</div></section>';
    h += '<div class="secthead"><h3>By year</h3><span class="app">the third tab</span> ' + tag('advisor') + '</div><section class="card"><div class="seats">' +
      (d.byYear.length ? d.byYear.map(function (x) { return '<div class="seat"><span class="seatmeta">' + esc(x.label) + '</span><p class="read">' + esc(x.text) + '</p></div>'; }).join('')
        : '<p class="empty">No year left in this decade touches your ' + esc(d.domain) + ' directly.</p>') + '</div></section>';
    return h;
  }
  function U(u) { return u && u.text ? '<p class="read">' + esc(u.text) + draft(u) + '</p>' : ''; }
  function M(t) { return t ? '<p class="meta">' + esc(t) + '</p>' : ''; }
  function blueprint(c) {
    var B = c.blueprint, s = B.structure, r = B.runs;
    var h = '<section class="card"><div class="eyebrow">Your Energy Blueprint ' + tag('advisor') + '</div><h2 class="title">' + esc(B.title) + '</h2><p class="lede">The decoding of your chart: why the rest of your reading comes out the way it does.</p></section>';
    h += '<section class="card bp"><span class="step">1 · Your structure</span>' + U(s.reading) + M('why · the revealed-stem rule') + U(s.rule) +
      '<p class="read"><span class="labp">' + esc(s.statusLabel) + '</span> ' + esc(s.status ? s.status.text : '') + draft(s.status) + '</p>' + (s.rescue ? M(s.rescue.label) + U(s.rescue) : '') + '</section>';
    h += '<section class="card bp"><span class="step">2 · What your chart runs on and lacks</span><p class="read"><span class="labp">Strongest.</span> ' + esc(r.strongest ? r.strongest.text : '') + draft(r.strongest) + '</p>' +
      (r.missing.length ? '<p class="read labp">Missing.</p>' + r.missing.map(function (x) { return M(x.label) + U(x); }).join('') : '') +
      (r.season ? '<p class="read labp">Your season · 调候.</p>' + M(r.seasonName + ' · 穷通宝鉴') + U(r.season) : '') + r.needs.map(function (x) { return M(x.label) + U(x); }).join('') +
      '<div class="seekease"><span class="grp">Seek ' + c.seek.map(function (e) { return '<i class="pip" style="--c:var(--' + e + ')"></i>'; }).join('') + '</span><span class="grp">Ease ' +
      c.ease.map(function (e) { return '<i class="pip" style="--c:var(--' + e + ')"></i>'; }).join('') + '</span></div></section>';
    h += '<section class="card bp"><span class="step">3 · Seen and unseen</span><p class="read labp">In plain view.</p>' + B.seen.plain.map(function (x) { return M(x.label) + U(x); }).join('') +
      '<p class="read labp">Inside.</p>' + B.seen.inside.map(function (x) { return M(x.label) + U(x); }).join('') + U(B.seen.close) + '</section>';
    h += '<section class="card bp"><span class="step">4 · Pairings and clashes</span>' + B.pairs.pairs.map(function (x) { return M(x.label) + U(x); }).join('') +
      B.pairs.bonds.map(function (x) { return M(x.label) + U(x); }).join('') + (B.pairs.noneHard ? '<p class="note">' + esc(B.pairs.noneHard.text) + '</p>' : '') +
      (!B.pairs.pairs.length && !B.pairs.bonds.length && !B.pairs.noneHard ? '<p class="empty">No pairing or bond holds in this chart.</p>' : '') + '</section>';
    return h;
  }
  function render() {
    var c = D.charts[state.id]; D._id = state.id;
    if (state.view !== 'hub' && state.view !== 'blueprint' && !c.domains.some(function (d) { return d.domain === state.view; })) state.view = 'hub';
    rail();
    document.getElementById('chartcard').innerHTML = chartCard(c);
    document.getElementById('nav').innerHTML = navHtml(c);
    var v = document.getElementById('view');
    v.innerHTML = state.view === 'hub' ? hub(c) : state.view === 'blueprint' ? blueprint(c) : domain(c, c.domains.filter(function (d) { return d.domain === state.view; })[0]);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-id],[data-view]'); if (!t) return;
    if (t.dataset.id) { state.id = t.dataset.id; put('dn-chart', state.id); }
    if (t.dataset.view) { state.view = t.dataset.view; put('dn-view', state.view); if (t.classList.contains('domcard')) document.getElementById('nav').scrollIntoView({ block: 'start' }); }
    render();
  });
  document.getElementById('chartsel').addEventListener('change', function (e) { state.id = e.target.value; put('dn-chart', state.id); render(); });
  render();
})();
</script>
