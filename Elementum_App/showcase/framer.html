<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F8F6F0; --silk:#F1E9D6; --silkDeep:#ECE2C9; --silkFold:#DDD1B3;
    --parchment:#EAE5DF; --paperHair:#CDBE9E;
    --ink:#2B2722; --inkSoft:#4A433B; --inkLight:#857D72; --inkMist:#B8AFA1;
    --bronze:#8b7355; --bronzeDark:#6b5339; --walnut:#5a4430; --gold:#D4AF37;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased;}
  body{background:#444;}
  .frame{
    position:relative; width:1600px; height:900px; overflow:hidden;
    background:var(--silk); font-family:"EB Garamond",Georgia,serif; color:var(--ink);
  }
  /* paper base + faint ink depth for the light "showcase" frames */
  .frame.light{
    background:
      radial-gradient(120% 90% at 18% 8%, #FBF8F1 0%, var(--silk) 42%, var(--silkDeep) 100%);
  }
  .frame .grain{position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply;
    background-image:url("src/art-landscape.png"); background-size:cover; background-position:center 70%;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.22), rgba(0,0,0,0) 58%);
            mask-image:linear-gradient(to top, rgba(0,0,0,.22), rgba(0,0,0,0) 58%);
    filter:grayscale(1) contrast(1.05);}
  .frame .vign{position:absolute; inset:0; box-shadow:inset 0 0 220px rgba(90,68,48,.16); pointer-events:none;}

  /* ---- text column ---- */
  .copy{position:absolute; left:96px; top:0; height:100%; width:640px;
    display:flex; flex-direction:column; justify-content:center; z-index:3;}
  .eyebrow{font-family:"Cinzel",serif; font-weight:500; font-size:18px; letter-spacing:6px;
    text-transform:uppercase; margin-bottom:26px;}
  .title{font-family:"Cormorant Garamond",serif; font-weight:500; font-size:78px; line-height:1.02;
    color:var(--ink); letter-spacing:.5px;}
  .han{font-family:"Noto Serif SC",serif; font-weight:400; color:var(--bronzeDark); margin-left:14px; font-size:.5em; vertical-align:.12em;}
  .rule{width:78px; height:2px; background:linear-gradient(90deg,var(--bronze),rgba(139,115,85,0)); margin:34px 0 30px;}
  .desc{font-family:"EB Garamond",serif; font-weight:400; font-size:27px; line-height:1.5; color:var(--inkSoft); max-width:540px;}
  .wordmark{position:absolute; left:96px; bottom:64px; font-family:"Cinzel",serif; font-weight:600;
    font-size:17px; letter-spacing:7px; color:var(--bronzeDark); text-transform:uppercase; z-index:3;}
  .wordmark .dot{display:inline-block; width:5px; height:5px; border-radius:999px; background:var(--gold);
    vertical-align:.32em; margin:0 12px;}

  /* ---- phone mock ---- */
  .stage{position:absolute; right:118px; top:0; height:100%; width:560px;
    display:flex; align-items:center; justify-content:center; z-index:2;}
  .phone{position:relative; width:372px; height:762px; border-radius:46px; padding:11px;
    background:linear-gradient(160deg,#3a342c,#1d1a16 60%,#0f0d0b);
    box-shadow:0 50px 90px -26px rgba(28,22,14,.62), 0 14px 36px -10px rgba(28,22,14,.4),
      inset 0 0 0 1px rgba(212,175,55,.22);}
  .phone .screen{position:relative; width:100%; height:100%; border-radius:35px; overflow:hidden;
    background:var(--silk); box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);}
  .phone .screen img{display:block; width:100%; height:auto;}
  .phone .notch{position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:118px; height:24px; background:#0f0d0b; border-radius:999px; z-index:4;}
  .phone .glare{position:absolute; inset:0; z-index:3; pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 26%);}

  /* ---- full-bleed art variant ---- */
  .frame.art .artbg{position:absolute; inset:0; background-size:cover; background-position:center; z-index:0;}
  .frame.art .scrim{position:absolute; inset:0; z-index:1;
    background:linear-gradient(90deg, rgba(244,240,232,.96) 0%, rgba(244,240,232,.82) 30%, rgba(244,240,232,.18) 56%, rgba(244,240,232,0) 78%);}
  .frame.art .copy{width:660px;}

  /* ---- hero variant ---- */
  .frame.hero{background:#15120d;}
  .frame.hero .artbg{position:absolute; inset:0; background-size:cover; background-position:center 38%; z-index:0;
    filter:grayscale(.15) contrast(1.04) brightness(.92);}
  .frame.hero .scrim{position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(90deg, rgba(12,10,7,.88) 0%, rgba(12,10,7,.6) 40%, rgba(12,10,7,.18) 66%, rgba(12,10,7,.42) 100%),
      radial-gradient(150% 130% at 26% 36%, rgba(12,10,7,0) 26%, rgba(12,10,7,.55) 100%);}
  .frame.hero .copy{z-index:3;}
  .frame.hero .eyebrow{color:#E8C977; font-size:20px; letter-spacing:8px;}
  .frame.hero .title{color:#F7F0DE; font-size:118px; text-shadow:0 6px 44px rgba(0,0,0,.55); letter-spacing:2px;}
  .frame.hero .rule{width:120px; background:linear-gradient(90deg, var(--gold), rgba(212,175,55,0));}
  .frame.hero .desc{color:#E9DEC6; font-style:italic; font-size:31px; max-width:520px;}
  .frame.hero .wordmark{color:#D9C9A0;}
  .frame.hero .phone{box-shadow:0 50px 100px -24px rgba(0,0,0,.72), inset 0 0 0 1px rgba(212,175,55,.3);}

  /* ---- square thumb variant (for the near-square landing tile) ---- */
  .frame.square{width:1200px; height:1200px; background:#15120d;}
  .frame.square .artbg{position:absolute; inset:0; background-size:cover; background-position:center 42%; z-index:0;
    filter:grayscale(.15) contrast(1.04) brightness(.9);}
  .frame.square .scrim{position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(180deg, rgba(12,10,7,.6), rgba(12,10,7,.32) 42%, rgba(12,10,7,.66)),
      radial-gradient(120% 100% at 50% 46%, rgba(12,10,7,0) 28%, rgba(12,10,7,.62));}
  .frame.square .sqwrap{position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 90px;}
  .frame.square .sq-eyebrow{font-family:"Cinzel",serif; font-weight:500; font-size:26px; letter-spacing:9px;
    text-transform:uppercase; color:#E8C977; margin-bottom:32px;}
  .frame.square .sq-title{font-family:"Cormorant Garamond",serif; font-weight:500; font-size:158px; line-height:.98;
    color:#F7F0DE; text-shadow:0 6px 44px rgba(0,0,0,.55); letter-spacing:2px;}
  .frame.square .sq-rule{width:150px; height:2px; margin:40px auto;
    background:linear-gradient(90deg, rgba(212,175,55,0), var(--gold), rgba(212,175,55,0));}
  .frame.square .sq-tag{font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500; font-size:40px;
    color:#E9DEC6; max-width:820px; line-height:1.35;}
</style>
</head>
<body>
<div id="root"></div>
<script>
  const PH = (img) => `
    <div class="stage"><div class="phone">
      <div class="notch"></div><div class="glare"></div>
      <div class="screen"><img src="${img}" /></div>
    </div></div>`;

  const FRAMES = [
    // hero — used as card thumbnail, landing tile, and detail hero
    { id:'elementum-hero', variant:'hero', bg:'src/art-landscape.png',
      eyebrow:'BaZi · Four Pillars · 八字',
      title:'Elementum',
      tag:'Your elemental energy, read from the moment you were born.',
      phone:'src/s03-reveal.png' },

    { id:'elementum-01-welcome', pigment:'#6b5339', eyebrow:'First Impression',
      title:'A quiet doorway', han:'',
      desc:'The app opens not with a dashboard but with stillness — ink-wash mountains, a single line, one invitation: discover yours.',
      phone:'src/s01-welcome.png' },

    { id:'elementum-02-onboarding', pigment:'#3e5f85', eyebrow:'A Ritual, Not a Form',
      title:'Seven measured steps',
      desc:'Birth date, hour, and place are gathered with ceremony — even location feeds a true-solar-time correction for an exact chart.',
      phone:'src/s02-onboarding.png' },

    { id:'elementum-03-reveal', pigment:'#6a849a', eyebrow:'The Reveal',
      title:'You are the Blade', han:'庚',
      desc:'The moment of recognition: your day-master archetype, drawn as a single ink stroke, with the energy that saturates your chart.',
      phone:'src/s03-reveal.png' },

    { id:'elementum-04-pillars', pigment:'#6b5339', eyebrow:'Deterministic Engine',
      title:'Four pillars, exact', han:'排盘',
      desc:'Underneath the poetry sits a deterministic BaZi calculator — heavenly stems and earthly branches resolved to canonical JSON.',
      phone:'src/s04-pillars.png' },

    { id:'elementum-05-reading', pigment:'#6b5339', eyebrow:'The Reading Library',
      title:'A catalogue, not a feed',
      desc:'Six readings fan out from your identity card — elemental nature, dominant energies, forces in motion, life chapters, and more.',
      phone:'src/s05-reading.png' },

    { id:'elementum-06-elemental', pigment:'#587a4d', eyebrow:'Long-form Readings',
      title:'Recognition, not horoscope',
      desc:'Each reading is hand-authored prose — declarative, precise, structurally grounded. It should feel uncomfortably accurate.',
      phone:'src/s06-elemental.png' },

    { id:'elementum-07-today', pigment:'#9e5540', eyebrow:'The Daily Signal',
      title:'One clear reading today', han:'今日',
      desc:'Day, month, and decade energy resolve into a single making-day signal: what to do, what to avoid, and your best hours.',
      phone:'src/s07-today.png' },

    { id:'elementum-08-guidance', pigment:'#927750', eyebrow:'Guidance & Tiers',
      title:'Deeper layers unlock', han:'引',
      desc:'An elemental draw, a personalised manual, self-calibration, and an AI consultant that has read your full chart and Manual.',
      phone:'src/s08-guidance.png' },

    { id:'elementum-09-compat', pigment:'#6a849a', eyebrow:'Resonance',
      title:'Two charts, one mirror',
      desc:'Compatibility reads the relationship between two charts — a percentage, a name, and a reading of why the bond holds.',
      phone:'src/s09-compat.png' },

    { id:'elementum-10-world', variant:'art', bg:'src/art-fiveelements.png', pigment:'#5a4430',
      eyebrow:'The Visual World', title:'Wood · Fire · Earth · Metal · Water', han:'五行',
      desc:'A restrained world of silk paper, bronze, parchment, and ink-wash — five element pigments, used sparingly and seriously.' },

    // square, centered thumbnail for the near-square landing-page tile
    { id:'elementum-thumb', variant:'square', bg:'src/art-landscape.png',
      eyebrow:'BaZi · 八字',
      title:'Elementum',
      tag:'Your elemental energy, read from the moment you were born.' },
  ];

  const root = document.getElementById('root');
  root.innerHTML = FRAMES.map((f) => {
    if (f.variant === 'hero') {
      return `<div class="frame hero" id="${f.id}">
        <div class="artbg" style="background-image:url('${f.bg}')"></div>
        <div class="scrim"></div>
        <div class="copy">
          <div class="eyebrow">${f.eyebrow}</div>
          <div class="title">${f.title}</div>
          <div class="rule"></div>
          <div class="desc">${f.tag}</div>
        </div>
        <div class="wordmark">Elementum<span class="dot"></span>八字</div>
        ${PH(f.phone)}
      </div>`;
    }
    if (f.variant === 'square') {
      return `<div class="frame square" id="${f.id}">
        <div class="artbg" style="background-image:url('${f.bg}')"></div>
        <div class="scrim"></div>
        <div class="sqwrap">
          <div class="sq-eyebrow">${f.eyebrow}</div>
          <div class="sq-title">${f.title}</div>
          <div class="sq-rule"></div>
          <div class="sq-tag">${f.tag}</div>
        </div>
      </div>`;
    }
    const han = f.han ? `<span class="han">${f.han}</span>` : '';
    if (f.variant === 'art') {
      return `<div class="frame art" id="${f.id}">
        <div class="artbg" style="background-image:url('${f.bg}')"></div>
        <div class="scrim"></div>
        <div class="copy">
          <div class="eyebrow" style="color:${f.pigment}">${f.eyebrow}</div>
          <div class="title">${f.title}${han}</div>
          <div class="rule"></div>
          <div class="desc">${f.desc}</div>
        </div>
        <div class="wordmark">Elementum<span class="dot"></span>八字</div>
      </div>`;
    }
    return `<div class="frame light" id="${f.id}">
      <div class="grain"></div><div class="vign"></div>
      <div class="copy">
        <div class="eyebrow" style="color:${f.pigment}">${f.eyebrow}</div>
        <div class="title">${f.title}${han}</div>
        <div class="rule"></div>
        <div class="desc">${f.desc}</div>
      </div>
      <div class="wordmark">Elementum<span class="dot"></span>八字</div>
      ${PH(f.phone)}
    </div>`;
  }).join('');
  window.__FRAME_IDS = FRAMES.map((f) => f.id);
</script>
</body>
</html>
