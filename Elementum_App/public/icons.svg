<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================
  Elementum · Icon Library (canonical source-of-truth)
  ============================================================

  Single SVG file containing every reusable icon as a <symbol>.
  Consumed by every legend HTML and by the React app via inline
  <svg><use href="icons.svg#id"/></svg> references.

  Convention:
    · viewBox 0 0 24 24
    · stroke="currentColor" — colour controlled by parent CSS
    · stroke-width 1.7 unless noted
    · stroke-linecap="round" stroke-linejoin="round"
    · fill="none" unless explicitly filled

  ID prefixes:
    el-*    five elements (5)
    dm-*    ten day-master stems (10) — PLACEHOLDER, needs ink-wash commission
    tab-*   bottom tab navigation (5)
    read-*  reading-section catalogue (5) — PLACEHOLDER, refinement welcome
    ico-*   utility / chrome (8)

  Total: 33 symbols.

  Sealed against:
    · legend-primitives.html §7
    · legend-screens.html §4 (canonical tab paths)
    · legend-screens-amendment.html §A2/§A3/§A6 (placeholders DA.2 + DA.9)

  When editing: add/edit symbol here ONLY. Never duplicate inline.
  Drift between this file and any inline SVG in a legend is a
  doc-patch trigger.
  ============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- ============================================================
         FIVE ELEMENTS · el-*
         Source: legend-primitives.html §7 (lines 963–987)
         Unchanged across v1/v2/v3.
         ============================================================ -->

    <symbol id="el-metal" viewBox="0 0 24 24">
      <path d="M5.28 12.6 A7.68 7.68 0 0 1 18.72 12.6"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    </symbol>

    <symbol id="el-wood" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none">
        <line x1="12" y1="19.2" x2="12" y2="4.8"/>
        <line x1="12" y1="10.8" x2="6.72" y2="6"/>
        <line x1="12" y1="10.8" x2="17.28" y2="6"/>
      </g>
    </symbol>

    <symbol id="el-fire" viewBox="0 0 24 24">
      <path d="M12 4.8 L18.24 17.28 L5.76 17.28 Z"
            stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/>
    </symbol>

    <symbol id="el-earth" viewBox="0 0 24 24">
      <rect x="5.76" y="6.72" width="12.48" height="10.56"
            stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none" rx="0.96"/>
    </symbol>

    <symbol id="el-water" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none">
