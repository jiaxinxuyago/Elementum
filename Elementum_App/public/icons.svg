    <!-- ============================================================
         READING-SECTION CATALOGUE · read-*
         Source: legend-screens-amendment.html §A2 / §A6
         Status: PLACEHOLDER (DA.9) — refinement or brushwork welcome.
         ============================================================ -->

    <!-- Elemental Nature — wu-xing pentagram -->
    <symbol id="read-elemental" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
